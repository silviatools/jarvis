<!-- Персонаж «Джарвис» (выражение: think) — талисман приложения, прозрачный фон. Подключать через <img> или как CSS-фон: внутри id градиентов и фильтров, при вставке inline они будут конфликтовать. Исходная иконка ярлыка «Прочее» — misc.svg. -->
