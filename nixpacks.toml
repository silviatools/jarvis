# Системные пакеты для сборки на Railway (builder = "nixpacks", см. railway.toml).
# LibreOffice (Impress) + poppler: превью слайдов и PDF для навыка «Презентации»
# (deck_builder.render_png: soffice → PDF → pdftoppm → PNG).
# Шрифты: Carlito — метрически совместим с Calibri, Liberation — с Arial/Times, DejaVu — кириллица по умолчанию.
# Chromium для кабинетов Ozon/WB ставит Playwright в /app/ms-playwright.
# Здесь — системные библиотеки, без которых этот браузер не стартует. Пакет chromium из apt
# на Ubuntu часто оказывается заглушкой snap и в контейнере не запускается.
# install не переписывать целиком: «...» — команда Python-провайдера
# (python -m venv /opt/venv, activate, pip install). Без неё pip нет в PATH.
[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/ms-playwright"

[phases.setup]
aptPkgs = [
  "libreoffice-impress",
  "poppler-utils",
  "fontconfig",
  "fonts-dejavu-core",
  "fonts-liberation",
  "fonts-crosextra-carlito",
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libdbus-1-3",
  "libxkbcommon0",
  "libatspi2.0-0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  "libglib2.0-0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxext6",
  "libxshmfence1",
  "libasound2t64",
]

[phases.install]
cmds = [
  "...",
  ". /opt/venv/bin/activate && python -m playwright install chromium",
]
