<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Своя игра</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --surface: #131c2e;
    --surface-2: #1b2740;
    --border: #26334d;
    --text: #f4f6fb;
    --text-muted: #9fadc7;
    --text-subtle: #6f7e99;
    --accent: #f0b429;
    --good: #34d399;
    --bad: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  input {
    font-family: inherit; font-size: 15px; width: 100%;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 14px 40px; overflow-wrap: break-word; }
  .font-display { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.02em; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 26px; line-height: 1.2; margin: 0; letter-spacing: -0.02em; }
  .muted { color: var(--text-muted); font-size: 14px; }
  .subtle { color: var(--text-subtle); font-size: 12px; }
  .head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .head .grow { flex: 1; min-width: 0; }
  .desc { white-space: pre-wrap; font-size: 14px; color: var(--text-muted); margin-top: 6px; }

  .btn {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover { background: #24324f; }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #1a1203; }
  .btn.accent:hover { opacity: .9; }
  .btn.sm { padding: 7px 10px; font-size: 13px; border-radius: 9px; }
  .btn.ghost { background: transparent; }

  /* Табло команд */
  .teams { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .team {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 12px; min-width: 130px; flex: 1 1 150px; max-width: 240px;
  }
  .team .nm { font-size: 13px; color: var(--text-muted); overflow-wrap: anywhere; }
  .team .sc { font-family: 'Fraunces', Georgia, serif; font-size: 26px; line-height: 1.1; margin-top: 2px; }
  .team .ctr { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .team .ctr button {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 0; font-size: 13px; color: var(--text-muted);
  }
  .team .ctr button:hover { color: var(--text); }

  /* Поле */
  .board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; width: fit-content; max-width: 100%; margin: 0 auto; }
  .col { flex: 1 1 0; min-width: 148px; max-width: 260px; display: flex; flex-direction: column; gap: 8px; }
  .col-head {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 10px; text-align: center; font-weight: 600; font-size: 14px;
    min-height: 62px; display: flex; align-items: center; justify-content: center;
  }
  .cell {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 8px; text-align: center;
    font-family: 'Fraunces', Georgia, serif; font-size: 22px; color: var(--accent);
    transition: transform .12s ease, background .15s ease;
  }
  .cell:hover { background: #24324f; transform: translateY(-1px); }
  .cell.done { color: var(--text-subtle); background: transparent; border-style: dashed; }

  /* Вопрос */
  .overlay {
    position: fixed; inset: 0; background: rgba(6, 10, 20, .92); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    overflow-y: auto;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 20px; width: 100%; max-width: 720px; margin: auto;
  }
  .q-meta { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-subtle); margin-bottom: 10px; }
  .q-text { font-family: 'Fraunces', Georgia, serif; font-size: 24px; line-height: 1.3; margin-bottom: 18px; }
  .opt {
    display: block; width: 100%; text-align: left; margin-bottom: 8px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 13px 14px; font-size: 15px;
  }
  .opt:hover { background: #24324f; }
  .opt.correct { border-color: var(--good); background: rgba(52, 211, 153, .14); }
  .opt.wrong { border-color: var(--bad); background: rgba(248, 113, 113, .12); }
  .opt .mark { float: right; font-weight: 600; font-size: 13px; }
  .award { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 14px; }
  .award-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .award-row .nm { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
  .award-row button { border: 1px solid var(--border); border-radius: 9px; padding: 7px 11px; font-size: 14px; background: var(--surface-2); }
  .award-row .plus:hover { border-color: var(--good); color: var(--good); }
  .award-row .minus:hover { border-color: var(--bad); color: var(--bad); }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; justify-content: center; }

  .team-edit { display: flex; align-items: center; gap: 8px; padding: 7px 0; }
  .team-edit .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .add-team { display: flex; gap: 8px; margin-top: 12px; }
  .center { text-align: center; padding: 60px 16px; }
  .footer-note { margin-top: 26px; font-size: 12px; color: var(--text-subtle); text-align: center; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  @media (max-width: 560px) {
    h1 { font-size: 22px; }
    .q-text { font-size: 20px; }
    .col { min-width: 128px; }
  }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="center muted">Загружаем игру…</div></div>

<script>
(function () {
  var root = document.getElementById('root');
  var token = (location.pathname.split('/').filter(Boolean)[1] || '');

  // Состояние: game — то, что пришло с сервера (менять можно только в
  // приложении), teams/answered — счёт, он же единственное, что страница
  // пишет обратно.
  var game = null;
  var teams = [];
  var answered = {};        // questionId -> true
  var openQ = null;         // { catName, question }
  var picked = null;        // id выбранного варианта в открытом вопросе
  var revealed = false;
  var showTeams = false;
  var saveTimer = null;
  var pollTimer = null;

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  var uid = function () {
    try { return crypto.randomUUID(); } catch (e) {}
    return 'tm-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  };

  function applyPayload(p) {
    game = p;
    teams = (p.teams || []).map(function (t) {
      return { id: t.id, name: t.name || '', score: Number(t.score) || 0 };
    });
    answered = {};
    (p.answered || []).forEach(function (id) { answered[id] = true; });
  }

  // Счёт отправляем с задержкой: за один тап по «+100» их прилетает несколько
  // (обновление кнопкой, затем закрытие вопроса) — хватит одной записи.
  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 400);
  }

  function save() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    fetch('/api/game/' + encodeURIComponent(token) + '/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teams: teams, answered: Object.keys(answered) }),
    }).catch(function () {});
  }

  // Пока никто ничего не трогает, подтягиваем чужой счёт: ведущий может
  // считать очки с телефона, а поле показывать на ноутбуке.
  function poll() {
    if (openQ || showTeams || saveTimer) return;
    fetch('/api/game/' + encodeURIComponent(token))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (p) {
        if (!p || openQ || showTeams || saveTimer) return;
        applyPayload(p);
        render();
      })
      .catch(function () {});
  }

  function questionsCount() {
    return (game.categories || []).reduce(function (n, c) { return n + c.questions.length; }, 0);
  }

  function answeredCount() {
    return (game.categories || []).reduce(function (n, c) {
      return n + c.questions.filter(function (q) { return answered[q.id]; }).length;
    }, 0);
  }

  function addTeam(name) {
    var nm = (name || '').trim();
    if (!nm) return;
    if (teams.length >= 30) { alert('Больше 30 команд не поместится.'); return; }
    teams.push({ id: uid(), name: nm.slice(0, 40), score: 0 });
    scheduleSave();
    render();
  }

  function changeScore(teamId, delta) {
    teams = teams.map(function (t) {
      return t.id === teamId ? { id: t.id, name: t.name, score: t.score + delta } : t;
    });
    scheduleSave();
    render();
  }

  function renderTeams() {
    if (!teams.length) {
      return '<div class="teams"><div class="team" style="flex:1 1 100%;max-width:none">'
        + '<div class="nm">Команд пока нет</div>'
        + '<div class="subtle" style="margin-top:4px">Нажмите «Команды», чтобы добавить участников и вести счёт.</div>'
        + '</div></div>';
    }
    return '<div class="teams">' + teams.map(function (t) {
      return '<div class="team">'
        + '<div class="nm">' + esc(t.name || 'Команда') + '</div>'
        + '<div class="sc">' + t.score + '</div>'
        + '<div class="ctr">'
        + '<button data-score="' + esc(t.id) + '" data-delta="-10">−10</button>'
        + '<button data-score="' + esc(t.id) + '" data-delta="10">+10</button>'
        + '</div></div>';
    }).join('') + '</div>';
  }

  function renderBoard() {
    if (!(game.categories || []).length) {
      return '<div class="center muted">В этой игре пока нет заполненных вопросов.</div>';
    }
    return '<div class="board">' + game.categories.map(function (c) {
      return '<div class="col">'
        + '<div class="col-head">' + esc(c.name) + '</div>'
        + c.questions.map(function (q) {
            var done = !!answered[q.id];
            return '<button class="cell' + (done ? ' done' : '') + '" data-q="' + esc(q.id) + '">'
              + q.points + '</button>';
          }).join('')
        + '</div>';
    }).join('') + '</div>';
  }

  function renderQuestionModal() {
    var q = openQ.question;
    var opts = (q.options || []).map(function (o) {
      var cls = 'opt';
      var mark = '';
      if (revealed) {
        if (o.correct) { cls += ' correct'; mark = '<span class="mark">верный</span>'; }
        else if (picked === o.id) { cls += ' wrong'; mark = '<span class="mark">выбран</span>'; }
      } else if (picked === o.id) {
        cls += ' correct';
      }
      return '<button class="' + cls + '" data-opt="' + esc(o.id) + '">' + esc(o.text) + mark + '</button>';
    }).join('');

    var award = teams.length
      ? '<div class="award"><div class="q-meta">Начислить за вопрос</div>' + teams.map(function (t) {
          return '<div class="award-row">'
            + '<div class="nm">' + esc(t.name || 'Команда') + ' <span class="subtle">· ' + t.score + '</span></div>'
            + '<button class="minus" data-score="' + esc(t.id) + '" data-delta="' + (-q.points) + '">−' + q.points + '</button>'
            + '<button class="plus" data-score="' + esc(t.id) + '" data-delta="' + q.points + '">+' + q.points + '</button>'
            + '</div>';
        }).join('') + '</div>'
      : '<div class="award subtle">Добавьте команды на главном экране, чтобы начислять очки.</div>';

    return '<div class="overlay" id="overlay"><div class="modal">'
      + '<div class="q-meta">' + esc(openQ.catName) + ' · ' + q.points + '</div>'
      + '<div class="q-text">' + esc(q.text) + '</div>'
      + (opts || '<div class="subtle">Вариантов ответа нет — вопрос открытый.</div>')
      + award
      + '<div class="modal-actions">'
      + (revealed ? '' : '<button class="btn" id="reveal">Показать ответ</button>')
      + '<button class="btn accent" id="close-q">Вопрос сыгран</button>'
      + '</div>'
      + '<div style="text-align:center;margin-top:10px"><button class="btn ghost sm" id="cancel-q">Закрыть без отметки</button></div>'
      + '</div></div>';
  }

  function renderTeamsModal() {
    var rows = teams.length
      ? teams.map(function (t) {
          return '<div class="team-edit">'
            + '<div class="nm">' + esc(t.name || 'Команда') + ' <span class="subtle">· ' + t.score + '</span></div>'
            + '<button class="btn sm" data-rename="' + esc(t.id) + '">Имя</button>'
            + '<button class="btn sm" data-remove="' + esc(t.id) + '">Удалить</button>'
            + '</div>';
        }).join('')
      : '<div class="subtle">Команд пока нет.</div>';

    return '<div class="overlay" id="overlay"><div class="modal">'
      + '<div class="q-meta">Команды</div>'
      + rows
      + '<div class="add-team"><input id="new-team" placeholder="Название команды" maxlength="40" />'
      + '<button class="btn accent" id="add-team">Добавить</button></div>'
      + '<div class="modal-actions">'
      + '<button class="btn" id="reset-scores">Обнулить счёт</button>'
      + '<button class="btn" id="reset-board">Открыть вопросы</button>'
      + '</div>'
      + '<div style="text-align:center;margin-top:10px"><button class="btn ghost sm" id="close-teams">Закрыть</button></div>'
      + '</div></div>';
  }

  function render() {
    var html = ''
      + '<div class="head"><div class="grow">'
      + '<h1>' + esc(game.game.title) + '</h1>'
      + (game.game.description ? '<div class="desc">' + esc(game.game.description) + '</div>' : '')
      + '<div class="subtle" style="margin-top:6px">Сыграно ' + answeredCount() + ' из ' + questionsCount() + '</div>'
      + '</div></div>'
      + '<div class="toolbar"><button class="btn" id="open-teams">Команды</button></div>'
      + renderTeams()
      + renderBoard()
      + '<div class="footer-note">Счёт виден всем, кто открыл эту ссылку.</div>';

    if (openQ) html += renderQuestionModal();
    else if (showTeams) html += renderTeamsModal();

    root.innerHTML = html;
    bind();
  }

  function bind() {
    root.querySelectorAll('[data-q]').forEach(function (el) {
      el.addEventListener('click', function () {
        var qid = el.getAttribute('data-q');
        (game.categories || []).forEach(function (c) {
          c.questions.forEach(function (q) {
            if (q.id === qid) openQ = { catName: c.name, question: q };
          });
        });
        picked = null; revealed = false;
        render();
      });
    });

    root.querySelectorAll('[data-score]').forEach(function (el) {
      el.addEventListener('click', function () {
        changeScore(el.getAttribute('data-score'), parseInt(el.getAttribute('data-delta'), 10) || 0);
      });
    });

    root.querySelectorAll('[data-opt]').forEach(function (el) {
      el.addEventListener('click', function () {
        picked = el.getAttribute('data-opt');
        revealed = true;      // вариант выбран — сразу видно, верный он или нет
        render();
      });
    });

    var reveal = root.querySelector('#reveal');
    if (reveal) reveal.addEventListener('click', function () { revealed = true; render(); });

    var closeQ = root.querySelector('#close-q');
    if (closeQ) closeQ.addEventListener('click', function () {
      answered[openQ.question.id] = true;
      openQ = null; picked = null; revealed = false;
      scheduleSave();
      render();
    });

    var cancelQ = root.querySelector('#cancel-q');
    if (cancelQ) cancelQ.addEventListener('click', function () {
      openQ = null; picked = null; revealed = false;
      render();
    });

    var openTeams = root.querySelector('#open-teams');
    if (openTeams) openTeams.addEventListener('click', function () { showTeams = true; render(); });

    var closeTeams = root.querySelector('#close-teams');
    if (closeTeams) closeTeams.addEventListener('click', function () { showTeams = false; render(); });

    var addBtn = root.querySelector('#add-team');
    var input = root.querySelector('#new-team');
    if (addBtn && input) {
      addBtn.addEventListener('click', function () { addTeam(input.value); });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') addTeam(input.value); });
    }

    root.querySelectorAll('[data-rename]').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-rename');
        var cur = (teams.find(function (t) { return t.id === id; }) || {}).name || '';
        var next = prompt('Название команды:', cur);
        if (next == null) return;
        teams = teams.map(function (t) { return t.id === id ? { id: t.id, name: next.trim().slice(0, 40), score: t.score } : t; });
        scheduleSave();
        render();
      });
    });

    root.querySelectorAll('[data-remove]').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-remove');
        var t = teams.find(function (x) { return x.id === id; });
        if (!confirm('Удалить команду «' + ((t && t.name) || 'Команда') + '»?')) return;
        teams = teams.filter(function (x) { return x.id !== id; });
        scheduleSave();
        render();
      });
    });

    var resetScores = root.querySelector('#reset-scores');
    if (resetScores) resetScores.addEventListener('click', function () {
      if (!confirm('Обнулить счёт всех команд?')) return;
      teams = teams.map(function (t) { return { id: t.id, name: t.name, score: 0 }; });
      scheduleSave();
      render();
    });

    var resetBoard = root.querySelector('#reset-board');
    if (resetBoard) resetBoard.addEventListener('click', function () {
      if (!confirm('Снять отметки «сыгран» со всех вопросов?')) return;
      answered = {};
      scheduleSave();
      render();
    });
  }

  function renderError() {
    root.innerHTML = '<div class="center"><div class="font-display" style="font-size:20px;margin-bottom:8px;">Игра не найдена</div>'
      + '<div class="muted">Ссылка недействительна или отключена автором.</div></div>';
  }

  if (!token) {
    renderError();
  } else {
    fetch('/api/game/' + encodeURIComponent(token))
      .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(function (p) {
        applyPayload(p);
        render();
        pollTimer = setInterval(poll, 8000);
      })
      .catch(renderError);
  }
})();
</script>
</body>
</html>
