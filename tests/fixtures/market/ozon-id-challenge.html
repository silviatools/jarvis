  <link rel="stylesheet" href="https://st.ozone.ru/s3/abt-challenge/incidents/styles_v2/common.css">
  <title>Antibot Challenge Page</title>

</head>

<body>
  <noscript>
    <div class="container">
      <div class="message">
        <div class="variant">

          <span class="subtitle">Нам нужно убедиться, что вы не робот.</span>

          <span class="subtitle">We need to make sure that you are not a robot.</span>
        </div>
      </div>
      <div class="details">
        <span class="details-text"><b>ID:</b> fab_chlg_20261027105228_01M5YFTXYP44JTM36QE7XJ86MF</span>,
        <span class="details-text"><b>IP:</b> 54.200.13.96</span>,
        <span class="details-text">Tuesday, 27-Oct-2026 10:52:28 UTC</span>
      </div>
    </div>
  </noscript>
  <div class="container" id="container">
    <div class="content" id="content">
      <input id="challenge" type="hidden" value="">
      <input id="incident" type="hidden" value="">
      <input id="complaints-token" type="hidden" value="">
      <input id="challenge-ip" type="hidden" value="">
      <input id="challenge-date" type="hidden" value="">
      <input id="complain-new-window" type="hidden" value="">

          <div class="loader-ellipse"></div>

        </div>

          <span id="run-status"></span>

        </ul>

    </div>

  <script>
    performance.mark('jobStart', { startTime: Date.now() })
    function showInformation() {
      const informationElement = document.querySelector('.challenge-information');
      if (informationElement) {
        informationElement.removeAttribute("hidden");
      }
    }
  </script>
