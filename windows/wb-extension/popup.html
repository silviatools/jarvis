<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Джарвис — WB</title>
<style>
body{font:14px system-ui,sans-serif;width:340px;padding:16px;color:#24212e}h1{font-size:19px;margin-top:0}label{display:block;margin:12px 0}input{box-sizing:border-box;width:100%;padding:9px;margin-top:5px;border:1px solid #bbb;border-radius:7px}button{padding:9px 12px;margin:3px 3px 3px 0;cursor:pointer}p{line-height:1.45}.muted{color:#666;font-size:12px}#status{white-space:pre-wrap}#error{color:#b42318}textarea{box-sizing:border-box;width:100%;height:200px;font:11px monospace}h2{font-size:16px}
</style></head><body>
<h1>Джарвис · Wildberries</h1>
<p>Войдите в WB в этом профиле Chrome. Расширение читает только покупки и доставки.</p>
<label>Адрес вашего Джарвиса<input id="server" type="url" placeholder="https://…up.railway.app" autocomplete="off"></label>
<label>Ключ ПК из настроек Джарвиса<input id="token" type="password" autocomplete="off" placeholder="wbpc_…"></label>
<button id="connect">Подключить</button><button id="disconnect">Остановить</button>
<button id="open">Открыть WB</button><button id="poll">Обновить связь</button>
<p id="status" role="status"></p><p id="error" role="alert"></p>
<h2>Диагностика WB</h2>
<p id="version" class="muted"></p>
<button id="diagnose">Проверить WB (открыть вкладку)</button><button id="copyLogs">Скопировать логи</button><button id="clearLogs">Очистить</button>
<button id="fields">Поля товаров и ПВЗ</button>
<p id="diagnosticStatus" class="muted" role="status"></p>
<textarea id="logs" readonly aria-label="Логи проверок WB" placeholder="Здесь появятся последние проверки. Значения полей заказов, cookies и ключ не записываются."></textarea>
<p class="muted">Chrome и ПК должны работать. Связь обновляется примерно каждые 30 секунд. Cookies и коды входа не отправляются Джарвису.</p>
<script src="popup.js"></script></body></html>
