function CarModal({ car, onSave, onClose }) {
  const [form, setForm] = useState(car);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const submit = () => {
    if (!form.name.trim()) return alert('Введите название автомобиля');
    onSave(form);
  };

  return (
    <Modal onClose={onClose} title={car.name ? 'Редактировать автомобиль' : 'Новый автомобиль'}>
      <div className="space-y-4">
        <div>
          <label>Название</label>
          <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="Например, Toyota Camry 2021" />
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label>Год</label>
            <input type="number" value={form.year} onChange={e => set('year', e.target.value)} placeholder="2021" min="1900" max="2099" />
          </div>
          <div>
            <label>Гос. номер</label>
            <input value={form.plate} onChange={e => set('plate', e.target.value)} placeholder="А123ВС77" />
          </div>
        </div>
        <div>
          <label>Заметки</label>
          <textarea value={form.notes} onChange={e => set('notes', e.target.value)} rows={2} placeholder="Цвет, особенности..." />
        </div>
        <div className="flex gap-3 pt-2">
          <button onClick={onClose} className="btn-secondary flex-1">Отмена</button>
          <button onClick={submit} className="btn-primary flex-1">Сохранить</button>
        </div>
      </div>
    </Modal>
  );
}

function ServiceHistoryView({ data, setData }) {
  const [filterCar, setFilterCar] = useState('all');
  const [filterService, setFilterService] = useState('');
  const [editRecord, setEditRecord] = useState(null);

  const cars = (data.cars || []).filter(c => !c.archived);
  const allRecords = data.serviceRecords || [];

  // Нормализация: старые записи имели service+price на верхнем уровне
  const getItems = (r) =>
    r.items || (r.service ? [{ id: 'legacy', service: r.service, price: r.price || 0 }] : []);

  const visibleServiceNames = [...new Set(
    allRecords
      .filter(r => filterCar === 'all' || r.carId === filterCar)
      .flatMap(r => getItems(r).map(i => i.service))
      .filter(Boolean)
  )].sort();

  const filtered = allRecords
    .filter(r => filterCar === 'all' || r.carId === filterCar)
    .filter(r => !filterService || getItems(r).some(i => i.service === filterService))
    .sort((a, b) => b.date.localeCompare(a.date));

  const getCarName = (carId) => (data.cars || []).find(c => c.id === carId)?.name || '—';

  const saveRecord = (record) => {
    record = { ...record, updatedAt: Date.now() };
    setData(d => {
      const list = d.serviceRecords || [];
      const exists = list.find(r => r.id === record.id);
      return { ...d, serviceRecords: exists ? list.map(r => r.id === record.id ? record : r) : [...list, record] };
    });
    setEditRecord(null);
  };

  const deleteRecord = (id) => {
    if (!confirm('Удалить запись?')) return;
    setData(d => ({ ...d, serviceRecords: (d.serviceRecords || []).filter(r => r.id !== id), deletedIds: withDeletedId(d, 'serviceRecords', id) }));
  };

  const fmtDate = (s) => {
    if (!s) return '';
    const d = new Date(s + 'T00:00:00');
    const mo = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    return `${d.getDate()} ${mo[d.getMonth()]} ${d.getFullYear()}`;
  };

  const fmtMoney = (n) => n ? new Intl.NumberFormat('ru-RU').format(n) + ' ₽' : null;
  const fmtKm    = (n) => n ? new Intl.NumberFormat('ru-RU').format(n) + ' км' : null;
  const totalCost = filtered.reduce((s, r) => s + getItems(r).reduce((a, i) => a + (Number(i.price) || 0), 0), 0);

  const newRecord = () => ({
    id: crypto.randomUUID(),
    carId: filterCar !== 'all' ? filterCar : cars[0].id,
    date: getTodayKey(),
    items: [{ id: crypto.randomUUID(), service: '', price: '' }],
    mileage: '', notes: '',
  });

  if (cars.length === 0) {
    return <EmptyState title="Нет автомобилей" text="Добавьте автомобиль во вкладке «Автомобили»" />;
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-display text-2xl">История</h2>
        <button onClick={() => setEditRecord(newRecord())} className="btn-primary flex items-center gap-2 text-sm">
          <Icon name="plus" size={16} />
          Добавить
        </button>
      </div>

      {/* Фильтры */}
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 mb-4 space-y-3">
        <div>
          <label>Автомобиль</label>
          <select value={filterCar} onChange={e => { setFilterCar(e.target.value); setFilterService(''); }}>
            <option value="all">Все автомобили</option>
            {cars.map(c => <option key={c.id} value={c.id}>{c.name}{c.year ? ` (${c.year})` : ''}</option>)}
          </select>
        </div>
        {visibleServiceNames.length > 0 && (
          <div>
            <label>Вид работ</label>
            <select value={filterService} onChange={e => setFilterService(e.target.value)}>
              <option value="">Все работы</option>
              {visibleServiceNames.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        )}
      </div>

      {/* Итог */}
      {filtered.length > 0 && (
        <div className="flex items-center gap-4 text-sm text-[var(--text-muted)] mb-4 px-1">
          <span>
            {filtered.length}{' '}
            {filtered.length === 1 ? 'запись' : filtered.length < 5 ? 'записи' : 'записей'}
          </span>
          {totalCost > 0 && (
            <span>Итого: <strong className="text-[var(--text)]">{fmtMoney(totalCost)}</strong></span>
          )}
        </div>
      )}

      {filtered.length === 0 ? (
        <EmptyState title="Нет записей" text="Нажмите «Добавить» чтобы внести первое обслуживание" />
      ) : (
        <div className="space-y-3">
          {filtered.map(record => {
            const items = getItems(record);
            const recTotal = items.reduce((s, i) => s + (Number(i.price) || 0), 0);
            return (
              <div key={record.id} className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
                <div className="flex items-start justify-between gap-4">
                  <div className="flex-1 min-w-0">
                    {/* Шапка: дата, авто, пробег */}
                    <div className="flex flex-wrap items-center gap-x-3 gap-y-0.5 text-sm mb-3">
                      <span className="font-medium text-[var(--text)]">{fmtDate(record.date)}</span>
                      {filterCar === 'all' && (
                        <span className="text-[var(--text-subtle)]">{getCarName(record.carId)}</span>
                      )}
                      {record.mileage > 0 && (
                        <span className="text-[var(--text-muted)]">{fmtKm(record.mileage)}</span>
                      )}
                    </div>
                    {/* Таблица работ */}
                    <div className="border border-[var(--border)] rounded-xl overflow-hidden text-sm">
                      {items.map((item, idx) => (
                        <div key={item.id || idx}
                          className={`flex items-center gap-3 px-3 py-2 ${idx > 0 ? 'border-t border-[var(--border)]' : ''}`}>
                          <span className="flex-1">{item.service}</span>
                          {Number(item.price) > 0 && (
                            <span className="text-[var(--text-muted)] flex-shrink-0 tabular-nums">{fmtMoney(item.price)}</span>
                          )}
                        </div>
                      ))}
                      {items.length > 1 && recTotal > 0 && (
                        <div className="flex items-center gap-3 px-3 py-2 border-t border-[var(--border-strong)] bg-[var(--bg)]">
                          <span className="flex-1 text-xs uppercase tracking-wide text-[var(--text-subtle)]">Итого</span>
                          <span className="font-semibold flex-shrink-0 tabular-nums">{fmtMoney(recTotal)}</span>
                        </div>
                      )}
                    </div>
                    {record.notes && <div className="text-sm text-[var(--text-muted)] mt-2 italic">{record.notes}</div>}
                  </div>
                  <div className="flex gap-1 flex-shrink-0">
                    <button onClick={() => setEditRecord(record)} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]">
                      <Icon name="edit" size={16} />
                    </button>
                    <button onClick={() => deleteRecord(record.id)} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]">
                      <Icon name="trash" size={16} />
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {editRecord && (
        <ServiceRecordModal
          record={editRecord}
          cars={cars}
          allServiceNames={[...new Set((data.serviceRecords || []).flatMap(r =>
            (r.items || (r.service ? [{ service: r.service }] : [])).map(i => i.service)
          ).filter(Boolean))].sort()}
          onSave={saveRecord}
          onClose={() => setEditRecord(null)}
        />
      )}
    </div>
  );
}

function ServiceRecordModal({ record, cars, allServiceNames, onSave, onClose }) {
  const initItems = () =>
    record.items
      ? record.items.map(i => ({ ...i }))
      : record.service
        ? [{ id: crypto.randomUUID(), service: record.service, price: record.price || '' }]
        : [{ id: crypto.randomUUID(), service: '', price: '' }];

  const [carId,   setCarId]   = useState(record.carId);
  const [date,    setDate]    = useState(record.date);
  const [mileage, setMileage] = useState(record.mileage || '');
  const [notes,   setNotes]   = useState(record.notes || '');
  const [items,   setItems]   = useState(initItems);
  const [activeSuggId, setActiveSuggId] = useState(null);

  const addItem    = () => setItems(it => [...it, { id: crypto.randomUUID(), service: '', price: '' }]);
  const removeItem = (id) => setItems(it => it.filter(i => i.id !== id));
  const updateItem = (id, key, val) => setItems(it => it.map(i => i.id === id ? { ...i, [key]: val } : i));

  const getSugg = (service) =>
    allServiceNames
      .filter(s => s !== service && s.toLowerCase().includes((service || '').toLowerCase()))
      .slice(0, 5);

  const total = items.reduce((s, i) => s + (Number(i.price) || 0), 0);

  const submit = () => {
    if (!carId) return alert('Выберите автомобиль');
    if (!date)  return alert('Укажите дату');
    const filled = items.filter(i => i.service.trim());
    if (!filled.length) return alert('Добавьте хотя бы одну работу');
    onSave({
      id: record.id,
      carId, date, notes,
      mileage: Number(mileage) || 0,
      items: filled.map(i => ({ ...i, service: i.service.trim(), price: Number(i.price) || 0 })),
    });
  };

  const isNew = !record.items && !record.service;

  return (
    <Modal onClose={onClose} title={isNew ? 'Новая запись' : 'Редактировать запись'}>
      <div className="space-y-4">
        <div>
          <label>Автомобиль</label>
          <select value={carId} onChange={e => setCarId(e.target.value)}>
            {cars.map(c => <option key={c.id} value={c.id}>{c.name}{c.year ? ` (${c.year})` : ''}</option>)}
          </select>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label>Дата</label>
            <input type="date" value={date} max={getTodayKey()} onChange={e => setDate(e.target.value)} />
          </div>
          <div>
            <label>Пробег (км)</label>
            <input type="number" min="0" value={mileage} onChange={e => setMileage(e.target.value)} placeholder="50000" />
          </div>
        </div>

        {/* Таблица работ */}
        <div>
          <label>Работы</label>
          <div className="space-y-2">
            {items.map((item, idx) => (
              <div key={item.id} className="flex gap-2 items-start">
                <div className="flex-1 relative">
                  <input
                    value={item.service}
                    onChange={e => { updateItem(item.id, 'service', e.target.value); setActiveSuggId(item.id); }}
                    onFocus={() => setActiveSuggId(item.id)}
                    onBlur={() => setTimeout(() => setActiveSuggId(null), 150)}
                    placeholder={`Работа ${idx + 1}...`}
                  />
                  {activeSuggId === item.id && getSugg(item.service).length > 0 && (
                    <div className="absolute left-0 right-0 top-full mt-1 bg-[var(--surface)] border border-[var(--border)] rounded-xl shadow-lg z-20 overflow-hidden">
                      {getSugg(item.service).map(s => (
                        <button key={s}
                          onMouseDown={() => { updateItem(item.id, 'service', s); setActiveSuggId(null); }}
                          className="w-full text-left px-4 py-2.5 text-sm hover:bg-black/5 text-[var(--text)]">
                          {s}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                <div style={{ width: 100, flexShrink: 0 }}>
                  <input
                    type="number" min="0"
                    value={item.price}
                    onChange={e => updateItem(item.id, 'price', e.target.value)}
                    placeholder="₽"
                  />
                </div>
                {items.length > 1 && (
                  <button onClick={() => removeItem(item.id)}
                    className="flex-shrink-0 p-2.5 text-[var(--text-subtle)] hover:text-red-400 transition-colors mt-0.5">
                    <Icon name="x" size={16} />
                  </button>
                )}
              </div>
            ))}
          </div>

          {total > 0 && (
            <div className="flex justify-between items-center px-1 pt-2 text-sm">
              <span className="text-[var(--text-subtle)]">Итого</span>
              <span className="font-semibold tabular-nums">{new Intl.NumberFormat('ru-RU').format(total)} ₽</span>
            </div>
          )}

          <button onClick={addItem}
            className="mt-2 flex items-center gap-1.5 text-sm text-[var(--text-muted)] hover:text-[var(--text)] transition-colors">
            <Icon name="plus" size={15} />
            Добавить работу
          </button>
        </div>

        <div>
          <label>Заметки</label>
          <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} placeholder="Сервис, мастер, бренд запчасти..." />
        </div>
        <div className="flex gap-3 pt-2">
          <button onClick={onClose} className="btn-secondary flex-1">Отмена</button>
          <button onClick={submit} className="btn-primary flex-1">Сохранить</button>
        </div>
      </div>
    </Modal>
  );
}

// ============== HEALTH VIEW (Здоровье) ==============

const HEALTH_EVENT_TYPES = [
  { id: 'illness',   label: 'Болезнь' },
  { id: 'visit',     label: 'Приём врача' },
  { id: 'procedure', label: 'Процедура/операция' },
  { id: 'flare_up',  label: 'Обострение' },
  { id: 'note',      label: 'Заметка' },
];
const healthEventTypeLabel = (id) => (HEALTH_EVENT_TYPES.find(t => t.id === id) || {}).label || id;

function formatHealthDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function HealthView({ data, setData }) {
  const [healthTab, setHealthTab] = useState('overview');
  const [editingEvent, setEditingEvent] = useState(null);         // 'new' | event | null
  const [newEventDefaults, setNewEventDefaults] = useState(null); // prefill for a 'new' event (e.g. conditionId)
  const [editingCondition, setEditingCondition] = useState(null); // 'new' | condition | null
  const [viewingCondition, setViewingCondition] = useState(null); // condition | null

  const conditions = [...(data.healthConditions || [])].sort((a, b) => (b.diagnosedDate || '').localeCompare(a.diagnosedDate || ''));
  const events = [...(data.healthEvents || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const openNewEvent = (defaults = null) => {
    setNewEventDefaults(defaults);
    setEditingEvent('new');
  };

  const saveEvent = (event) => {
    const now = Date.now();
    event = { ...event, updatedAt: now, createdAt: event.createdAt || now };
    setData(d => {
      const list = d.healthEvents || [];
      const exists = list.find(e => e.id === event.id);
      return { ...d, healthEvents: exists ? list.map(e => e.id === event.id ? event : e) : [...list, event] };
    });
    setEditingEvent(null);
  };

  const deleteEvent = (id) => {
    const event = events.find(e => e.id === id);
    (event?.photos || []).map(normalizePhoto).forEach(p => deletePhoto(p.filename));
    (event?.files || []).forEach(f => deleteFile(f.filename));
    setData(d => ({
      ...d,
      healthEvents: (d.healthEvents || []).filter(e => e.id !== id),
      deletedIds: withDeletedId(d, 'healthEvents', id),
    }));
  };

  const saveCondition = (condition) => {
    const now = Date.now();
    condition = { ...condition, updatedAt: now, createdAt: condition.createdAt || now };
    setData(d => {
      const list = d.healthConditions || [];
      const exists = list.find(c => c.id === condition.id);
      return { ...d, healthConditions: exists ? list.map(c => c.id === condition.id ? condition : c) : [...list, condition] };
    });
    setViewingCondition(v => (v && v.id === condition.id) ? condition : v);
    setEditingCondition(null);
    return condition;
  };

  // Удаление состояния не трогает связанные события — они остаются в истории,
  // только теряют привязку (conditionId обнуляется), чтобы не терять записи о лечении.
  const deleteCondition = (id) => {
    if (!confirm('Удалить состояние? Связанные записи в истории останутся, но потеряют привязку к нему.')) return;
    setData(d => ({
      ...d,
      healthConditions: (d.healthConditions || []).filter(c => c.id !== id),
      healthEvents: (d.healthEvents || []).map(e => e.conditionId === id ? { ...e, conditionId: '', updatedAt: Date.now() } : e),
      deletedIds: withDeletedId(d, 'healthConditions', id),
    }));
    setViewingCondition(v => (v && v.id === id) ? null : v);
  };

  if (editingEvent !== null) {
    return (
      <HealthEventForm
        event={editingEvent === 'new' ? null : editingEvent}
        defaults={newEventDefaults}
        conditions={data.healthConditions || []}
        onSave={saveEvent}
        onCancel={() => setEditingEvent(null)}
        onCreateCondition={(name) => saveCondition({
          id: crypto.randomUUID(), name, isChronic: false, status: 'active',
          diagnosedDate: '', resolvedDate: '', notes: '', tags: [],
        })}
      />
    );
  }

  if (editingCondition !== null) {
    return (
      <HealthConditionForm
        condition={editingCondition === 'new' ? null : editingCondition}
        onSave={saveCondition}
        onCancel={() => setEditingCondition(null)}
      />
    );
  }

  const tabs = [
    { id: 'overview',   label: 'Обзор'     },
    { id: 'timeline',   label: 'История'   },
    { id: 'conditions', label: 'Состояния' },
  ];

  return (
    <div className="fade-in">
      <div className="mb-6 flex items-end justify-between">
        <div>
          <div className="text-[var(--text-subtle)] text-xs uppercase tracking-widest mb-2">Раздел</div>
          <h1 className="font-display text-3xl md:text-4xl">Здоровье</h1>
        </div>
        {healthTab === 'timeline' && (
          <button onClick={() => openNewEvent()} className="btn-primary flex items-center gap-2 text-sm">
            <Icon name="plus" size={16} /> Запись
          </button>
        )}
        {healthTab === 'conditions' && (
          <button onClick={() => setEditingCondition('new')} className="btn-primary flex items-center gap-2 text-sm">
            <Icon name="plus" size={16} /> Состояние
          </button>
        )}
      </div>

      <div className="overflow-x-auto scrollbar-hide -mx-4 px-4 sm:mx-0 sm:px-0 mb-6">
        <div className="inline-flex bg-[var(--surface)] border border-[var(--border)] rounded-xl p-1 gap-0">
          {tabs.map(t => (
            <button key={t.id} onClick={() => setHealthTab(t.id)}
              className={`px-4 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap flex-shrink-0 ${healthTab===t.id?'bg-[var(--text)] text-white':'text-[var(--text-muted)]'}`}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {healthTab === 'overview'   && <HealthOverview conditions={conditions} events={events} onSelectCondition={setViewingCondition} />}
      {healthTab === 'timeline'   && <HealthTimeline events={events} conditions={data.healthConditions || []} onEdit={setEditingEvent} onDelete={deleteEvent} />}
      {healthTab === 'conditions' && <HealthConditionsList conditions={conditions} events={events} onEdit={setEditingCondition} onDelete={deleteCondition} onView={setViewingCondition} />}

      {viewingCondition && (
        <HealthConditionDetail
          condition={viewingCondition}
          events={events.filter(e => e.conditionId === viewingCondition.id)}
          onClose={() => setViewingCondition(null)}
          onEdit={() => { setEditingCondition(viewingCondition); setViewingCondition(null); }}
          onAddEvent={() => { openNewEvent({ conditionId: viewingCondition.id, type: 'flare_up' }); setViewingCondition(null); }}
          onEditEvent={(ev) => { setEditingEvent(ev); setViewingCondition(null); }}
        />
      )}
    </div>
  );
}

function HealthOverview({ conditions, events, onSelectCondition }) {
  const active = conditions.filter(c => c.status === 'active');
  const lastEventFor = (conditionId) => events.find(e => e.conditionId === conditionId) || null; // events отсортированы по убыванию даты

  if (active.length === 0) {
    return <EmptyState title="Нет активных состояний" text="Добавьте состояние во вкладке «Состояния» или запись во вкладке «История»" />;
  }

  return (
    <div className="space-y-3">
      {active.map(c => {
        const last = lastEventFor(c.id);
        return (
          <button key={c.id} onClick={() => onSelectCondition(c)}
            className="w-full text-left bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 hover:border-[var(--border-strong)] transition-colors">
            <div className="flex items-center gap-2 flex-wrap mb-1">
              <span className="font-display text-lg">{c.name}</span>
              {c.isChronic && (
                <span className="text-[10px] uppercase tracking-wide font-semibold px-2 py-0.5 rounded-full bg-[var(--text)] text-white">Хроническое</span>
              )}
            </div>
            <div className="text-xs text-[var(--text-muted)]">
              {c.diagnosedDate ? `С ${formatHealthDate(c.diagnosedDate)}` : 'Дата диагноза не указана'}
            </div>
            {last && (
              <div className="text-sm text-[var(--text-muted)] mt-2">
                Последняя запись: <span className="text-[var(--text)]">{formatHealthDate(last.date)}</span>{last.title ? ` — ${last.title}` : ''}
              </div>
            )}
          </button>
        );
      })}
    </div>
  );
}

function HealthTimeline({ events, conditions, onEdit, onDelete }) {
  const [query, setQuery] = useState('');
  const [filterType, setFilterType] = useState('all');
  const [filterCondition, setFilterCondition] = useState('all');

  const getConditionName = (id) => conditions.find(c => c.id === id)?.name || '';

  const q = query.trim().toLowerCase();
  const filtered = events
    .filter(e => filterType === 'all' || e.type === filterType)
    .filter(e => filterCondition === 'all' || e.conditionId === filterCondition)
    .filter(e => {
      if (!q) return true;
      const haystack = [
        e.title, e.symptoms, e.diagnosis, e.outcome, e.doctor, e.clinic,
        ...(e.medications || []).map(m => m.name),
        ...(e.tags || []),
      ].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(q);
    });

  if (events.length === 0) {
    return <EmptyState title="Нет записей" text="Нажмите «Запись» чтобы внести первую запись о болезни, визите к врачу или процедуре" />;
  }

  return (
    <div>
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 mb-4 space-y-3">
        <div className="relative">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-subtle)]">
            <Icon name="search" size={16} />
          </span>
          <input value={query} onChange={e => setQuery(e.target.value)}
            placeholder="Поиск по названию, диагнозу, препарату, тегам…" className="w-full !pl-9" />
        </div>
        <div className="grid grid-cols-2 gap-3">
          <select value={filterType} onChange={e => setFilterType(e.target.value)}>
            <option value="all">Все типы</option>
            {HEALTH_EVENT_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
          </select>
          <select value={filterCondition} onChange={e => setFilterCondition(e.target.value)}>
            <option value="all">Все состояния</option>
            {conditions.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
      </div>

      {filtered.length === 0 ? (
        <EmptyState title="Ничего не найдено" text="Попробуйте изменить запрос или фильтры" />
      ) : (
        <div className="space-y-3">
          {filtered.map(event => (
            <HealthEventRow key={event.id} event={event} conditionName={getConditionName(event.conditionId)}
              onEdit={() => onEdit(event)} onDelete={() => onDelete(event.id)} />
          ))}
        </div>
      )}
    </div>
  );
}

function HealthEventRow({ event, conditionName, onEdit, onDelete }) {
  const meds = event.medications || [];
  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
      <div className="flex items-start justify-between gap-3 mb-2">
        <div className="min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-display text-lg truncate">{event.title || healthEventTypeLabel(event.type)}</span>
            <span className="text-[10px] uppercase tracking-wide font-semibold px-2 py-0.5 rounded-full bg-[var(--bg)] border border-[var(--border)] text-[var(--text-muted)]">{healthEventTypeLabel(event.type)}</span>
          </div>
          <div className="text-xs text-[var(--text-muted)] mt-1 flex flex-wrap gap-x-2">
            <span>{formatHealthDate(event.date)}{event.endDate ? ` — ${formatHealthDate(event.endDate)}` : ''}</span>
            {conditionName && <span>· {conditionName}</span>}
            {event.doctor && <span>· {event.doctor}</span>}
          </div>
        </div>
        <div className="flex gap-1 shrink-0">
          <button onClick={onEdit} className="p-2 rounded-xl hover:bg-black/5 text-[var(--text-muted)]"><Icon name="edit" size={16} /></button>
          <button onClick={() => { if (confirm('Удалить запись?')) onDelete(); }} className="p-2 rounded-xl hover:bg-black/5 text-[var(--text-muted)]"><Icon name="trash" size={16} /></button>
        </div>
      </div>
      {event.diagnosis && <div className="text-sm text-[var(--text-muted)] mb-1"><span className="text-[var(--text-subtle)]">Диагноз:</span> {event.diagnosis}</div>}
      {meds.length > 0 && (
        <div className="flex flex-wrap gap-1.5 mt-2">
          {meds.map(m => (
            <span key={m.id} className="px-2.5 py-1 rounded-full text-xs bg-[var(--bg)] border border-[var(--border)]">
              💊 {m.name}{m.dosage ? `, ${m.dosage}` : ''}
            </span>
          ))}
        </div>
      )}
      {event.outcome && <div className="text-sm text-[var(--text-muted)] mt-2 italic">{event.outcome}</div>}
    </div>
  );
}

function HealthConditionsList({ conditions, events, onEdit, onDelete, onView }) {
  if (conditions.length === 0) {
    return <EmptyState title="Нет состояний" text="Добавьте хроническое заболевание или перенесённую операцию" />;
  }

  const eventCount = (id) => events.filter(e => e.conditionId === id).length;
  const chronicActive = conditions.filter(c => c.isChronic && c.status === 'active');
  const rest = conditions.filter(c => !(c.isChronic && c.status === 'active'));

  const Row = (c) => {
    const n = eventCount(c.id);
    return (
      <div key={c.id} className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
        <div className="flex items-start justify-between gap-3">
          <button onClick={() => onView(c)} className="text-left flex-1 min-w-0">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="font-medium">{c.name}</span>
              {c.isChronic && <span className="text-[10px] uppercase tracking-wide font-semibold px-2 py-0.5 rounded-full bg-[var(--text)] text-white">Хроническое</span>}
              {c.status === 'resolved' && <span className="text-[10px] uppercase tracking-wide font-semibold px-2 py-0.5 rounded-full border border-[var(--border)] text-[var(--text-muted)]">Разрешено</span>}
            </div>
            <div className="text-xs text-[var(--text-muted)] mt-1.5 flex flex-wrap gap-x-3 gap-y-1">
              {c.diagnosedDate && <span>С {formatHealthDate(c.diagnosedDate)}</span>}
              {n > 0 && <span>{n} {n === 1 ? 'запись' : n < 5 ? 'записи' : 'записей'}</span>}
            </div>
          </button>
          <div className="flex gap-1 shrink-0">
            <button onClick={() => onEdit(c)} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]"><Icon name="edit" size={16} /></button>
            <button onClick={() => onDelete(c.id)} className="p-2 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500"><Icon name="trash" size={16} /></button>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div className="space-y-3">
      {chronicActive.map(Row)}
      {rest.map(Row)}
    </div>
  );
}

function HealthConditionDetail({ condition, events, onClose, onEdit, onAddEvent, onEditEvent }) {
  return (
    <Modal title={condition.name} onClose={onClose} wide>
      <div className="space-y-5">
        <div className="flex flex-wrap gap-2 text-xs">
          {condition.isChronic && <span className="px-2.5 py-1 rounded-full font-semibold uppercase tracking-wide bg-[var(--text)] text-white">Хроническое</span>}
          <span className="px-2.5 py-1 rounded-full font-medium border border-[var(--border)] text-[var(--text-muted)]">{condition.status === 'resolved' ? 'Разрешено' : 'Активно'}</span>
        </div>
        <div className="text-sm text-[var(--text-muted)] space-y-0.5">
          {condition.diagnosedDate && <div>Диагностировано: <b className="text-[var(--text)]">{formatHealthDate(condition.diagnosedDate)}</b></div>}
          {condition.resolvedDate && <div>Разрешено: <b className="text-[var(--text)]">{formatHealthDate(condition.resolvedDate)}</b></div>}
        </div>
        {condition.notes && <div className="text-sm bg-[var(--bg)] border border-[var(--border)] rounded-xl p-3">{condition.notes}</div>}

        <div>
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs uppercase tracking-wide text-[var(--text-subtle)] font-medium">История ({events.length})</div>
            <button onClick={onAddEvent} className="text-sm text-[var(--text-muted)] hover:text-[var(--text)] flex items-center gap-1"><Icon name="plus" size={14} /> Эпизод</button>
          </div>
          {events.length === 0 ? (
            <div className="text-sm text-[var(--text-subtle)]">Пока нет связанных записей</div>
          ) : (
            <div className="space-y-2">
              {events.map(e => (
                <button key={e.id} onClick={() => onEditEvent(e)}
                  className="w-full text-left bg-[var(--bg)] border border-[var(--border)] rounded-xl p-3 hover:border-[var(--border-strong)] transition-colors">
                  <div className="text-sm font-medium">{formatHealthDate(e.date)} · {e.title || healthEventTypeLabel(e.type)}</div>
                  {e.diagnosis && <div className="text-xs text-[var(--text-muted)] mt-0.5">{e.diagnosis}</div>}
                  {(e.medications || []).length > 0 && (
                    <div className="flex flex-wrap gap-1 mt-1.5">
                      {e.medications.map(m => (
                        <span key={m.id} className="px-2 py-0.5 rounded-full text-[10px] bg-[var(--surface)] border border-[var(--border)]">💊 {m.name}{m.dosage ? `, ${m.dosage}` : ''}</span>
                      ))}
                    </div>
                  )}
                </button>
              ))}
            </div>
          )}
        </div>

        <div className="flex gap-3 pt-2">
          <button onClick={onEdit} className="btn-secondary flex-1">Редактировать</button>
          <button onClick={onClose} className="btn-primary flex-1">Закрыть</button>
        </div>
      </div>
    </Modal>
  );
}

function HealthEventForm({ event, defaults, conditions, onSave, onCancel, onCreateCondition }) {
  const today = getTodayKey();
  const [form, setForm] = useState(() => event
    ? {
        ...event,
        medications: (event.medications || []).map(m => ({ ...m })),
        photos: (event.photos || []).map(normalizePhoto),
        files: (event.files || []).map(f => ({ ...f })),
        tags: [...(event.tags || [])],
      }
    : {
        id: crypto.randomUUID(),
        date: today, endDate: '',
        type: (defaults && defaults.type) || 'illness',
        conditionId: (defaults && defaults.conditionId) || '',
        title: '', symptoms: '', diagnosis: '', doctor: '', clinic: '',
        medications: [], outcome: '', photos: [], files: [], tags: [], notes: '',
      });
  const [pending, setPending] = useState([]); // {file, preview, category}
  const [tagInput, setTagInput] = useState('');
  const [addingCondition, setAddingCondition] = useState(false);
  const [newConditionName, setNewConditionName] = useState('');
  const [uploading, setUploading] = useState(false);
  const [uploadingFile, setUploadingFile] = useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const addMed = () => set('medications', [...form.medications, { id: crypto.randomUUID(), name: '', dosage: '', schedule: '', duration: '', notes: '' }]);
  const updMed = (id, k, v) => set('medications', form.medications.map(m => m.id === id ? { ...m, [k]: v } : m));
  const delMed = (id) => set('medications', form.medications.filter(m => m.id !== id));

  const addTag = () => {
    const t = tagInput.trim();
    if (t && !form.tags.includes(t)) set('tags', [...form.tags, t]);
    setTagInput('');
  };
  const removeTag = (t) => set('tags', form.tags.filter(x => x !== t));

  const confirmNewCondition = () => {
    const name = newConditionName.trim();
    if (!name) { setAddingCondition(false); return; }
    const condition = onCreateCondition(name);
    set('conditionId', condition.id);
    setNewConditionName('');
    setAddingCondition(false);
  };

  const handleFiles = (e) => {
    const files = Array.from(e.target.files);
    setPending(p => [...p, ...files.map(f => ({ file: f, preview: URL.createObjectURL(f), category: '' }))]);
    e.target.value = '';
  };
  const removePending = (i) => setPending(p => { URL.revokeObjectURL(p[i].preview); return p.filter((_, j) => j !== i); });
  const setPendingCategory = (i, cat) => setPending(p => p.map((item, j) => j === i ? { ...item, category: cat } : item));
  const setExistingCategory = (filename, cat) => set('photos', form.photos.map(ph => ph.filename === filename ? { ...ph, category: cat } : ph));
  const removeExistingPhoto = async (filename) => {
    await deletePhoto(filename);
    set('photos', form.photos.filter(ph => ph.filename !== filename));
  };

  const onFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setUploadingFile(true);
    try {
      const filename = await uploadFile(file);
      set('files', [...form.files, { filename, originalName: file.name, ext: (file.name.split('.').pop() || '').toLowerCase() }]);
    } catch {
      alert('Не удалось загрузить файл');
    }
    setUploadingFile(false);
    e.target.value = '';
  };
  const removeExistingFile = async (filename) => {
    await deleteFile(filename);
    set('files', form.files.filter(f => f.filename !== filename));
  };

  const handleSave = async () => {
    if (!form.title.trim()) { alert('Введите название записи'); return; }
    setUploading(true);
    try {
      // Фото грузятся независимо: одна неудачная загрузка (офлайн, сбой сервера)
      // не должна отменять всю запись — остальное сохранится и без неё.
      const results = await Promise.allSettled(pending.map(async p => {
        const filename = await uploadPhoto(p.file);
        return { filename, category: p.category || '' };
      }));
      const uploaded = results.filter(r => r.status === 'fulfilled').map(r => r.value);
      const failed = results.length - uploaded.length;
      pending.forEach(p => URL.revokeObjectURL(p.preview));
      if (failed > 0) alert(`Не удалось загрузить ${failed} фото — запись сохранена без них.`);
      onSave({
        ...form,
        medications: form.medications.filter(m => (m.name || '').trim()),
        photos: [...form.photos, ...uploaded],
      });
    } finally {
      setUploading(false);
    }
  };

  const PhotoCategoryPills = ({ value, onChange }) => (
    <div className="flex flex-wrap gap-1 mt-1.5">
      <button onClick={() => onChange('')}
        className={`px-2 py-0.5 rounded-full text-[10px] font-medium border transition-all ${!value ? 'bg-[var(--text)] text-white border-transparent' : 'border-[var(--border)] text-[var(--text-muted)] hover:bg-black/5'}`}>
        Без категории
      </button>
      {['анализы', 'снимок', 'выписка', 'рецепт'].map(c => (
        <button key={c} onClick={() => onChange(c)}
          className={`px-2 py-0.5 rounded-full text-[10px] font-medium border transition-all ${value===c ? 'bg-[var(--text)] text-white border-transparent' : 'border-[var(--border)] text-[var(--text-muted)] hover:bg-black/5'}`}>
          {c}
        </button>
      ))}
    </div>
  );

  return (
    <div className="fade-in">
      <div className="mb-6 flex items-center gap-3">
        <button onClick={onCancel} className="p-2 rounded-xl hover:bg-black/5 text-[var(--text-muted)]"><Icon name="x" size={20} /></button>
        <h2 className="font-display text-2xl">{event ? 'Редактировать запись' : 'Новая запись'}</h2>
      </div>

      <div className="space-y-4">
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 space-y-4">
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label>Дата начала</label>
              <input type="date" value={form.date} max={today} onChange={e => set('date', e.target.value)} />
            </div>
            <div>
              <label>Дата окончания (если растянулось)</label>
              <input type="date" value={form.endDate || ''} onChange={e => set('endDate', e.target.value)} />
            </div>
          </div>
          <div>
            <label>Тип записи</label>
            <div className="flex flex-wrap gap-1.5">
              {HEALTH_EVENT_TYPES.map(t => (
                <button key={t.id} onClick={() => set('type', t.id)}
                  className={`px-3 py-1.5 rounded-lg text-sm font-medium border transition-all ${form.type===t.id ? 'bg-[var(--text)] text-white border-transparent' : 'border-[var(--border)] text-[var(--text-muted)] hover:bg-black/5'}`}>
                  {t.label}
                </button>
              ))}
            </div>
          </div>
        </div>

        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
          <label>Название</label>
          <input value={form.title} onChange={e => set('title', e.target.value)} placeholder="Например, ОРВИ, приём гастроэнтеролога…" />
        </div>

        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
          <label>Связанное состояние (необязательно)</label>
          {!addingCondition ? (
            <div className="flex gap-2">
              <select value={form.conditionId || ''} onChange={e => set('conditionId', e.target.value)} className="flex-1">
                <option value="">Без привязки</option>
                {conditions.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <button onClick={() => setAddingCondition(true)} className="btn-secondary px-3 shrink-0 text-sm whitespace-nowrap">+ Новое</button>
            </div>
          ) : (
            <div className="flex gap-2">
              <input autoFocus value={newConditionName} onChange={e => setNewConditionName(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); confirmNewCondition(); } }}
                placeholder="Название нового состояния" className="flex-1" />
              <button onClick={confirmNewCondition} className="btn-primary px-3 shrink-0 text-sm">Создать</button>
              <button onClick={() => { setAddingCondition(false); setNewConditionName(''); }} className="btn-secondary px-3 shrink-0 text-sm">Отмена</button>
            </div>
          )}
        </div>

        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 space-y-4">
          <div>
            <label>Симптомы</label>
            <textarea value={form.symptoms} rows={2} onChange={e => set('symptoms', e.target.value)} style={{ resize: 'vertical' }} placeholder="Что беспокоило..." />
          </div>
          <div>
            <label>Диагноз</label>
            <textarea value={form.diagnosis} rows={2} onChange={e => set('diagnosis', e.target.value)} style={{ resize: 'vertical' }} placeholder="Поставленный диагноз..." />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label>Врач</label>
              <input value={form.doctor} onChange={e => set('doctor', e.target.value)} placeholder="ФИО врача" />
            </div>
            <div>
              <label>Клиника</label>
              <input value={form.clinic} onChange={e => set('clinic', e.target.value)} placeholder="Название клиники" />
            </div>
          </div>
        </div>

        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-display text-lg">Лечение / препараты</h3>
            <button onClick={addMed} className="text-sm text-[var(--text-muted)] hover:text-[var(--text)] flex items-center gap-1"><Icon name="plus" size={14} /> Добавить</button>
          </div>
          {form.medications.length === 0 ? (
            <div className="text-sm text-[var(--text-subtle)]">Нет добавленных препаратов</div>
          ) : (
            <div className="space-y-3">
              {form.medications.map(m => (
                <div key={m.id} className="border border-[var(--border)] rounded-xl p-3 space-y-2">
                  <div className="flex gap-2">
                    <input value={m.name} onChange={e => updMed(m.id, 'name', e.target.value)} placeholder="Название препарата" />
                    <button onClick={() => delMed(m.id)} className="p-2 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500 shrink-0"><Icon name="trash" size={16} /></button>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <input value={m.dosage} onChange={e => updMed(m.id, 'dosage', e.target.value)} placeholder="Дозировка (напр. 500 мг)" />
                    <input value={m.duration} onChange={e => updMed(m.id, 'duration', e.target.value)} placeholder="Длительность (напр. 7 дней)" />
                  </div>
                  <input value={m.schedule} onChange={e => updMed(m.id, 'schedule', e.target.value)} placeholder="Схема приёма (напр. 2 раза в день после еды)" />
                  <input value={m.notes} onChange={e => updMed(m.id, 'notes', e.target.value)} placeholder="Заметка (необязательно)" />
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
          <label>Результат / исход</label>
          <textarea value={form.outcome} rows={2} onChange={e => set('outcome', e.target.value)} style={{ resize: 'vertical' }} placeholder="Помогло, симптомы прошли за..., не помогло..." />
        </div>

        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
          <h3 className="font-display text-lg mb-3">Фото</h3>
          <div className="space-y-3">
            {form.photos.map(ph => (
              <div key={ph.filename} className="flex gap-3 items-start bg-[var(--bg)] rounded-xl p-2">
                <div className="relative flex-shrink-0">
                  <img src={`/api/photos/${ph.filename}`} className="w-16 h-16 object-cover rounded-xl" />
                  <button onClick={() => removeExistingPhoto(ph.filename)}
                    className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-xs flex items-center justify-center">×</button>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-xs text-[var(--text-muted)] mb-0.5">Категория:</div>
                  <PhotoCategoryPills value={ph.category} onChange={cat => setExistingCategory(ph.filename, cat)} />
                </div>
              </div>
            ))}
            {pending.map((p, i) => (
              <div key={i} className="flex gap-3 items-start bg-[var(--bg)] rounded-xl p-2">
                <div className="relative flex-shrink-0">
                  <img src={p.preview} className="w-16 h-16 object-cover rounded-xl opacity-70" />
                  <button onClick={() => removePending(i)}
                    className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-xs flex items-center justify-center">×</button>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-xs text-[var(--text-muted)] mb-0.5">Категория:</div>
                  <PhotoCategoryPills value={p.category} onChange={cat => setPendingCategory(i, cat)} />
                </div>
              </div>
            ))}
            <label className="flex items-center gap-2 px-3 py-2.5 border-2 border-dashed border-[var(--border-strong)] rounded-xl cursor-pointer hover:bg-black/5 text-[var(--text-subtle)]">
              <input type="file" accept="image/*" multiple className="hidden" onChange={handleFiles} />
              <Icon name="plus" size={18} />
              <span className="text-sm">Добавить фото</span>
            </label>
          </div>
        </div>

        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
          <h3 className="font-display text-lg mb-3">Документы (анализы, выписки, направления)</h3>
          <div className="space-y-2">
            {form.files.map(f => (
              <div key={f.filename} className="flex items-center gap-2 text-sm px-3 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--bg)]">
                <Icon name="download" size={16} />
                <a href={`/api/files/${f.filename}`} target="_blank" rel="noopener" download={f.originalName} className="truncate flex-1 hover:underline">{f.originalName}</a>
                <button onClick={() => removeExistingFile(f.filename)} className="p-1.5 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500 shrink-0"><Icon name="trash" size={15} /></button>
              </div>
            ))}
            <label className="flex items-center justify-center gap-2 text-sm px-4 py-3 rounded-xl border border-dashed border-[var(--border)] text-[var(--text-muted)] hover:border-[var(--text)] hover:text-[var(--text)] transition-colors cursor-pointer">
              <Icon name="plus" size={16} />
              {uploadingFile ? 'Загрузка…' : 'Загрузить файл (PDF, фото, doc…)'}
              <input type="file" className="hidden" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.rtf,.csv,image/*" onChange={onFile} disabled={uploadingFile} />
            </label>
          </div>
        </div>

        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
          <label>Теги</label>
          <div className="flex flex-wrap gap-1.5 mb-2">
            {form.tags.map(t => (
              <span key={t} className="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-[var(--bg)] border border-[var(--border)]">
                {t}
                <button onClick={() => removeTag(t)} className="text-[var(--text-subtle)] hover:text-red-500">×</button>
              </span>
            ))}
          </div>
          <div className="flex gap-2">
            <input value={tagInput} onChange={e => setTagInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addTag(); } }}
              placeholder="Добавить тег и нажать Enter" />
            <button onClick={addTag} className="btn-secondary px-3 shrink-0 text-sm">Добавить</button>
          </div>
        </div>

        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
          <label>Заметки</label>
          <textarea value={form.notes} rows={2} placeholder="Необязательно..."
            onChange={e => set('notes', e.target.value)} style={{ resize: 'vertical' }} />
        </div>

const HOLIDAY_MONTHS_SHORT = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

function formatHolidayDate(dateStr) {
  if (!dateStr) return '';
  const [mm, dd] = dateStr.split('-');
  return `${parseInt(dd)} ${HOLIDAY_MONTHS_SHORT[parseInt(mm) - 1]}`;
}

function getDaysUntilHoliday(dateStr) {
  if (!dateStr) return Infinity;
  const today = new Date(); today.setHours(0,0,0,0);
  const [mm, dd] = dateStr.split('-').map(Number);
  let target = new Date(today.getFullYear(), mm - 1, dd);
  target.setHours(0,0,0,0);
  if (target < today) target = new Date(today.getFullYear() + 1, mm - 1, dd);
  return Math.round((target - today) / 86400000);
}

const getAge = (dateStr, birthYear) => {
  if (!birthYear || !dateStr) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const [mm, dd] = dateStr.split('-').map(Number);
  const birthdayThisYear = new Date(today.getFullYear(), mm - 1, dd);
  const age = today.getFullYear() - parseInt(birthYear);
  // Если ДР ещё не было в этом году — человеку на 1 год меньше
  return birthdayThisYear <= today ? age : age - 1;
};

// embedded — раздел показан вкладкой внутри «Планировщика дел»: свой
// крупный заголовок там не нужен, его роль играет заголовок планировщика.
function HolidaysView({ data, setData, embedded }) {
  const [editing, setEditing] = useState(null);
  const [filter, setFilter] = useState('all');
  const [sortBy, setSortBy] = useState('days');

  const holidays = (data.holidays || []).filter(h => !h.archived);

  const save = (holiday) => {
    holiday = { ...holiday, updatedAt: Date.now() };
    setData(d => {
      const list = d.holidays || [];
      const exists = list.find(h => h.id === holiday.id);
      return {
        ...d,
        holidays: exists
          ? list.map(h => h.id === holiday.id ? holiday : h)
          : [...list, holiday],
      };
    });
    setEditing(null);
  };

  const remove = (id) => {
    if (!confirm('Удалить событие?')) return;
    setData(d => ({ ...d, holidays: (d.holidays || []).filter(h => h.id !== id), deletedIds: withDeletedId(d, 'holidays', id) }));
  };

  const newHoliday = () => setEditing({
    id: crypto.randomUUID(),
    name: '', type: 'birthday', date: '', description: '',
    birthYear: '',
    notify: true,
    reminders: [
      { id: crypto.randomUUID(), daysBefore: 7, time: '09:00' },
      { id: crypto.randomUUID(), daysBefore: 0, time: '09:00' },
    ],
    archived: false,
  });

  const EMOJI = { birthday: '🎂', anniversary: '💑', other: '🎉' };

  const FILTERS = [
    { id: 'all',         label: 'Все' },
    { id: 'birthday',    label: '🎂 ДР' },
    { id: 'anniversary', label: '💑 Юбилеи' },
    { id: 'other',       label: '🎉 Другие' },
  ];

  const filtered = filter === 'all' ? holidays : holidays.filter(h => h.type === filter);

  const sorted = [...filtered].sort((a, b) =>
    sortBy === 'name'
      ? a.name.localeCompare(b.name, 'ru')
      : getDaysUntilHoliday(a.date) - getDaysUntilHoliday(b.date)
  );

  return (
    <div className={embedded ? '' : 'fade-in'}>
      {!embedded && (
        <div className="mb-6 flex items-baseline justify-between gap-4">
          <div className="font-display text-2xl">Праздники</div>
          <div className="text-[var(--text-subtle)] text-xs uppercase tracking-widest flex-shrink-0">События</div>
        </div>
      )}

      <button onClick={newHoliday} className="btn-primary w-full flex items-center justify-center gap-2 mb-4">
        <Icon name="plus" size={18} />
        Добавить событие
      </button>

      {holidays.length > 0 && (
        <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
          <div className="flex gap-1.5 flex-wrap">
            {FILTERS.map(f => (
              <button
                key={f.id}
                onClick={() => setFilter(f.id)}
                className={`px-3 py-1.5 rounded-xl text-sm font-medium transition-all ${
                  filter === f.id
                    ? 'bg-[var(--text)] text-white'
                    : 'bg-[var(--surface)] border border-[var(--border)] text-[var(--text-muted)]'
                }`}
              >{f.label}</button>
            ))}
          </div>
          <select
            value={sortBy}
            onChange={e => setSortBy(e.target.value)}
            style={{ width: 'auto' }}
            className="text-sm py-1.5 px-3 rounded-xl border border-[var(--border)] bg-[var(--surface)] text-[var(--text-muted)]"
          >
            <option value="days">По дате</option>
            <option value="name">По имени</option>
          </select>
        </div>
      )}

      {sorted.length === 0 ? (
        <EmptyState title="Нет событий" text={filter === 'all' ? 'Добавьте дни рождения, юбилеи и другие праздники' : 'Нет событий этого типа'} />
      ) : (
        <div className="space-y-3">
          {sorted.map(h => {
            const days = getDaysUntilHoliday(h.date);
            const daysText = days === 0 ? 'Сегодня!' : `через ${days} ${days === 1 ? 'день' : days < 5 ? 'дня' : 'дней'}`;
            const age = h.type === 'birthday' ? getAge(h.date, h.birthYear) : null;
            return (
              <div key={h.id} className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 flex items-start gap-3">
                <div className="text-2xl flex-shrink-0 mt-0.5">{EMOJI[h.type] || '🎉'}</div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap mb-0.5">
                    <span className="font-medium">{h.name}</span>
                    {age !== null && (
                      <span className="text-xs font-medium px-2 py-0.5 rounded-full bg-purple-50 text-purple-600">
                        {age} лет
                      </span>
                    )}
                  </div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-sm text-[var(--text-muted)]">{formatHolidayDate(h.date)}</span>
                    <span className={`text-xs font-medium px-2 py-0.5 rounded-full ${
                      days === 0 ? 'bg-red-100 text-red-700' :
                      days <= 7 ? 'bg-amber-100 text-amber-700' :

                  <button onClick={() => setEditing(h)} className="p-1.5 rounded-lg hover:bg-black/5 text-[var(--text-muted)]">
                    <Icon name="edit" size={15} />
                  </button>
                  <button onClick={() => remove(h.id)} className="p-1.5 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500">
                    <Icon name="trash" size={15} />
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {editing && <HolidayForm key={editing.id} initial={editing} onSave={save} onClose={() => setEditing(null)} />}
    </div>
  );
}

function HolidayForm({ initial, onSave, onClose }) {
  const [form, setForm] = useState(initial);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  // Инициализируем текстовое поле из сохранённых date + birthYear
  const [dateInput, setDateInput] = useState(() => {
    if (!initial.date) return '';
    const [mm, dd] = initial.date.split('-');
    if (initial.type === 'birthday' && initial.birthYear) return `${dd}.${mm}.${initial.birthYear}`;
    return `${dd}.${mm}`;
  });

  const handleDateChange = (val) => {
    setDateInput(val);
    const parts = val.trim().split(/[.\-\/]+/);
    if (parts.length >= 2 && parts[0] && parts[1]) {
      const dd = parts[0].padStart(2, '0');
      const mm = parts[1].padStart(2, '0');
      const yyyy = (parts[2] || '').replace(/\D/g, '');
      const d = parseInt(dd), m = parseInt(mm);
      if (d >= 1 && d <= 31 && m >= 1 && m <= 12) {
        setForm(f => ({
          ...f,
          date: `${mm}-${dd}`,
          birthYear: yyyy.length === 4 ? yyyy : (yyyy ? f.birthYear : ''),
        }));
      }
    } else if (!val.trim()) {
      setForm(f => ({ ...f, date: '', birthYear: '' }));
    }
  };

  const addReminder = () => setForm(f => ({
    ...f,
    reminders: [...(f.reminders || []), { id: crypto.randomUUID(), daysBefore: 0, time: '09:00' }],
  }));

  const removeReminder = (id) => setForm(f => ({
    ...f,
    reminders: (f.reminders || []).filter(r => r.id !== id),
  }));

  const setReminder = (id, k, v) => setForm(f => ({
    ...f,
    reminders: (f.reminders || []).map(r => r.id === id ? { ...r, [k]: v } : r),
  }));

  const submit = () => {
    if (!form.name.trim() || !form.date) return;
    onSave(form);
  };

  const DAYS_OPTIONS = [
    { value: 0,  label: 'В сам день'  },
    { value: 1,  label: 'За 1 день'   },
    { value: 3,  label: 'За 3 дня'    },
    { value: 7,  label: 'За 7 дней'   },
    { value: 14, label: 'За 2 недели' },
    { value: 30, label: 'За месяц'    },
  ];

  return (
    <Modal title={initial.name ? 'Редактировать' : 'Новое событие'} onClose={onClose}>
      <div className="space-y-4">
        <div>
          <label>Название</label>
          <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="День рождения Мамы" />
        </div>

        <div>
          <label>Тип</label>
          <select value={form.type} onChange={e => set('type', e.target.value)}>
            <option value="birthday">🎂 День рождения</option>
            <option value="anniversary">💑 Юбилей / Годовщина</option>
            <option value="other">🎉 Другое событие</option>
          </select>
        </div>

        <div>
          <label>
            {form.type === 'birthday' ? 'Дата рождения' : 'Дата события (повторяется ежегодно)'}
          </label>
          <input
            value={dateInput}
            onChange={e => handleDateChange(e.target.value)}
            inputMode="numeric"
            placeholder={form.type === 'birthday' ? '20.04.2003' : '20.04'}
          />
          <p className="text-xs text-[var(--text-subtle)] mt-1">
            {form.type === 'birthday'
              ? 'ДД.ММ.ГГГГ — год необязателен, но нужен для отображения возраста'
              : 'ДД.ММ — год не нужен, событие повторяется ежегодно'}
          </p>
        </div>

        <div>
          <label>Описание (необязательно)</label>
          <textarea
            value={form.description || ''}
            onChange={e => set('description', e.target.value)}
            rows={2}
            placeholder="Заметки..."
          />
        </div>

        <div className="bg-[var(--bg)] border border-[var(--border)] rounded-xl p-4 space-y-3">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <Icon name="bell" size={16} />
              <span className="text-sm font-medium">Уведомления в Telegram</span>
            </div>
            <Toggle checked={!!form.notify} onChange={v => set('notify', v)} />
          </div>

          {form.notify && (
            <div className="space-y-2 fade-in">
              {(form.reminders || []).map(r => (
                <div key={r.id} className="flex items-center gap-2">
                  <select
                    value={r.daysBefore}
                    onChange={e => setReminder(r.id, 'daysBefore', parseInt(e.target.value))}
                    style={{ flex: '1', minWidth: 0 }}
                  >
                    {DAYS_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                  </select>
                  <MskTimeInput
                    value={r.time}
                    onChange={t => setReminder(r.id, 'time', t)}
                    style={{ width: '110px', flexShrink: 0 }}
                  />
                  <button
                    onClick={() => removeReminder(r.id)}
                    className="p-1.5 rounded-lg text-[var(--text-muted)] hover:text-red-500 flex-shrink-0"
                  >
                    <Icon name="x" size={16} />

              ))}
              <button
                onClick={addReminder}
                className="btn-secondary w-full flex items-center justify-center gap-2 text-sm"

                <Icon name="plus" size={15} />

        <div className="flex gap-3 pt-2">
          <button onClick={onClose} className="btn-secondary flex-1">Отмена</button>
          <button onClick={submit} className="btn-primary flex-1">Сохранить</button>
        </div>
      </div>
    </Modal>
  );

const getCurrentMonthStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
};

const addMonthsStr = (ym, n) => {
  if (!ym) return '';
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
};

const monthsBetweenStr = (start, end) => {
  if (!start || !end) return 0;
  const [sy, sm] = start.split('-').map(Number);
  const [ey, em] = end.split('-').map(Number);
  return Math.max(1, (ey - sy) * 12 + (em - sm) + 1);
};

const formatMonthFull = (ym) => {
  if (!ym) return '';
  const [y, m] = ym.split('-').map(Number);
  const names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  return `${names[m - 1]} ${y}`;
};

const formatMonthShortBudget = (ym) => {
  if (!ym) return '';
  const [y, m] = ym.split('-').map(Number);
  const names = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  return `${names[m - 1]} ${y}`;
};

// Плановый взнос на весь график: сумма ÷ число месяцев (start…target).
// Платежи и текущий остаток план НЕ меняют — иначе после оплаты «плывут»
// и закрытые, и будущие месяцы. asOfMonth/balance оставлены в сигнатуре
// для совместимости вызовов и игнорируются.
const calcMonthly = (exp, _balance, _asOfMonth) => {
  if (!exp || !(exp.amount > 0) || !exp.startDate || !exp.targetDate) return 0;
  if (exp.startDate > exp.targetDate) return 0;
  return Math.ceil(exp.amount / monthsBetweenStr(exp.startDate, exp.targetDate));
};

const monthsLeftFor = (exp, asOfMonth) => {
  const fromMonth = asOfMonth || getCurrentMonthStr();
  if (!exp?.targetDate) return 0;
  const periodStart = (exp.startDate && exp.startDate > fromMonth) ? exp.startDate : fromMonth;
  if (exp.targetDate < periodStart) return 0;
  return monthsBetweenStr(periodStart, exp.targetDate);
};

// Debt payments: payment reduces remaining; increase adds to principal.
// Plan /мес = effectiveAmount / months in schedule (payments do not change it).
const getDebtTxTotals = (debtId, transactions) => {
  let paid = 0, increased = 0;
  (transactions || []).forEach(t => {
    if (t.debtId !== debtId) return;
    if (t.type === 'increase') increased += t.amount || 0;
    else paid += t.amount || 0;
  });
  return { paid, increased };
};

const getDebtEffectiveAmount = (debt, transactions) =>
  (debt.amount || 0) + getDebtTxTotals(debt.id, transactions).increased;

const getDebtPaid = (debt, transactions) =>
  getDebtTxTotals(debt.id, transactions).paid;

const getDebtRemaining = (debt, transactions) =>
  Math.max(getDebtEffectiveAmount(debt, transactions) - getDebtPaid(debt, transactions), 0);

const calcDebtMonthly = (debt, transactions, _asOfMonth) => {
  // Closed debts still keep their schedule in «По месяцу».
  if (!debt || !debt.startDate || !debt.targetDate) return 0;
  const effective = getDebtEffectiveAmount(debt, transactions);
  return calcMonthly({ ...debt, amount: effective });
};

const formatRub = (n) => {
  if (n == null || n === '') return '—';
  return new Intl.NumberFormat('ru-RU').format(Math.round(n));
};

// Правильная русская плюрализация: 21 день / 22 дня / 25 дней, 111 дней.
const pluralRu = (n, [one, few, many]) => {
  const n10 = Math.abs(n) % 10, n100 = Math.abs(n) % 100;
  if (n10 === 1 && n100 !== 11) return one;
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
  return many;
};
const pluralMonths = (n) => pluralRu(n, ['месяц', 'месяца', 'месяцев']);

// ── MoneyOK statement import ────────────────────────────────────────────────
const normalizeBudgetLabel = (s) => String(s || '')
  .toLowerCase()
  .replace(/ё/g, 'е')
  .replace(/[^\p{L}\p{N}\s]/gu, ' ')
  .replace(/\s+/g, ' ')
  .trim();

const parseMoneyOkCsvText = (text) => {
  const cleaned = String(text || '').replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = cleaned.split('\n').filter(l => l.trim().length > 0);
  if (!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const parseRow = (line) => {
    const out = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === delim && !inQ) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(c => c.trim());
  };
  const header = parseRow(lines[0]).map(h => h.replace(/^\uFEFF/, '').toLowerCase());
  const idx = {
    date: header.findIndex(h => h === 'date' || h === 'дата'),
    amount: header.findIndex(h => h === 'amount' || h === 'сумма'),
    currency: header.findIndex(h => h === 'currency' || h === 'валюта'),
    account: header.findIndex(h => h === 'account' || h === 'счёт' || h === 'счет'),
    category: header.findIndex(h => h === 'category' || h === 'категория'),
    note: header.findIndex(h => h === 'note' || h === 'заметка' || h === 'комментарий'),
  };
  if (idx.date < 0 || idx.amount < 0 || idx.account < 0 || idx.category < 0) {
    throw new Error('Неверный формат выписки MoneyOK. Ожидаются колонки Date, Amount, Account, Category.');
  }
  const rows = [];
  for (let li = 1; li < lines.length; li++) {
    const cols = parseRow(lines[li]);
    if (cols.every(c => !c)) continue;
    const dateRaw = cols[idx.date] || '';
    const amountRaw = String(cols[idx.amount] || '').replace(/\s/g, '').replace(',', '.');
    const amount = parseFloat(amountRaw);
    const account = cols[idx.account] || '';
    const category = cols[idx.category] || '';
    if (!dateRaw || !account || !category || !Number.isFinite(amount)) continue;
    if (category === 'Account balance') continue;
    const dm = dateRaw.match(/^(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})$/);
    if (!dm) continue;
    const month = `${dm[1]}-${String(+dm[2]).padStart(2, '0')}`;
    rows.push({
      date: `${dm[1]}-${String(+dm[2]).padStart(2, '0')}-${String(+dm[3]).padStart(2, '0')}`,
      month,
      amount,
      currency: idx.currency >= 0 ? (cols[idx.currency] || '') : '',
      account,
      category,
      note: idx.note >= 0 ? (cols[idx.note] || '') : '',
    });
  }
  return rows;
};

const readMoneyOkCsvFile = async (file) => {
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf);
  let text;
  if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xFE) {
    text = new TextDecoder('utf-16le').decode(u8);
  } else if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) {
    text = new TextDecoder('utf-16be').decode(u8);
  } else if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) {
    text = new TextDecoder('utf-8').decode(u8);
  } else {
    // Heuristic: many MoneyOK exports are UTF-16LE without relying only on BOM
    const sample = u8.slice(0, Math.min(u8.length, 200));
    let zeros = 0;
    for (let i = 1; i < sample.length; i += 2) if (sample[i] === 0) zeros++;
    text = zeros > sample.length / 6
      ? new TextDecoder('utf-16le').decode(u8)
      : new TextDecoder('utf-8').decode(u8);
  }
  return parseMoneyOkCsvText(text);
};

const collectBudgetFactTargets = (data, allCats, incomeSources) => {
  const groups = [];
  (incomeSources || []).forEach(src => {
    if (!groups.length || groups[0].id !== '__income') {
      groups.unshift({ id: '__income', label: 'Приход', items: [] });
    }
    groups[0].items.push({ id: `inc:${src.id}`, label: src.label, kind: 'income' });
  });
  (allCats || []).forEach(cat => {
    const items = (cat.items || []).map(it => ({
      id: `item:${it.id}`,
      label: it.label,
      kind: 'expense',
      emoji: it.emoji || cat.emoji || '',
    }));
    if (items.length) groups.push({ id: cat.id, label: cat.label, emoji: cat.emoji, items });
  });
  return groups;
};

const autoMapStatementCategory = (categoryName, targetGroups, savedMappings) => {
  if (savedMappings && savedMappings[categoryName]) return savedMappings[categoryName];
  const needle = normalizeBudgetLabel(categoryName);
  if (!needle) return '';
  let best = '';
  let bestScore = 0;
  targetGroups.forEach(g => {
    g.items.forEach(it => {
      const hay = normalizeBudgetLabel(it.label);
      if (!hay) return;
      let score = 0;
      if (hay === needle) score = 3;
      else if (hay.includes(needle) || needle.includes(hay)) score = 2;
      if (score > bestScore) { bestScore = score; best = it.id; }
    });
  });
  return bestScore >= 2 ? best : '';
};

// ── ДДС: счета, операции и факт по статьям ──────────────────────────────────
// Статьи, по которым можно записывать операции ДДС — ровно те строки вкладки
// «По месяцу», факт по которым ведётся вручную: источники дохода, статьи
// ручных категорий и категории «Постоянные». Накопления и Долги сюда не
// входят: их факт считается из платежей на своих вкладках, и запись через
// ДДС удвоила бы суммы.
// ДЕРЖАТЬ В СИНХРОНЕ с pf_articles() из jarvis.py — по этому же списку
// мобильное приложение /pf/<token> показывает статьи на телефоне.
const cashflowArticles = (data) => {
  const out = [];
  (data.budgetIncomeSources || []).forEach(src => {
    if (!src || !src.id) return;
    out.push({ id: src.id, label: src.label || 'Доход', direction: 'in', group: 'Приход', emoji: '💰' });
  });
  (data.budgetPlanCategories || []).forEach(cat => {
    if (!cat) return;
    (cat.items || []).forEach(it => {
      if (!it || !it.id) return;
      out.push({
        id: it.id, label: it.label || 'Статья', direction: 'out',
        group: cat.label || '', emoji: it.emoji || cat.emoji || '',
      });
    });
  });
  const recCats = getRecurringCats(data);
  const usedRec = [...new Set((data.budgetRecurring || [])
    .filter(r => r && !r.archived).map(r => r.category).filter(Boolean))];
  usedRec.forEach(cid => {
    const c = recCats.find(x => x.id === cid) || {};
    out.push({
      id: `__rec_${cid}`, label: c.label || cid, direction: 'out',
      group: 'Постоянные', emoji: c.emoji || '🔄',
    });
  });
  return out;
};

const cashflowOpsOf = (data) => (data.budgetCashflowOps || []).filter(o => o && o.id);

// Баланс счёта = первоначальный остаток + доходы − расходы по его операциям.
const cashflowAccountBalance = (acc, ops) => {
  const start = Number(acc?.initialBalance) || 0;
  return ops.reduce((sum, op) => {
    if (op.accountId !== acc.id) return sum;
    const amt = Number(op.amount) || 0;
    return sum + (op.direction === 'in' ? amt : -amt);
  }, start);
};

// Факт из ДДС по ключам `${статья}_${YYYY-MM}` — отдельно расход и доход.
// Он СКЛАДЫВАЕТСЯ с ручным фактом и фактом из выписки, а не заменяет их.
const cashflowFactMaps = (ops) => {
  const expense = {};
  const income = {};
  ops.forEach(op => {
    const month = String(op.date || '').slice(0, 7);
    const cat = op.categoryId;
    if (!month || !cat) return;
    const amt = Number(op.amount) || 0;
    if (!amt) return;
    const target = op.direction === 'in' ? income : expense;
    const key = `${cat}_${month}`;
    target[key] = (target[key] || 0) + amt;
  });
  return { expense, income };
};

const formatRubExact = (n) => {
  const num = Number(n) || 0;
  return new Intl.NumberFormat('ru-RU', {
    minimumFractionDigits: Number.isInteger(num) ? 0 : 2,
    maximumFractionDigits: 2,
  }).format(num);
};

// Адрес приложения — С завершающим слэшем: только по нему относительная
// ссылка на манифест внутри finance.html разрешается в /pf/<token>/manifest.
// webmanifest. Без слэша iOS при добавлении на экран «Домой» подхватывал
// общий манифест сайта и иконка открывала главный экран Jarvis.
// Выводы одного месяца, в том же порядке, что показывает приложение
// (сначала по sort, потом по времени создания).
// ДЕРЖАТЬ В СИНХРОНЕ с pf_reminders() из jarvis.py.
const monthlyNotesFor = (data, month) => (data.budgetMonthlyNotes || [])
  .filter(n => n && n.id && n.month === month)
  .sort((a, b) => (a.sort || 0) - (b.sort || 0) || (a.createdAt || 0) - (b.createdAt || 0));

// Месяцы, на которые выводы вообще заводились — новые сверху.
const monthlyNotesMonths = (data) => [...new Set((data.budgetMonthlyNotes || [])
  .filter(n => n && n.id && n.month && String(n.text || '').trim())
  .map(n => n.month))].sort().reverse();

  const activeUser = users.find(u => u.id === activeId) || users[0] || null;
  const slice = (data.budgetByUser && data.budgetByUser[activeId]) || emptyBudgetSlice();

  // Child views still read/write flat budget* keys; this adapter maps them
  // onto the active user's slice inside budgetByUser.
  const scopedData = { ...data, ...slice };

  const scopedSetData = React.useCallback((updater) => {
    setData(d => {
      const uid = d.activeBudgetUserId || (d.budgetUsers || [])[0]?.id || DEFAULT_BUDGET_USER_ID;
      const curSlice = { ...emptyBudgetSlice(), ...((d.budgetByUser || {})[uid] || {}) };
      const virtual = { ...d, ...curSlice };
      const nextVirtual = typeof updater === 'function' ? updater(virtual) : updater;
      if (!nextVirtual || typeof nextVirtual !== 'object') return d;

      const newSlice = { ...curSlice };
      BUDGET_SLICE_KEYS.forEach(k => {
        if (k in nextVirtual) newSlice[k] = nextVirtual[k];
      });

      const root = { ...nextVirtual };
      BUDGET_SLICE_KEYS.forEach(k => { delete root[k]; });

      return {
        ...root,
        budgetUsers: nextVirtual.budgetUsers !== undefined ? nextVirtual.budgetUsers : d.budgetUsers,
        activeBudgetUserId: nextVirtual.activeBudgetUserId !== undefined ? nextVirtual.activeBudgetUserId : d.activeBudgetUserId,
        budgetByUser: {
          ...(d.budgetByUser || {}),
          ...(nextVirtual.budgetByUser || {}),
          [uid]: newSlice,
        },
      };
    });
  }, [setData]);

  const setActiveUser = (id) => setData(d => ({ ...d, activeBudgetUserId: id }));

function BudgetUsersModal({ data, setData, onClose }) {
  const users = data.budgetUsers || [];
  const activeId = data.activeBudgetUserId;
  const [newName, setNewName] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState('');

  const addUser = () => {
    const name = newName.trim();
    if (!name) return;
    const id = crypto.randomUUID();
    const user = { id, name, createdAt: Date.now(), updatedAt: Date.now() };
    setData(d => ({
      ...d,
      budgetUsers: [...(d.budgetUsers || []), user],
      activeBudgetUserId: id,
      budgetByUser: { ...(d.budgetByUser || {}), [id]: emptyBudgetSlice() },
    }));
    setNewName('');
  };

  const startRename = (u) => {
    setEditingId(u.id);
    setEditName(u.name || '');
  };

  const saveRename = (id) => {
    const name = editName.trim();
    if (!name) return;
    setData(d => ({
      ...d,
      budgetUsers: (d.budgetUsers || []).map(u => u.id === id ? { ...u, name, updatedAt: Date.now() } : u),
    }));
    setEditingId(null);
  };

  const removeUser = (id) => {
    if (users.length <= 1) {
      alert('Нельзя удалить последнего пользователя');
      return;
    }
    const u = users.find(x => x.id === id);
    if (!confirm(`Удалить пользователя «${u?.name || ''}» и все его данные бюджета?`)) return;
    setData(d => {
      const nextUsers = (d.budgetUsers || []).filter(x => x.id !== id);
      const nextByUser = { ...(d.budgetByUser || {}) };
      delete nextByUser[id];
      const nextActive = d.activeBudgetUserId === id ? nextUsers[0]?.id : d.activeBudgetUserId;
      return {
        ...d,
        budgetUsers: nextUsers,
        budgetByUser: nextByUser,
        activeBudgetUserId: nextActive,
        deletedIds: withDeletedId(d, 'budgetUsers', id),
      };
    });
  };

  return (
    <Modal title="Пользователи бюджета" onClose={onClose}>
      <div className="space-y-4">
        <p className="text-sm text-[var(--text-muted)]">
          У каждого пользователя свой бюджет: план по месяцам, накопления, постоянные расходы, спортпит и долги.
        </p>

        <div className="space-y-2">
          {users.map(u => (
            <div key={u.id} className={`flex items-center gap-2 p-3 rounded-xl border ${u.id === activeId ? 'border-[var(--text)] bg-[var(--surface)]' : 'border-[var(--border)]'}`}>
              {editingId === u.id ? (
                <>
                  <input
                    autoFocus
                    value={editName}
                    onChange={e => setEditName(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') saveRename(u.id); if (e.key === 'Escape') setEditingId(null); }}
                    className="flex-1 bg-[var(--bg)] border border-[var(--border)] rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-[var(--text)]"
                  />
                  <button type="button" onClick={() => saveRename(u.id)} className="text-sm px-2 py-1.5 rounded-lg bg-[var(--text)] text-white">OK</button>
