          </div>
          <div className="text-right text-sm text-[var(--text-muted)]">
            <div>{formatRub(totalMonthly)} ₽/мес по плану</div>
          </div>
        </div>
      )}

      <div className="flex items-center gap-2 flex-wrap mb-6">
        <button onClick={newDebt} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[var(--text)] text-white text-sm font-medium hover:opacity-85 transition-all">
          <Icon name="plus" size={16} />Добавить долг
        </button>
      </div>

      {!debts.length ? (
        <EmptyState title="Нет долгов" text="Добавьте долг с периодичностью выплат — план появится в «По месяцу», а платежи уменьшат остаток" />
      ) : (
        <>
          {active.length > 0 && (
            <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl overflow-hidden inline-block max-w-full align-top">
              <div className="overflow-x-auto md:overflow-x-visible">
                <table className="text-sm w-max max-w-full md:max-w-none">
                  <thead>
                    <tr className="bg-[var(--bg)] border-b border-[var(--border)]">
                      {['Кому', 'Осталось', 'Сумма', '/ мес', 'Начало', 'До', 'Откуда', 'Напоминание'].map(h => (
                        <th key={h} className={`px-3 py-3 text-xs font-semibold uppercase tracking-wide text-[var(--text-subtle)] whitespace-nowrap ${['Осталось','Сумма','/ мес'].includes(h) ? 'text-right' : 'text-left'}`}>{h}</th>
                      ))}
                      <th className="px-3 py-3 w-28" />
                    </tr>
                  </thead>
                  <tbody>
                    {active.map((d, i) => {
                      const remaining = getDebtRemaining(d, transactions);
                      const paid = getDebtPaid(d, transactions);
                      const effective = getDebtEffectiveAmount(d, transactions);
                      const monthly = calcDebtMonthly(d, transactions);
                      const pct = effective > 0 ? Math.min(100, Math.round((paid / effective) * 100)) : 0;
                      const hasSchedule = !!(d.startDate && d.targetDate);
                      const isOver = hasSchedule && d.targetDate < curMonth && remaining > 0;
                      const mLeft = hasSchedule ? monthsLeftFor(d) : 0;
                      return (
                        <tr key={d.id} className={`border-b border-[var(--border)] last:border-0 hover:bg-black/[0.02] transition-colors ${i % 2 === 1 ? 'bg-[var(--bg)]/50' : ''}`}>
                          <td className="px-3 py-3">
                            <div className="font-medium whitespace-nowrap">{d.debtor || '—'}</div>
                            {d.comment && <div className="text-xs text-[var(--text-subtle)] truncate max-w-[180px]">{d.comment}</div>}
                          </td>
                          <td className="px-3 py-3 text-right whitespace-nowrap">
                            <div className="flex items-center justify-end gap-2">
                              <div className="w-14 bg-[var(--bg)] rounded-full h-1.5 overflow-hidden">
                                <div className={`h-full rounded-full ${pct >= 100 ? 'bg-green-500' : pct >= 50 ? 'bg-blue-500' : 'bg-rose-500'}`}
                                  style={{ width: Math.max(0, pct) + '%' }} />
                              </div>
                              <span className={`font-medium ${remaining > 0 ? 'text-[var(--text)]' : 'text-green-600'}`}>
                                {formatRub(remaining)} ₽
                              </span>
                              <span className="text-[10px] text-[var(--text-subtle)]">{pct}%</span>
                            </div>
                          </td>
                          <td className="px-3 py-3 text-right whitespace-nowrap font-medium">{formatRub(effective)} ₽</td>
                          <td className="px-3 py-3 text-right whitespace-nowrap font-semibold">
                            {hasSchedule ? `${formatRub(monthly)} ₽` : <span className="text-[var(--text-subtle)] font-normal">—</span>}
                          </td>
                          <td className="px-3 py-3 whitespace-nowrap text-[var(--text-muted)]">
                            {hasSchedule ? formatMonthShortBudget(d.startDate) : '—'}
                          </td>
                          <td className={`px-3 py-3 whitespace-nowrap ${isOver ? 'text-red-500 font-medium' : 'text-[var(--text-muted)]'}`}>
                            {hasSchedule ? formatMonthShortBudget(d.targetDate) : (d.returnDate ? fmtDate(d.returnDate) : '—')}
                            {isOver
                              ? <span className="block text-[10px] text-red-400">просрочен</span>
                              : mLeft > 0 && <span className="block text-[10px] text-[var(--text-subtle)]">ещё {mLeft} мес</span>}
                          </td>
                          <td className="px-3 py-3 whitespace-nowrap text-[var(--text-muted)]">{d.source || '—'}</td>
                          <td className="px-3 py-3 whitespace-nowrap text-[var(--text-muted)] text-xs">
                            {d.notify && d.notifyDate ? `🔔 ${fmtDate(d.notifyDate)} ${d.notifyTime || ''}` : '—'}
                          </td>
                          <td className="px-2 py-3">
                            <div className="flex gap-0.5 justify-end">
                              <button
                                onClick={() => {
                                  if (monthly > 0) addTx(d.id, 'payment', monthly, today);
                                  else setPayModal(d);
                                }}
                                title={monthly > 0
                                  ? `Отметить платёж ${formatRub(monthly)} ₽ (план/мес) на ${today}`
                                  : 'Внести платёж'}
                                className="p-1.5 rounded-lg hover:bg-green-50 text-green-500 hover:text-green-700 font-bold text-base leading-none">+</button>
                              <button onClick={() => setPayModal(d)}
                                title="Внести платёж или пополнить долг"
                                className="p-1.5 rounded-lg hover:bg-black/5 text-[var(--text-muted)] text-xs font-medium px-1.5">₽</button>
                              <button onClick={() => toggleClosed(d.id)} title="Отметить закрытым"
                                className="p-1.5 rounded-lg hover:bg-black/5 text-green-500 hover:text-green-700">
                                <Icon name="check" size={14} />
                              </button>
                              <button onClick={() => setEditing(d)} className="p-1.5 rounded-lg hover:bg-black/5 text-[var(--text-muted)]" title="Редактировать"><Icon name="edit" size={14} /></button>
                              <button onClick={() => remove(d.id)} className="p-1.5 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500" title="Удалить"><Icon name="trash" size={14} /></button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div className="px-4 py-3 bg-[var(--bg)] border-t border-[var(--border)] flex justify-between items-center flex-wrap gap-2">
                <span className="text-xs text-[var(--text-subtle)] uppercase tracking-wide">{active.length} активных</span>
                <div className="text-right flex gap-4 items-baseline">
                  <span className="text-xs text-[var(--text-subtle)]">Осталось: <b className="text-[var(--text)]">{formatRub(totalRemaining)} ₽</b></span>
                  <span className="text-xs text-[var(--text-subtle)]">{formatRub(totalMonthly)} ₽/мес</span>
                </div>
              </div>
            </div>
          )}

          {closed.length > 0 && (
            <div className="mt-4">
              <button onClick={() => setShowClosed(v => !v)}
                className="flex items-center gap-2 text-sm text-[var(--text-muted)] hover:text-[var(--text)] transition-colors">
                <Icon name="chevronDown" size={14} style={{ transform: showClosed ? 'none' : 'rotate(-90deg)', transition: 'transform 0.15s ease' }} />
                Закрытые ({closed.length})
              </button>
              {showClosed && (
                <div className="mt-3 space-y-2">
                  {closed.map(d => {
                    const rem = getDebtRemaining(d, transactions);
                    return (
                      <div key={d.id} className="flex items-center justify-between bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3 opacity-60">
                        <div>
                          <div className="font-medium">{d.debtor || '—'}</div>
                          <div className="text-xs text-[var(--text-subtle)]">
                            {formatRub(getDebtEffectiveAmount(d, transactions))} ₽ · осталось {formatRub(rem)} ₽
                          </div>
                        </div>
                        <div className="flex gap-1">
                          <button onClick={() => toggleClosed(d.id)} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]" title="Вернуть в активные">
                            <Icon name="restore" size={16} />
                          </button>
                          <button onClick={() => remove(d.id)} className="p-2 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500" title="Удалить">
                            <Icon name="trash" size={16} />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </>
      )}

      {editing && (
        <BudgetDebtModal
          debt={editing}
          paid={getDebtPaid(editing, transactions)}
          increased={getDebtTxTotals(editing.id, transactions).increased}
          onSave={save}
          onClose={() => setEditing(null)}
        />
      )}
      {payModal && (
        <DebtPaymentModal
          debt={payModal}
          transactions={transactions}
          onSave={(type, amount, date, comment) => {
            addTx(payModal.id, type, amount, date, comment);
            setPayModal(null);
          }}
          onClose={() => setPayModal(null)}
        />
      )}
    </div>
  );
}

function DebtsPaymentsView({ data, setData }) {
  const [showAdd, setShowAdd] = useState(false);
  const [sortCol, setSortCol] = useState('date');
  const [sortDir, setSortDir] = useState('desc');

  const debts = data.budgetDebts || [];
  const activeDebts = debts.filter(d => !d.closed);
  const transactions = data.debtTransactions || [];

  const getDebtName = (id) => {
    const d = debts.find(x => x.id === id);
    return d ? (d.closed ? `${d.debtor || 'Долг'} (закрыт)` : (d.debtor || 'Долг')) : '(удалено)';
  };

  const formatDate = (d) => {
    if (!d) return '—';
    const [y, m, day] = d.split('-');
    return `${day}.${m}.${y}`;
  };

  const toggleSort = (col) => {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('desc'); }
  };

  const sorted = [...transactions].sort((a, b) => {
    const vals = {
      date: [a.date || '', b.date || ''],
      name: [getDebtName(a.debtId), getDebtName(b.debtId)],
      type: [a.type === 'increase' ? 1 : 0, b.type === 'increase' ? 1 : 0],
      amount: [a.amount || 0, b.amount || 0],
    };
    const [av, bv] = vals[sortCol] || vals.date;
    const cmp = typeof av === 'string' ? av.localeCompare(bv, 'ru') : av - bv;
    return sortDir === 'asc' ? cmp : -cmp;
  });

  const removeTx = (id) => {
    if (!confirm('Удалить операцию?')) return;
    setData(d => ({
      ...d,
      debtTransactions: (d.debtTransactions || []).filter(t => t.id !== id),
      deletedIds: withDeletedId(d, 'debtTransactions', id),
    }));
  };

  const totalPaid = sorted.filter(t => t.type !== 'increase').reduce((s, t) => s + (t.amount || 0), 0);
  const totalInc = sorted.filter(t => t.type === 'increase').reduce((s, t) => s + (t.amount || 0), 0);

  const SortArrow = ({ col }) => (
    <span className={`ml-0.5 text-[11px] ${sortCol === col ? 'opacity-100' : 'opacity-25'}`}>
      {sortCol === col ? (sortDir === 'asc' ? '↑' : '↓') : '↕'}
    </span>
  );

  const COLS = [
    { col: 'date', label: 'Дата', cls: 'text-left' },
    { col: 'name', label: 'Долг', cls: 'text-left' },
    { col: 'type', label: 'Тип', cls: 'text-left' },
    { col: 'amount', label: 'Сумма', cls: 'text-right' },
  ];

  return (
    <div>
      <div className="flex items-center gap-2 flex-wrap mb-6">
        <button onClick={() => setShowAdd(true)} disabled={!activeDebts.length && !debts.length}
          className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[var(--text)] text-white text-sm font-medium hover:opacity-85 transition-all disabled:opacity-40">
          <Icon name="plus" size={16} />Добавить операцию
        </button>
      </div>

      {!transactions.length ? (
        <EmptyState title="Нет платежей" text="Отмечайте плановые платежи или вносите внеплановые — остаток и план в «По месяцу» пересчитаются сами" />
      ) : (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl overflow-hidden inline-block max-w-full align-top">
          <div className="overflow-x-auto md:overflow-x-visible">
            <table className="text-sm w-max max-w-full md:max-w-none">
              <thead>
                <tr className="bg-[var(--bg)] border-b border-[var(--border)]">
                  {COLS.map(({ col, label, cls }) => (
                    <th key={col} onClick={() => toggleSort(col)}
                      className={`px-3 py-3 text-xs font-semibold uppercase tracking-wide text-[var(--text-subtle)] cursor-pointer hover:text-[var(--text)] transition-colors select-none whitespace-nowrap ${cls}`}>
                      {label}<SortArrow col={col} />
                    </th>
                  ))}
                  <th className="px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-[var(--text-subtle)]">Коммент</th>
                  <th className="px-3 py-3 w-10" />
                </tr>
              </thead>
              <tbody>
                {sorted.map((t, i) => {
                  const isInc = t.type === 'increase';
                  return (
                    <tr key={t.id} className={`border-b border-[var(--border)] last:border-0 hover:bg-black/[0.02] transition-colors ${i % 2 === 1 ? 'bg-[var(--bg)]/50' : ''}`}>
                      <td className="px-3 py-2.5 whitespace-nowrap text-[var(--text-muted)]">{formatDate(t.date)}</td>
                      <td className="px-3 py-2.5 font-medium">{getDebtName(t.debtId)}</td>
                      <td className="px-3 py-2.5 whitespace-nowrap">
                        <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${isInc ? 'bg-amber-50 text-amber-700' : 'bg-green-50 text-green-700'}`}>
                          {isInc ? '↑ Пополнение долга' : '↓ Платёж'}
                        </span>
                      </td>
                      <td className={`px-3 py-2.5 text-right whitespace-nowrap font-semibold ${isInc ? 'text-amber-700' : 'text-green-600'}`}>
                        {isInc ? '+' : '−'}{formatRub(t.amount)} ₽
                      </td>
                      <td className="px-3 py-2.5 text-[var(--text-subtle)] text-sm max-w-[180px] truncate">{t.comment || '—'}</td>
                      <td className="px-2 py-2.5">
                        <button onClick={() => removeTx(t.id)}
                          className="p-1 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500">
                          <Icon name="trash" size={13} />
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="px-4 py-3 bg-[var(--bg)] border-t border-[var(--border)] flex flex-wrap gap-4 justify-between items-center">
            <span className="text-xs text-[var(--text-subtle)] uppercase tracking-wide">{sorted.length} операций</span>
            <div className="flex gap-5 text-sm">
              <span className="text-green-600">Платежи: <b>−{formatRub(totalPaid)} ₽</b></span>
              <span className="text-amber-700">Пополнения: <b>+{formatRub(totalInc)} ₽</b></span>
            </div>
          </div>
        </div>
      )}

      {showAdd && (
        <DebtPaymentModal
          debts={debts}
          transactions={transactions}
          onSave={(debtId, type, amount, date, comment) => {
            setData(d => ({
              ...d,
              debtTransactions: [...(d.debtTransactions || []), {
                id: crypto.randomUUID(), debtId, type, amount, date,
                comment: (comment || '').trim(), updatedAt: Date.now(),
              }],
            }));
            setShowAdd(false);
          }}
          onClose={() => setShowAdd(false)}
        />
      )}
    </div>
  );
}

function DebtPaymentModal({ debt, debts, transactions = [], onSave, onClose }) {
  const today = getTodayKey();
  const list = debt ? [debt] : (debts || []);
  const [debtId, setDebtId] = useState(debt?.id || (list.find(d => !d.closed)?.id || list[0]?.id || ''));
  const [type, setType] = useState('payment');
  const [amount, setAmount] = useState('');
  const [date, setDate] = useState(today);
  const [comment, setComment] = useState('');

  const selected = list.find(d => d.id === debtId) || debt;
  const rem = selected ? getDebtRemaining(selected, transactions) : 0;
  const planMonthly = selected ? calcDebtMonthly(selected, transactions) : 0;

  const submit = () => {
    const val = Number(amount);
    if (!val || val <= 0) return;
    if (!debtId) return;
    if (debt) onSave(type, val, date || today, comment);
    else onSave(debtId, type, val, date || today, comment);
  };

  return (
    <Modal title="Операция по долгу" onClose={onClose}>
      <div className="space-y-4">
        <div>
          <label>Тип</label>
          <div className="flex gap-2">
            <button onClick={() => setType('payment')}
              className={`flex-1 px-3 py-2.5 rounded-xl text-sm font-medium border transition-all ${type === 'payment' ? 'bg-green-50 border-green-300 text-green-700' : 'border-[var(--border)] text-[var(--text-muted)]'}`}>
              ↓ Платёж
            </button>
            <button onClick={() => setType('increase')}
              className={`flex-1 px-3 py-2.5 rounded-xl text-sm font-medium border transition-all ${type === 'increase' ? 'bg-amber-50 border-amber-300 text-amber-700' : 'border-[var(--border)] text-[var(--text-muted)]'}`}>
              ↑ Пополнение долга
            </button>
          </div>
          <div className="text-xs text-[var(--text-subtle)] mt-1.5">
            {type === 'payment'
              ? 'Уменьшает остаток и пересчитывает план в «По месяцу»'
              : 'Увеличивает сумму долга (доп. выдача) — остаток и /мес пересчитаются'}
          </div>
        </div>

        {!debt && (
          <div>
            <label>Долг</label>
            <select value={debtId} onChange={e => setDebtId(e.target.value)}>
              {list.map(d => <option key={d.id} value={d.id}>{d.debtor || 'Долг'}{d.closed ? ' (закрыт)' : ''}</option>)}
            </select>
          </div>
        )}

        {debt && (
          <div className="text-sm text-[var(--text-muted)]">
            {debt.debtor || 'Долг'}
            {rem > 0 && <span className="text-[var(--text-subtle)]"> · осталось {formatRub(rem)} ₽</span>}
          </div>
        )}

        <div>
          <label>Сумма (₽)</label>
          <input type="number" inputMode="numeric" min="1" value={amount}
            onChange={e => setAmount(e.target.value)} placeholder="5 000" autoFocus />
          {type === 'payment' && planMonthly > 0 && (
            <button type="button" onClick={() => setAmount(String(planMonthly))}
              className="text-xs text-blue-600 hover:underline mt-1">
              По плану: {formatRub(planMonthly)} ₽/мес
            </button>
          )}
          {type === 'payment' && rem > 0 && (
            <button type="button" onClick={() => setAmount(String(rem))}
              className="block text-xs text-[var(--text-subtle)] hover:text-[var(--text)] mt-0.5">
              Весь остаток: {formatRub(rem)} ₽
            </button>
          )}
        </div>

        <div>
          <label>Дата</label>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} />
        </div>

        <div>
          <label>Комментарий (необязательно)</label>
          <input value={comment} onChange={e => setComment(e.target.value)} placeholder="Внеплановый платёж..." />
        </div>

        <div className="flex gap-3 pt-2">
          <button onClick={onClose} className="btn-secondary flex-1">Отмена</button>
          <button onClick={submit}
            className={`flex-1 px-4 py-2.5 rounded-xl text-sm font-medium text-white transition-all hover:opacity-90 ${type === 'payment' ? 'bg-green-600' : 'bg-amber-600'}`}>
            {type === 'payment' ? 'Внести платёж' : 'Пополнить долг'}
          </button>
        </div>
      </div>
    </Modal>
  );
}

function BudgetDebtModal({ debt, paid = 0, increased = 0, onSave, onClose }) {
  const [form, setForm] = useState(() => ({
    ...debt,
    startDate: debt.startDate || getCurrentMonthStr(),
    targetDate: debt.targetDate || (debt.returnDate ? debt.returnDate.slice(0, 7) : addMonthsStr(getCurrentMonthStr(), 6)),
  }));
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const effective = (Number(form.amount) || 0) + (increased || 0);
  const remaining = Math.max(effective - (paid || 0), 0);
  const months = form.startDate && form.targetDate ? monthsBetweenStr(form.startDate, form.targetDate) : 0;
  const monthsLeft = monthsLeftFor({ ...form, amount: effective });
  const monthly = (form.targetDate && effective > 0)
    ? calcMonthly({ ...form, amount: effective })
    : 0;

  const submit = () => {
    if (!form.amount || Number(form.amount) <= 0) return;
    if (!form.debtor.trim()) return;
    if (form.startDate && form.targetDate && form.startDate > form.targetDate) {
      alert('Дата начала выплат должна быть раньше или равна дате окончания');
      return;
    }
    // Keep returnDate in sync with end of schedule when schedule is set
    let returnDate = form.returnDate || '';
    if (form.targetDate && !returnDate) {
      const [y, m] = form.targetDate.split('-');
      returnDate = `${y}-${m}-${new Date(Number(y), Number(m), 0).getDate()}`;
    }
    onSave({
      ...form,
      amount: Number(form.amount),
      debtor: form.debtor.trim(),
      comment: (form.comment || '').trim(),
      returnDate,
      notify: !!(form.notify && form.notifyDate),
    });
  };

  const isNew = !debt.debtor && !debt.amount;

  return (
    <Modal title={isNew ? 'Новый долг' : 'Редактировать долг'} onClose={onClose}>
      <div className="space-y-4">
        <div>
          <label>Сумма долга (₽)</label>
          <input type="number" inputMode="numeric" min="1" autoFocus
            value={form.amount || ''}
            onChange={e => set('amount', e.target.value)}
            placeholder="5 000" />
        </div>

        <div>
          <label>Кому даётся долг</label>
          <input value={form.debtor} onChange={e => set('debtor', e.target.value)} placeholder="Имя" />
        </div>

        <div>
          <label>Откуда даётся долг</label>
          <select value={form.source} onChange={e => set('source', e.target.value)}>
            {DEBT_SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label>Начать выплаты</label>
            <input type="month" value={form.startDate || ''} onChange={e => set('startDate', e.target.value)} />
          </div>
          <div>
            <label>Выплатить к</label>
            <input type="month" value={form.targetDate || ''} onChange={e => set('targetDate', e.target.value)} />
          </div>
        </div>

        {monthly > 0 && (
          <div className="bg-[var(--bg)] border border-[var(--border)] rounded-2xl p-4 fade-in">
            <div className="text-xs text-[var(--text-subtle)] uppercase tracking-widest mb-3">План выплат</div>
            <div className="flex items-baseline gap-2 mb-1">
              <span className="font-display text-4xl">{formatRub(monthly)}</span>
              <span className="text-[var(--text-muted)] text-base">₽ в месяц</span>
            </div>
            <div className="text-sm text-[var(--text-subtle)]">
              Осталось {formatRub(remaining)} ₽ · {monthsLeft || months} {pluralMonths(monthsLeft || months)}
              {paid > 0 && <span> · уже выплачено {formatRub(paid)} ₽</span>}
            </div>
            {form.startDate && months > 0 && (
              <div className="mt-3 flex gap-1 flex-wrap">
                {Array.from({ length: Math.min(months, 12) }).map((_, i) => {
                  const mo = addMonthsStr(form.startDate, i);
                  return (
                    <div key={mo} className="flex-1 min-w-[32px] text-center">
                      <div className="h-6 bg-rose-600 rounded" style={{ opacity: 0.3 + (i / Math.max(months - 1, 1)) * 0.7 }} />
                      <div className="text-[9px] text-[var(--text-subtle)] mt-0.5">{formatMonthShortBudget(mo).split(' ')[0]}</div>
                    </div>
                  );
                })}
                {months > 12 && <div className="text-xs text-[var(--text-subtle)] self-end">+{months - 12} мес</div>}
              </div>
            )}
          </div>
        )}

        <div>
          <label>Вернуть до (дата, необязательно)</label>
          <input type="date" value={form.returnDate || ''} onChange={e => set('returnDate', e.target.value)} />
        </div>

        <div className="border border-[var(--border)] rounded-xl p-3 space-y-3">
          <label className="flex items-center gap-2 cursor-pointer !mb-0">
            <input type="checkbox" className="!w-auto" checked={!!form.notify} onChange={e => set('notify', e.target.checked)} />
            <span className="text-sm font-medium">Напоминание в Telegram</span>
          </label>
          {form.notify && (
            <div className="flex gap-2">
              <div className="flex-1">
                <label>Дата</label>
                <input type="date" value={form.notifyDate || ''} onChange={e => set('notifyDate', e.target.value)} />
              </div>
              <div className="w-28">
                <label>Время</label>
                <MskTimeInput value={form.notifyTime || '12:00'} onChange={t => set('notifyTime', t)} />
              </div>
            </div>
          )}
        </div>

        <div>
          <label>Комментарий (необязательно)</label>
          <textarea value={form.comment || ''} onChange={e => set('comment', e.target.value)} rows={2} placeholder="Дополнительная информация..." />
        </div>

        <div className="flex gap-3 pt-2">
          <button onClick={onClose} className="btn-secondary flex-1">Отмена</button>
          <button onClick={submit}  className="btn-primary flex-1">Сохранить</button>
        </div>
      </div>
    </Modal>
  );
}


// ============== SUPPLEMENTS ==============

function BudgetSupplementsView({ data, setData }) {
  const [editing, setEditing] = useState(null);
  const [showAssign, setShowAssign] = useState(false);
  const [editingMonth, setEditingMonth] = useState(null);
  const [selected, setSelected] = useState([]);
  const [sortCol, setSortCol] = useState('name');
  const [sortDir, setSortDir] = useState('asc');
  const [filters, setFilters] = useState({});
  const [filterOpen, setFilterOpen] = useState(null);
  const [filterAnchor, setFilterAnchor] = useState(null);

  const items = (data.budgetSupplements || []).filter(s => !s.archived);
  const rawAssignments = data.budgetSupplementAssignments || {};
  const assignments = Object.fromEntries(
    Object.entries(rawAssignments).map(([m, arr]) => [m,
      (arr || []).map(x => typeof x === 'string' ? { id: x, qty: 1 } : x)
    ])
  );

  const save = (item) => {
    item = { ...item, updatedAt: Date.now() };
    setData(d => {
      const list = d.budgetSupplements || [];
      const exists = list.find(s => s.id === item.id);
      return { ...d, budgetSupplements: exists ? list.map(s => s.id === item.id ? item : s) : [...list, item] };
    });
    setEditing(null);
  };

  const remove = (id) => {
    if (!confirm('Удалить позицию?')) return;
    setData(d => {
      const newAssign = { ...d.budgetSupplementAssignments };
      Object.keys(newAssign).forEach(m => {
        newAssign[m] = (newAssign[m] || []).map(x => typeof x === 'string' ? { id: x, qty: 1 } : x).filter(x => x.id !== id);
        if (newAssign[m].length === 0) delete newAssign[m];
      });
      return { ...d, budgetSupplements: (d.budgetSupplements || []).filter(s => s.id !== id), budgetSupplementAssignments: newAssign, deletedIds: withDeletedId(d, 'budgetSupplements', id) };
    });
  };

  const newItem = () => setEditing({
    id: crypto.randomUUID(), name: '', brand: '', qtyPerPack: '', dailyIntake: '',
    cost: '', link: '', notes: '', archived: false,
  });

  const toggleSelect = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  // Operates on the VISIBLE (filtered+sorted) rows so the header checkbox and
  // the selection always agree when a filter is active. `sorted` is defined
  // below; the closure resolves it at click time.
  const selectAll = () => setSelected(sorted.length === selected.length ? [] : sorted.map(i => i.id));

  const assignToMonth = (month, quantities) => {
    setData(d => {
      const a = { ...(d.budgetSupplementAssignments || {}) };
      const existing = (a[month] || []).map(x => typeof x === 'string' ? { id: x, qty: 1 } : x);
      const merged = [...existing];
      selected.forEach(id => {
        const idx = merged.findIndex(x => x.id === id);
        const qty = quantities[id] || 1;
        if (idx >= 0) merged[idx] = { ...merged[idx], qty };
        else merged.push({ id, qty });
      });
      return { ...d, budgetSupplementAssignments: { ...a, [month]: merged } };
    });
    setSelected([]);
    setShowAssign(false);
  };

  const removeFromMonth = (month, itemId) => {
    setData(d => {
      const a = { ...(d.budgetSupplementAssignments || {}) };
      a[month] = (a[month] || []).map(x => typeof x === 'string' ? { id: x, qty: 1 } : x).filter(x => x.id !== itemId);
      if (a[month].length === 0) delete a[month];
      return { ...d, budgetSupplementAssignments: a };
    });
  };

  const saveMonthEntries = (month, entries) => {
    setData(d => {
      const a = { ...(d.budgetSupplementAssignments || {}) };
      const valid = entries.filter(e => e.qty > 0);
      if (valid.length === 0) delete a[month];
      else a[month] = valid;
      return { ...d, budgetSupplementAssignments: a };
    });
    setEditingMonth(null);
  };

  const daysLast = (item) => {
    const qty = Number(item.qtyPerPack) || 0;
    const daily = Number(item.dailyIntake) || 0;
    return daily > 0 ? Math.floor(qty / daily) : 0;
  };

  const COLUMNS = [
    { id: 'name',       label: 'Название',  align: 'left',  getValue: x => x.name || '' },
    { id: 'brand',      label: 'Бренд',     align: 'left',  getValue: x => x.brand || '' },
    { id: 'qtyPerPack', label: 'В уп.',     align: 'right', getValue: x => Number(x.qtyPerPack) || 0 },
    { id: 'dailyIntake',label: 'В день',    align: 'right', getValue: x => Number(x.dailyIntake) || 0 },
    { id: 'daysLast',   label: 'Хватит, дн',align: 'right', getValue: x => daysLast(x) },
    { id: 'cost',       label: 'Цена',      align: 'right', getValue: x => Number(x.cost) || 0 },
    { id: 'notes',      label: 'Коммент',   align: 'left',  getValue: x => x.notes || '' },
  ];

  const getUniqueVals = (colId) => {
    const col = COLUMNS.find(c => c.id === colId);
    if (!col) return [];
    const vals = [...new Set(items.map(x => {
      const v = col.getValue(x);
      return typeof v === 'number' ? (v || 0) : (v || '');
    }))];
    return vals.sort((a, b) => typeof a === 'string' ? a.localeCompare(b, 'ru') : a - b);
  };

  const toggleSort = (col) => {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('asc'); }
  };

  const setFilter = (colId, values) => {
    setFilters(f => {
      const next = { ...f };
      if (!values || values.length === 0) delete next[colId];
      else next[colId] = values;
      return next;
    });
  };

  const toggleFilterValue = (colId, val) => {
    setFilters(f => {
      const cur = f[colId] || [];
      const next = cur.includes(val) ? cur.filter(v => v !== val) : [...cur, val];
      const updated = { ...f };
      if (next.length === 0) delete updated[colId];
      else updated[colId] = next;
      return updated;
    });
  };

  const activeFilterCount = Object.keys(filters).length;

  const filtered = items.filter(item => {
    return Object.entries(filters).every(([colId, allowed]) => {
      const col = COLUMNS.find(c => c.id === colId);
      if (!col) return true;
      const v = col.getValue(item);
      return allowed.includes(typeof v === 'number' ? v : v);
    });
  });

  const sorted = [...filtered].sort((a, b) => {
    const col = COLUMNS.find(c => c.id === sortCol);
    if (!col) return 0;
    const av = col.getValue(a);
    const bv = col.getValue(b);
    const cmp = typeof av === 'string' ? av.localeCompare(bv, 'ru') : av - bv;
    return sortDir === 'asc' ? cmp : -cmp;
  });

  const totalSelected = selected.filter(id => sorted.find(x => x.id === id)).reduce((s, id) => {
    const it = items.find(x => x.id === id);
    return s + (it ? (it.cost || 0) : 0);
  }, 0);

  const MONTH_NAMES_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const curYear = new Date().getFullYear();

  const assignedMonths = Object.keys(assignments).filter(m => (assignments[m] || []).length > 0).sort();

  return (
    <div>
      <div className="flex items-center gap-2 flex-wrap mb-6">
        <button onClick={newItem} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[var(--text)] text-white text-sm font-medium hover:opacity-85 transition-all">
          <Icon name="plus" size={16} />Добавить
        </button>
        {selected.length > 0 && (
          <button onClick={() => setShowAssign(true)}
            className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-medium hover:opacity-85 transition-all">
            📅 В месяц ({selected.length} поз.)
          </button>
        )}
        {activeFilterCount > 0 && (
          <button onClick={() => setFilters({})}
            className="inline-flex items-center gap-1.5 px-3 py-2.5 rounded-xl text-xs border border-amber-200 bg-amber-50 text-amber-700 hover:bg-amber-100 transition-colors">
            Сбросить фильтры ({activeFilterCount})
          </button>
        )}
      </div>

      {!items.length ? (
        <EmptyState title="Нет добавок" text="Добавьте БАДы или спортивное питание — укажите количество, дозировку и стоимость" />
      ) : (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl overflow-hidden inline-block max-w-full align-top">
          <div className="overflow-x-auto md:overflow-x-visible">
            <table className="text-sm w-max max-w-full md:max-w-none">
              <thead>
                <tr className="bg-[var(--bg)] border-b border-[var(--border)]">
                  <th className="px-3 py-3 w-10">
                    <input type="checkbox" checked={sorted.length > 0 && selected.length === sorted.length}
                      onChange={() => setSelected(sorted.length === selected.length ? [] : sorted.map(i => i.id))}
                      className="rounded border-gray-300" />
                  </th>
                  {COLUMNS.map(col => (
                    <th key={col.id} className={`px-3 py-3 text-${col.align} text-xs font-semibold uppercase tracking-wide text-[var(--text-subtle)] whitespace-nowrap relative`}>
                      <div className={`flex items-center gap-1 ${col.align === 'right' ? 'justify-end' : ''}`}>
                        <button onClick={() => toggleSort(col.id)}
                          className="hover:text-[var(--text)] transition-colors select-none flex items-center gap-0.5">
                          {col.label}
                          <span className={`text-[11px] ${sortCol === col.id ? 'opacity-100' : 'opacity-25'}`}>
                            {sortCol === col.id ? (sortDir === 'asc' ? '↑' : '↓') : '↕'}
                          </span>
                        </button>
                        <button onClick={(e) => { e.stopPropagation(); if (filterOpen === col.id) { setFilterOpen(null); return; } setFilterAnchor(e.currentTarget); setFilterOpen(col.id); }}
                          className={`p-0.5 rounded hover:bg-black/5 transition-colors ${filters[col.id] ? 'text-blue-600' : 'text-[var(--text-subtle)] opacity-40 hover:opacity-100'}`}>
                          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
                          </svg>
                        </button>
                      </div>
                    </th>
                  ))}
                  <th className="px-3 py-3 w-20" />
                </tr>
              </thead>
              <tbody>
                {sorted.map((item, i) => {
                  const days = daysLast(item);
                  return (
                    <tr key={item.id} className={`border-b border-[var(--border)] last:border-0 hover:bg-black/[0.02] transition-colors ${selected.includes(item.id) ? 'bg-blue-50/50' : ''}`}>
                      <td className="px-3 py-3">
                        <input type="checkbox" checked={selected.includes(item.id)} onChange={() => toggleSelect(item.id)}
                          className="rounded border-gray-300" />
                      </td>
                      <td className="px-3 py-3 font-medium">
                        {item.link ? (
                          <a href={item.link} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline">{item.name}</a>
                        ) : item.name}
                      </td>
                      <td className="px-3 py-3 text-[var(--text-muted)]">{item.brand || '—'}</td>
                      <td className="px-3 py-3 text-right text-[var(--text-muted)]">{item.qtyPerPack || '—'}</td>
                      <td className="px-3 py-3 text-right text-[var(--text-muted)]">{item.dailyIntake || '—'}</td>
                      <td className="px-3 py-3 text-right font-medium">{days > 0 ? days : '—'}</td>
                      <td className="px-3 py-3 text-right font-semibold whitespace-nowrap">{item.cost ? formatRub(item.cost) + ' ₽' : '—'}</td>
                      <td className="px-3 py-3 text-[var(--text-subtle)] max-w-[180px] truncate">{item.notes || '—'}</td>
                      <td className="px-2 py-3">
                        <div className="flex gap-1 justify-end">
                          <button onClick={() => setEditing(item)} className="p-1.5 rounded-lg hover:bg-black/5 text-[var(--text-muted)]"><Icon name="edit" size={14} /></button>
                          <button onClick={() => remove(item.id)} className="p-1.5 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500"><Icon name="trash" size={14} /></button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="px-4 py-3 bg-[var(--bg)] border-t border-[var(--border)] flex justify-between items-center">
            <span className="text-xs text-[var(--text-subtle)]">
              {filtered.length !== items.length ? `${sorted.length} из ${items.length} позиций` : `${items.length} позиций`}
            </span>
            <span className="font-display text-base">{formatRub(sorted.reduce((s, x) => s + (x.cost || 0), 0))} ₽</span>
          </div>
        </div>
      )}

      {/* Assigned months overview */}
      {assignedMonths.length > 0 && (
        <div className="mt-6">
          <h3 className="text-sm font-semibold text-[var(--text-subtle)] uppercase tracking-wide mb-3">Распределено по месяцам</h3>
          <div className="space-y-3">
            {assignedMonths.map(month => {
              const entries = assignments[month] || [];
              const monthEntries = entries.map(e => {
                const item = items.find(x => x.id === e.id);
                return item ? { ...item, qty: e.qty || 1 } : null;
              }).filter(Boolean);
              if (monthEntries.length === 0) return null;
              const [y, m] = month.split('-');
              const monthLabel = `${MONTH_NAMES_FULL[parseInt(m, 10) - 1]} ${y}`;
              const total = monthEntries.reduce((s, x) => s + (x.cost || 0) * x.qty, 0);
              return (
                <div key={month} className="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm font-semibold">{monthLabel}</span>
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-display font-semibold">{formatRub(total)} ₽</span>
                      <button onClick={() => setEditingMonth(month)}
                        className="p-1 rounded-lg hover:bg-black/5 text-[var(--text-muted)] hover:text-[var(--text)]">
                        <Icon name="edit" size={14} />
                      </button>
                    </div>
                  </div>
                  <div className="space-y-1">
                    {monthEntries.map(item => (
                      <div key={item.id} className="flex items-center justify-between text-sm text-[var(--text-muted)]">
                        <span>{item.name}{item.qty > 1 ? ` ×${item.qty}` : ''}</span>
                        <div className="flex items-center gap-2">
                          <span>{item.cost ? formatRub(item.cost * item.qty) + ' ₽' : ''}</span>
                          <button onClick={() => removeFromMonth(month, item.id)}
                            className="p-1 rounded hover:bg-red-50 text-[var(--text-subtle)] hover:text-red-500">
                            <Icon name="x" size={12} />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {editing && <BudgetSupplementModal item={editing} onSave={save} onClose={() => setEditing(null)} />}

      {showAssign && (
        <BudgetSupplementAssignModal
          selectedItems={selected.map(id => items.find(x => x.id === id)).filter(Boolean)}
          onAssign={assignToMonth}
          onClose={() => setShowAssign(false)}
        />
      )}

      {editingMonth && (
        <BudgetSupplementEditMonthModal
          month={editingMonth}
          entries={assignments[editingMonth] || []}
          allItems={items}
          onSave={(entries) => saveMonthEntries(editingMonth, entries)}
          onClose={() => setEditingMonth(null)}
        />
      )}

      <FilterDropdownPortal anchorRef={filterAnchor} isOpen={!!filterOpen} onClose={() => setFilterOpen(null)}>
        {filterOpen && (() => {
          const col = COLUMNS.find(c => c.id === filterOpen);
          if (!col) return null;
          return (
            <>
              <div className="flex items-center justify-between mb-1.5 px-1">
                <span className="text-[10px] font-semibold text-gray-400 uppercase">Фильтр: {col.label}</span>
                {filters[filterOpen] && (
                  <button onClick={() => setFilter(filterOpen, null)} className="text-[10px] text-blue-600 hover:underline">Сбросить</button>
                )}
              </div>
              {getUniqueVals(filterOpen).map(val => {
                const display = typeof val === 'number'
                  ? (filterOpen === 'cost' ? formatRub(val) + ' ₽' : (val || '—'))
                  : (val || '(пусто)');
                return (
                  <label key={String(val)} className="flex items-center gap-2 px-1.5 py-1.5 rounded-lg hover:bg-gray-50 cursor-pointer text-sm">
                    <input type="checkbox" checked={(filters[filterOpen] || []).includes(val)}
                      onChange={() => toggleFilterValue(filterOpen, val)} className="rounded border-gray-300" />
                    <span>{display}</span>
                  </label>
                );
              })}
            </>
          );
        })()}
      </FilterDropdownPortal>
    </div>
  );
}

function BudgetSupplementEditMonthModal({ month, entries, allItems, onSave, onClose }) {
  const MONTH_NAMES_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const [y, m] = month.split('-');
  const monthLabel = `${MONTH_NAMES_FULL[parseInt(m, 10) - 1]} ${y}`;

  const [localEntries, setLocalEntries] = useState(() =>
    entries.map(e => ({ id: e.id, qty: e.qty || 1 }))
  );

  const assignedIds = localEntries.map(e => e.id);
  const unassigned = allItems.filter(x => !assignedIds.includes(x.id));

  const setQty = (id, val) => setLocalEntries(arr =>
    arr.map(e => e.id === id ? { ...e, qty: Math.max(1, parseInt(val) || 1) } : e)
  );
  const removeEntry = (id) => setLocalEntries(arr => arr.filter(e => e.id !== id));
  const addEntry = (id) => setLocalEntries(arr => [...arr, { id, qty: 1 }]);

  const total = localEntries.reduce((s, e) => {
    const item = allItems.find(x => x.id === e.id);
    return s + (item ? (item.cost || 0) * e.qty : 0);
  }, 0);

  return (
    <Modal title={`Редактировать — ${monthLabel}`} onClose={onClose}>
      <div className="space-y-3 max-h-[50vh] overflow-y-auto">
        {localEntries.length === 0 && (
          <div className="text-center py-4 text-sm text-[var(--text-subtle)]">Список пуст</div>
        )}
        {localEntries.map(entry => {
          const item = allItems.find(x => x.id === entry.id);
          if (!item) return null;
          return (
            <div key={entry.id} className="flex items-center gap-3 bg-[var(--bg)] rounded-xl px-3 py-2">
              <div className="flex-1 min-w-0">
                <div className="text-sm font-medium truncate">{item.name}</div>
                {item.brand && <div className="text-xs text-[var(--text-subtle)]">{item.brand}</div>}
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <button onClick={() => setQty(entry.id, entry.qty - 1)}
                  className="w-7 h-7 rounded-lg bg-[var(--surface)] border border-[var(--border)] text-sm flex items-center justify-center hover:bg-black/5">−</button>
                <input type="number" min="1" value={entry.qty}
                  onChange={e => setQty(entry.id, e.target.value)}
                  className="w-12 text-center text-sm border border-[var(--border)] rounded-lg py-1 bg-[var(--surface)]" />
                <button onClick={() => setQty(entry.id, entry.qty + 1)}
                  className="w-7 h-7 rounded-lg bg-[var(--surface)] border border-[var(--border)] text-sm flex items-center justify-center hover:bg-black/5">+</button>
              </div>
              <span className="text-sm font-medium whitespace-nowrap w-20 text-right">{item.cost ? formatRub(item.cost * entry.qty) + ' ₽' : '—'}</span>
              <button onClick={() => removeEntry(entry.id)}
                className="p-1 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500 shrink-0">
                <Icon name="trash" size={14} />
              </button>
            </div>
          );
        })}

        {unassigned.length > 0 && (
          <div className="pt-2 border-t border-[var(--border)]">
            <div className="text-xs text-[var(--text-subtle)] uppercase tracking-wide font-semibold mb-2">Добавить</div>
            <div className="space-y-1">
              {unassigned.map(item => (
                <button key={item.id} onClick={() => addEntry(item.id)}
                  className="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-blue-50 transition-colors text-left">
                  <Icon name="plus" size={14} />
                  <span className="text-sm flex-1 truncate">{item.name}{item.brand ? ` (${item.brand})` : ''}</span>
                  <span className="text-xs text-[var(--text-subtle)]">{item.cost ? formatRub(item.cost) + ' ₽' : ''}</span>
                </button>
              ))}
            </div>
          </div>
        )}
      </div>

// ============== SHARED ==============
function FilterDropdownPortal({ anchorRef, isOpen, onClose, children }) {
  const dropRef = useRef(null);
  const [pos, setPos] = useState({ top: 0, left: 0 });

  useEffect(() => {
    if (!isOpen || !anchorRef) return;
    const el = anchorRef instanceof Element ? anchorRef : anchorRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const dropW = 240;
    let left = rect.left;
    if (left + dropW > window.innerWidth) left = window.innerWidth - dropW - 8;
    if (left < 8) left = 8;
    setPos({ top: rect.bottom + 4, left });
  }, [isOpen, anchorRef]);

  useEffect(() => {
    if (!isOpen) return;
    const handler = (e) => {
      if (dropRef.current && !dropRef.current.contains(e.target)) onClose();
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [isOpen, onClose]);

  if (!isOpen) return null;

  return ReactDOM.createPortal(
    <div ref={dropRef}
      className="fixed z-[9999] bg-white border border-gray-200 rounded-xl shadow-xl p-2.5"
      style={{ top: pos.top, left: pos.left, minWidth: 230, maxHeight: 300, overflowY: 'auto' }}>
      {children}
    </div>,
    document.body
  );
}

// ============== ПЛАНИРОВЩИК ДЕЛ ==============
// Общие события с друзьями. Друзья НЕ заходят в приложение: организатор
// копирует ссылку /e/<token> и отправляет её. Ссылка открывает отдельную
// страницу (event.html), которая знает только про одно это событие —
// ни других разделов, ни /api/data оттуда не видно.

const PLANNER_STATUSES = [
  { id: 'yes',          label: 'Точно еду',             short: 'Точно еду',  color: '#16a34a' },
  { id: 'probably',     label: 'Скорее всего еду',      short: 'Скорее да',  color: '#0891b2' },
  { id: 'maybe',        label: 'Пока не знаю',          short: 'Не знаю',    color: '#ca8a04' },
  { id: 'probably_not', label: 'Скорее всего не смогу', short: 'Скорее нет', color: '#ea580c' },
  { id: 'no',           label: 'Не смогу',              short: 'Не смогу',   color: '#dc2626' },
];
const PLANNER_STATUS_BY_ID = Object.fromEntries(PLANNER_STATUSES.map(s => [s.id, s]));

// Как гость попадает в событие: выбирает себя из готового списка друзей
// либо вписывает своё имя сам (тогда событие не ограничено кругом друзей).
const PLANNER_MODES = [
  { id: 'list', label: 'Только из списка' },
  { id: 'open', label: 'Вписывают имя сами' },
];
const plannerEventMode = (ev) => (ev && ev.participantMode === 'open' ? 'open' : 'list');

// Участники события: приглашённые организатором из списка друзей плюс (в
// открытом событии) все, кто вписал себя сам. Порядок тот же, что отдаёт
// сервер гостевой странице, — чтобы списки везде выглядели одинаково.
const plannerParticipantsOf = (ev, friends, guests) => {
  const byId = Object.fromEntries((friends || []).map(f => [f.id, f]));
  const invited = (ev?.participantIds || [])
    .map(id => byId[id])
    .filter(Boolean)
    .map(f => ({ id: f.id, name: f.name, self: false }));
  if (plannerEventMode(ev) !== 'open') return invited;
  const joined = (guests || [])
    .filter(g => g.eventId === ev.id)
    .slice()
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))
    .map(g => ({ id: g.id, name: g.name || 'Гость', self: true }));
  return [...invited, ...joined];
};

const PLANNER_MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                        'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

// Токен гостевой ссылки: 32 hex-символа. Подобрать его перебором нельзя,
// а знать его достаточно, чтобы открыть страницу события — поэтому ссылку
// стоит слать только тем, кого действительно зовём.
const makePlannerToken = () => {
  try {
    if (crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
  } catch (_) {}
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
};

// Дату разбираем вручную: new Date('YYYY-MM-DD') — это полночь UTC, которая
// западнее Гринвича превращается во вчерашний день.
const plannerParseDate = (iso) => {
  if (!iso) return null;
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y || !m || !d) return null;
  const date = new Date(y, m - 1, d);
  date.setHours(0, 0, 0, 0);
  return isNaN(date.getTime()) ? null : date;
};

const plannerFmtDate = (iso, withYear = true) => {
  const d = plannerParseDate(iso);
  if (!d) return '';
  return `${d.getDate()} ${PLANNER_MONTHS[d.getMonth()]}${withYear ? ' ' + d.getFullYear() : ''}`;
};

const plannerFmtRange = (ev) => {
  if (!ev.startDate) return 'Дата не назначена';
  const a = plannerParseDate(ev.startDate);
  const b = plannerParseDate(ev.endDate);
  let s;
  if (!b || +b === +a) s = plannerFmtDate(ev.startDate);
  else if (a && b.getFullYear() === a.getFullYear()) {
    s = a.getMonth() === b.getMonth()
      ? `${a.getDate()}–${plannerFmtDate(ev.endDate)}`
      : `${plannerFmtDate(ev.startDate, false)} – ${plannerFmtDate(ev.endDate)}`;
  } else s = `${plannerFmtDate(ev.startDate)} – ${plannerFmtDate(ev.endDate)}`;
  if (ev.startTime) s += `, ${ev.startTime}${ev.endTime ? '–' + ev.endTime : ''}`;
  return s;
};

const plannerDaysUntil = (iso) => {
  const d = plannerParseDate(iso);
  if (!d) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((d - today) / 86400000);
};

const plannerPlural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
};

// Событие «прошло», когда закончилась последняя его дата.
const plannerIsPast = (ev) => {
  const end = plannerParseDate(ev.endDate || ev.startDate);
  if (!end) return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return end < today;
};

const plannerEventUrl = (ev) =>
  ev.shareToken ? `${window.location.origin}/e/${ev.shareToken}` : '';

const copyToClipboard = async (text) => {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) {}
  // Fallback для http и старых webview, где Clipboard API недоступен.
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (_) { return false; }
};

const newPlannerEvent = () => ({

const plannerEventConfirmed = (ev) => !!(ev && ev.confirmed);

// ── Мои планы: календарь месяца ────────────────────────────────────────────

const newPlannerPlan = (startDate = '') => ({
  id: crypto.randomUUID(),
  title: '',
  description: '',
  startDate,
  endDate: startDate,
  createdAt: Date.now(),
  updatedAt: Date.now(),
