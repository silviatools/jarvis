function EngSyncBtn({cfg,toMark,toUnmark,rawData,tcRef,atRef}){
  const [st,setSt]=useState('idle');const [msg,setMsg]=useState('');
  const sync=async()=>{
    if(!cfg.clientId){alert('OAuth Client ID is not set in ⚙ Settings');return;}
    setSt('loading');setMsg('Authorizing...');
    const doSync=async()=>{
      try{
        setMsg('Writing...');
        const data=[...toMark.map(i=>({range:`${cfg.sheetName}!I${i}`,values:[[true]]})),...toUnmark.map(i=>({range:`${cfg.sheetName}!I${i}`,values:[[false]]}))];
        const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${cfg.sheetId}/values:batchUpdate`,{method:'POST',headers:{'Authorization':'Bearer '+atRef.current,'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'USER_ENTERED',data})});
        if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||'HTTP '+r.status);}
        setSt('done');setMsg(`✓ ${toMark.length?'+'+toMark.length+' marked':''}${toUnmark.length?' −'+toUnmark.length+' unmarked':''}`);
      }catch(e){setSt('err');setMsg('✗ '+e.message);}
    };
    if(atRef.current){await doSync();return;}
    if(!tcRef.current){alert('OAuth not ready');setSt('idle');return;}
    tcRef.current.requestAccessToken({prompt:'consent'});
    let tries=0;
    const wait=setInterval(async()=>{if(atRef.current){clearInterval(wait);await doSync();}else if(++tries>30){clearInterval(wait);setSt('err');setMsg('Timeout');}},500);
  };
  return(
    <div>
      <button onClick={sync} disabled={st==='loading'||st==='done'} className="btn-primary w-full py-3">
        {st==='loading'?'⏳ '+msg:st==='done'?msg:'↻ Sync to spreadsheet'}
      </button>
      {st==='err'&&<p className="text-xs text-red-500 mt-1">{msg}</p>}
    </div>
  );
}

function FlashcardsTab({rawData,cfg,ai}){
  const [phase,setPhase]=useState('setup');
  const [settings,setSettings]=useState({direction:'en-ru',count:20,order:'random',filter:'all',dateRange:'all',sentence:true,synonyms:true,tts:false,hide:true,repeat:true,auto:false});
  const [sess,setSess]=useState(null);
  const sessRef=useRef(null);
  useEffect(()=>{sessRef.current=sess;},[sess]);
  const tcRef=useRef(null);const atRef=useRef(null);

  // Example-sentence cache: permanent (by word), shared across sessions, so
  // generation is a one-time cost per word and is never awaited during study.
  const [sentCache,setSentCache]=useState(()=>{try{return JSON.parse(localStorage.getItem(ENG_SENT_CACHE_KEY)||'{}');}catch{return{};}});
  const mergeSentCache=(entries)=>setSentCache(prev=>{
    const next={...prev,...entries};
    try{localStorage.setItem(ENG_SENT_CACHE_KEY,JSON.stringify(next));}catch(e){}
    return next;
  });
  const getSent=(en)=>sentCache[String(en||'').trim().toLowerCase()]||null;

  useEffect(()=>{
    if(!cfg.clientId) return;
    const load=()=>{
      if(!window.google?.accounts) return;
      try{tcRef.current=window.google.accounts.oauth2.initTokenClient({client_id:cfg.clientId,scope:'https://www.googleapis.com/auth/spreadsheets',callback:(r)=>{if(r.access_token)atRef.current=r.access_token;}});}catch(e){}
    };
    if(window.google?.accounts){load();return;}
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>setTimeout(load,300);document.head.appendChild(s);
  },[cfg.clientId]);

  useEffect(()=>{
    const h=(e)=>{
      const s=sessRef.current;if(!s||phase!=='study') return;
      if(e.code==='Space'){e.preventDefault();setSess(x=>x?{...x,flipped:!x.flipped}:x);}
      else if(e.key==='h'||e.key==='H') toggleHard();
      else if(s.flipped&&['1','2','3','4'].includes(e.key)){doAnswer({'1':'again','2':'hard','3':'good','4':'easy'}[e.key]);}
      else if(!s.flipped){
        if(e.key==='ArrowRight') setSess(x=>x?{...x,cur:x.cur+1}:x);
        else if(e.key==='ArrowLeft'&&s.cur>0) setSess(x=>x?{...x,cur:x.cur-1,flipped:false}:x);
      }
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[phase]);

  const autoRef=useRef(null);
  useEffect(()=>{
    if(autoRef.current) clearTimeout(autoRef.current);
    if(!sess||sess.flipped||!settings.auto||phase!=='study') return;
    autoRef.current=setTimeout(()=>setSess(s=>s?{...s,flipped:true}:s),5000);
    return()=>clearTimeout(autoRef.current);
  },[sess?.cur,sess?.flipped,settings.auto,phase]);

  const getIY=(data)=>{const ys=data.map(w=>engParseDate(w.date)?.getFullYear()).filter(Boolean);return ys.length?Math.max(...ys):new Date().getFullYear();};

  const startSession=()=>{
    if(!rawData?.length) return;
    const iy=getIY(rawData);
    let pool=rawData.slice();
    if(settings.filter==='hard') pool=pool.filter(w=>w.hard);
    else if(settings.filter==='not-hard') pool=pool.filter(w=>!w.hard);
    else if(settings.filter==='not-shown') pool=pool.filter(w=>!w.showNew);
    if(settings.dateRange!=='all'){
      const days=parseInt(settings.dateRange);
      const times=rawData.map(w=>engParseDate(w.date,iy)).filter(Boolean).map(d=>d.getTime());
      const ref=times.length?Math.max(...times):Date.now();
      pool=pool.filter(w=>{const d=engParseDate(w.date,iy);return d&&d.getTime()>=ref-(days-1)*86400000;});
    }
    if(!pool.length){alert('No words match the selected filters');return;}
    if(settings.order==='random') pool.sort(()=>Math.random()-.5);
    else if(settings.order==='newest') pool.sort((a,b)=>(engParseDate(b.date,iy)?.getTime()||0)-(engParseDate(a.date,iy)?.getTime()||0));
    else if(settings.order==='oldest') pool.sort((a,b)=>(engParseDate(a.date,iy)?.getTime()||0)-(engParseDate(b.date,iy)?.getTime()||0));
    const pd=()=>settings.direction==='mixed'?(Math.random()<.5?'en-ru':'ru-en'):settings.direction;
    const cnt=settings.count>0&&settings.count<pool.length?settings.count:pool.length;
    const batch=pool.slice(0,cnt).map(w=>({...w,_dir:pd()}));
    setSess({queue:batch,again:[],done:[],cur:0,flipped:false,markHard:new Set(),unmarkHard:new Set(),stats:{again:0,hard:0,good:0,easy:0},iy});
    setPhase('study');
    if(settings.sentence) engPrefetchSentences(ai,batch,sentCache,mergeSentCache); // background, never awaited
  };

  const toggleHard=()=>setSess(s=>{
    if(!s) return s;
    const w=s.queue[s.cur];if(!w) return s;
    const idx=w.rowIndex;const nm=new Set(s.markHard),nu=new Set(s.unmarkHard);
    if(w.hard){nu.has(idx)?nu.delete(idx):nu.add(idx);}else{nm.has(idx)?nm.delete(idx):nm.add(idx);}
    return{...s,markHard:nm,unmarkHard:nu};
  });

  const doAnswer=(type)=>setSess(s=>{
    if(!s) return s;
    const w=s.queue[s.cur];
    const ns={...s.stats,[type]:s.stats[type]+1};
    const na=(type==='again'||type==='hard')?[...s.again,{...w}]:s.again;
    const nd=[...s.done,w];let nq=[...s.queue];nq.splice(s.cur,1);let nc=s.cur;
    if(nc>=nq.length){
      if(settings.repeat&&na.length) return{...s,queue:na,again:[],done:nd,cur:0,flipped:false,stats:ns};
      setTimeout(()=>setPhase('finish'),0);
      return{...s,queue:nq,again:na,done:nd,cur:nc,stats:ns};
    }
    return{...s,queue:nq,again:na,done:nd,cur:nc,flipped:false,stats:ns};
  });

  if(!rawData?.length) return(
    <div className="text-center py-20 text-[var(--text-subtle)]">
      <div className="font-display text-5xl mb-4">A↻</div><p>Load words from Google Sheets</p>
    </div>
  );

  // --- SETUP ---
  if(phase==='setup') return(
    <div className="max-w-lg mx-auto space-y-5 pb-8">
      <div><label>Direction</label>
        <div className="flex gap-2 mt-1">
          {[['en-ru','EN → RU'],['ru-en','RU → EN'],['mixed','Mixed']].map(([v,l])=>(
            <button key={v} onClick={()=>setSettings(s=>({...s,direction:v}))} className={`flex-1 py-2.5 rounded-lg text-sm font-medium border transition-all ${settings.direction===v?'bg-[var(--text)] text-white border-[var(--text)]':'border-[var(--border)] text-[var(--text-muted)]'}`}>{l}</button>
          ))}
        </div>
      </div>
      <div><label>Number of cards</label><input type="number" min="0" max="500" value={settings.count||''} onChange={e=>setSettings(s=>({...s,count:parseInt(e.target.value)||0}))} placeholder="0 = all"/><p className="text-xs text-[var(--text-subtle)] mt-1">0 = all matching</p></div>
      <div><label>Order</label><select value={settings.order} onChange={e=>setSettings(s=>({...s,order:e.target.value}))}><option value="random">Random</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div>
      <div><label>Filter</label><select value={settings.filter} onChange={e=>setSettings(s=>({...s,filter:e.target.value}))}><option value="all">All words</option><option value="hard">Hard only ★</option><option value="not-hard">Non-hard only</option><option value="not-shown">Not studied yet</option></select></div>
      <div><label>Period</label><select value={settings.dateRange} onChange={e=>setSettings(s=>({...s,dateRange:e.target.value}))}><option value="all">All time</option><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option></select></div>
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-4 space-y-3">
        {[['sentence','Show example sentence'],['synonyms','Show synonyms'],['hide','Hide word in example'],['repeat','Repeat mistakes'],['auto','Auto-flip (5 sec)'],['tts','TTS pronunciation']].map(([k,l])=>(
          <div key={k} className="flex items-center justify-between"><span className="text-sm">{l}</span><Toggle checked={!!settings[k]} onChange={v=>setSettings(s=>({...s,[k]:v}))}/></div>
        ))}
      </div>
      <button onClick={startSession} className="btn-primary w-full py-3.5 flex items-center justify-center gap-2">▶ Start session ({rawData.length} words)</button>
    </div>
  );

  // --- FINISH ---
  if(phase==='finish'&&sess){
    const s=sess.stats;const correct=s.good+s.easy,total=s.again+s.hard+s.good+s.easy;
    const pct=total?Math.round(correct/total*100):0;
    const toMark=[...sess.markHard],toUnmark=[...sess.unmarkHard];
    const wFor=(idx)=>{const w=rawData.find(x=>x.rowIndex===idx);return w?w.en:`row ${idx}`;};
    return(
      <div className="text-center py-8 max-w-lg mx-auto pb-12">
        <div className="font-display text-7xl font-bold mb-1">{pct}%</div>
        <h2 className="font-display text-2xl mb-1">Session complete</h2>
        <p className="text-[var(--text-muted)] mb-6">{correct} out of {total} on the first try</p>
        <div className="flex justify-center gap-3 mb-8 flex-wrap">
          {[['again',s.again,'text-red-500'],['hard',s.hard,'text-amber-500'],['good',s.good,'text-green-500'],['easy',s.easy,'text-green-600']].map(([l,v,c])=>(
            <div key={l} className="bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3 min-w-[64px]">
              <div className={`font-display text-2xl font-bold ${c}`}>{v}</div>
              <div className="text-xs text-[var(--text-subtle)] mt-1">{l}</div>
            </div>
          ))}
        </div>
        {(toMark.length>0||toUnmark.length>0)&&(
          <div className="mb-6 text-left space-y-3">
            {toMark.length>0&&<div className="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-4"><div className="text-xs text-[var(--text-subtle)] uppercase tracking-wide mb-2">+ Mark as hard ({toMark.length})</div><div className="text-sm">{toMark.map(wFor).join(', ')}</div></div>}
            {toUnmark.length>0&&<div className="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-4"><div className="text-xs text-[var(--text-subtle)] uppercase tracking-wide mb-2">− Remove hard mark ({toUnmark.length})</div><div className="text-sm">{toUnmark.map(wFor).join(', ')}</div></div>}
            <EngSyncBtn cfg={cfg} toMark={toMark} toUnmark={toUnmark} rawData={rawData} tcRef={tcRef} atRef={atRef}/>
          </div>
        )}
        <button onClick={()=>{setSess(null);setPhase('setup');}} className="btn-primary px-8 py-3">↻ New session</button>
      </div>
    );
  }

  // --- STUDY ---
  if(!sess||sess.cur>=sess.queue.length) return null;
  const w=sess.queue[sess.cur];const dir=w._dir;
  const front=dir==='en-ru'?w.en:w.ru;const back=dir==='en-ru'?w.ru:w.en;
  const total=sess.queue.length+sess.done.length;
  const prog=sess.done.length/Math.max(total,1)*100;
  const isHard=sess.markHard.has(w.rowIndex)?'marking':(sess.unmarkHard.has(w.rowIndex)?'unmarking':(w.hard?'hard':'none'));
  let sentF=w.sentence;
  if(settings.hide&&dir==='en-ru'&&sentF) sentF=sentF.replace(new RegExp('\\b'+engEscRe(w.en.split(' ')[0])+'\\w*','ig'),'___');
  if(settings.tts&&!sess.flipped){const u=new SpeechSynthesisUtterance(dir==='en-ru'?w.en:'');u.lang='en-US';u.rate=.9;window.speechSynthesis?.cancel();window.speechSynthesis?.speak(u);}
  const cachedSent=getSent(w.en);
  const pendingSent=settings.sentence&&engAIConfigured(ai)?sess.queue.concat(sess.again).filter(x=>!getSent(x.en)).length:0;

  return(
    <div className="max-w-2xl mx-auto space-y-4 pb-8">
      <div className="h-1.5 bg-[var(--surface)] rounded-full overflow-hidden"><div className="h-full bg-[var(--text)] rounded-full transition-all" style={{width:prog+'%'}}/></div>
      <div className="flex gap-2 text-xs flex-wrap">
        {[['card',`${sess.done.length+1}/${total}`,''],[' again',sess.stats.again,'text-red-500'],['hard',sess.stats.hard,'text-amber-500'],['good',sess.stats.good+sess.stats.easy,'text-green-500'],['queue',sess.again.length,'']].map(([l,v,c],i)=>(
          <div key={i} className={`bg-[var(--surface)] border border-[var(--border)] rounded-lg px-2.5 py-1 ${c}`}>{l} <span className="font-semibold">{v}</span></div>
        ))}
        {pendingSent>0&&<div className="bg-[var(--surface)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-amber-500" title="Examples are still generating in the background">examples <span className="font-semibold">⏳ {pendingSent}</span></div>}
      </div>
      <div style={ENG_CARD_S.wrap} onClick={()=>setSess(s=>s?{...s,flipped:!s.flipped}:s)}>
        <div key={w.rowIndex + '_' + w._dir} style={ENG_CARD_S.card(sess.flipped)}>
          <div style={ENG_CARD_S.face}>
            <div className="absolute top-3 left-4 text-[10px] uppercase tracking-widest text-[var(--text-subtle)]">{dir==='en-ru'?'ENGLISH':'RUSSIAN'}</div>
            <button onClick={e=>{e.stopPropagation();toggleHard();}} className={`absolute top-2 right-3 text-xs px-2.5 py-1 rounded-full border transition-all ${isHard==='hard'||isHard==='marking'?'border-amber-400 text-amber-500':'border-[var(--border)] text-[var(--text-subtle)]'}`}>
              {isHard==='marking'?'★ +hard':isHard==='unmarking'?'✕ −hard':isHard==='hard'?'★ hard':'☆ hard'}
            </button>
            <div className="font-display text-4xl sm:text-5xl font-bold leading-tight mb-3">{front}</div>
            {settings.sentence&&sentF&&<div className="text-sm text-[var(--text-muted)] italic max-w-sm leading-relaxed">{sentF}</div>}
            <div className="absolute bottom-3 text-[10px] text-[var(--text-subtle)]">↻ click or press Space</div>
          </div>
          <div style={{...ENG_CARD_S.face,...ENG_CARD_S.back}}>
            <div className="absolute top-3 left-4 text-[10px] uppercase tracking-widest text-[var(--text-subtle)]">{dir==='en-ru'?'RUSSIAN':'ENGLISH'}</div>
            <button onClick={e=>{e.stopPropagation();toggleHard();}} className={`absolute top-2 right-3 text-xs px-2.5 py-1 rounded-full border transition-all ${isHard==='hard'||isHard==='marking'?'border-amber-400 text-amber-500':'border-[var(--border)] text-[var(--text-subtle)]'}`}>
              {isHard==='marking'?'★ +hard':isHard==='hard'?'★ hard':'☆ hard'}
            </button>
            <div className="font-display text-4xl sm:text-5xl font-bold leading-tight mb-3">{back}</div>
            {settings.sentence&&(cachedSent
              ? <div className="text-sm text-[var(--text-muted)] italic max-w-sm leading-relaxed" dangerouslySetInnerHTML={{__html:engHighlight(cachedSent,w.en)}}/>
              : engAIConfigured(ai)
                ? <div className="text-sm text-[var(--text-subtle)] italic max-w-sm leading-relaxed opacity-60">⏳ example is being generated…</div>
                : w.sentence
                  ? <div className="text-sm text-[var(--text-muted)] italic max-w-sm leading-relaxed" dangerouslySetInnerHTML={{__html:engHighlight(w.sentence,w.en)}}/>
                  : null
            )}
            {settings.synonyms&&w.syn&&<div className="text-xs text-[var(--text-subtle)] mt-2">syn: {w.syn}</div>}
            <div className="absolute bottom-3 text-[10px] text-[var(--text-subtle)]">rate below · 1–4</div>
          </div>
        </div>
      </div>
      {sess.flipped?(
        <div className="grid grid-cols-4 gap-2">
          {[['again','Again','1','border-red-300 text-red-500 hover:bg-red-500/5'],['hard','Hard','2','border-amber-300 text-amber-500 hover:bg-amber-500/5'],['good','Good','3','border-green-300 text-green-500 hover:bg-green-500/5'],['easy','Easy','4','bg-green-500 text-white border-green-500']].map(([t,l,k,cls])=>(
            <button key={t} onClick={()=>doAnswer(t)} className={`py-3 rounded-xl text-sm font-semibold border transition-all flex flex-col items-center gap-0.5 ${cls}`}>
              {l}<span className="text-[10px] opacity-60 font-normal">{k}</span>
            </button>
          ))}
        </div>
      ):(
        <div className="flex gap-2 justify-between">
          <button onClick={()=>setSess(s=>s&&s.cur>0?{...s,cur:s.cur-1,flipped:false}:s)} disabled={sess.cur===0} className="btn-secondary text-sm px-4">← Back</button>
          <div className="flex gap-2">
            <button onClick={()=>setSess(s=>s?{...s,flipped:true}:s)} className="btn-primary text-sm px-4">Show (Space)</button>
            <button onClick={()=>setSess(s=>s?{...s,cur:s.cur+1}:s)} className="btn-secondary text-sm px-3">Skip →</button>
            <button onClick={()=>setPhase('finish')} className="btn-secondary text-sm px-3 text-red-500">Finish</button>
          </div>
        </div>
      )}
    </div>
  );
}

function FillTab({rawData,ai}){
  const [filter,setFilter]=useState('random');
  const [count,setCount]=useState(0);
  const [hideWords,setHideWords]=useState(false);
  const [words,setWords]=useState([]);
  const [sentences,setSentences]=useState([]);
  const [genPhase,setGenPhase]=useState('idle'); // idle|loading|done
  const [answers,setAnswers]=useState({});

  const getPool=()=>{
    if(!rawData) return [];
    let pool=rawData.slice();
    if(filter==='hard') pool=pool.filter(w=>w.hard);
    if(filter==='oldest') pool.sort((a,b)=>(engParseDate(a.date)?.getTime()||0)-(engParseDate(b.date)?.getTime()||0));
    else if(filter==='newest') pool.sort((a,b)=>(engParseDate(b.date)?.getTime()||0)-(engParseDate(a.date)?.getTime()||0));
    else pool.sort(()=>Math.random()-.5);
    return pool;
  };

  const generate=async()=>{
    if(!rawData){alert('Load data first');return;}
    const pool=getPool();if(!pool.length){alert('No words');return;}
    const n=count>0?Math.min(count,pool.length):pool.length;
    if(n>50&&!confirm(`Generate ${n} sentences?`)) return;
    const batch=pool.slice(0,n);setWords(batch);setGenPhase('loading');setSentences([]);setAnswers({});
    const prompt=`English teacher. For each word create ONE natural B2-C1 sentence. Return ONLY valid JSON array, no markdown.\nWords:\n${batch.map(w=>`- "${w.en}" (${w.ru})`).join('\n')}\nFormat: [{"word":"word1","sentence":"..."},...]`;
    try{
      const raw=await engCallAI(ai,prompt);
      const match=raw.match(/\[[\s\S]*\]/);if(!match) throw new Error('Invalid format');
      const items=JSON.parse(match[0]);if(!Array.isArray(items)||!items.length) throw new Error('Empty response');
      const result=items.map((item,idx)=>{
        const wo=batch.find(w=>w.en.toLowerCase()===(item.word||'').toLowerCase())||batch[idx]||batch[0];
        const sentence=item.sentence||'';
        const m=sentence.match(new RegExp('\\b('+engEscRe(wo.en.split(' ')[0])+'\\w*)','i'));
        return{word:wo,sentence,exactForm:m?m[1]:wo.en};
      });
      setSentences(result);setGenPhase('done');
    }catch(e){alert('AI error: '+e.message);setGenPhase('idle');}
  };

  const check=(i)=>{
    const item=sentences[i];if(!item) return;
    const val=(answers[i]?.val||'').trim().toLowerCase();
    const target=(item.exactForm||item.word.en).toLowerCase();
    const ok=engLev(val,target)<=1;
    setAnswers(a=>({...a,[i]:{...a[i],checked:true,ok}}));
  };
  const reveal=(i)=>{
    const item=sentences[i];if(!item) return;
    setAnswers(a=>({...a,[i]:{val:item.exactForm||item.word.en,checked:true,ok:true,revealed:true}}));
  };

  const pool=rawData?getPool():[];const avail=count>0?Math.min(count,pool.length):pool.length;

  return(
    <div className="space-y-5 pb-8">
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
        <div><label>Word filter</label>
          <div className="flex flex-col gap-1.5 mt-1">
            {[['random','🔀 Random'],['oldest','📅 Oldest first'],['newest','🆕 Newest first'],['hard','★ Hard only']].map(([f,l])=>(
              <button key={f} onClick={()=>setFilter(f)} className={`text-left px-3 py-2 rounded-lg text-sm border transition-all ${filter===f?'bg-[var(--text)] text-white border-[var(--text)]':'border-[var(--border)] text-[var(--text-muted)]'}`}>{l}</button>
            ))}
          </div>
        </div>
        <div className="space-y-4">
          <div><label>Count (0 = all)</label><input type="number" min="0" max="500" value={count||''} onChange={e=>setCount(parseInt(e.target.value)||0)} placeholder="0"/><p className="text-xs text-[var(--text-subtle)] mt-1">{avail} words available</p></div>
          <div className="flex items-center justify-between"><span className="text-sm">Hide word list</span><Toggle checked={hideWords} onChange={setHideWords}/></div>
          <button onClick={generate} disabled={genPhase==='loading'||!rawData} className="btn-primary w-full py-3">{genPhase==='loading'?'⏳ Generating...':'✨ Generate'}</button>
        </div>
      </div>
      {words.length>0&&(
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-4">
          <div className="text-xs text-[var(--text-subtle)] uppercase tracking-wide mb-3">Words in this batch</div>
          <div className="flex flex-wrap gap-2">
            {words.map((w,i)=><span key={i} className={`px-2.5 py-1 bg-[var(--bg)] border border-[var(--border)] rounded-lg text-sm ${hideWords?'blur-sm select-none':''}`}>{w.en}</span>)}
          </div>
        </div>
      )}
      {sentences.map((item,i)=>{
        const ans=answers[i]||{};
        const blank=item.sentence.replace(new RegExp('\\b'+engEscRe(item.word.en.split(' ')[0])+'\\w*','i'),'___');
        return(
          <div key={i} className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 space-y-3">
            <div className="text-xs text-[var(--text-subtle)]">#{i+1} · <span className="cursor-pointer blur-sm hover:blur-none transition-all select-none" onClick={e=>e.currentTarget.classList.remove('blur-sm')}>{item.word.en} — {item.word.ru}</span></div>
            <div className="font-display text-lg italic">{ans.checked?item.sentence:blank}</div>
            <div className="flex items-center gap-2 flex-wrap">
              <input className={`w-44 ${ans.checked?(ans.ok?'border-green-400':'border-red-400'):''}`} value={ans.val||''} onChange={e=>setAnswers(a=>({...a,[i]:{...a[i],val:e.target.value}}))} onKeyDown={e=>e.key==='Enter'&&check(i)} placeholder="type the word..." disabled={ans.checked}/>
              {!ans.checked&&<><button onClick={()=>check(i)} className="btn-primary py-2 px-3 text-sm">Check</button><button onClick={()=>reveal(i)} className="btn-secondary py-2 px-3 text-sm">Hint</button></>}
              {ans.checked&&<span className={`text-sm font-medium ${ans.ok?'text-green-500':'text-red-500'}`}>{ans.ok?'✓ Correct!':ans.revealed?`Word: ${item.exactForm||item.word.en}`:`✗ Answer: ${item.exactForm||item.word.en}`}</span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function TypingTab({rawData,ai}){
  const [filter,setFilter]=useState('random');
  const [count,setCount]=useState(20);
  const [aiMode,setAiMode]=useState('always');
  const [phase,setPhase]=useState('setup');
  const [queue,setQueue]=useState([]);
  const [cur,setCur]=useState(0);
  const [stats,setStats]=useState({correct:0,close:0,wrong:0});
  const [answer,setAnswer]=useState('');
  const [result,setResult]=useState(null);
  const inputRef=useRef(null);
  useEffect(()=>{if(phase==='study'&&inputRef.current)inputRef.current.focus();},[cur,phase]);
  useEffect(()=>{
    if(phase!=='study'||result) return;
    const h=(e)=>{if(e.key==='Enter'&&answer.trim())check();};
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[phase,result,answer]);

  const start=()=>{
    if(!rawData){alert('Load data first');return;}
    let pool=rawData.slice();
    if(filter==='hard') pool=pool.filter(w=>w.hard);
    else if(filter==='oldest') pool.sort((a,b)=>(engParseDate(a.date)?.getTime()||0)-(engParseDate(b.date)?.getTime()||0));
    else if(filter==='newest') pool.sort((a,b)=>(engParseDate(b.date)?.getTime()||0)-(engParseDate(a.date)?.getTime()||0));
    else pool.sort(()=>Math.random()-.5);
    const n=count>0?Math.min(count,pool.length):pool.length;
    if(!n){alert('No words');return;}
    setQueue(pool.slice(0,n));setCur(0);setStats({correct:0,close:0,wrong:0});setAnswer('');setResult(null);setPhase('study');
  };

  const check=async()=>{
    if(!answer.trim()) return;
    const w=queue[cur];const dist=engLev(answer.trim().toLowerCase(),w.en.toLowerCase());
    const type=dist===0?'correct':dist<=2?'close':'wrong';
    setStats(s=>({...s,[type]:s[type]+1}));
    const needAI=aiMode==='always'||(aiMode==='wrong'&&type!=='correct');
    setResult({type,comment:null,loading:needAI});
    if(needAI){
      const prompt=`English teacher feedback. Student shown "${w.ru}", typed "${answer}", correct is "${w.en}".${w.sentence?`\nExample: "${w.sentence}"`:''}${w.syn?`\nSynonyms: ${w.syn}`:''}\nShort comment (2-3 sentences, English, friendly, no markdown).`;
      try{const c=await engCallAI(ai,prompt);setResult(r=>r?{...r,comment:c,loading:false}:r);}
      catch(e){setResult(r=>r?{...r,comment:'(AI unavailable)',loading:false}:r);}
    }
  };

  const next=()=>{setAnswer('');setResult(null);if(cur+1>=queue.length){setPhase('finish');return;}setCur(c=>c+1);};

  if(!rawData) return <div className="text-center py-20 text-[var(--text-subtle)]"><p>Load data from Google Sheets</p></div>;

  if(phase==='setup') return(
    <div className="max-w-lg mx-auto space-y-5 pb-8">
      <div><label>Filter</label>
        <div className="flex flex-col gap-1.5 mt-1">
          {[['random','🔀 Random'],['oldest','📅 Oldest first'],['newest','🆕 Newest first'],['hard','★ Hard only']].map(([f,l])=>(
            <button key={f} onClick={()=>setFilter(f)} className={`text-left px-3 py-2 rounded-lg text-sm border transition-all ${filter===f?'bg-[var(--text)] text-white border-[var(--text)]':'border-[var(--border)] text-[var(--text-muted)]'}`}>{l}</button>
          ))}
        </div>
      </div>
      <div><label>Word count (0 = all)</label><input type="number" min="0" max="500" value={count||''} onChange={e=>setCount(parseInt(e.target.value)||0)}/></div>
      <div><label>AI comments</label>
        <div className="flex gap-2 mt-1">
          {[['always','Always'],['wrong','Errors only'],['never','Off']].map(([v,l])=>(
            <button key={v} onClick={()=>setAiMode(v)} className={`flex-1 py-2.5 rounded-lg text-sm font-medium border transition-all ${aiMode===v?'bg-[var(--text)] text-white border-[var(--text)]':'border-[var(--border)] text-[var(--text-muted)]'}`}>{l}</button>
          ))}
        </div>
      </div>
      <button onClick={start} className="btn-primary w-full py-3.5">▶ Start</button>
    </div>
  );

  if(phase==='finish'){
    const total=stats.correct+stats.close+stats.wrong;const pct=total?Math.round((stats.correct+stats.close)/total*100):0;
    return(
      <div className="text-center py-8 max-w-lg mx-auto pb-12">
        <div className="font-display text-7xl font-bold mb-1">{pct}%</div>
        <h2 className="font-display text-2xl mb-6">Typing mode complete</h2>
        <div className="flex justify-center gap-3 mb-8 flex-wrap">
          {[['correct',stats.correct,'text-green-500'],['close',stats.close,'text-amber-500'],['errors',stats.wrong,'text-red-500']].map(([l,v,c])=>(
            <div key={l} className="bg-[var(--surface)] border border-[var(--border)] rounded-xl px-4 py-3"><div className={`font-display text-2xl font-bold ${c}`}>{v}</div><div className="text-xs text-[var(--text-subtle)] mt-1">{l}</div></div>
          ))}
        </div>
        <button onClick={()=>setPhase('setup')} className="btn-primary px-8 py-3">↻ Repeat</button>
      </div>
    );
  }

  const w=queue[cur];const total=queue.length;const pct=Math.round(cur/total*100);
  return(
    <div className="max-w-2xl mx-auto space-y-4 pb-8">
      <div className="h-1.5 bg-[var(--surface)] rounded-full overflow-hidden"><div className="h-full bg-[var(--text)] transition-all" style={{width:pct+'%'}}/></div>
      <div className="flex gap-2 text-xs flex-wrap">
        {[['card',`${cur+1}/${total}`,''],['correct',stats.correct,'text-green-500'],['close',stats.close,'text-amber-500'],['errors',stats.wrong,'text-red-500']].map(([l,v,c],i)=>(
          <div key={i} className={`bg-[var(--surface)] border border-[var(--border)] rounded-lg px-2.5 py-1 ${c}`}>{l} <b>{v}</b></div>
        ))}
      </div>
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-8 text-center">
        <div className="text-xs text-[var(--text-subtle)] uppercase tracking-widest mb-4">RU → EN</div>
        <div className="font-display text-4xl sm:text-5xl font-bold mb-3">{w.ru}</div>
        {w.syn&&<div className="text-sm text-[var(--text-muted)]">syn: {w.syn}</div>}
      </div>
      {!result?(
        <div className="flex gap-2">
          <input ref={inputRef} value={answer} onChange={e=>setAnswer(e.target.value)} placeholder="type in English..." className="flex-1 text-lg" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"/>
          <button onClick={check} disabled={!answer.trim()} className="btn-primary px-5">Check</button>
          <button onClick={next} className="btn-secondary px-4">→</button>
        </div>
      ):(
        <div className="space-y-3">
          <div className={`bg-[var(--surface)] border rounded-xl p-4 ${result.type==='correct'?'border-green-400':result.type==='close'?'border-amber-400':'border-red-400'}`}>
            <div className={`font-semibold mb-2 ${result.type==='correct'?'text-green-500':result.type==='close'?'text-amber-500':'text-red-500'}`}>
              {result.type==='correct'?'✓ Correct!':result.type==='close'?`~ Close! Correct: ${w.en}`:`✗ Wrong. Correct: ${w.en}`}
            </div>
            {result.loading&&<div className="text-sm text-[var(--text-muted)]">⏳ AI is analyzing...</div>}
            {result.comment&&<div className="text-sm text-[var(--text-muted)]">{result.comment}</div>}
          </div>
          <button onClick={next} className="btn-primary w-full py-3">Next word →</button>
        </div>
      )}
    </div>
  );
}

const ENG_MYSENT_DEFAULT_PROMPT = `You are a friendly English teacher. The student was given the word "{word}" (translation: "{translation}"). They wrote their own example sentence with it:

"{sentence}"

Briefly (3-5 sentences), in English:
1. Assess whether the word is used correctly in meaning and grammar. If there are mistakes, point them out and give a corrected version.
2. If the sentence is good, say so and, if useful, suggest a more natural or advanced alternative.
Be warm and to the point, no markdown, no headings.`;

// Write your own sentence with the word + say it out loud. Similar to TypingTab,
// but instead of translating, the student composes their own example, and the AI
// gives feedback via a customizable prompt (stored in the DB with the other
// English settings).
function MySentenceTab({rawData,ai,prompt,onSavePrompt}){
  const [filter,setFilter]=useState('random');
  const [count,setCount]=useState(15);
  const [phase,setPhase]=useState('setup');
  const [promptDraft,setPromptDraft]=useState(prompt);
  useEffect(()=>{setPromptDraft(prompt);},[prompt]);
  const [queue,setQueue]=useState([]);
  const [cur,setCur]=useState(0);
  const [stats,setStats]=useState({done:0});
  const [sentence,setSentence]=useState('');
  const [feedback,setFeedback]=useState(null); // {loading,text}
  const [said,setSaid]=useState(false);
  const taRef=useRef(null);
  useEffect(()=>{if(phase==='study'&&taRef.current)taRef.current.focus();},[cur,phase]);

  const start=()=>{
    if(!rawData){alert('Load data first');return;}
    let pool=rawData.slice();
    if(filter==='hard') pool=pool.filter(w=>w.hard);
    else if(filter==='oldest') pool.sort((a,b)=>(engParseDate(a.date)?.getTime()||0)-(engParseDate(b.date)?.getTime()||0));
    else if(filter==='newest') pool.sort((a,b)=>(engParseDate(b.date)?.getTime()||0)-(engParseDate(a.date)?.getTime()||0));
    else pool.sort(()=>Math.random()-.5);
    const n=count>0?Math.min(count,pool.length):pool.length;
    if(!n){alert('No words');return;}
    setQueue(pool.slice(0,n));setCur(0);setStats({done:0});setSentence('');setFeedback(null);setSaid(false);setPhase('study');
  };

  const check=async()=>{
    const val=sentence.trim();
    if(!val) return;
    const w=queue[cur];
    setFeedback({loading:true,text:''});
    try{
      const p=(prompt||ENG_MYSENT_DEFAULT_PROMPT).replaceAll('{word}',w.en).replaceAll('{translation}',w.ru).replaceAll('{sentence}',val);
      const c=await engCallAI(ai,p);
      setFeedback({loading:false,text:c});
    }catch(e){
      setFeedback({loading:false,text:'(AI unavailable: '+e.message+')'});
    }
    setStats(s=>({...s,done:s.done+1}));
  };

  const playWord=()=>{
    const w=queue[cur];if(!w||!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';u.rate=.9;
    window.speechSynthesis.speak(u);
  };

  const next=()=>{setSentence('');setFeedback(null);setSaid(false);if(cur+1>=queue.length){setPhase('finish');return;}setCur(c=>c+1);};

  if(!rawData) return <div className="text-center py-20 text-[var(--text-subtle)]"><p>Load data from Google Sheets</p></div>;

  if(phase==='setup') return(
    <div className="max-w-lg mx-auto space-y-5 pb-8">
      <div><label>Filter</label>
        <div className="flex flex-col gap-1.5 mt-1">
          {[['random','🔀 Random'],['oldest','📅 Oldest first'],['newest','🆕 Newest first'],['hard','★ Hard only']].map(([f,l])=>(
            <button key={f} onClick={()=>setFilter(f)} className={`text-left px-3 py-2 rounded-lg text-sm border transition-all ${filter===f?'bg-[var(--text)] text-white border-[var(--text)]':'border-[var(--border)] text-[var(--text-muted)]'}`}>{l}</button>
          ))}
        </div>
      </div>
      <div><label>Word count (0 = all)</label><input type="number" min="0" max="500" value={count||''} onChange={e=>setCount(parseInt(e.target.value)||0)}/></div>
      <div>
        <label>AI review prompt</label>
        <textarea value={promptDraft} onChange={e=>setPromptDraft(e.target.value)} rows={9} style={{resize:'vertical',fontFamily:'inherit'}} className="w-full text-sm"/>
        <p className="text-xs text-[var(--text-subtle)] mt-1">Placeholders: <code>{'{word}'}</code>, <code>{'{translation}'}</code>, <code>{'{sentence}'}</code></p>
        <div className="flex gap-2 mt-2">
          <button onClick={()=>onSavePrompt(promptDraft)} disabled={promptDraft===prompt} className="btn-secondary text-xs py-1.5 px-3">Save prompt</button>
          <button onClick={()=>setPromptDraft(ENG_MYSENT_DEFAULT_PROMPT)} className="btn-secondary text-xs py-1.5 px-3">↺ Reset</button>
        </div>
      </div>
      <button onClick={start} className="btn-primary w-full py-3.5">▶ Start</button>
    </div>
  );

  if(phase==='finish'){
    return(
      <div className="text-center py-8 max-w-lg mx-auto pb-12">
        <div className="font-display text-6xl mb-1">✓</div>
        <h2 className="font-display text-2xl mb-2">Custom sentences complete</h2>
        <p className="text-[var(--text-muted)] mb-8">Written and reviewed: {stats.done}</p>
        <button onClick={()=>setPhase('setup')} className="btn-primary px-8 py-3">↻ Repeat</button>
      </div>
    );
  }

  const w=queue[cur];const total=queue.length;const pct=Math.round(cur/total*100);
  return(
    <div className="max-w-2xl mx-auto space-y-4 pb-8">
      <div className="h-1.5 bg-[var(--surface)] rounded-full overflow-hidden"><div className="h-full bg-[var(--text)] transition-all" style={{width:pct+'%'}}/></div>
      <div className="flex gap-2 text-xs flex-wrap">
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-lg px-2.5 py-1">card <b>{cur+1}/{total}</b></div>
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-green-500">done <b>{stats.done}</b></div>
      </div>
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-8 text-center">
        <div className="text-xs text-[var(--text-subtle)] uppercase tracking-widest mb-3">write your own sentence with</div>
        <div className="font-display text-4xl sm:text-5xl font-bold mb-2">{w.en}</div>
        {w.syn&&<div className="text-xs text-[var(--text-subtle)] mt-1">syn: {w.syn}</div>}
      </div>

      <div>
        <label>Your sentence</label>
        <textarea ref={taRef} value={sentence} onChange={e=>setSentence(e.target.value)} rows={3} placeholder="Write a sentence using this word..." className="w-full" disabled={!!feedback}/>
      </div>

      {!feedback?(
        <div className="flex gap-2">
          <button onClick={check} disabled={!sentence.trim()} className="btn-primary px-5">Check</button>
          <button onClick={next} className="btn-secondary px-4">Skip →</button>
        </div>
      ):(
        <>
          <div className="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-4">
            {feedback.loading
              ? <div className="text-sm text-[var(--text-muted)]">⏳ AI is reviewing your sentence...</div>
              : <div className="text-sm text-[var(--text-muted)] whitespace-pre-wrap">{feedback.text}</div>}
          </div>
          <div className="bg-amber-500/10 border border-amber-400/30 rounded-xl p-4 space-y-3">
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <div className="text-sm">🔊 <b>Say the word out loud:</b> "{w.en}"</div>
              <button onClick={playWord} className="btn-secondary text-xs py-1.5 px-3">▶ Play pronunciation</button>
            </div>
            <label className="flex items-center gap-2 text-sm cursor-pointer">
              <input type="checkbox" checked={said} onChange={e=>setSaid(e.target.checked)} className="w-4 h-4"/>
              I said the word out loud
            </label>
          </div>
          <button onClick={next} disabled={!said} className="btn-primary w-full py-3">Next word →</button>
        </>
      )}
    </div>
  );
}

const ENG_CIPHER_DEFAULT_PROMPT = `You are a friendly English teacher. The student was shown this Russian sentence:

"{ruSentence}"

They were asked to translate it into English using the word "{word}" (translation: "{translation}"). Their translation:

"{answer}"

Reply in English, briefly (3-5 sentences):
1. How accurate and natural is the translation of the sentence overall?
2. Is the word "{word}" used correctly (meaning + grammar)? If there are mistakes, point them out and give a corrected version.
3. If everything is good, say so and, if useful, suggest a more natural or advanced alternative.
Be warm and to the point, no markdown, no headings.`;

// AI writes a Russian sentence using the translation of a dictionary word.
// The target English word is shown blurred (click to reveal) instead of in
// plain text, so the student has to recall it rather than just read it.
// The student translates the Russian sentence into English using that word,
// then AI reviews the translation. All sentences for the session are
// generated up front, in parallel chunks (same pattern as engPrefetchSentences),
// so there's no AI wait between cards during study.
function CipherTab({rawData,ai,prompt,onSavePrompt}){
  const [filter,setFilter]=useState('all');
  const [order,setOrder]=useState('random');
  const [dateRange,setDateRange]=useState('all');
  const [count,setCount]=useState(10);
  const [promptDraft,setPromptDraft]=useState(prompt);
  useEffect(()=>{setPromptDraft(prompt);},[prompt]);
  const [phase,setPhase]=useState('setup'); // setup|loading|study|finish
  const [queue,setQueue]=useState([]);
  const [cur,setCur]=useState(0);
  const [stats,setStats]=useState({done:0});
  const [revealed,setRevealed]=useState(false);
  const [answer,setAnswer]=useState('');
  const [feedback,setFeedback]=useState(null); // {loading,text}
  const taRef=useRef(null);
  useEffect(()=>{if(phase==='study'&&taRef.current)taRef.current.focus();},[cur,phase]);

  const genChunk=async(chunk)=>{
    const wordList=chunk.map(w=>`- "${w.ru}" (перевод английского слова "${w.en}")`).join('\n');
    const p=`Ты — репетитор русского языка, который готовит упражнения для русскоязычного ученика, изучающего английский.
Для каждого русского слова ниже напиши ОДНО естественное русское предложение (8-14 слов), в котором это слово (или его естественная форма) встречается ровно один раз, в понятном бытовом контексте.

Правила:
- Пиши предложение только на русском
- Заданное слово (или его естественная грамматическая форма) должно встретиться ровно один раз
- Пиши просто и естественно, без пояснений
- Верни ТОЛЬКО валидный JSON-массив, без markdown и обратных кавычек

Слова:
${wordList}

Формат ответа (строго JSON-массив):
[{"ru":"слово1","sentence":"Предложение на русском с этим словом."}]`;
    const raw=await engCallAI(ai,p);
    const m=raw.match(/\[[\s\S]*\]/);
    if(!m) throw new Error('AI returned an invalid format');
    const items=JSON.parse(m[0]);
    if(!Array.isArray(items)||!items.length) throw new Error('Empty response from AI');
    return chunk.map((w,idx)=>{
      const item=items.find(it=>String(it.ru||'').trim().toLowerCase()===w.ru.trim().toLowerCase())||items[idx]||items[0];
      return {...w, ruSentence:(item&&item.sentence)||''};
    });
  };

  const start=async()=>{
    if(!rawData){alert('Load data first');return;}
    if(!engAIConfigured(ai)){alert('Configure AI first — this mode needs it to generate sentences.');return;}
    let pool=rawData.slice();
    if(filter==='hard') pool=pool.filter(w=>w.hard);
    else if(filter==='not-hard') pool=pool.filter(w=>!w.hard);
    else if(filter==='not-shown') pool=pool.filter(w=>!w.showNew);
    if(dateRange!=='all'){
      const days=parseInt(dateRange);
      const times=rawData.map(w=>engParseDate(w.date)).filter(Boolean).map(d=>d.getTime());
      const ref=times.length?Math.max(...times):Date.now();
      pool=pool.filter(w=>{const d=engParseDate(w.date);return d&&d.getTime()>=ref-(days-1)*86400000;});
    }
    if(!pool.length){alert('No words match this filter');return;}
    if(order==='random') pool.sort(()=>Math.random()-.5);
    else if(order==='newest') pool.sort((a,b)=>(engParseDate(b.date)?.getTime()||0)-(engParseDate(a.date)?.getTime()||0));
    else if(order==='oldest') pool.sort((a,b)=>(engParseDate(a.date)?.getTime()||0)-(engParseDate(b.date)?.getTime()||0));

    const n=count>0?Math.min(count,pool.length):pool.length;
    const batch=pool.slice(0,n);
    if(batch.length>50&&!confirm(`Will generate ${batch.length} sentences. This may take a while and use many tokens. Continue?`)) return;

    setPhase('loading');
    const CHUNK=15;
    const chunks=[];
    for(let i=0;i<batch.length;i+=CHUNK) chunks.push(batch.slice(i,i+CHUNK));
    try{
      const results=await Promise.all(chunks.map(genChunk));
      setQueue(results.flat());setCur(0);setStats({done:0});setRevealed(false);setAnswer('');setFeedback(null);
      setPhase('study');
    }catch(e){
      alert('AI error: '+e.message);
      setPhase('setup');
    }
  };

  const check=async()=>{
    const val=answer.trim();
    if(!val) return;
    const w=queue[cur];
    setFeedback({loading:true,text:''});
    try{
      const p=(prompt||ENG_CIPHER_DEFAULT_PROMPT)
        .replaceAll('{word}',w.en).replaceAll('{translation}',w.ru)
        .replaceAll('{ruSentence}',w.ruSentence||'').replaceAll('{answer}',val);
      const c=await engCallAI(ai,p);
      setFeedback({loading:false,text:c});
    }catch(e){
      setFeedback({loading:false,text:'(AI unavailable: '+e.message+')'});
    }
    setStats(s=>({...s,done:s.done+1}));
    setRevealed(true);
  };

  const next=()=>{
    setAnswer('');setFeedback(null);setRevealed(false);
    if(cur+1>=queue.length){setPhase('finish');return;}
    setCur(c=>c+1);
  };

  if(!rawData) return <div className="text-center py-20 text-[var(--text-subtle)]"><p>Load data from Google Sheets</p></div>;

  if(phase==='setup') return(
    <div className="max-w-lg mx-auto space-y-5 pb-8">
      <div><label>Word filter</label>
        <select value={filter} onChange={e=>setFilter(e.target.value)}>
          <option value="all">All words</option>
          <option value="not-shown">New words only (not shown yet)</option>
          <option value="hard">Hard words only</option>
          <option value="not-hard">Non-hard words only</option>
        </select>
      </div>
      <div><label>Word count (0 = all)</label><input type="number" min="0" max="500" value={count||''} onChange={e=>setCount(parseInt(e.target.value)||0)}/></div>
      <div><label>Order</label><select value={order} onChange={e=>setOrder(e.target.value)}><option value="random">Random</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div>
      <div><label>Date range</label><select value={dateRange} onChange={e=>setDateRange(e.target.value)}><option value="all">All time</option><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option></select></div>
      <div>
        <label>AI review prompt</label>
        <textarea value={promptDraft} onChange={e=>setPromptDraft(e.target.value)} rows={9} style={{resize:'vertical',fontFamily:'inherit'}} className="w-full text-sm"/>
        <p className="text-xs text-[var(--text-subtle)] mt-1">Placeholders: <code>{'{word}'}</code>, <code>{'{translation}'}</code>, <code>{'{ruSentence}'}</code>, <code>{'{answer}'}</code></p>
        <div className="flex gap-2 mt-2">
          <button onClick={()=>onSavePrompt(promptDraft)} disabled={promptDraft===prompt} className="btn-secondary text-xs py-1.5 px-3">Save prompt</button>
          <button onClick={()=>setPromptDraft(ENG_CIPHER_DEFAULT_PROMPT)} className="btn-secondary text-xs py-1.5 px-3">↺ Reset</button>
        </div>
      </div>
      <button onClick={start} className="btn-primary w-full py-3.5">▶ Start</button>
    </div>
  );

  if(phase==='loading') return(
    <div className="text-center py-20 text-[var(--text-subtle)]">
      <p>⏳ AI is generating Russian sentences...</p>
      <p className="text-xs mt-2">Generating everything up front, so there's no waiting between cards</p>
    </div>
  );

  if(phase==='finish'){
    return(
      <div className="text-center py-8 max-w-lg mx-auto pb-12">
        <div className="font-display text-6xl mb-1">✓</div>
        <h2 className="font-display text-2xl mb-2">Cipher sentences complete</h2>
        <p className="text-[var(--text-muted)] mb-8">Translated and reviewed: {stats.done}</p>
        <button onClick={()=>setPhase('setup')} className="btn-primary px-8 py-3">↻ Repeat</button>
      </div>
    );
  }

  const w=queue[cur];const total=queue.length;const pct=Math.round(cur/total*100);
  return(
    <div className="max-w-2xl mx-auto space-y-4 pb-8">
      <div className="h-1.5 bg-[var(--surface)] rounded-full overflow-hidden"><div className="h-full bg-[var(--text)] transition-all" style={{width:pct+'%'}}/></div>
      <div className="flex gap-2 text-xs flex-wrap">
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-lg px-2.5 py-1">card <b>{cur+1}/{total}</b></div>
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-lg px-2.5 py-1 text-green-500">done <b>{stats.done}</b></div>
      </div>

      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-8 text-center">
        <div className="text-xs text-[var(--text-subtle)] uppercase tracking-widest mb-4">translate to english</div>
        <div className="font-display text-xl sm:text-2xl font-bold mb-5">{w.ruSentence || '(no sentence generated)'}</div>
        <div>
          <span
            className={`italic select-none transition-all ${revealed?'':'blur-sm cursor-pointer'}`}
            onClick={()=>setRevealed(true)}
            title={revealed?'':'Click to reveal'}
          >{w.en}</span>
        </div>
      </div>

      <div>
        <label>Your translation</label>
        <textarea ref={taRef} value={answer} onChange={e=>setAnswer(e.target.value)} rows={3} placeholder="Translate the sentence into English, using the blurred word..." className="w-full" disabled={!!feedback}/>
      </div>

      {!feedback?(
        <div className="flex gap-2">
          <button onClick={check} disabled={!answer.trim()} className="btn-primary px-5">Проверить</button>
          <button onClick={next} className="btn-secondary px-4">Skip →</button>
        </div>
      ):(
        <>
          <div className="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-4">
            {feedback.loading
              ? <div className="text-sm text-[var(--text-muted)]">⏳ AI проверяет твой перевод...</div>
              : <div className="text-sm text-[var(--text-muted)] whitespace-pre-wrap">{feedback.text}</div>}
          </div>
          <button onClick={next} className="btn-primary w-full py-3">Next word →</button>
        </>
      )}
    </div>
  );
}

// Legacy-чтение настроек English из localStorage (так они хранились раньше —
// на каждом устройстве отдельно, и Safari стирал их через ~7 дней простоя).
const engLegacyCfg = () => ({
  apiKey: localStorage.getItem('eng_api_key') || '',
  clientId: localStorage.getItem('eng_client_id') || '',
  sheetId: localStorage.getItem('eng_sheet_id') || '13njpnDojuZKWO5xOXm7WBPcnTIhkm0-Wt60SdjqDUns',
  sheetName: localStorage.getItem('eng_sheet_name') || 'words b3 anki',
});
const engLegacyAI = () => ({
  provider: localStorage.getItem('ai_provider') || 'anthropic',
  anthropicKey: localStorage.getItem('ai_anthropic_key') || '',
  anthropicModel: localStorage.getItem('ai_anthropic_model') || 'claude-sonnet-4-6',
  openaiKey: localStorage.getItem('ai_openai_key') || '',
  openaiModel: localStorage.getItem('ai_openai_model') || 'gpt-4o-mini',
  ollamaUrl: localStorage.getItem('ai_ollama_url') || 'http://localhost:11434',
  ollamaModel: localStorage.getItem('ai_ollama_model') || 'llama3',
});

function EnglishView({ data, setData }){
  // Источник правды — синхронизируемая БД (data.engConfig / data.engAI), как
  // у всех остальных настроек: переживает чистку localStorage и доступна со
  // всех устройств. localStorage остаётся только как источник миграции.
  const cfg = data.engConfig || engLegacyCfg();
  const ai = data.engAI || engLegacyAI();
  const studyPlan = data.engStudyPlan || { text: '', updatedAt: 0 };
  const mySentPrompt = typeof data.engMySentPrompt === 'string' ? data.engMySentPrompt : ENG_MYSENT_DEFAULT_PROMPT;
  const cipherPrompt = typeof data.engCipherPrompt === 'string' ? data.engCipherPrompt : ENG_CIPHER_DEFAULT_PROMPT;
  const [rawData,setRawData]=useState(()=>{try{return JSON.parse(localStorage.getItem('eng_raw_data')||'null');}catch{return null;}});
  const [loading,setLoading]=useState(false);
  const initStatus=()=>{try{const d=localStorage.getItem('eng_raw_data');return d?{type:'ok',text:`${JSON.parse(d).length} words`}:{type:'',text:'Load from Google Sheets'};}catch{return{type:'',text:'Load from Google Sheets'};}};
  const [status,setStatus]=useState(initStatus);
  const [engTab,setEngTab]=useState('cards');
  const [showCfg,setShowCfg]=useState(false);
  const [showAI,setShowAI]=useState(false);
  const [showPlan,setShowPlan]=useState(false);

  const saveCfg=(c)=>setData(d=>({...d, engConfig:{...c, updatedAt: Date.now()}}));
  const saveAI=(a)=>setData(d=>({...d, engAI:{...a, updatedAt: Date.now()}}));
  const saveStudyPlan=(p)=>setData(d=>({...d, engStudyPlan:{ text: p.text || '', updatedAt: p.updatedAt || Date.now() }}));
  const saveMySentPrompt=(p)=>setData(d=>({...d, engMySentPrompt: p}));
  const saveCipherPrompt=(p)=>setData(d=>({...d, engCipherPrompt: p}));

  // One-time migration: keys entered before this fix only live in this
  // browser's localStorage — move them into the DB so they stop getting lost.
  useEffect(()=>{
    if(!data.engConfig){
      const legacy = engLegacyCfg();
      if(legacy.apiKey || legacy.clientId) saveCfg(legacy);
    }
    if(!data.engAI){
      const legacy = engLegacyAI();
      if(legacy.anthropicKey || legacy.openaiKey) saveAI(legacy);
    }
  },[]);

  const loadSheets=async()=>{
    if(!cfg.apiKey){setShowCfg(true);return;}
    setLoading(true);setStatus({type:'loading',text:'Loading...'});
    try{
      const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${cfg.sheetId}/values/${encodeURIComponent(cfg.sheetName)}?key=${cfg.apiKey}&dateTimeRenderOption=FORMATTED_STRING&valueRenderOption=UNFORMATTED_VALUE`);
      if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||'HTTP '+r.status);}
      const data=await r.json();
      if((data.values||[]).length<2) throw new Error('No data in the sheet');
      const parsed=engParseRows(data.values);
      localStorage.setItem('eng_raw_data',JSON.stringify(parsed));localStorage.setItem('eng_raw_at',new Date().toISOString());
      setRawData(parsed);setStatus({type:'ok',text:`Loaded ${parsed.length} words`});
    }catch(e){setStatus({type:'err',text:'Error: '+e.message});}

function buildVoiceSystemPrompt(appData) {
  const DAY_NAMES = ['вс','пн','вт','ср','чт','пт','сб'];
  const PERIOD_NAMES = { morning: 'утро', evening: 'вечер', allday: 'весь день' };
  const FREQ_LABELS = { daily:'каждый день', every2:'каждые 2 дня', every3:'каждые 3 дня', weekly:'раз в неделю', biweekly:'раз в 2 нед', monthly:'раз в месяц', custom:'своя' };

  const today = new Date();
  const todayStr = dateToLocalStr(today);
  const todayDayName = DAY_NAMES[today.getDay()];

  const chores = (appData.chores || []).filter(c => !c.archived);
  const bossTasks = (appData.bossTasks || []).filter(t => !t.archived);

  const choreLines = chores.length
    ? chores.map(c => {
        const next = getChoreNextDate(c);
        const nextStr = isChoreDueToday(c) ? 'СЕГОДНЯ' : dateToLocalStr(next);
        const freq = FREQ_LABELS[c.frequency] || c.frequency;
        const custom = c.frequency === 'custom' ? ` (${c.customDays} дн)` : '';
        return `  • ${c.name} | ${freq}${custom} | последний раз: ${c.lastDone || 'никогда'} | следующий: ${nextStr}`;
      }).join('\n')
    : '  (пусто)';

  const bossLines = bossTasks.length
    ? bossTasks.map(t => {
        const days = (t.days || []).map(d => DAY_NAMES[d]).join(',');
        return `  • ${t.name} | ${PERIOD_NAMES[t.period] || t.period} | дни: ${days}`;
      }).join('\n')
    : '  (пусто)';

  return `Ты голосовой помощник приложения Jarvis. Отвечай кратко, по-русски.

СЕГОДНЯ: ${todayStr} (${todayDayName})

РАЗДЕЛ "ПО ДОМУ" — регулярные домашние дела:
${choreLines}

РАЗДЕЛ "БОСС" — задачи по расписанию:
${bossLines}

ТЫ УМЕЕШЬ:
1. Ответить на любой вопрос о делах пользователя (что сегодня, что просрочено, когда последний раз, что на этой неделе и т.д.)
2. Добавить новое дело в один из разделов

ФОРМАТ ОТВЕТА — только JSON, без markdown, без пояснений:

Ответить на вопрос:
{"action":"answer","text":"краткий разговорный ответ на русском"}

Добавить в "По дому":
{"action":"add","section":"chores","name":"...","frequency":"daily|every2|every3|weekly|biweekly|monthly|custom","customDays":null}

Добавить в "Босс":
{"action":"add","section":"boss","name":"...","period":"morning|evening|allday","days":[1,2,3,4,5]}

Уточнить (если непонятно):
{"action":"clarify","question":"короткий вопрос"}`;
}

async function callAI(messages, settings, appData) {
  const systemPrompt = buildVoiceSystemPrompt(appData || {});
  const provider = settings.voiceProvider || 'claude';
  const key = (settings.voiceApiKey || '').trim();
  if (!key) throw new Error('no_key');

  const model = (settings.voiceModel || '').trim() ||
    (provider === 'claude' ? 'claude-sonnet-4-6' : 'gpt-4o');

  if (provider === 'claude') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model,
        max_tokens: 400,
        system: systemPrompt,
        messages,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `Claude API ${res.status}`);
    }
    const resp = await res.json();
    const text = resp.content?.[0]?.text || '';
    return JSON.parse(text);
  } else {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`,
      },
      body: JSON.stringify({
        model,
        max_tokens: 400,
        messages: [{ role: 'system', content: systemPrompt }, ...messages],
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `OpenAI API ${res.status}`);
    }
    const resp = await res.json();
    const text = resp.choices?.[0]?.message?.content || '';
    return JSON.parse(text);
  }
}

function applyVoiceTask(parsed, setData) {
  if (parsed.section === 'chores') {
    setData(d => ({
      ...d,
      chores: [...(d.chores || []), {
        id: crypto.randomUUID(),
        name: parsed.name,
        frequency: parsed.frequency || 'weekly',
        customDays: parsed.customDays || null,
        notify: false,
        notifyTime: '09:00',
        archived: false,
        updatedAt: Date.now(),
      }],
    }));
  } else if (parsed.section === 'boss') {
    setData(d => ({
      ...d,
      bossTasks: [...(d.bossTasks || []), {
        id: crypto.randomUUID(),
        name: parsed.name,
        period: parsed.period || 'morning',
        days: parsed.days || [1, 2, 3, 4, 5],
        archived: false,
        updatedAt: Date.now(),
      }],
    }));
  }
}

let _currentAudio = null;

function speak(text, settings) {
  // Stop any currently playing audio
  if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
  window.speechSynthesis?.cancel();

  const key = (settings?.voiceApiKey || '').trim();
  if (key) {
    // OpenAI TTS — returns promise that resolves when audio finishes
    const voice = settings?.voiceTtsVoice || 'nova';
    return fetch('https://api.openai.com/v1/audio/speech', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`,
      },
      body: JSON.stringify({ model: 'tts-1', voice, input: text }),
    }).then(res => {
      if (!res.ok) throw new Error('tts_fail');
      return res.blob();
    }).then(blob => {
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      _currentAudio = audio;
      return new Promise(resolve => {
        audio.onended = () => { URL.revokeObjectURL(url); _currentAudio = null; resolve(); };
        audio.onerror = () => { URL.revokeObjectURL(url); _currentAudio = null; resolve(); };
        audio.play().catch(resolve);
      });
    }).catch(() => Promise.resolve());
  }

  // Fallback: browser SpeechSynthesis — returns promise that resolves when done
  if (!window.speechSynthesis) return Promise.resolve();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = 1.05;
  const voices = window.speechSynthesis.getVoices();
  const ruVoice = voices.find(v => v.lang.startsWith('ru'));
  if (ruVoice) u.voice = ruVoice;
  return new Promise(resolve => {
    u.onend = resolve;
    u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}

function VoiceButton({ data, setData, settings }) {
  const [phase, setPhase] = useState('idle'); // idle|recording|processing|clarifying|success|answered|error
  const [transcript, setTranscript] = useState('');
  const [clarifyQuestion, setClarifyQuestion] = useState('');
  const [messages, setMessages] = useState([]);
  const [lastAdded, setLastAdded] = useState('');
  const [answerText, setAnswerText] = useState('');
  const [errorMsg, setErrorMsg] = useState('');
  const recogRef = React.useRef(null);
  const transcriptRef = React.useRef(''); // kept in sync for onend closure

  const processTranscript = async (text, existingMessages) => {
    if (!text) {
      setPhase(existingMessages.length > 0 ? 'clarifying' : 'idle');
      return;
    }
    const newMessages = [...existingMessages, { role: 'user', content: text }];
    setMessages(newMessages);
    setPhase('processing');
    try {
      const parsed = await callAI(newMessages, settings, data);
      if (parsed.action === 'add') {
        applyVoiceTask(parsed, setData);
        const name = parsed.name || 'задача';
        setLastAdded(name);
        speak(`Добавлено: ${name}`, settings);
        setPhase('success');
        setTimeout(() => { setPhase('idle'); setMessages([]); }, 2500);
      } else if (parsed.action === 'answer') {
        const answerStr = parsed.text || 'Готово';
        setAnswerText(answerStr);
        setPhase('answered');
        await speak(answerStr, settings);
        setPhase('idle');
        setMessages([]);
      } else if (parsed.action === 'clarify') {
        const q = parsed.question || 'Уточните запрос';
        const updatedMessages = [...newMessages, { role: 'assistant', content: q }];
        setClarifyQuestion(q);
        setMessages(updatedMessages);
        setPhase('clarifying');
        await speak(q, settings);
        startRecording(updatedMessages);
      } else {
        setErrorMsg('Непонятный ответ ИИ. Попробуйте ещё раз.');
        setPhase('error');
        setTimeout(() => setPhase('idle'), 3000);
      }
    } catch (e) {
      const msg = e.message === 'no_key'
        ? 'Настройте API-ключ в Настройках → Ассистент'
        : `Ошибка: ${e.message}`;
      setErrorMsg(msg);
      setPhase('error');
      setTimeout(() => setPhase('idle'), 4000);
    }
  };

  const startRecording = (existingMessages) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setErrorMsg('Браузер не поддерживает распознавание речи');
      setPhase('error');
      setTimeout(() => setPhase('idle'), 3000);
      return;
    }
    const r = new SR();
    r.lang = 'ru-RU';
    r.interimResults = true;
    r.maxAlternatives = 1;
    // continuous=false (default): auto-stops after a natural speech pause
    transcriptRef.current = '';
    recogRef.current = r;

    r.onresult = (e) => {
      let t = '';
      for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      transcriptRef.current = t;
      setTranscript(t);
    };

    r.onerror = (e) => {
      recogRef.current = null;
      if (e.error === 'no-speech') { setPhase('idle'); return; }
      setErrorMsg(`Ошибка записи: ${e.error}`);
      setPhase('error');
      setTimeout(() => setPhase('idle'), 3000);
    };

    // Auto-triggered when user stops speaking (or manually via r.stop())
    r.onend = () => {
      recogRef.current = null;
      processTranscript(transcriptRef.current.trim(), existingMessages);
    };

    r.start();
    setPhase('recording');
    setTranscript('');
  };

  const handleMainButton = () => {
    if (phase === 'idle') {
      const key = (settings?.voiceApiKey || '').trim();
      if (!key) {
        setErrorMsg('Настройте API-ключ в Настройках → Ассистент');
        setPhase('error');
        setTimeout(() => setPhase('idle'), 4000);
        return;
      }
      setMessages([]);
      startRecording([]);
    } else if (phase === 'recording') {
      // Manual early stop — triggers onend which calls processTranscript
      if (recogRef.current) recogRef.current.stop();
    } else if (phase === 'clarifying') {
      startRecording(messages);
    }
    // processing/success/error: do nothing
  };

  const cancel = () => {
    window.speechSynthesis?.cancel();
    if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
    if (recogRef.current) { recogRef.current.onend = null; recogRef.current.stop(); recogRef.current = null; }
    setPhase('idle');
    setMessages([]);
    setTranscript('');
  };

  const showPanel = phase !== 'idle';

  const btnBg = {
    idle: 'bg-[var(--text)] text-white',
    recording: 'bg-red-500 text-white',
    processing: 'bg-[var(--text)] text-white',
    clarifying: 'bg-blue-500 text-white',
    answered: 'bg-blue-500 text-white',
    success: 'bg-green-500 text-white',
    error: 'bg-red-500 text-white',
  }[phase] || 'bg-[var(--text)] text-white';

  return (
    <div className="fixed bottom-24 right-4 z-30 flex flex-col items-end gap-2 md:bottom-8">
      {/* Mini panel */}
      {showPanel && (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl shadow-lg p-4 max-w-[260px] w-[260px] fade-in">
          {phase === 'recording' && (
            <div>
              <div className="text-xs text-red-500 font-medium mb-1 flex items-center gap-1">
                <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse inline-block"></span>
                Слушаю...
              </div>
              <div className="text-sm text-[var(--text)] min-h-[40px] leading-snug">
                {transcript || <span className="text-[var(--text-subtle)]">Говорите...</span>}
              </div>
              <div className="text-xs text-[var(--text-subtle)] mt-2">Остановится автоматически после паузы</div>
            </div>
          )}
          {phase === 'processing' && (
            <div className="flex items-center gap-2">
              <div className="w-4 h-4 border-2 border-[var(--text)] border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
              <span className="text-sm text-[var(--text-muted)]">Обрабатываю...</span>
            </div>
          )}
          {phase === 'clarifying' && (
            <div>
              <div className="text-xs text-blue-500 font-medium mb-1">Уточнение</div>
              <div className="text-sm text-[var(--text)] mb-3">{clarifyQuestion}</div>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => startRecording(messages)}
                  className="flex-1 flex items-center justify-center gap-1.5 bg-blue-500 text-white rounded-xl py-2 text-sm font-medium"
                >
                  <Icon name="mic" size={16} />
                  Ответить
                </button>
                <button onClick={cancel} className="p-2 rounded-xl hover:bg-black/5 text-[var(--text-muted)]">
                  <Icon name="x" size={18} />
                </button>
              </div>
            </div>
          )}
          {phase === 'success' && (
            <div className="flex items-center gap-2">
              <span className="text-green-500"><Icon name="check" size={18} /></span>
              <span className="text-sm text-[var(--text)]">Добавлено: <b>{lastAdded}</b></span>
            </div>
          )}
          {phase === 'answered' && (
            <div>
              <div className="text-xs text-blue-500 font-medium mb-1 flex items-center gap-1">
                <span className="w-2 h-2 rounded-full bg-blue-500 animate-pulse inline-block"></span>
                Ответ
              </div>
              <div className="text-sm text-[var(--text)] leading-snug">{answerText}</div>
            </div>
          )}
          {phase === 'error' && (
            <div>
              <div className="text-xs text-red-500 font-medium mb-1">Ошибка</div>
              <div className="text-sm text-[var(--text-muted)]">{errorMsg}</div>
            </div>
          )}
        </div>
      )}

      {/* Main button */}
      <button
        onClick={handleMainButton}
        disabled={phase === 'processing' || phase === 'success'}
        className={`w-14 h-14 rounded-full shadow-lg flex items-center justify-center transition-all ${btnBg} ${phase === 'recording' ? 'voice-pulse' : ''} ${phase === 'processing' ? 'opacity-70' : ''}`}
        title="Голосовой ассистент"
      >
        {phase === 'processing' ? (
          <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        ) : phase === 'success' ? (
          <Icon name="check" size={24} />
        ) : (
          <Icon name="mic" size={24} />
        )}
      </button>
    </div>
  );
}

function formatBodyDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const days = ['вс','пн','вт','ср','чт','пт','сб'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} (${days[d.getDay()]})`;
}

async function compressImage(file, maxPx = 1200, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxPx || height > maxPx) {
        if (width > height) { height = Math.round(height * maxPx / width); width = maxPx; }
        else { width = Math.round(width * maxPx / height); height = maxPx; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('compress failed')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load failed')); };
    img.src = url;
  });
}

async function uploadPhoto(file) {
  let blob, ext, ctype;
  try {
    blob = await compressImage(file);
    ext = 'jpg';
    ctype = 'image/jpeg';
  } catch {
    // Compression failed — send the ORIGINAL bytes with their real type, not
    // mislabelled as jpeg (a PNG/HEIC stored as .jpg is technically corrupt).
    blob = file;
    const nameExt = (file.name.split('.').pop() || '').toLowerCase();
    ext = ['jpg', 'jpeg', 'png', 'webp', 'heic', 'gif'].includes(nameExt) ? nameExt : 'jpg';
    ctype = file.type || 'application/octet-stream';
  }
  const res = await fetch(`/api/photos?ext=${ext}`, {
    method: 'POST',
    headers: { 'Content-Type': ctype },
    body: blob,
  });
  if (!res.ok) throw new Error('upload failed');
  return (await res.json()).filename;
}

async function deletePhoto(filename) {

}

  const activeMode = (data.bodyModes || []).find(m => m.id === data.activeBodyModeId) || null;

  const saveEntry = (entry) => {
    entry = { ...entry, updatedAt: Date.now() };
    setData(d => {
      const list = d.bodyEntries || [];
      if (entry.id && list.find(e => e.id === entry.id)) {
        return { ...d, bodyEntries: list.map(e => e.id === entry.id ? entry : e) };
      }
      return { ...d, bodyEntries: [...list, { ...entry, id: crypto.randomUUID() }] };
    });
    setEditEntry(null);
  };

  const deleteEntry = (id) => {
    const entry = entries.find(e => e.id === id);
    (entry?.photos || []).map(normalizePhoto).forEach(p => deletePhoto(p.filename));
    setData(d => ({
      ...d,
      bodyEntries: (d.bodyEntries || []).filter(e => e.id !== id),

  if (editEntry !== null) {
    return (
      <BodyEntryForm
        entry={editEntry === 'new' ? null : editEntry}
        fields={fields}
        categories={categories}
        onSave={saveEntry}
        onCancel={() => setEditEntry(null)}

    );
  }

  const tabs = [

function BodyModesView({ data, setData }) {
  const [editing, setEditing] = useState(null); // 'new' | mode | null
  const [viewing, setViewing] = useState(null);

  const modes = [...(data.bodyModes || [])].sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
  const activeId = data.activeBodyModeId || null;

  const setActiveMode = (id) => setData(d => ({ ...d, activeBodyModeId: id }));

  const save = (mode) => {
    mode = { ...mode, updatedAt: Date.now() };
    setData(d => {
      const list = d.bodyModes || [];
      const exists = list.find(m => m.id === mode.id);
      return { ...d, bodyModes: exists ? list.map(m => m.id === mode.id ? mode : m) : [...list, mode] };
    });
    if (viewing?.id === mode.id) setViewing(mode);
    setEditing(null);
  };

  const remove = (mode) => {
    if (!confirm('Удалить режим?')) return;
    if (mode.workoutFile?.filename) deleteFile(mode.workoutFile.filename);
    setData(d => ({
      ...d,
      bodyModes: (d.bodyModes || []).filter(m => m.id !== mode.id),
      activeBodyModeId: d.activeBodyModeId === mode.id ? null : d.activeBodyModeId,
      deletedIds: withDeletedId(d, 'bodyModes', mode.id),
    }));
  };

  if (editing) {
    return <BodyModeForm mode={editing === 'new' ? null : editing} onSave={save} onCancel={() => setEditing(null)} />;
  }

  const fmt = (s) => s ? new Date(s + 'T00:00:00').toLocaleDateString('ru-RU') : '—';
  const label = (m) => (m.name && m.name.trim()) ? m.name.trim() : `${fmt(m.startDate)} — ${fmt(m.endDate)}`;

  return (
    <div className="fade-in space-y-4">
      {modes.length > 0 && (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4">
          <div className="text-xs uppercase tracking-wide text-[var(--text-subtle)] font-medium mb-2">Текущий режим</div>
          <select
            value={activeId || ''}
            onChange={e => setActiveMode(e.target.value || null)}
            className="w-full bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-[var(--text)]"
          >
            <option value="">Не выбран</option>
            {modes.map(m => (
              <option key={m.id} value={m.id}>{label(m)}</option>
            ))}
          </select>
        </div>
      )}

      <button onClick={() => setEditing('new')} className="btn-primary flex items-center gap-2 text-sm">
        <Icon name="plus" size={16} /> Добавить режим
      </button>

      {modes.length === 0 ? (
        <EmptyState title="Нет режимов" text="Добавьте режим: период, БАДДы, КБЖУ и программу тренировок — всё в одном месте." />
      ) : (
        <div className="space-y-3">
          {modes.map(m => {
            const isActive = m.id === activeId;
            return (
            <div key={m.id} className={`bg-[var(--surface)] border rounded-2xl p-4 transition-colors ${isActive ? 'border-[var(--text)]' : 'border-[var(--border)]'}`}>
              <div className="flex items-start justify-between gap-3">
                <button onClick={() => setViewing(m)} className="text-left flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-medium">{label(m)}</span>
                    {isActive && (
                      <span className="text-[10px] uppercase tracking-wide font-semibold px-2 py-0.5 rounded-full bg-[var(--text)] text-white">Текущий</span>
                    )}
                  </div>
                  <div className="text-xs text-[var(--text-muted)] mt-1.5 flex flex-wrap gap-x-3 gap-y-1">
                    {m.name && m.name.trim() && <span>{fmt(m.startDate)} — {fmt(m.endDate)}</span>}
                    {m.supplements?.length > 0 && <span>💊 {m.supplements.length}</span>}
                    {m.nutrition?.calories && <span>🍽 {m.nutrition.calories} ккал</span>}
                    {m.workoutFile && <span>📄 программа</span>}
                  </div>
                </button>
                <div className="flex gap-1 shrink-0">
                  {!isActive && (
                    <button onClick={() => setActiveMode(m.id)} title="Сделать текущим" className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]">
                      <Icon name="check" size={16} />
                    </button>
                  )}
                  <button onClick={() => setEditing({ ...m, supplements: (m.supplements || []).map(s => ({ ...s })), nutrition: { ...(m.nutrition || {}) } })} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]"><Icon name="edit" size={16} /></button>
                  <button onClick={() => remove(m)} className="p-2 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500"><Icon name="trash" size={16} /></button>
                </div>
              </div>
            </div>
            );
          })}
        </div>
      )}

      {viewing && (
        <BodyModeView mode={viewing}
          onClose={() => setViewing(null)}
          onEdit={() => { setEditing(viewing); setViewing(null); }} />
      )}
    </div>
  );
}
