  .slide-down { animation: slideDown 0.3s ease both; overflow: hidden; }
  .input-display {
    font-family: 'Fraunces', serif;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
    padding: 4px 6px;
    text-align: center;
    background: transparent;
    border-color: var(--border);
  }

  /* Скрыть скроллбар */

  /* iOS safe area */
  .pb-safe { padding-bottom: max(8px, env(safe-area-inset-bottom)); }

  /* Инпуты */

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    color: var(--text);
    width: 100%;
    transition: border-color 0.15s ease;
    outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--text);

  label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: block;
    font-weight: 500;

  /* Кнопки */
  .btn-primary {
    background: var(--text);
    color: white;
    padding: 14px 20px;
    border-radius: 10px;
    font-weight: 500;
    transition: opacity 0.15s ease;
    border: none;
    cursor: pointer;

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    padding: 14px 20px;
    border-radius: 10px;

    inset: 0;
    border-radius: 9999px;
    background: #ef4444;

<script type="text/babel" data-presets="react">

// Which Telegram section each background reminder belongs to. Keep the ids in
// sync with jarvis.py's NOTIFICATION_CATEGORIES — they gate who receives each
// broadcast (data.settings.notifyRouting[chatId] = [subset of these ids]).
const NOTIFICATION_CATEGORIES = [
  { id: 'chores',    label: 'По дому' },
  { id: 'boss',      label: 'Босс' },

];

// ── MSK time helpers ─────────────────────────────────────────────────────
// All Telegram reminder times (chores, boss tasks, holidays, debts, diet,
// checklist) are compared against the SERVER's Moscow-time clock. If the
// user's device is not in the Moscow timezone, a time entered "as-is" would
// never match. MskTimeInput below shows/edits the value in the user's own
// local time while transparently storing/comparing it as MSK — so the
// notification fires at the moment the user actually intends, regardless of
// which timezone their device is in.
const MSK_OFFSET_MS = 3 * 60 * 60 * 1000; // MSK = UTC+3, no DST
const HHMM_RE = /^\d{2}:\d{2}$/;

function localTimeToMsk(hhmm) {
  if (!hhmm || !HHMM_RE.test(hhmm)) return hhmm;
  const [h, m] = hhmm.split(':').map(Number);
  const now = new Date();
  const localInstantMs = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0).getTime();
  const msk = new Date(localInstantMs + MSK_OFFSET_MS);
  return `${String(msk.getUTCHours()).padStart(2, '0')}:${String(msk.getUTCMinutes()).padStart(2, '0')}`;
}

function mskTimeToLocal(hhmm) {
  if (!hhmm || !HHMM_RE.test(hhmm)) return hhmm;
  const [h, m] = hhmm.split(':').map(Number);
  const now = new Date();
  const asUtcInstantMs = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), h, m, 0, 0);
  const local = new Date(asUtcInstantMs - MSK_OFFSET_MS);
  return `${String(local.getHours()).padStart(2, '0')}:${String(local.getMinutes()).padStart(2, '0')}`;
}

// Drop-in replacement for <input type="time">: displays/edits in the user's
// local time, stores/reports the MSK-equivalent value via onChange.
function MskTimeInput({ value, onChange, className, style, hint }) {
  const mskValue = value || '';
  return (
    <>
      <input
        type="time"
        value={mskTimeToLocal(mskValue)}
        onChange={e => onChange(localTimeToMsk(e.target.value))}
        className={className}
        style={style}
        title={mskValue ? `Хранится и сравнивается на сервере как ${mskValue} МСК` : undefined}
      />
      {hint && mskValue && (
        <div className="text-[11px] text-[var(--text-subtle)] mt-1">
          На сервере (МСК): <span className="font-mono">{mskValue}</span> — если время устройства/часовой пояс настроены неверно, здесь будет видно расхождение.
        </div>
      )}
    </>
  );
}

const DEFAULT_BODY_FIELDS = [

  { id: 'waist',        label: 'Талия',             unit: 'см'  },

const DEFAULT_BUDGET_USER_ID = 'default-budget-user';

const BUDGET_SLICE_KEYS = [

  'budgetStatementRows', 'budgetStatementFileName',
  'budgetCashflowAccounts', 'budgetCashflowOps', 'budgetCashflowSettings',
  'budgetMonthlyNotes',
];

const emptyBudgetSlice = () => ({
  budgetExpenses: [],
  budgetCategories: [],
  budgetRecurring: [],
  budgetPlanCategories: [],
  budgetPlanValues: {},
  budgetFactValues: {},
  budgetIncomeFactValues: {},
  budgetStatementMappings: {},
  budgetStatementAccount: '',
  budgetStatementRows: [],

  budgetRecurringCategories: [],
  savingsActual: {},
  savingsCorrections: [],
  savingsTransactions: [],
  budgetDebts: [],
  debtTransactions: [],
  budgetIncomeSources: [],
  budgetIncomeValues: {},
  budgetCategoryOrder: [],
  budgetSupplements: [],
  budgetSupplementAssignments: {},
  // ДДС: счета, операции расхода/дохода и настройки быстрого ввода
  // (их пишет и вкладка «ДДС», и мобильное приложение /pf/<token>).
  budgetCashflowAccounts: [],
  budgetCashflowOps: [],
  budgetCashflowSettings: {},
  // «Выводы по месяцу»: один элемент = один пункт, привязанный к месяцу.
  // Плоский список (а не объект по месяцам) — чтобы правки с телефона и с
  // компьютера сливались по id, а прошлые месяцы оставались в истории.
  budgetMonthlyNotes: [],
});

const extractBudgetSlice = (data) => {
  const slice = emptyBudgetSlice();
  BUDGET_SLICE_KEYS.forEach(k => {
    if (data && data[k] !== undefined) slice[k] = data[k];
  });
  return slice;
};

const budgetSliceHasData = (slice) => BUDGET_SLICE_KEYS.some(k => {
  const v = slice && slice[k];
  if (Array.isArray(v)) return v.length > 0;
  if (v && typeof v === 'object') return Object.keys(v).length > 0;
  return false;
});

// Migrates legacy flat budget keys into per-user buckets. Stable default id
// keeps independently-migrating devices from creating duplicate "Основной" users.
const normalizeBudgetUsers = (data) => {
  if (!data || typeof data !== 'object') return data;
  const d = { ...data };
  const legacySlice = extractBudgetSlice(d);
  const hasLegacy = budgetSliceHasData(legacySlice);

  if (Array.isArray(d.budgetUsers) && d.budgetUsers.length > 0) {
    const byUser = { ...(d.budgetByUser || {}) };
    d.budgetUsers.forEach(u => {
      if (u?.id && !byUser[u.id]) byUser[u.id] = emptyBudgetSlice();
    });
    if (hasLegacy) {
      const firstId = d.budgetUsers[0].id;
      if (!budgetSliceHasData(byUser[firstId] || {})) byUser[firstId] = legacySlice;
    }
    BUDGET_SLICE_KEYS.forEach(k => { delete d[k]; });
    let active = d.activeBudgetUserId;
    if (!active || !d.budgetUsers.some(u => u.id === active)) active = d.budgetUsers[0].id;
    return { ...d, budgetByUser: byUser, activeBudgetUserId: active };
  }

  BUDGET_SLICE_KEYS.forEach(k => { delete d[k]; });
  return {
    ...d,
    budgetUsers: [{ id: DEFAULT_BUDGET_USER_ID, name: 'Основной', createdAt: Date.now(), updatedAt: Date.now() }],
    activeBudgetUserId: DEFAULT_BUDGET_USER_ID,
    budgetByUser: { [DEFAULT_BUDGET_USER_ID]: legacySlice },
  };
};

const DEFAULT_DATA = () => ({

  plannerFriends: [],

  campingCategories: [],

// backward compat: photos were stored as strings, now as {filename, category}
const normalizePhoto = (p) => typeof p === 'string' ? { filename: p, category: '' } : p;

// backward compat: meal sections (завтрак/перекус/обед/ужин) were one freeform
// string with one dish per line ("Гречка 230г\nКофе"), now an array of
// {id, product, amount} items. Best-effort split of legacy lines into
// product + trailing amount ("230г", "1 шт", "1"); if no amount is found,
// the whole line becomes the product with an empty amount — no text is lost.
const parseMealLine = (line) => {
  const trimmed = (line || '').trim();
  if (!trimmed) return null;
  const m = trimmed.match(/^(.+?)\s+(\d+(?:[.,]\d+)?\s?[^\d\s]{0,15})\s*$/u);
  if (m) return { id: crypto.randomUUID(), product: m[1].trim(), amount: m[2].trim() };
  // leading-number form: "2 яйца", "1.5 л молоко"
  const lead = trimmed.match(/^(\d+(?:[.,]\d+)?)\s+(.+)$/u);
  if (lead) return { id: crypto.randomUUID(), product: lead[2].trim(), amount: lead[1].trim() };
  return { id: crypto.randomUUID(), product: trimmed, amount: '' };
};

const normalizeMealSection = (val) => {
  if (Array.isArray(val)) {
    return val.map(it => (it && typeof it === 'object')
      ? { id: it.id || crypto.randomUUID(), product: it.product || '', amount: it.amount || '' }
      : { id: crypto.randomUUID(), product: String(it ?? ''), amount: '' });
  }
  if (typeof val === 'string') {
    return val.split('\n').map(parseMealLine).filter(Boolean);
  }
  return [];
};

const normalizeMeal = (meal) => ({
  ...meal,
  breakfast: normalizeMealSection(meal.breakfast),
  snack: normalizeMealSection(meal.snack),
  lunch: normalizeMealSection(meal.lunch),
  dinner: normalizeMealSection(meal.dinner),
});

// ── Закупка (shopping list): aggregate product amounts across selected meal
// plans × quantity, for totalling a grocery run. ──────────────────────────
const MEAL_SECTION_KEYS = ['breakfast', 'snack', 'lunch', 'dinner'];

const UNIT_ALIASES = {
  'г': 'г', 'гр': 'г', 'грамм': 'г', 'граммов': 'г', 'грамма': 'г',
  'кг': 'кг', 'килограмм': 'кг', 'килограмма': 'кг', 'килограммов': 'кг',
  'мл': 'мл', 'миллилитр': 'мл', 'миллилитра': 'мл', 'миллилитров': 'мл',
  'л': 'л', 'литр': 'л', 'литра': 'л', 'литров': 'л',
  'шт': 'шт', 'штук': 'шт', 'штука': 'шт', 'штуки': 'шт',
  'ст.л': 'ст.л', 'ложка': 'ст.л', 'ложки': 'ст.л', 'ложек': 'ст.л',
  'ч.л': 'ч.л',
};
const normalizeUnit = (u) => {
  const raw = (u || '').trim().toLowerCase();
  const noDot = raw.replace(/\.+$/, '');
  return UNIT_ALIASES[raw] || UNIT_ALIASES[noDot] || raw;
};

// "230гр" -> {value:230, unit:'г'}; "2 шт" -> {value:2, unit:'шт'}; "1" -> {value:1, unit:''}
// Returns null if the amount doesn't start with a number (can't be summed numerically).
const parseMealAmount = (amountStr) => {
  const s = (amountStr || '').trim();
  const m = s.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if (!m) return null;
  const value = parseFloat(m[1].replace(',', '.'));
  if (isNaN(value)) return null;
  return { value, unit: normalizeUnit(m[2]) };
};

const formatAmountValue = (v) => {
  const rounded = Math.round(v * 100) / 100;
  return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace('.', ',');
};

// selections: [{ mealId, qty }] — qty = how many times that meal plan is needed.
// Returns { totals: [{product, unit, value}], uncounted: [{product, count}] },
// both sorted alphabetically by product (ru locale).
const aggregateShoppingList = (meals, selections) => {
  const totals = new Map();
  const uncounted = new Map();
  (selections || []).forEach(sel => {
    const qty = Number(sel.qty) || 0;
    if (qty <= 0) return;
    const meal = meals.find(m => m.id === sel.mealId);
    if (!meal) return;
    MEAL_SECTION_KEYS.forEach(key => {
      (meal[key] || []).forEach(item => {
        const product = (item.product || '').trim();
        if (!product) return;
        const parsed = parseMealAmount(item.amount);
        if (parsed) {
          const k = `${product.toLowerCase()}__${parsed.unit}`;
          const cur = totals.get(k);
          if (cur) cur.value += parsed.value * qty;
          else totals.set(k, { product, unit: parsed.unit, value: parsed.value * qty });
        } else {
          const k = product.toLowerCase();
          const cur = uncounted.get(k);
          if (cur) cur.count += qty;
          else uncounted.set(k, { product, count: qty });
        }
      });
    });
  });
  const byProduct = (a, b) => a.product.localeCompare(b.product, 'ru');
  return {
    totals: [...totals.values()].sort(byProduct),
    uncounted: [...uncounted.values()].sort(byProduct),
  };
};

const loadData = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return DEFAULT_DATA();
    const parsed = JSON.parse(raw);
    parsed.settings = { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) };
    return normalizeBudgetUsers(parsed);
  } catch {
    return DEFAULT_DATA();
  }
};

//  • dietLog / dailyChecklistLog on pull → server wins (Telegram bot)
//  • everything else on pull → local wins (user edits, bodyModes, reminders…)
//  • on push → local wins, bot date-logs merged in
const isPlainObject = (v) => v && typeof v === 'object' && !Array.isArray(v);
const DATE_LOG_KEYS = new Set(['dietLog', 'dailyChecklistLog']);

const preferLocalForKey = (key, mode) => mode === 'push' || !DATE_LOG_KEYS.has(key);

// Merge two per-collection "deleted id" tombstone maps ({ [id]: deletedAtMs }),
// keeping the newest timestamp for any id present on both sides. Tombstones
// older than TOMBSTONE_TTL_MS are pruned so the map can't grow forever.
const TOMBSTONE_TTL_MS = 90 * 24 * 60 * 60 * 1000;

const mergeDeletedIdsMaps = (localAll, serverAll) => {
  const cutoff = Date.now() - TOMBSTONE_TTL_MS;
  const merged = {};
  const collKeys = new Set([...Object.keys(localAll || {}), ...Object.keys(serverAll || {})]);
  collKeys.forEach(ck => {
    const l = (localAll || {})[ck] || {};
    const s = (serverAll || {})[ck] || {};
    const out = {};
    new Set([...Object.keys(l), ...Object.keys(s)]).forEach(id => {
      const ts = Math.max(l[id] || 0, s[id] || 0);
      if (ts >= cutoff) out[id] = ts;
    });
    merged[ck] = out;
  });
  return merged;
};

// Records that an item was explicitly deleted from a collection, so a later
// merge (pull/push) with a server snapshot that still has it can never
// resurrect it. Use alongside filtering the item out of the array itself.
const withDeletedId = (d, collectionKey, id) => {
  const all = { ...(d.deletedIds || {}) };
  all[collectionKey] = { ...(all[collectionKey] || {}), [String(id)]: Date.now() };
  return all;
};

// True if this array holds objects identifiable by `.id` (the normal case
// for entity lists). False for plain-value arrays (category name strings,
// id-order lists etc.) which have no per-item id to merge by.
const looksLikeIdArray = (arr) => (Array.isArray(arr) ? arr : []).some(e => e && typeof e === 'object' && e.id != null);

const mergeIdArrays = (localArr, serverArr, preferLocal, deletedForKey) => {
  const la = Array.isArray(localArr) ? localArr : [];
  const sa = Array.isArray(serverArr) ? serverArr : [];

  if (!looksLikeIdArray(la) && !looksLikeIdArray(sa)) {
    // Plain-value array — no id to merge by. Union unique values so neither
    // side's entries are ever silently wiped out by a merge (this used to
    // always collapse to [] since nothing in a string array has `.id`),
    // while still respecting explicit deletions recorded by value.
    // Key objects with sorted keys — matches Python's json.dumps(sort_keys=True)
    // so value-tombstones agree on both sides regardless of key insertion order.
    const stableKey = (v) => {
      if (v === null || typeof v !== 'object') return v;
      if (Array.isArray(v)) return JSON.stringify(v.map(stableKey));
      return JSON.stringify(Object.keys(v).sort().reduce((o, k) => { o[k] = v[k]; return o; }, {}));
    };
    const seen = new Set();
    const out = [];
    [...la, ...sa].forEach(v => {
      const k = stableKey(v);
      if (!seen.has(k) && !(deletedForKey && deletedForKey[k] !== undefined)) { seen.add(k); out.push(v); }
    });
    return out;
  }

  // Last-write-wins by `updatedAt` when BOTH sides have a real timestamp for
  // the same id — this is what makes edits from a DIFFERENT device actually
  // show up everywhere else, instead of always losing to whichever copy
  // happens to be "local" on a given device. Falls back to the old bias
  // (preferLocal decides) when timestamps are missing, for legacy data.
  const byId = new Map();
  const consider = (e, isPreferredPass) => {
    if (e?.id == null) return;
    const key = String(e.id);
    const cur = byId.get(key);
    if (!cur) { byId.set(key, e); return; }
    const curTs = typeof cur.updatedAt === 'number' ? cur.updatedAt : null;
    const eTs = typeof e.updatedAt === 'number' ? e.updatedAt : null;
    if (curTs == null && eTs == null) {
      if (isPreferredPass) byId.set(key, e);
      return;
    }
    if (eTs != null && (curTs == null || eTs > curTs)) byId.set(key, e);
  };
  const first = preferLocal ? sa : la;
  const second = preferLocal ? la : sa;
  first.forEach(e => consider(e, false));
  second.forEach(e => consider(e, true));
  if (deletedForKey) {
    // Tombstone — не вечная стена: он убирает только копии СТАРШЕ момента
    // удаления. Элемент, созданный заново после удаления (updatedAt новее),
    // выживает — иначе однажды удалённую запись невозможно было бы завести
    // снова: синхронизация сбрасывала бы её через секунды.
    Object.entries(deletedForKey).forEach(([id, delTs]) => {
      const item = byId.get(id);
      if (item && !(typeof item.updatedAt === 'number' && item.updatedAt > delTs)) {
        byId.delete(id);
      }
    });
  }

  // ORDER matters too (checklist items, body fields are user-arranged). The
  // Map's insertion order above follows the first pass — i.e. the SERVER —
  // which silently reverted every local reorder within one sync cycle. Emit
  // in the order of the side edited most recently (max updatedAt), tie →
  // local; items known only to the other side are appended in their order.
  const maxTs = (arr) => arr.reduce((m, e) => Math.max(m, typeof e?.updatedAt === 'number' ? e.updatedAt : 0), 0);
  const orderSides = maxTs(la) >= maxTs(sa) ? [la, sa] : [sa, la];
  const out = [];
  const emitted = new Set();
  orderSides.forEach(side => side.forEach(e => {
    if (e?.id == null) return;
    const k = String(e.id);
    if (byId.has(k) && !emitted.has(k)) { emitted.add(k); out.push(byId.get(k)); }
  }));
  return out;
};

const mergeDateLogEntries = (localArr, serverArr, preferLocal, deletedForKey) => {
  const norm = (e) => ({ ...e, answers: { ...(e.answers || {}) } });
  const ts = (e) => typeof e.updatedAt === 'number' ? e.updatedAt : null;

  // Merge two same-date entries with `over` taking precedence — unless `base`
  // carries a strictly newer updatedAt, in which case the newer edit wins
  // wholesale (fixes the 20s pull reverting a rating changed seconds ago).
  const combine = (base, over) => {
    const bTs = ts(base), oTs = ts(over);
    if (bTs != null && (oTs == null || bTs > oTs)) { const t = base; base = over; over = t; }
    const merged = {
      ...base,
      ...over,
      answers: { ...(base.answers || {}), ...(over.answers || {}) },
      id: over.id || base.id,
    };
    if (over.level !== undefined) merged.level = over.level;
    else if (base.level !== undefined) merged.level = base.level;
    return merged;
  };

  const local = (Array.isArray(localArr) ? localArr : []).filter(e => e?.date).map(norm);
  const server = (Array.isArray(serverArr) ? serverArr : []).filter(e => e?.date).map(norm);

  // ОБЪЕДИНЕНИЕ по датам в обоих режимах: запись, известная только одной
  // стороне, сохраняется (например, ответ бота, который клиент ещё не успел
  // подтянуть). Удаления обеспечиваются исключительно date-tombstone-ами.
  // При конфликте одной даты в combine побеждает строго более свежий
  // updatedAt; без штампов — запись предпочитаемой стороны.
  const first = preferLocal ? server : local;
  const second = preferLocal ? local : server;
  const byDate = new Map();
  first.forEach(e => byDate.set(e.date, { ...e }));
  second.forEach(e => {
    const prev = byDate.get(e.date);
    byDate.set(e.date, prev ? combine(prev, e) : { ...e });
  });
  let result = [...byDate.values()];

  if (deletedForKey) {
    // Как и для id-массивов: tombstone убирает лишь записи не новее момента
    // удаления. Ручная запись за когда-то удалённую дату (штамп свежее)
    // сохраняется, а не сбрасывается каждой синхронизацией.
    result = result.filter(e => {
      const delTs = deletedForKey[String(e.date)];
      if (delTs === undefined) return true;
      return typeof e.updatedAt === 'number' && e.updatedAt > delTs;
    });
  }
  return result.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
};

const mergeBudgetSlice = (localSlice, serverSlice, preferLocal, mergedDeletedIds) => {
  const ls = localSlice || {};
  const ss = serverSlice || {};
  const out = {};
  const keys = new Set([...Object.keys(ls), ...Object.keys(ss), ...BUDGET_SLICE_KEYS]);
  keys.forEach(sk => {
    const lv = ls[sk], sv = ss[sk];
    if (sv === undefined) { out[sk] = lv; return; }
    if (lv === undefined) { out[sk] = sv; return; }
    if (Array.isArray(lv) || Array.isArray(sv)) {
      out[sk] = mergeIdArrays(lv, sv, preferLocal, mergedDeletedIds[sk]);
    } else if (isPlainObject(lv) && isPlainObject(sv)) {
      out[sk] = preferLocal ? { ...sv, ...lv } : { ...lv, ...sv };
    } else {
      out[sk] = preferLocal ? lv : sv;
    }
  });
  return out;
};

const mergeAppData = (local, server, mode = 'pull') => {
  local = normalizeBudgetUsers(local || {});
  server = normalizeBudgetUsers(server || {});
  const merged = { ...local, ...server };
  const mergedDeletedIds = mergeDeletedIdsMaps(local?.deletedIds, server?.deletedIds);
  const keys = new Set([...Object.keys(local || {}), ...Object.keys(server || {})]);
  for (const key of keys) {
    if (key === 'deletedIds') { merged[key] = mergedDeletedIds; continue; }
    // Flat legacy budget keys are folded into budgetByUser by normalizeBudgetUsers.
    if (BUDGET_SLICE_KEYS.includes(key)) continue;
    const l = local ? local[key] : undefined;
    const s = server ? server[key] : undefined;
    if (s === undefined) { merged[key] = l; continue; }
    if (l === undefined) { merged[key] = s; continue; }
    const preferLocal = preferLocalForKey(key, mode);
    if (key === 'kanban' && isPlainObject(l) && isPlainObject(s)) {
      // Доска задач — один объект, но её колонки должны сливаться КАК ЗАПИСИ
      // (по id, «новее — побеждает»). Слияние объекта целиком означало, что
      // локальная доска всегда затирала изменения с другого устройства.
      const base = preferLocal ? { ...s, ...l } : { ...l, ...s };
      base.columns = mergeIdArrays(l.columns || [], s.columns || [], preferLocal, mergedDeletedIds['kanbanColumns']);
      merged[key] = base;
    } else if (key === 'budgetByUser' && isPlainObject(l) && isPlainObject(s)) {
      const userIds = new Set([...Object.keys(l), ...Object.keys(s)]);
      const out = {};
      userIds.forEach(uid => {
        out[uid] = mergeBudgetSlice(l[uid], s[uid], preferLocal, mergedDeletedIds);
      });
      merged[key] = out;
    } else if (DATE_LOG_KEYS.has(key) && (Array.isArray(l) || Array.isArray(s))) {
      merged[key] = mergeDateLogEntries(l, s, preferLocal, mergedDeletedIds[key]);
    } else if (Array.isArray(l) || Array.isArray(s)) {
      merged[key] = mergeIdArrays(l, s, preferLocal, mergedDeletedIds[key]);
    } else if (isPlainObject(l) && isPlainObject(s)) {
      // Цельный объект со штампом updatedAt (dietReminder, checklist-reminder,
      // settings…) сливается «новее — побеждает» ЦЕЛИКОМ. Иначе устройство со
      // старой копией вечно затирало свежую настройку с другого устройства —
      // время напоминания «не обновлялось», как его ни меняй.
      const lTs = typeof l.updatedAt === 'number' ? l.updatedAt : null;
      const sTs = typeof s.updatedAt === 'number' ? s.updatedAt : null;
      if (lTs != null || sTs != null) {
        merged[key] = (sTs != null && (lTs == null || sTs > lTs)) ? s : l;
      } else {
        merged[key] = preferLocal ? { ...s, ...l } : { ...l, ...s };
      }
    } else {
      merged[key] = preferLocal ? l : s;
    }
  }
  // Drop any residual flat budget keys so budgetByUser stays the only source.
  BUDGET_SLICE_KEYS.forEach(k => { delete merged[k]; });
  return normalizeBudgetUsers(merged);
};

// Auto-stamps `updatedAt` on any id-array item that actually changed, so no
// individual setData() call site has to remember to do it. The cross-device
// merge (mergeAppData → mergeIdArrays) picks the newer updatedAt on conflict;
// forgetting to bump it anywhere let the periodic 20s server pull silently
// revert a just-made edit back to a stale server copy on a tie. This wrapper
// closes that whole bug class centrally, instead of relying on every present
// and future reducer getting it right by hand.
const withoutUpdatedAt = (obj) => {
  if (!obj || typeof obj !== 'object') return obj;
  const { updatedAt, ...rest } = obj;
  return rest;
};

// Cheap first pass before the (expensive) JSON.stringify content compare:
// same key set + all top-level values reference-equal ⇒ definitely unchanged.
// Reducers that rebuild every object ({...x}) keep nested value refs, so this
// short-circuits the common "rebuilt but not edited" case without stringify.
const shallowEqualItems = (a, b) => {
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  for (const k of ka) {
    if (k === 'updatedAt') continue;
    if (a[k] !== b[k]) return false;
  }
  return true;
};

const stampUpdatedAt = (prev, next) => {
  if (!prev || !next || prev === next) return next;
  let changed = false;
  const out = { ...next };
  for (const key of Object.keys(next)) {
    const nv = next[key];
    const pv = prev[key];
    if (nv === pv || !Array.isArray(nv) || !looksLikeIdArray(nv)) continue;
    const prevById = new Map((Array.isArray(pv) ? pv : []).map(e => [e && e.id, e]));
    let arrChanged = false;
    const stamped = nv.map(item => {
      if (!item || typeof item !== 'object' || item.id == null) return item;
      const prevItem = prevById.get(item.id);
      if (item === prevItem) return item; // untouched reference
      if (prevItem && (shallowEqualItems(prevItem, item)
          || JSON.stringify(withoutUpdatedAt(prevItem)) === JSON.stringify(withoutUpdatedAt(item)))) {
        return item; // same content (e.g. reorder pass-through) — nothing to stamp
      }
      arrChanged = true;
      return { ...item, updatedAt: Date.now() };
    });
    if (arrChanged) { out[key] = stamped; changed = true; }
  }
  // Per-user budget slices hold the real entity arrays — stamp them too.
  if (isPlainObject(out.budgetByUser)) {
    const prevBy = isPlainObject(prev.budgetByUser) ? prev.budgetByUser : {};
    let byChanged = false;
    const nextBy = { ...out.budgetByUser };
    for (const uid of Object.keys(nextBy)) {
      if (!isPlainObject(nextBy[uid])) continue;
      const stampedSlice = stampUpdatedAt(prevBy[uid] || {}, nextBy[uid]);
      if (stampedSlice !== nextBy[uid]) {
        nextBy[uid] = stampedSlice;
        byChanged = true;
      }
    }
    if (byChanged) { out.budgetByUser = nextBy; changed = true; }
  }
  return changed ? out : next;
};

const saveData = (data) => {
  // Never throw: this runs inside React state updaters (mount/pull merges) —
  // a quota/private-mode exception here would crash the whole tree. The server
  // copy still persists everything even when localStorage is unavailable.
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('saveData: localStorage write failed', e);
  }
};

const fetchServerData = async () => {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    if (!res.ok) return null;
    const json = await res.json();
    if (!json || Object.keys(json).length === 0) return null;
    json.settings = { ...DEFAULT_SETTINGS, ...(json.settings || {}) };
    return normalizeBudgetUsers(json);
  } catch {
    return null;
  }
};

let getAppDataSnapshot = () => null;

// Dedicated, immediate delete for date-log entries (dailyChecklistLog / dietLog).
// Uses keepalive so the request survives even if the user reloads the page
// right after clicking delete — avoids the race where a later pull-merge
// (which trusts the server for these bot-writable logs) would resurrect
// the entry from a stale server snapshot fetched before this delete landed.
const deleteLogEntryOnServer = (key, date) => {
  try {
    fetch('/api/data/delete-log-entry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, date }),
      keepalive: true,
    }).catch(() => {});
  } catch (_) {}
};

const pushServerData = (() => {
  let timer = null;
  const doPush = async (snapshot) => {
    const local = snapshot || getAppDataSnapshot();
    if (!local) return;
    try {
      const serverData = await fetchServerData();
      const toPush = serverData ? mergeAppData(local, serverData, 'push') : local;
      await fetch('/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(toPush),
      });
    } catch (_) {}
  };
  return {
    schedule: () => {
      clearTimeout(timer);
      timer = setTimeout(() => doPush(), 400);
    },
    flush: (snapshot) => {
      clearTimeout(timer);
      timer = null;
      return doPush(snapshot);
    },
  };
})();

// ============== CONSTANTS ==============
const FORMS = ['Таблетки', 'Капсулы', 'Капли', 'Порошок', 'Сироп', 'Жидкость', 'Жевательные', 'Спрей'];

const FREQUENCIES = [
  { id: 'daily_morning', label: 'Ежедневно — утром' },
  { id: 'daily_evening', label: 'Ежедневно — вечером' },
  { id: 'daily_both', label: 'Ежедневно — утром и вечером' },
  { id: 'every_other_morning', label: 'Через день — утром' },
  { id: 'every_other_evening', label: 'Через день — вечером' },
  { id: 'weekdays_morning', label: 'По будням — утром' },
  { id: 'weekdays_evening', label: 'По будням — вечером' },
  { id: 'weekends_morning', label: 'По выходным — утром' },
  { id: 'weekends_evening', label: 'По выходным — вечером' },
  { id: 'weekly_morning', label: 'Раз в неделю — утром (выбрать день)' },
  { id: 'weekly_evening', label: 'Раз в неделю — вечером (выбрать день)' },
];

const WEEKDAYS = [
  { id: 1, label: 'Пн' },
  { id: 2, label: 'Вт' },
  { id: 3, label: 'Ср' },
  { id: 4, label: 'Чт' },
  { id: 5, label: 'Пт' },
  { id: 6, label: 'Сб' },
  { id: 0, label: 'Вс' },
];

// ============== HELPERS ==============
// Утро: 6:00–12:00, Вечер: 18:00–23:00
const getCurrentPeriod = () => {
  const h = new Date().getHours();
  if (h >= 6 && h < 12) return 'morning';
  if (h >= 18 && h < 23) return 'evening';
  // Между периодами — показываем ближайший
  if (h >= 12 && h < 18) return 'evening';
  return 'morning';
};

// Local calendar date as YYYY-MM-DD. Never use toISOString() for day-level
// values: it converts to UTC, so between 00:00 and 03:00 MSK "today" would
// silently become yesterday.
const dateToLocalStr = (d) =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const getTodayKey = () => dateToLocalStr(new Date());

// Сколько дней прошло с эпохи (для "через день")
const getDayNumber = () => {
  return Math.floor(new Date().setHours(0,0,0,0) / 86400000);
};

const isSupplementForPeriod = (supp, period) => {
  if (supp.archived) return false;
  const f = supp.frequency;
  const today = new Date().getDay(); // 0=вс, 1=пн ...
  const isWeekend = today === 0 || today === 6;
  const isWeekday = !isWeekend;
  const dayNum = getDayNumber();
  const isEvenDay = dayNum % 2 === 0;

  if (period === 'morning') {
    if (f === 'daily_morning' || f === 'daily_both') return true;
    if (f === 'every_other_morning') return isEvenDay;
    if (f === 'weekdays_morning') return isWeekday;
    if (f === 'weekends_morning') return isWeekend;
    if (f === 'weekly_morning') return today === supp.weekday;
  }
  if (period === 'evening') {
    if (f === 'daily_evening' || f === 'daily_both') return true;
    if (f === 'every_other_evening') return isEvenDay;
    if (f === 'weekdays_evening') return isWeekday;
    if (f === 'weekends_evening') return isWeekend;
    if (f === 'weekly_evening') return today === supp.weekday;
  }
  return false;
};

const getFrequencyLabel = (id) => FREQUENCIES.find(f => f.id === id)?.label || id;

const CHORE_FREQUENCIES = [
  { id: 'daily',     label: 'Каждый день',      days: 1 },
  { id: 'every2',    label: 'Каждые 2 дня',     days: 2 },
  { id: 'every3',    label: 'Каждые 3 дня',     days: 3 },
  { id: 'weekly',    label: 'Раз в неделю',     days: 7 },
  { id: 'biweekly',  label: 'Раз в 2 недели',   days: 14 },
  { id: 'monthly',   label: 'Раз в месяц',      days: 30 },
  { id: 'custom',    label: 'Своя периодичность', days: null },
];

const getChoreFrequencyDays = (chore) => {
  if (chore.frequency === 'custom') return Math.max(1, chore.customDays || 7);
  return CHORE_FREQUENCIES.find(f => f.id === chore.frequency)?.days || 7;
};

const getChoreNextDate = (chore) => {
  const days = getChoreFrequencyDays(chore);
  if (!chore.lastDone) {
    const d = new Date(); d.setHours(0, 0, 0, 0); return d;
  }
  // Parse as LOCAL midnight: new Date('YYYY-MM-DD') would be UTC midnight,
  // which lands on the previous local day west of UTC and makes a chore
  // marked done today look due again immediately.
  const [ly, lm, ld] = String(chore.lastDone).split('-').map(Number);
  const last = lm ? new Date(ly, lm - 1, ld) : new Date(chore.lastDone);
  last.setHours(0, 0, 0, 0);
  last.setDate(last.getDate() + days);
  return last;
};

const isChoreDueToday = (chore) => {
  if (chore.archived) return false;
  const next = getChoreNextDate(chore);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return next <= today;
};

const isChoreUpcoming = (chore) => {
  if (chore.archived) return false;
  const next = getChoreNextDate(chore);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const week = new Date(today); week.setDate(week.getDate() + 7);
  return next > today && next <= week;
};

const getBossPeriod = () => {
  const h = new Date().getHours();
  if (h >= 5  && h < 13) return 'morning';
  if (h >= 13 && h < 24) return 'evening';
  return null;
};

const formatChoreDate = (dateStr) => {
  if (!dateStr) return 'ещё не делалось';
  const d = new Date(dateStr);
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${d.getDate()} ${months[d.getMonth()]}`;
};

// ============== APP ==============

// Clean-URL deep links: /mybody → «Моё тело», etc. Keep in sync with
// SPA_ROUTES in jarvis.py (the server serves index.html for these paths).
const PATH_TAB_MAP = {
  '/mybody': 'body',
  '/budget': 'budget',
  '/supplements': 'supplements',
  '/meals': 'meals',
  '/weather': 'weather',
  '/house': 'house',
  '/cars': 'cars',
  '/health': 'health',
  // Праздники переехали вкладкой внутрь планировщика, но старый адрес живой:
  // он открывает раздел сразу на этой вкладке (см. PLANNER_SUB_BY_PATH).
  '/holidays': 'planner',
  '/planner': 'planner',
  // Вкладки «Прочего» — тоже адреса: /wishlist и /cards открывают раздел сразу
  // на нужной вкладке, '/misc' идёт последним и потому остаётся адресом раздела.
  '/wishlist': 'misc',
  '/cards': 'misc',
  '/misc': 'misc',
  '/settings': 'settings',
};
// Порядок важен: '/planner' идёт последним, поэтому обратная карта ведёт
// планировщик на '/planner', а не на '/holidays'.
const TAB_PATH_MAP = Object.fromEntries(Object.entries(PATH_TAB_MAP).map(([p, t]) => [t, p]));

const PLANNER_SUB_BY_PATH = { '/holidays': 'holidays' };
const PLANNER_PATH_BY_SUB = { holidays: '/holidays' };

const MISC_SUB_BY_PATH = { '/wishlist': 'wishlist', '/cards': 'cards' };
const MISC_PATH_BY_SUB = { wishlist: '/wishlist', cards: '/cards' };

const currentPathname = () => {
  try {
    return window.location.pathname.replace(/\/+$/, '') || '/';
  } catch { return '/'; }
};

const getTabFromPath = () => PATH_TAB_MAP[currentPathname()] || 'home';

const getPlannerSubFromPath = () => PLANNER_SUB_BY_PATH[currentPathname()] || 'plans';

const getMiscSubFromPath = () => MISC_SUB_BY_PATH[currentPathname()] || 'wishlist';

function App() {
  const [data, setRawData] = useState(loadData());
  // Every setData() call is auto-stamped (see stampUpdatedAt) so a changed
  // array item always gets a fresh updatedAt — no call site can forget it.
  const setData = React.useCallback((updater) => {
    setRawData(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      return stampUpdatedAt(prev, next);
    });
  }, []);
  const [tab, setTab] = useState(getTabFromPath); // home | supplements | meals | weather | house | settings
  const [plannerTab, setPlannerTab] = useState(getPlannerSubFromPath); // plans | holidays | events | camping
  const [miscTab, setMiscTab] = useState(getMiscSubFromPath); // wishlist | cards
  const [settingsTab, setSettingsTab] = useState('general');
  const [houseTab, setHouseTab] = useState('boss');
  const [mealTab, setMealTab] = useState('plan');
  const initialLoad = React.useRef(true);
  const serverLoaded = React.useRef(false);

  // On mount: try to load from server, merge with localStorage to prevent data loss
  useEffect(() => {
    fetchServerData().then(serverData => {
      if (serverData) {
        // Use the raw setter (not the auto-stamping setData) — this is a
        // trusted merge of already-timestamped data, not a fresh local edit,
        // and re-stamping it here would erase real cross-device timestamps.
        setRawData(prev => {
          // Whitelist-free merge so no entered data is ever lost, for any field
          const merged = mergeAppData(prev, serverData);
          saveData(merged);
          return merged;
        });
      }
      serverLoaded.current = true;
    });
  }, []);

  // Перезагрузка при смене дня через Web Worker.
  // Worker работает в отдельном потоке — Safari его не throttleит
  // даже при полном отсутствии активности на экране.
  useEffect(() => {
    const todayAtMount = getTodayKey();

    const checkDate = () => {
      if (getTodayKey() !== todayAtMount) {
        window.location.reload();
      }
    };

    // Основной механизм: Web Worker тикает каждую минуту
    let worker = null;
    try {
      const blob = new Blob(
        [`setInterval(() => postMessage('tick'), 60000);`],
        { type: 'application/javascript' }
      );
      const url = URL.createObjectURL(blob);
      worker = new Worker(url);
      worker.onmessage = checkDate;
      URL.revokeObjectURL(url);
    } catch (_) {}

    // Страховки если Workers недоступны
    const timer = setInterval(checkDate, 60 * 1000);
    const onVisible = () => { if (document.visibilityState === 'visible') checkDate(); };
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('pageshow', checkDate);

    return () => {
      if (worker) worker.terminate();
      clearInterval(timer);
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('pageshow', checkDate);
    };
  }, []);

  // On every change: save locally + push to server (debounced)
  // Don't push to server until initial server load completes to avoid overwriting
  const dataRef = React.useRef(data);
  useEffect(() => {
    dataRef.current = data;
    getAppDataSnapshot = () => dataRef.current;
    if (initialLoad.current) { initialLoad.current = false; return; }
    saveData(data);
    if (serverLoaded.current) {
      pushServerData.schedule();
    }
  }, [data]);

  // Flush latest data to the server synchronously when the page is hidden/closed,
  // so a change made just before closing (before the debounce fires) isn't lost.
  useEffect(() => {
    const flush = () => {
      if (!serverLoaded.current) return;
      try {
        const body = JSON.stringify(dataRef.current);
        const blob = new Blob([body], { type: 'application/json' });
        // sendBeacon returns false when it refuses the payload (UA queue limit
        // is ~64 KB — this app's snapshot easily exceeds it). Fall back to a
        // keepalive fetch in that case too, not only when the API is missing.
        const queued = !!(navigator.sendBeacon && navigator.sendBeacon('/api/data', blob));
        if (!queued) {
          fetch('/api/data', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body,
            keepalive: true,
          });
        }
      } catch (_) {}
      pushServerData.flush();
    };
    const onHide = () => { if (document.visibilityState === 'hidden') flush(); };
    document.addEventListener('visibilitychange', onHide);
    window.addEventListener('pagehide', flush);
    return () => {
      document.removeEventListener('visibilitychange', onHide);
      window.removeEventListener('pagehide', flush);
    };
  }, []);

  // Re-sync from server when the app becomes visible again, so entries written
  // server-side (e.g. diet answers from the Telegram bot) merge back in and
  // aren't clobbered by a later local push.
  useEffect(() => {
    const syncFromServer = () => {
      if (!serverLoaded.current) return;
      fetchServerData().then(serverData => {
        // Raw setter here too — same reasoning as the on-mount merge above.
        if (serverData) setRawData(prev => { const m = mergeAppData(prev, serverData, 'pull'); saveData(m); return m; });
      });
    };
    const onVisible = () => {
      if (document.visibilityState === 'visible') syncFromServer();
    };
    document.addEventListener('visibilitychange', onVisible);
    const pollId = setInterval(() => {
      if (document.visibilityState === 'visible') syncFromServer();
    }, 20000);
    return () => {
      document.removeEventListener('visibilitychange', onVisible);
      clearInterval(pollId);
    };
  }, []);

  // Keep the URL in sync with the active tab (clean deep links like /mybody),
  // and follow browser back/forward between tabs. User-driven tab switches
  // PUSH a history entry (so the Back button walks between tabs); popstate-
  // driven changes must NOT push again or Back would be undone immediately.
  const navFromPopstate = React.useRef(false);
  useEffect(() => {
    const path = (tab === 'planner' && PLANNER_PATH_BY_SUB[plannerTab])
      || (tab === 'misc' && MISC_PATH_BY_SUB[miscTab])
      || TAB_PATH_MAP[tab] || '/';
    const currentPath = currentPathname();
    if (currentPath !== path) {
      if (navFromPopstate.current) {
        window.history.replaceState(null, '', path);
      } else {
        window.history.pushState(null, '', path);
      }
    }
    navFromPopstate.current = false;
  }, [tab, plannerTab, miscTab]);

  useEffect(() => {
    const onPopState = () => {
      navFromPopstate.current = true;
      setTab(getTabFromPath());
      setPlannerTab(getPlannerSubFromPath());
      setMiscTab(getMiscSubFromPath());
    };
    window.addEventListener('popstate', onPopState);
    return () => window.removeEventListener('popstate', onPopState);
  }, []);

  // Разовая миграция legacy-рационов: строки блюд → массивы {product, amount}.
  // Раньше нормализация была только «на лету» и никогда не сохранялась, так что
  // старые рационы вечно перепарсивались при каждом рендере.
  useEffect(() => {
    const isLegacy = (m) => ['breakfast', 'snack', 'lunch', 'dinner'].some(k => typeof m[k] === 'string');
    if ((data.meals || []).some(isLegacy)) {
      setData(d => ({ ...d, meals: (d.meals || []).map(m => isLegacy(m) ? normalizeMeal(m) : m) }));
    }
  }, [data.meals]);

  // Очистка отметок старше сегодняшнего дня. Всё считается ВНУТРИ функционального
  // апдейтера — снимок из первого рендера здесь был бы устаревшим и мог стереть
  // отметки, домёрженные с сервера между монтированием и запуском эффекта.
  useEffect(() => {
    const today = getTodayKey();
    setData(d => {
      const taken = d.taken || {};
      const cleaned = {};
      Object.keys(taken).forEach(k => {
        if (k.startsWith(today)) cleaned[k] = taken[k];
      });
      if (Object.keys(cleaned).length === Object.keys(taken).length) return d;
      return { ...d, taken: cleaned };
    });
  }, []);

  // Авто-переключение на Погоду при бездействии
  const { weatherAutoSwitch, weatherAutoSwitchMinutes } = data.settings || DEFAULT_SETTINGS;
  useEffect(() => {
    if (!weatherAutoSwitch) return;
    const intervalMs = Math.max(0.5, Number(weatherAutoSwitchMinutes) || 2) * 60 * 1000;
    let timerId = null;

    const reset = () => {
      if (timerId) clearTimeout(timerId);
      timerId = setTimeout(() => {
        setTab(current => current === 'home' ? current : 'home');
      }, intervalMs);
    };

    const events = ['mousedown', 'mousemove', 'keydown', 'touchstart', 'wheel', 'click'];
    events.forEach(ev => window.addEventListener(ev, reset, { passive: true }));
    reset();

    return () => {
      if (timerId) clearTimeout(timerId);
      events.forEach(ev => window.removeEventListener(ev, reset));
    };
  }, [weatherAutoSwitch, weatherAutoSwitchMinutes]);

  // Авто-синхронизация конфига уведомлений с jarvis.py
  useEffect(() => {
    const token = data.settings?.telegramToken;
    if (!token) return;
    const timer = setTimeout(() => {
      const config = {
        telegram: { token },
        chores: (data.chores || []).filter(c => !c.archived).map(c => ({
          name: c.name,
          frequency: c.frequency,
          customDays: c.customDays || null,
          lastDone: c.lastDone || null,
          notify: !!c.notify,
          notifyTime: c.notifyTime || '09:00',
        })),
      };
      fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(config),
      }).catch(() => {});
    }, 1000);
    return () => clearTimeout(timer);
  }, [data.settings?.telegramToken, data.chores]);

  return (
    <div className="min-h-screen pb-24 md:pb-8">
      <Header tab={tab} setTab={setTab} />
      {tab === 'english' ? (
        <EngErrorBoundary><EnglishView data={data} setData={setData} /></EngErrorBoundary>
      ) : tab === 'house' ? (
        <HouseView data={data} setData={setData} houseTab={houseTab} setHouseTab={setHouseTab} />
      ) : tab === 'budget' ? (
        <BudgetView data={data} setData={setData} />
      ) : (
        <main className="max-w-3xl mx-auto px-4 sm:px-6 pt-6 md:pt-8">
          {tab === 'home' && <HomeView data={data} setData={setData} setTab={setTab} setHouseTab={setHouseTab} setMealTab={setMealTab} />}
          {tab === 'supplements' && <SupplementsView data={data} setData={setData} />}
          {tab === 'meals' && <MealsView data={data} setData={setData} mealTab={mealTab} setMealTab={setMealTab} />}
          {tab === 'weather' && <WeatherView settings={data.settings} />}
          {tab === 'body' && <BodyView data={data} setData={setData} />}
          {tab === 'health' && <HealthView data={data} setData={setData} />}
          {tab === 'cars' && <CarsView data={data} setData={setData} />}
          {tab === 'planner' && (
            <PlannerView data={data} setData={setData} sub={plannerTab} setSub={setPlannerTab} />
          )}
          {tab === 'misc' && (
            <MiscView data={data} setData={setData} sub={miscTab} setSub={setMiscTab} />
          )}
          {tab === 'settings' && (
            <SettingsView
              data={data}
              setData={setData}
              settingsTab={settingsTab}
              setSettingsTab={setSettingsTab}
            />
          )}
        </main>
      )}
      <BottomNav tab={tab} setTab={setTab} />
      <VoiceButton data={data} setData={setData} settings={data.settings} />
    </div>
  );
}

// ============== SUPPLEMENTS VIEW ==============
function SupplementsView({ data, setData }) {
  const [period, setPeriod] = useState(getCurrentPeriod());
  const [showSettings, setShowSettings] = useState(false);
  const [settingsSubTab, setSettingsSubTab] = useState('supplements');
  const todayKey = getTodayKey();

  // Авто-переключение утро/вечер без участия пользователя
  useEffect(() => {
    const timer = setInterval(() => {
      setPeriod(prev => {
        const current = getCurrentPeriod();
        return current !== prev ? current : prev;
      });
    }, 60 * 1000);
    return () => clearInterval(timer);
  }, []);

  const list = useMemo(() => {
    if (period === 'workout') {
      return (data.workoutSupplements || []).filter(s => !s.archived);
    }
    return (data.supplements || []).filter(s => isSupplementForPeriod(s, period));
  }, [data.supplements, data.workoutSupplements, period]);

  const isTaken = (id) => !!data.taken?.[`${todayKey}_${period}_${id}`];

  const toggle = (id) => {
    const key = `${todayKey}_${period}_${id}`;
    setData(d => {
      const taken = { ...(d.taken || {}) };
      if (taken[key]) delete taken[key];
      else taken[key] = Date.now();
      return { ...d, taken };
    });
  };

  const takeAll = () => {
    setData(d => {
      const taken = { ...(d.taken || {}) };
      list.forEach(s => { taken[`${todayKey}_${period}_${s.id}`] = Date.now(); });
      return { ...d, taken };
    });
  };

  const remaining = list.filter(s => !isTaken(s.id));
  const allTaken = list.length > 0 && remaining.length === 0;

  const periodLabels = { morning: 'утро', evening: 'вечер', workout: 'тренировку' };
  const emptyTexts = {
    morning: 'Нет БАДДов на это время',
    evening: 'Нет БАДДов на это время',
    workout: 'Нет БАДДов для тренировки',
  };

  return (
    <div className="fade-in">
      <div className="mb-6 flex items-center justify-between gap-4">
        <div className="font-display text-2xl">БАДДы</div>

const formatMealItem = (item) => item.amount ? `${item.product} ${item.amount}` : item.product;

function MealPlanView({ data, setData }) {
  const [expanded, setExpanded] = useState(null);
  const meals = (data.meals || []).filter(m => !m.archived).map(normalizeMeal);
  // Избранное живёт в staredMeals = { ids, updatedAt }: штампованный объект
  // сливается «новее — побеждает» целиком, поэтому СНЯТИЕ звёздочки реально
  // сохраняется. Старый формат (простой массив starredMealIds) при слиянии
  // объединялся — сервер возвращал снятую звёздочку через секунды.
  // Fallback на старый ключ — миграция при первом же клике.
  const starredIds = data.starredMeals?.ids || data.starredMealIds || [];

  const toggleStar = (e, mealId) => {
    e.stopPropagation();
    setData(d => {
      const ids = d.starredMeals?.ids || d.starredMealIds || [];
      const next = ids.includes(mealId) ? ids.filter(id => id !== mealId) : [mealId, ...ids];
      return {
        ...d,
        starredMeals: { ids: next, updatedAt: Date.now() },
        starredMealIds: [], // очищаем legacy-ключ, чтобы union-слияние его не воскрешало
      };
    });
  };

  const sorted = [...meals].sort((a, b) => {
    const aStarred = starredIds.includes(a.id);
    const bStarred = starredIds.includes(b.id);
    if (aStarred && !bStarred) return -1;
    if (!aStarred && bStarred) return 1;
    return 0;
  });

  if (sorted.length === 0) return <EmptyState title="Нет рационов" text="Создайте рацион в настройках" />;

  return (
    <div className="space-y-3">
      {sorted.map(meal => {
        const isOpen = expanded === meal.id;
        const isStarred = starredIds.includes(meal.id);
        const summary = [
          meal.breakfast[0] && `Завтрак: ${formatMealItem(meal.breakfast[0])}`,
          meal.snack[0] && `Перекус: ${formatMealItem(meal.snack[0])}`,
          meal.lunch[0] && `Обед: ${formatMealItem(meal.lunch[0])}`,
          meal.dinner[0] && `Ужин: ${formatMealItem(meal.dinner[0])}`,
        ].filter(Boolean).join(' · ');

        return (
          <div
            key={meal.id}
            className={`bg-[var(--surface)] border rounded-2xl overflow-hidden transition-all ${isStarred ? 'border-amber-400' : 'border-[var(--border)]'}`}
          >
            <button
              onClick={() => setExpanded(isOpen ? null : meal.id)}
              className="w-full p-5 text-left flex items-start gap-4"
            >
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-2">
                  <h3 className="font-display text-xl">{meal.name}</h3>
                  {isStarred && <span className="text-xs font-medium text-amber-500 bg-amber-50 px-2 py-0.5 rounded-full shrink-0">Сегодня</span>}
                </div>
                <NutritionRow meal={meal} compact />
                {!isOpen && summary && (
                  <div className="text-sm text-[var(--text-subtle)] truncate mt-2">{summary}</div>
                )}
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button
                  onClick={(e) => toggleStar(e, meal.id)}
                  className={`w-12 h-12 flex items-center justify-center rounded-2xl transition-all active:scale-90 ${isStarred ? 'text-amber-400 bg-amber-50' : 'text-[var(--border-strong)] bg-[var(--bg)]'}`}
                >
                  <Icon name={isStarred ? 'starFilled' : 'star'} size={26} />
                </button>
                <div className={`text-[var(--text-muted)] transition-transform ${isOpen ? 'rotate-180' : ''}`}>
                  <Icon name="chevronDown" size={20} />
                </div>
              </div>
            </button>

            {isOpen && (
              <div className="slide-down border-t border-[var(--border)] px-5 py-6 space-y-5">
                <NutritionRow meal={meal} />
                <MealSection title="Завтрак" items={meal.breakfast} />
                <MealSection title="Перекус" items={meal.snack} />
                <MealSection title="Обед" items={meal.lunch} />
                <MealSection title="Ужин" items={meal.dinner} />
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function RationCounter({ data, setData }) {
  const rations = data.rationStock ?? 0;
  const RATIONS_PER_DAY = 2;
  const daysLeft = rations / RATIONS_PER_DAY;
  const wholeDays = Math.floor(daysLeft);
  const halfDay = (rations % RATIONS_PER_DAY) > 0;

  const [inputVal, setInputVal] = useState('');
  const [showAdd, setShowAdd] = useState(false);

  const consume = () => {
    if (rations <= 0) return;
    setData(d => ({ ...d, rationStock: (d.rationStock ?? 0) - 1 }));
  };

  const addRations = (n) => {
    if (!n || n <= 0) return;
    setData(d => ({ ...d, rationStock: (d.rationStock ?? 0) + n }));
    setInputVal('');
    setShowAdd(false);
  };

  const daysLabel = () => {
    if (rations === 0) return 'Рационов нет';
    const parts = [];
    if (wholeDays > 0) parts.push(`${wholeDays} ${pluralRu(wholeDays, ['день', 'дня', 'дней'])}`);
    if (halfDay) parts.push('½ дня');
    return `Хватит на ${parts.join(' и ')}`;
  };

  const urgencyColor = rations === 0
    ? 'text-red-500'
    : wholeDays < 2
    ? 'text-amber-500'
    : 'text-[var(--text)]';

  return (
    <div className="space-y-4">
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 text-center">
        <div className="text-xs uppercase tracking-widest text-[var(--text-subtle)] mb-4">Остаток рационов</div>

        <div className={`font-display text-8xl leading-none mb-3 ${urgencyColor}`}>
          {rations}
        </div>
        <div className={`text-base mb-8 ${rations === 0 ? 'text-red-400' : wholeDays < 2 ? 'text-amber-500' : 'text-[var(--text-muted)]'}`}>
          {daysLabel()}
        </div>

        <button
          onClick={consume}
          disabled={rations <= 0}
          className={`w-full py-4 rounded-2xl font-medium text-base transition-all ${
            rations > 0
              ? 'bg-[var(--text)] text-white active:scale-95'
              : 'bg-[var(--border)] text-[var(--text-subtle)] cursor-not-allowed'
          }`}
        >
          Съел рацион  −1
        </button>
      </div>

      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
        {!showAdd ? (
          <button
            onClick={() => setShowAdd(true)}
            className="w-full flex items-center justify-center gap-2 py-2 text-[var(--text-muted)] text-sm font-medium hover:text-[var(--text)] transition-colors"
          >
            <Icon name="plus" size={16} />
            Добавить рационы
          </button>
        ) : (
          <div className="flex gap-2">
            <input
              type="number"
              inputMode="numeric"
              min="1"
              value={inputVal}
              onChange={e => setInputVal(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && addRations(parseInt(inputVal))}
              placeholder="Сколько рационов приготовил?"
              autoFocus
              className="flex-1"
            />
            <button
              onClick={() => addRations(parseInt(inputVal))}
              className="px-4 py-2 bg-[var(--text)] text-white rounded-xl text-sm font-medium"
            >
              Добавить
            </button>
            <button
              onClick={() => { setShowAdd(false); setInputVal(''); }}
              className="px-3 py-2 border border-[var(--border)] rounded-xl text-[var(--text-muted)]"
            >
              <Icon name="x" size={16} />
            </button>
          </div>
        )}
        <p className="text-xs text-[var(--text-subtle)] text-center mt-3">1 день = {RATIONS_PER_DAY} рациона</p>
      </div>
    </div>
  );
}

              <span className="text-[var(--text-subtle)] ml-1">{i.label}</span>
            </span>

  }

  return (
    <div className="grid grid-cols-4 gap-1 bg-[var(--bg)] border border-[var(--border)] rounded-xl p-3">
      {items.map(i => (
        <div key={i.label} className="text-center">

  );

// ============== MEAL PURCHASE (Закупка) ==============

function MealPurchaseView({ data, setData }) {
  const [editing, setEditing] = useState(null); // 'new' | list | null

  const meals = (data.meals || []).filter(m => !m.archived).map(normalizeMeal);
  const lists = [...(data.shoppingLists || [])].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  const save = (list) => {
    setData(d => {
      const arr = d.shoppingLists || [];
      const exists = arr.find(x => x.id === list.id);
      return { ...d, shoppingLists: exists ? arr.map(x => x.id === list.id ? list : x) : [...arr, list] };
    });
    setEditing(null);
  };

  const remove = (id) => {
    if (!confirm('Удалить закупку?')) return;
    setData(d => ({ ...d, shoppingLists: (d.shoppingLists || []).filter(x => x.id !== id), deletedIds: withDeletedId(d, 'shoppingLists', id) }));
  };

  if (editing) {
    return (
      <MealPurchaseForm
        meals={meals}
        list={editing === 'new' ? null : editing}
        onSave={save}
        onCancel={() => setEditing(null)}
      />
    );
  }

  const fmtDate = (ms) => ms ? new Date(ms).toLocaleDateString('ru-RU') : '';

  return (
    <div className="fade-in space-y-4">
      <button onClick={() => setEditing('new')} className="btn-primary flex items-center gap-2 text-sm">
        <Icon name="plus" size={16} /> Добавить закупку
      </button>

      {meals.length === 0 ? (
        <EmptyState title="Нет рационов" text="Сначала создайте рационы во вкладке «План»" />
      ) : lists.length === 0 ? (
        <EmptyState title="Нет закупок" text="Выберите рационы и их количество — получите список продуктов" />
      ) : (
        <div className="space-y-3">
          {lists.map(list => {
            const count = (list.selections || []).filter(s => Number(s.qty) > 0).length;
            return (
              <div key={list.id} className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4">
                <div className="flex items-start justify-between gap-3">
                  <button onClick={() => setEditing(list)} className="text-left flex-1 min-w-0">
                    <div className="font-medium">{list.name || 'Закупка'}</div>
                    <div className="text-xs text-[var(--text-muted)] mt-1">
                      {fmtDate(list.createdAt)} · {count} {pluralRu(count, ['рацион', 'рациона', 'рационов'])}
                    </div>
                  </button>
                  <div className="flex gap-1 shrink-0">
                    <button onClick={() => setEditing(list)} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]"><Icon name="edit" size={16} /></button>
                    <button onClick={() => remove(list.id)} className="p-2 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500"><Icon name="trash" size={16} /></button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MealPurchaseForm({ meals, list, onSave, onCancel }) {
  const todayLabel = new Date().toLocaleDateString('ru-RU');
  const [name, setName] = useState(list?.name || `Закупка от ${todayLabel}`);
  const [qtyByMeal, setQtyByMeal] = useState(() => {
    const init = {};
    (list?.selections || []).forEach(s => { init[s.mealId] = String(s.qty); });
    return init;
  });

  const toggleMeal = (mealId) => {
    setQtyByMeal(q => {
      const next = { ...q };
      if (next[mealId] !== undefined) delete next[mealId];
      else next[mealId] = '1';
      return next;
    });
  };
  const setQty = (mealId, v) => setQtyByMeal(q => ({ ...q, [mealId]: v }));

  const selections = Object.entries(qtyByMeal).map(([mealId, qty]) => ({ mealId, qty: Number(qty) || 0 }));
  const { totals, uncounted } = aggregateShoppingList(meals, selections);
  const hasSelection = selections.some(s => s.qty > 0);

  const submit = () => {
    const clean = selections.filter(s => s.qty > 0);
    if (!clean.length) return alert('Выберите хотя бы один рацион с количеством больше 0');
    onSave({
      id: list?.id || crypto.randomUUID(),
      name: name.trim() || `Закупка от ${todayLabel}`,
      selections: clean,
      createdAt: list?.createdAt || Date.now(),
      updatedAt: Date.now(),
    });
  };

  return (
    <div className="fade-in space-y-5">
      <div className="flex items-center gap-3">
        <button onClick={onCancel} className="p-2 rounded-xl hover:bg-black/5 text-[var(--text-muted)]"><Icon name="x" size={20} /></button>
        <h2 className="font-display text-2xl">{list ? 'Редактировать закупку' : 'Новая закупка'}</h2>
      </div>

      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
        <label className="block text-xs text-[var(--text-muted)] font-medium mb-1.5">Название</label>
        <input value={name} onChange={e => setName(e.target.value)} placeholder={`Закупка от ${todayLabel}`} />
      </div>

      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
        <div className="text-sm font-semibold mb-3">Рационы и количество</div>
        {meals.length === 0 ? (
          <div className="text-sm text-[var(--text-subtle)]">Нет доступных рационов</div>
        ) : (
          <div className="space-y-2">
            {meals.map(meal => {
              const checked = qtyByMeal[meal.id] !== undefined;
              return (
                <div key={meal.id} className={`flex items-center gap-3 rounded-xl border px-3 py-2.5 transition-colors ${checked ? 'border-[var(--text)] bg-[var(--bg)]' : 'border-[var(--border)]'}`}>
                  <label className="flex items-center gap-3 flex-1 min-w-0 cursor-pointer !mb-0">
                    <input type="checkbox" className="!w-auto" checked={checked} onChange={() => toggleMeal(meal.id)} />
                    <span className="text-sm font-medium truncate">{meal.name}</span>
                  </label>
                  {checked && (
                    <input
                      type="number" min="0" inputMode="numeric"
                      value={qtyByMeal[meal.id]}
                      onChange={e => setQty(meal.id, e.target.value)}
                      placeholder="Кол-во"
                      style={{ width: '90px', textAlign: 'center' }}
                    />
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {hasSelection && (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
          <div className="text-sm font-semibold mb-3">Итого по продуктам</div>
          {totals.length === 0 && uncounted.length === 0 ? (
            <div className="text-sm text-[var(--text-subtle)]">В выбранных рационах нет продуктов</div>
          ) : (
            <div className="space-y-1.5">
              {totals.map(t => (
                <div key={`${t.product}__${t.unit}`} className="flex items-baseline justify-between gap-3 text-sm bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2">
                  <span className="font-medium">{t.product}</span>
                  <span className="text-[var(--text-muted)] shrink-0">{formatAmountValue(t.value)}{t.unit ? ` ${t.unit}` : ''}</span>
                </div>
              ))}
              {uncounted.map(u => (
                <div key={u.product} className="flex items-baseline justify-between gap-3 text-sm bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2">
                  <span className="font-medium">{u.product}</span>
                  <span className="text-[var(--text-subtle)] shrink-0">× {u.count} (без указания количества)</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <div className="flex gap-3">
        <button onClick={onCancel} className="btn-secondary flex-1">Отмена</button>
        <button onClick={submit} className="btn-primary flex-1">Сохранить</button>
      </div>
    </div>
  );
}

const WEATHER_CACHE_KEY = 'weather_cache_v1';
const WEATHER_MINI_CACHE_KEY = 'weather_mini_cache_v2';
const WEATHER_LOC_KEY = 'weather_location_v1';
const COMMUTE_CACHE_KEY = 'commute_cache_v1';

// WMO Weather codes → иконка + описание
const getWeatherInfo = (code) => {
  if (code === 0) return { icon: 'sun', label: 'Ясно' };
  if (code === 1) return { icon: 'cloudSun', label: 'Преимущественно ясно' };
  if (code === 2) return { icon: 'cloudSun', label: 'Переменная облачность' };
  if (code === 3) return { icon: 'cloud', label: 'Пасмурно' };
  if (code === 45 || code === 48) return { icon: 'cloudFog', label: 'Туман' };
  if (code >= 51 && code <= 57) return { icon: 'cloudRain', label: 'Морось' };
  if (code >= 61 && code <= 67) return { icon: 'cloudRain', label: 'Дождь' };
  if (code >= 71 && code <= 77) return { icon: 'cloudSnow', label: 'Снег' };
  if (code >= 80 && code <= 82) return { icon: 'cloudRain', label: 'Ливень' };
  if (code >= 85 && code <= 86) return { icon: 'cloudSnow', label: 'Снегопад' };
  if (code >= 95 && code <= 99) return { icon: 'cloudLightning', label: 'Гроза' };
  return { icon: 'cloud', label: 'Облачно' };
};
