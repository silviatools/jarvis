const PLANNER_DOW_SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const PLANNER_MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                            'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

// Цвета календаря: событие, личный план и праздник различаются на глаз,
// а не только подписью — праздник намеренно не выглядит как событие.
const PLANNER_CAL_COLORS = {
  event:   { bar: '#059669', bg: '#d1fae5', text: '#065f46', label: 'Подтверждённое событие' },
  plan:    { bar: '#4f46e5', bg: '#e0e7ff', text: '#3730a3', label: 'Мой план' },
  holiday: { bar: '#d97706', bg: '#fef3c7', text: '#92400e', label: 'Праздник' },
};

const plannerIso = (d) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

const plannerToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

// Понедельник — первый день недели: getDay() отдаёт 0 для воскресенья.
const plannerWeeksOfMonth = (year, month) => {
  const shift = (new Date(year, month, 1).getDay() + 6) % 7;
  const total = shift + new Date(year, month + 1, 0).getDate();
  const weeks = [];
  for (let w = 0; w < Math.ceil(total / 7); w++) {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(year, month, 1 - shift + w * 7 + i);
      d.setHours(0, 0, 0, 0);
      days.push(d);
    }
    weeks.push(days);
  }
  return weeks;
};

// Праздник хранится как «MM-DD» и повторяется каждый год. 29 февраля в
// невисокосном году показываем 28-го — иначе праздник просто исчезал бы.
const plannerHolidayIsoInYear = (mmdd, year) => {
  const [mm, dd] = String(mmdd || '').split('-').map(Number);
  if (!mm || !dd || mm < 1 || mm > 12) return '';
  const last = new Date(year, mm, 0).getDate();
  const day = Math.min(dd, last);
  return `${year}-${String(mm).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
};

/** Всё, что показывается в календаре, одним списком: подтверждённые события
 *  планировщика, личные планы и праздники того года, который сейчас открыт. */
const plannerCalendarItems = (data, year) => {
  const items = [];
  (data.plannerEvents || []).forEach(ev => {
    if (!plannerEventConfirmed(ev) || !ev.startDate) return;
    const end = ev.endDate && ev.endDate >= ev.startDate ? ev.endDate : ev.startDate;
    items.push({
      key: `event:${ev.id}`, kind: 'event', ref: ev,
      title: ev.title || 'Без названия', start: ev.startDate, end,
    });
  });
  (data.plannerPlans || []).forEach(p => {
    if (!p.startDate) return;
    const end = p.endDate && p.endDate >= p.startDate ? p.endDate : p.startDate;
    items.push({
      key: `plan:${p.id}`, kind: 'plan', ref: p,
      title: p.title || 'Без названия', start: p.startDate, end,
    });
  });
  (data.holidays || []).filter(h => !h.archived && h.date).forEach(h => {
    // Праздник виден и в декабре, и в январе соседнего года — календарь
    // умеет листать месяцы, поэтому берём три года вокруг открытого.
    [year - 1, year, year + 1].forEach(y => {
      const iso = plannerHolidayIsoInYear(h.date, y);
      if (!iso) return;
      items.push({
        key: `holiday:${h.id}:${y}`, kind: 'holiday', ref: h,
        title: h.name || 'Праздник', start: iso, end: iso,
      });
    });
  });
  return items;
};

/** Полосы недели: элемент, попавший в неделю, занимает подряд идущие
 *  колонки — так событие на несколько дней визуально тянется по календарю.
 *  Пересекающиеся полосы раскладываются по «дорожкам», чтобы не наезжать. */
const plannerWeekSegments = (items, week) => {
  const from = plannerIso(week[0]), to = plannerIso(week[6]);
  const inWeek = items
    .filter(it => it.start <= to && it.end >= from)
    .sort((a, b) => a.start.localeCompare(b.start)   // раньше начались — выше
      || b.end.localeCompare(a.end)                   // длиннее — выше
      || a.title.localeCompare(b.title));
  const lanes = []; // lanes[i] = индекс последней занятой колонки в дорожке
  return inWeek.map(it => {
    const col = Math.max(0, week.findIndex(d => plannerIso(d) >= it.start));
    let endCol = 6;
    for (let i = 6; i >= 0; i--) { if (plannerIso(week[i]) <= it.end) { endCol = i; break; } }
    const span = Math.max(1, endCol - col + 1);
    let lane = lanes.findIndex(last => last < col);
    if (lane === -1) { lane = lanes.length; lanes.push(-1); }
    lanes[lane] = col + span - 1;
    return {
      ...it, col, span, lane,
      startsHere: it.start >= from,
      endsHere: it.end <= to,
    };
  });
};

// sub/setSub живут в App: вкладка «Праздники» — это ещё и адрес /holidays,
// поэтому активная вкладка должна попадать в URL наравне с разделом.
function PlannerView({ data, setData, sub, setSub }) {
  const TABS = [
    { id: 'plans',    label: 'Календарь планов', icon: 'calendar' },
    { id: 'holidays', label: 'Праздники',        icon: 'gift'     },
    { id: 'events',   label: 'События',          icon: 'star'     },
    { id: 'camping',  label: 'Кемпинг',          icon: 'backpack' },
  ];

  return (
    <div className="fade-in">
      <div className="mb-5 flex items-baseline justify-between gap-4">
        <div className="font-display text-2xl">Планировщик дел</div>
        <div className="text-[var(--text-subtle)] text-xs uppercase tracking-widest flex-shrink-0">Календарь</div>
      </div>

      <div className="flex gap-1.5 mb-5 flex-wrap">
        {TABS.map(t => (
          <button
            key={t.id}
            onClick={() => setSub(t.id)}
            className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition-all ${
              sub === t.id
                ? 'bg-[var(--text)] text-white'
                : 'bg-[var(--surface)] border border-[var(--border)] text-[var(--text-muted)]'
            }`}
          >
            <Icon name={t.icon} size={16} />
            {t.label}
          </button>
        ))}
      </div>

      {sub === 'plans'    && <PlannerPlansView data={data} setData={setData} goToEvents={() => setSub('events')} />}
      {sub === 'holidays' && <HolidaysView data={data} setData={setData} embedded />}
      {sub === 'events'   && <PlannerEventsView data={data} setData={setData} />}
      {sub === 'camping'  && <PlannerCampingView data={data} setData={setData} />}
    </div>
  );
}

// ── Мои планы ──────────────────────────────────────────────────────────────
// Календарь месяца: подтверждённые события планировщика, личные планы и
// праздники в одном месте. Событие на несколько дней рисуется полосой,
// растянутой по своим числам, а не точкой в каждой клетке.
const PLANNER_HOLIDAY_EMOJI = { birthday: '🎂', anniversary: '💑', other: '🎉' };

function PlannerPlansView({ data, setData, goToEvents }) {
  const today = plannerToday();
  const [cursor, setCursor] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
  const [selected, setSelected] = useState(() => plannerIso(today));
  const [editing, setEditing] = useState(null);

  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const todayIso = plannerIso(today);

  const items = useMemo(
    () => plannerCalendarItems(data, year),
    [data.plannerEvents, data.plannerPlans, data.holidays, year]);
  const weeks = useMemo(() => plannerWeeksOfMonth(year, month), [year, month]);

  const savePlan = (plan) => {
    // updatedAt проставит setData (stampUpdatedAt) — руками не нужно.
    const entry = { ...plan, title: plan.title.trim() };
    setData(d => {
      const list = d.plannerPlans || [];
      const exists = list.some(p => p.id === entry.id);
      return {
        ...d,
        plannerPlans: exists ? list.map(p => p.id === entry.id ? entry : p) : [...list, entry],
      };
    });
    setEditing(null);
  };

  const removePlan = (plan) => {
    if (!confirm(`Удалить план «${plan.title || 'без названия'}»?`)) return;
    setData(d => ({
      ...d,
      plannerPlans: (d.plannerPlans || []).filter(p => p.id !== plan.id),
      deletedIds: withDeletedId(d, 'plannerPlans', plan.id),
    }));
  };

  const shiftMonth = (delta) => {
    const next = new Date(year, month + delta, 1);
    setCursor(next);
    // Выделение оставляем на месте, если оно и так видно в новом месяце.
    const sel = plannerParseDate(selected);
    if (!sel || sel.getFullYear() !== next.getFullYear() || sel.getMonth() !== next.getMonth()) {
      setSelected(plannerIso(new Date(next.getFullYear(), next.getMonth(), 1)));
    }
  };

  const goToday = () => {
    setCursor(new Date(today.getFullYear(), today.getMonth(), 1));
    setSelected(todayIso);
  };

  const dayItems = items
    .filter(it => it.start <= selected && it.end >= selected)
    .sort((a, b) => {
      const order = { holiday: 0, event: 1, plan: 2 };
      return order[a.kind] - order[b.kind] || a.title.localeCompare(b.title);
    });

  const confirmedCount = (data.plannerEvents || []).filter(plannerEventConfirmed).length;
  const hasEvents = (data.plannerEvents || []).length > 0;

  return (
    <div>
      <button
        onClick={() => setEditing(newPlannerPlan(selected))}
        className="btn-primary w-full flex items-center justify-center gap-2 mb-4"
      >
        <Icon name="plus" size={18} />
        Добавить планы
      </button>

      {hasEvents && confirmedCount === 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4 text-sm text-amber-900">
          В календарь попадают только события со статусом «Подтверждено».
          Отметьте нужные на вкладке «События».{' '}
          <button onClick={goToEvents} className="underline font-medium">Перейти</button>
        </div>
      )}

      {/* Календарь месяца */}
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-3 sm:p-4">
        <div className="flex items-center justify-between gap-2 mb-3">
          <button
            onClick={() => shiftMonth(-1)}
            className="p-2 rounded-xl border border-[var(--border)] text-[var(--text-muted)] hover:text-[var(--text)]"
            title="Предыдущий месяц"
          >
            <Icon name="chevronLeft" size={16} />
          </button>
          <div className="text-center min-w-0">
            <div className="font-display text-lg leading-tight truncate">{PLANNER_MONTHS_NOM[month]}</div>
            <div className="text-xs text-[var(--text-subtle)]">{year}</div>
          </div>
          <div className="flex items-center gap-1.5">
            <button
              onClick={goToday}
              className="px-3 py-2 rounded-xl border border-[var(--border)] text-xs font-medium text-[var(--text-muted)] hover:text-[var(--text)]"
            >Сегодня</button>
            <button
              onClick={() => shiftMonth(1)}
              className="p-2 rounded-xl border border-[var(--border)] text-[var(--text-muted)] hover:text-[var(--text)]"
              title="Следующий месяц"
            >
              <Icon name="chevronRight" size={16} />
            </button>
          </div>
        </div>

        <div className="grid grid-cols-7 gap-1 mb-1">
          {PLANNER_DOW_SHORT.map((w, i) => (
            <div
              key={w}
              className={`text-center text-[11px] font-medium uppercase tracking-wide ${
                i > 4 ? 'text-[var(--text-subtle)]' : 'text-[var(--text-muted)]'}`}
            >{w}</div>
          ))}
        </div>

        {weeks.map((week, wi) => {
          const segs = plannerWeekSegments(items, week);
          const lanes = segs.reduce((m, s) => Math.max(m, s.lane + 1), 0);
          return (
            <div
              key={wi}
              className="grid grid-cols-7 gap-1 mb-1.5"
              style={{ gridTemplateRows: `auto${lanes ? ` repeat(${lanes}, 18px)` : ''}` }}
            >
              {/* Рамка каждого дня — число и его события внутри одной обведённой
                  ячейки, чтобы полосу события не путать с соседней неделей сверху/снизу. */}
              {week.map((d, di) => (
                <div
                  key={`box-${plannerIso(d)}`}
                  className="rounded-lg border border-[var(--border)] pointer-events-none"
                  style={{ gridColumn: di + 1, gridRow: '1 / -1', margin: '-2px' }}
                />
              ))}

              {week.map((d, di) => {
                const iso = plannerIso(d);
                const outside = d.getMonth() !== month;
                const isToday = iso === todayIso;
                const isSelected = iso === selected;
                const hasHoliday = segs.some(s => s.kind === 'holiday' && s.start === iso);
                return (
                  <button
                    key={iso}
                    onClick={() => setSelected(iso)}
                    style={{ gridColumn: di + 1, gridRow: 1 }}
                    className={`h-9 rounded-lg text-sm font-medium transition-all border ${
                      isSelected
                        ? 'bg-[var(--text)] text-white border-[var(--text)]'
                        : isToday
                          ? 'border-[var(--text)] text-[var(--text)]'
                          : 'border-transparent hover:bg-black/5'
                    } ${!isSelected && outside ? 'text-[var(--text-subtle)] opacity-60' : ''} ${
                      !isSelected && !outside && hasHoliday ? 'text-amber-600' : ''}`}
                  >{d.getDate()}</button>
                );
              })}

              {segs.map(s => {
                const c = PLANNER_CAL_COLORS[s.kind];
                return (
                  <button
                    key={s.key}
                    onClick={() => setSelected(s.start > plannerIso(week[0]) ? s.start : plannerIso(week[0]))}
                    title={s.title}
                    className="min-w-0 flex items-center px-1.5 text-[10px] leading-none font-medium truncate text-left"
                    style={{
                      gridColumn: `${s.col + 1} / span ${s.span}`,
                      gridRow: s.lane + 2,
                      background: c.bg,
                      color: c.text,
                      borderLeft: s.startsHere ? `3px solid ${c.bar}` : 'none',
                      borderTopLeftRadius: s.startsHere ? 6 : 0,
                      borderBottomLeftRadius: s.startsHere ? 6 : 0,
                      borderTopRightRadius: s.endsHere ? 6 : 0,
                      borderBottomRightRadius: s.endsHere ? 6 : 0,
                    }}
                  >
                    <span className="truncate">
                      {s.kind === 'holiday' ? `${PLANNER_HOLIDAY_EMOJI[s.ref.type] || '🎉'} ` : ''}
                      {s.startsHere ? s.title : `→ ${s.title}`}
                    </span>
                  </button>
                );
              })}
            </div>
          );
        })}

        <div className="flex items-center gap-3 flex-wrap pt-2 mt-1 border-t border-[var(--border)] text-[11px] text-[var(--text-muted)]">
          {['event', 'plan', 'holiday'].map(k => (
            <span key={k} className="flex items-center gap-1.5">
              <span className="w-3 h-3 rounded" style={{ background: PLANNER_CAL_COLORS[k].bar }} />
              {PLANNER_CAL_COLORS[k].label}
            </span>
          ))}
        </div>
      </div>

      {/* Что назначено на выбранную дату */}
      <div className="mt-4">
        <div className="flex items-baseline justify-between gap-3 mb-2">
          <div className="font-display text-lg">
            {plannerFmtDate(selected)}
            {selected === todayIso && <span className="text-[var(--text-subtle)] text-sm font-body"> · сегодня</span>}
          </div>
          <button
            onClick={() => setEditing(newPlannerPlan(selected))}
            className="text-xs text-[var(--text-muted)] hover:text-[var(--text)] underline flex-shrink-0"
          >добавить план</button>
        </div>

        {dayItems.length === 0 ? (
          <div className="bg-[var(--surface)] border border-dashed border-[var(--border-strong)] rounded-2xl p-5 text-center text-sm text-[var(--text-subtle)]">
            На эту дату ничего не назначено
          </div>
        ) : (
          <div className="space-y-2">
            {dayItems.map(it => {
              const c = PLANNER_CAL_COLORS[it.kind];
              const multi = it.start !== it.end;
              return (
                <div
                  key={it.key}
                  className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-3.5 flex items-start gap-3"
                  style={{ borderLeft: `4px solid ${c.bar}` }}
                >
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="font-medium text-[15px] break-words">
                        {it.kind === 'holiday' ? `${PLANNER_HOLIDAY_EMOJI[it.ref.type] || '🎉'} ` : ''}{it.title}
                      </span>
                      <span
                        className="text-[10px] font-medium px-2 py-0.5 rounded-full"
                        style={{ background: c.bg, color: c.text }}
                      >{c.label}</span>
                    </div>

                    {it.kind === 'event' && (
                      <div className="text-sm text-[var(--text-muted)] mt-0.5">{plannerFmtRange(it.ref)}</div>
                    )}
                    {it.kind === 'plan' && multi && (
                      <div className="text-sm text-[var(--text-muted)] mt-0.5">
                        {plannerFmtDate(it.start)} – {plannerFmtDate(it.end)}
                      </div>
                    )}
                    {it.kind === 'event' && (it.ref.place || it.ref.address) && (
                      <div className="text-sm text-[var(--text-muted)] mt-0.5 flex items-start gap-1.5">
                        <span className="mt-0.5 flex-shrink-0 text-[var(--text-subtle)]"><Icon name="mapPin" size={13} /></span>
                        <span className="break-words">{[it.ref.place, it.ref.address].filter(Boolean).join(' · ')}</span>
                      </div>
                    )}
                    {it.ref.description && (
                      <div className="text-sm text-[var(--text-muted)] mt-1.5 whitespace-pre-wrap break-words">
                        {it.ref.description}
                      </div>
                    )}
                  </div>

                  {it.kind === 'plan' && (
                    <div className="flex gap-1 flex-shrink-0">
                      <button onClick={() => setEditing(it.ref)} className="p-1.5 rounded-lg hover:bg-black/5 text-[var(--text-muted)]">
                        <Icon name="edit" size={15} />
                      </button>
                      <button onClick={() => removePlan(it.ref)} className="p-1.5 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500">
                        <Icon name="trash" size={15} />
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {editing && (
        <PlannerPlanModal
          key={editing.id}
          initial={editing}
          onSave={savePlan}
          onClose={() => setEditing(null)}
        />
      )}
    </div>
  );
}

function PlannerPlanModal({ initial, onSave, onClose }) {
  const [f, setF] = useState({ ...initial });
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));

  const submit = () => {
    if (!f.title.trim()) return alert('Введите название плана');
    if (!f.startDate) return alert('Выберите дату начала');
    if (f.endDate && f.endDate < f.startDate) return alert('Дата окончания раньше даты начала');
    onSave({ ...f, endDate: f.endDate || f.startDate });
  };

  return (
    <Modal onClose={onClose} title={initial.title ? 'План' : 'Новый план'}>
      <div className="space-y-4">
        <div>
          <label>Название</label>
          <input value={f.title} onChange={e => set('title', e.target.value)} placeholder="Например, Отпуск" autoFocus />
        </div>

        <div className="flex gap-3">
          <div className="flex-1">
            <label>Дата начала</label>
            <input
              type="date"
              value={f.startDate || ''}
              onChange={e => {
                const v = e.target.value;
                // Пустая или «уехавшая назад» дата окончания — подтягиваем к началу.
                setF(x => ({ ...x, startDate: v, endDate: !x.endDate || x.endDate < v ? v : x.endDate }));
              }}
            />
          </div>
          <div className="flex-1">
            <label>Дата окончания</label>
            <input type="date" value={f.endDate || ''} onChange={e => set('endDate', e.target.value)} />
          </div>
        </div>
        <div className="text-[11px] text-[var(--text-subtle)] -mt-2">
          План на несколько дней растянется в календаре на весь диапазон.
        </div>

        <div>
          <label>Описание</label>
          <textarea
            value={f.description || ''}
            onChange={e => set('description', e.target.value)}
            rows={4}
            placeholder="Детали плана — что нужно сделать, что взять с собой…"
            style={{ resize: 'vertical' }}
          />
        </div>

        <div className="flex gap-3 pt-2">
          <button onClick={onClose} className="btn-secondary flex-1">Отмена</button>
          <button onClick={submit} className="btn-primary flex-1">Сохранить</button>
        </div>
      </div>
    </Modal>
  );
}

// ── События ────────────────────────────────────────────────────────────────
// «Друзья» вложены сюда как внутренняя вкладка: список друзей нужен только
// как источник участников события, отдельным верхнеуровневым разделом он не является.
function PlannerEventsView({ data, setData }) {
  const [editing, setEditing] = useState(null);
  const [filter, setFilter] = useState('active');
  const [view, setView] = useState('events'); // events | friends
  const goToFriends = () => setView('friends');

  const friends = data.plannerFriends || [];
  const events = data.plannerEvents || [];
  const responses = data.plannerResponses || [];
  const comments = data.plannerComments || [];
  const guests = data.plannerGuests || [];
  const expenses = data.plannerExpenses || [];
  const payments = data.plannerPayments || [];
  const shoppingItems = data.plannerShoppingItems || [];
  const [editingExpense, setEditingExpense] = useState(null);

  const save = (ev) => {
    setData(d => {
      const list = d.plannerEvents || [];
      const exists = list.some(e => e.id === ev.id);
      return {
        ...d,
        plannerEvents: exists ? list.map(e => e.id === ev.id ? ev : e) : [...list, ev],
      };
    });
    setEditing(null);
  };

  // Подтверждение — ручное решение организатора для всего события целиком.
  // Только подтверждённые попадают в календарь вкладки «Мои планы».
  const toggleConfirmed = (ev) => {
    setData(d => ({
      ...d,
      plannerEvents: (d.plannerEvents || []).map(e =>
        e.id === ev.id ? { ...e, confirmed: !plannerEventConfirmed(e) } : e),
    }));
  };

  const remove = (ev) => {
    if (!confirm(`Удалить событие «${ev.title || 'без названия'}»?\n\nОтветы и комментарии друзей тоже удалятся, а ссылка перестанет открываться.`)) return;
    setData(d => {
      const deleted = { ...(d.deletedIds || {}) };
      const stamp = (key, ids) => {
        if (!ids.length) return;
        const coll = { ...(deleted[key] || {}) };
        ids.forEach(id => { coll[String(id)] = Date.now(); });
        deleted[key] = coll;
      };
      stamp('plannerEvents', [ev.id]);
      stamp('plannerResponses', (d.plannerResponses || []).filter(r => r.eventId === ev.id).map(r => r.id));
      stamp('plannerComments', (d.plannerComments || []).filter(c => c.eventId === ev.id).map(c => c.id));
      stamp('plannerGuests', (d.plannerGuests || []).filter(g => g.eventId === ev.id).map(g => g.id));
      stamp('plannerExpenses', (d.plannerExpenses || []).filter(e => e.eventId === ev.id).map(e => e.id));
      stamp('plannerPayments', (d.plannerPayments || []).filter(p => p.eventId === ev.id).map(p => p.id));
      stamp('plannerShoppingItems', (d.plannerShoppingItems || []).filter(s => s.eventId === ev.id).map(s => s.id));
      return {
        ...d,
        plannerEvents: (d.plannerEvents || []).filter(e => e.id !== ev.id),
        plannerResponses: (d.plannerResponses || []).filter(r => r.eventId !== ev.id),
        plannerComments: (d.plannerComments || []).filter(c => c.eventId !== ev.id),
        plannerGuests: (d.plannerGuests || []).filter(g => g.eventId !== ev.id),
        plannerExpenses: (d.plannerExpenses || []).filter(e => e.eventId !== ev.id),
        plannerPayments: (d.plannerPayments || []).filter(p => p.eventId !== ev.id),
        plannerShoppingItems: (d.plannerShoppingItems || []).filter(s => s.eventId !== ev.id),
        deletedIds: deleted,
      };
    });
  };

  const removeComment = (id) => {
    if (!confirm('Удалить комментарий?')) return;
    setData(d => ({
      ...d,
      plannerComments: (d.plannerComments || []).filter(c => c.id !== id),
      deletedIds: withDeletedId(d, 'plannerComments', id),
    }));
  };

  // Гость вписал себя сам — организатору нужен способ убрать лишнего
  // (ошиблись именем, чужой человек по переславшейся ссылке).
  const removeGuest = (ev, guest) => {
    if (!confirm(`Убрать ${guest.name} из события «${ev.title || 'без названия'}»?\n\nЕго ответ и комментарии к этому событию удалятся. Он сможет вписаться снова, если у него есть ссылка.`)) return;
    setData(d => {
      const deleted = { ...(d.deletedIds || {}) };
      const stamp = (key, ids) => {
        if (!ids.length) return;
        const coll = { ...(deleted[key] || {}) };
        ids.forEach(id => { coll[String(id)] = Date.now(); });
        deleted[key] = coll;
      };
      stamp('plannerGuests', [guest.id]);
      stamp('plannerResponses', (d.plannerResponses || []).filter(r => r.friendId === guest.id).map(r => r.id));
      stamp('plannerComments', (d.plannerComments || []).filter(c => c.friendId === guest.id && c.eventId === ev.id).map(c => c.id));
      return {
        ...d,
        plannerGuests: (d.plannerGuests || []).filter(g => g.id !== guest.id),
        plannerResponses: (d.plannerResponses || []).filter(r => r.friendId !== guest.id),
        plannerComments: (d.plannerComments || []).filter(c => !(c.friendId === guest.id && c.eventId === ev.id)),
        deletedIds: deleted,
      };
    });
  };

  // Траты и отметки переводов организатор пишет в те же коллекции, что и
  // гости через свои эндпоинты: id-массивы со штампом updatedAt, поэтому
  // слияние между устройствами разруливает их «новее — побеждает».
  const saveExpense = (exp) => {
    setData(d => {
      const list = d.plannerExpenses || [];
      const exists = list.some(e => e.id === exp.id);
      return {
        ...d,
        plannerExpenses: exists ? list.map(e => e.id === exp.id ? exp : e) : [...list, exp],
      };
    });
    setEditingExpense(null);
  };

  const removeExpense = (exp) => {
    if (!confirm(`Удалить трату «${exp.title || 'без описания'}» на ${window.PlannerSplit.formatMoney(window.PlannerSplit.toCents(exp.amount))}?`)) return;
    setData(d => ({
      ...d,
      plannerExpenses: (d.plannerExpenses || []).filter(e => e.id !== exp.id),
      deletedIds: withDeletedId(d, 'plannerExpenses', exp.id),
    }));
  };

  const togglePayment = (ev, row) => {
    const id = window.PlannerSplit.paymentId(ev.id, row.fromId, row.toId);
    const paid = !row.paid;
    setData(d => {
      const list = d.plannerPayments || [];
      const prev = list.find(p => p.id === id);
      const entry = {
        ...(prev || {}),
        id,
        eventId: ev.id,
        fromId: row.fromId,
        toId: row.toId,
        paid,
        amount: paid ? row.amount : 0,
        paidAt: paid ? Date.now() : 0,
        paidBy: paid ? 'organizer' : '',
        createdAt: prev?.createdAt || Date.now(),
      };
      return {
        ...d,
        plannerPayments: prev ? list.map(p => p.id === id ? entry : p) : [...list, entry],
      };
    });
  };

  // Список покупок: та же id-коллекция со штампом updatedAt, что и у трат —
  // организатор пишет сюда напрямую, участники по ссылке через свой эндпоинт,
  // слияние между устройствами разруливает «новее — побеждает».
  const saveShoppingItem = (ev, item) => {
    setData(d => {
      const list = d.plannerShoppingItems || [];
      const exists = list.some(s => s.id === item.id);
      return {
        ...d,
        plannerShoppingItems: exists
          ? list.map(s => s.id === item.id ? item : s)
          : [...list, item],
      };
    });
  };

  const removeShoppingItem = (item) => {
    setData(d => ({
      ...d,
      plannerShoppingItems: (d.plannerShoppingItems || []).filter(s => s.id !== item.id),
      deletedIds: withDeletedId(d, 'plannerShoppingItems', item.id),
    }));
  };

  const toggleShoppingItem = (item) => {
    const taken = !item.takenBy;
    setData(d => ({
      ...d,
      plannerShoppingItems: (d.plannerShoppingItems || []).map(s => s.id === item.id ? {
        ...s,
        takenBy: taken ? 'organizer' : null,
        takenAt: taken ? Date.now() : 0,
        updatedAt: Date.now(),
      } : s),
    }));
  };

  const toggleShare = (ev) => {
    setData(d => ({
      ...d,
      plannerEvents: (d.plannerEvents || []).map(e =>
        e.id === ev.id ? { ...e, shareEnabled: !(e.shareEnabled !== false) } : e),
    }));
  };

  const regenerateToken = (ev) => {
    if (!confirm('Сделать новую ссылку?\n\nСтарая перестанет работать — тем, кому вы её уже отправили, придётся прислать новую.')) return;
    setData(d => ({
      ...d,
      plannerEvents: (d.plannerEvents || []).map(e =>
        e.id === ev.id ? { ...e, shareToken: makePlannerToken(), shareEnabled: true } : e),
    }));
  };

  const FILTERS = [
    { id: 'active',    label: 'Актуальные'    },
    { id: 'confirmed', label: 'Подтверждённые' },
    { id: 'past',      label: 'Прошедшие'     },
    { id: 'all',       label: 'Все'           },
  ];

  const filtered = events.filter(e =>
    filter === 'all' ? true
      : filter === 'past' ? plannerIsPast(e)
      : filter === 'confirmed' ? plannerEventConfirmed(e)
      : !plannerIsPast(e));

  // Ближайшее — сверху; события без даты — в конце, прошедшие — от свежих к старым.
  const sorted = [...filtered].sort((a, b) => {
    const pa = plannerIsPast(a), pb = plannerIsPast(b);
    if (pa !== pb) return pa ? 1 : -1;
    const da = a.startDate || '', db = b.startDate || '';
    if (!da && !db) return (b.createdAt || 0) - (a.createdAt || 0);
    if (!da) return 1;
    if (!db) return -1;
    return pa ? db.localeCompare(da) : da.localeCompare(db);
  });

  const EVENT_SUBVIEWS = [
    { id: 'events',  label: 'События', icon: 'star'  },
    { id: 'friends', label: 'Друзья',  icon: 'users' },
  ];

  return (
    <div>
      <div className="flex gap-1.5 mb-4">
        {EVENT_SUBVIEWS.map(v => (
          <button
            key={v.id}
            onClick={() => setView(v.id)}
            className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-sm font-medium transition-all ${
              view === v.id
                ? 'bg-[var(--text)] text-white'
                : 'bg-[var(--surface)] border border-[var(--border)] text-[var(--text-muted)]'
            }`}
          >
            <Icon name={v.icon} size={14} />
            {v.label}
            {v.id === 'friends' && friends.length > 0 && (
              <span className={view === v.id ? 'opacity-80' : 'text-[var(--text-subtle)]'}>{friends.length}</span>
            )}
          </button>
        ))}
      </div>

      {view === 'friends' ? (
        <PlannerFriendsView data={data} setData={setData} />
      ) : (
      <>
      <button
        onClick={() => setEditing(newPlannerEvent())}
        className="btn-primary w-full flex items-center justify-center gap-2 mb-4"
      >
        <Icon name="plus" size={18} />
        Новое событие
      </button>

      {friends.length === 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4 text-sm text-amber-900">
          Сначала добавьте друзей на вкладке «Друзья» — из них выбираются участники события.{' '}
          <button onClick={goToFriends} className="underline font-medium">Перейти</button>
        </div>
      )}

      {events.length > 0 && (
        <div className="flex gap-1.5 mb-4 flex-wrap">
          {FILTERS.map(f => (
            <button
              key={f.id}
              onClick={() => setFilter(f.id)}
              className={`px-3 py-1.5 rounded-xl text-sm font-medium transition-all ${
                filter === f.id
                  ? 'bg-[var(--text)] text-white'
                  : 'bg-[var(--surface)] border border-[var(--border)] text-[var(--text-muted)]'
              }`}
            >{f.label}</button>
          ))}
        </div>
      )}

      {sorted.length === 0 ? (
        <EmptyState
          title="Событий нет"
          text={events.length === 0
            ? 'Создайте событие, выберите участников и отправьте им ссылку'
            : 'В этом фильтре пусто'}
        />
      ) : (
        <div className="space-y-3">
          {sorted.map(ev => (
            <PlannerEventCard
              key={ev.id}
              event={ev}
              friends={friends}
              guests={guests.filter(g => g.eventId === ev.id)}
              responses={responses.filter(r => r.eventId === ev.id)}
              comments={comments.filter(c => c.eventId === ev.id)}
              onEdit={() => setEditing(ev)}
              onDelete={() => remove(ev)}
              onDeleteComment={removeComment}
              onDeleteGuest={(g) => removeGuest(ev, g)}
              expenses={expenses.filter(e => e.eventId === ev.id)}
              payments={payments.filter(p => p.eventId === ev.id)}
              onAddExpense={() => setEditingExpense({ eventId: ev.id })}
              onEditExpense={(e) => setEditingExpense(e)}
              onDeleteExpense={removeExpense}
              onTogglePayment={(row) => togglePayment(ev, row)}
              shoppingItems={shoppingItems.filter(s => s.eventId === ev.id)}
              onAddShoppingItem={(item) => saveShoppingItem(ev, item)}
              onDeleteShoppingItem={removeShoppingItem}
              onToggleShoppingItem={toggleShoppingItem}
              onToggleShare={() => toggleShare(ev)}
              onRegenerate={() => regenerateToken(ev)}
              onToggleConfirmed={() => toggleConfirmed(ev)}
            />
          ))}
        </div>
      )}

      {editing && (
        <PlannerEventModal
          key={editing.id}
          initial={editing}
          friends={friends}
          onSave={save}
          onClose={() => setEditing(null)}
        />
      )}

      {editingExpense && (() => {
        const ev = events.find(e => e.id === editingExpense.eventId);
        if (!ev) return null;
        return (
          <PlannerExpenseModal
            key={editingExpense.id || 'new'}
            initial={editingExpense}
            participants={plannerParticipantsOf(ev, friends, guests)}
            expenses={expenses.filter(e => e.eventId === ev.id)}
            onSave={saveExpense}
            onClose={() => setEditingExpense(null)}
          />
        );
      })()}
      </>
      )}
    </div>
  );
}

function PlannerEventCard({ event: ev, friends, guests, responses, comments, expenses, payments,
                            onEdit, onDelete, onDeleteComment, onDeleteGuest, onToggleShare, onRegenerate,
                            onAddExpense, onEditExpense, onDeleteExpense, onTogglePayment, onToggleConfirmed,
                            shoppingItems, onAddShoppingItem, onDeleteShoppingItem, onToggleShoppingItem }) {
  const [open, setOpen] = useState(false);
  const [copied, setCopied] = useState(false);

  const mode = plannerEventMode(ev);
  const participants = useMemo(
    () => plannerParticipantsOf(ev, friends, guests), [ev, friends, guests]);
  const nameById = useMemo(
    () => Object.fromEntries(participants.map(p => [p.id, p.name])), [participants]);
  const responseByFriend = useMemo(
    () => Object.fromEntries(responses.map(r => [r.friendId, r])), [responses]);

  const answered = participants.filter(p => responseByFriend[p.id]).length;
  const counts = PLANNER_STATUSES.map(s => ({
    ...s,
    n: participants.filter(p => responseByFriend[p.id]?.status === s.id).length,
  })).filter(s => s.n > 0);

  const shareOn = ev.shareEnabled !== false;
  const confirmed = plannerEventConfirmed(ev);
  const url = plannerEventUrl(ev);
  const deadlineLeft = plannerDaysUntil(ev.decisionDeadline);
  const past = plannerIsPast(ev);

  const copy = async () => {
    const ok = await copyToClipboard(url);
    if (ok) {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } else {
      prompt('Скопируйте ссылку вручную:', url);
    }
  };

  const share = async () => {
    try {
      await navigator.share({ title: ev.title || 'Событие', text: ev.title || '', url });
    } catch (_) {}
  };

  return (
    <div className={`bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 ${past ? 'opacity-70' : ''}`}>
      <div className="flex items-start gap-3">
        <div className="flex-1 min-w-0">
          <div className="font-medium text-[17px] leading-snug">{ev.title || 'Без названия'}</div>
          <div className="text-sm text-[var(--text-muted)] mt-0.5">{plannerFmtRange(ev)}</div>
          {(ev.place || ev.address) && (
            <div className="text-sm text-[var(--text-muted)] mt-0.5 flex items-start gap-1.5">
              <span className="mt-0.5 flex-shrink-0 text-[var(--text-subtle)]"><Icon name="mapPin" size={13} /></span>
              <span className="break-words">{[ev.place, ev.address].filter(Boolean).join(' · ')}</span>
            </div>
          )}
        </div>
        <div className="flex gap-1 flex-shrink-0">
          <button onClick={onEdit} className="p-1.5 rounded-lg hover:bg-black/5 text-[var(--text-muted)]">
            <Icon name="edit" size={15} />
          </button>
          <button onClick={onDelete} className="p-1.5 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500">
            <Icon name="trash" size={15} />
          </button>
        </div>
      </div>

      {/* Статус события — ручной, ставит организатор. Подтверждённое событие
          показывается в календаре на вкладке «Мои планы». */}
      <button
        onClick={onToggleConfirmed}
        className={`mt-2.5 flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-full border transition-all ${
          confirmed
            ? 'bg-emerald-50 border-emerald-300 text-emerald-700'
            : 'bg-[var(--bg)] border-[var(--border)] text-[var(--text-muted)] hover:border-[var(--border-strong)]'
        }`}
        title={confirmed ? 'Снять подтверждение — событие исчезнет из календаря' : 'Подтвердить — событие появится на вкладке «Календарь планов»'}
      >
        <Icon name={confirmed ? 'check' : 'calendar'} size={13} />
        {confirmed ? 'Подтверждено' : 'Не подтверждено'}
      </button>

      <div className="flex items-center gap-1.5 flex-wrap mt-2">
        {ev.decisionDeadline && (
          <span className={`text-xs font-medium px-2 py-1 rounded-full ${
            deadlineLeft === null ? 'bg-[var(--bg)] text-[var(--text-subtle)]' :
            deadlineLeft < 0  ? 'bg-red-100 text-red-700' :
            deadlineLeft === 0 ? 'bg-red-100 text-red-700' :
            deadlineLeft <= 3 ? 'bg-amber-100 text-amber-700' :
            'bg-[var(--bg)] text-[var(--text-muted)]'
          }`}>
            {deadlineLeft === null ? `Решение до ${ev.decisionDeadline}`
              : deadlineLeft < 0 ? `Дедлайн прошёл ${plannerFmtDate(ev.decisionDeadline, false)}`
              : deadlineLeft === 0 ? 'Дедлайн решения — сегодня'
              : `Решение до ${plannerFmtDate(ev.decisionDeadline, false)} · ${deadlineLeft} ${plannerPlural(deadlineLeft, 'день', 'дня', 'дней')}`}
          </span>
        )}
        <span className="text-xs font-medium px-2 py-1 rounded-full bg-[var(--bg)] text-[var(--text-muted)]">
          {mode === 'open'
            ? `Записались ${participants.length}, ответили ${answered}`
            : `Ответили ${answered} из ${participants.length}`}
        </span>
        {mode === 'open' && (
          <span className="text-xs font-medium px-2 py-1 rounded-full bg-[var(--bg)] text-[var(--text-subtle)]">
            Открытое — вписывают имя
          </span>
        )}
        {!shareOn && (
          <span className="text-xs font-medium px-2 py-1 rounded-full bg-red-100 text-red-700">Ссылка выключена</span>
        )}
      </div>

      {counts.length > 0 && (
        <div className="flex items-center gap-1.5 flex-wrap mt-2">
          {counts.map(c => (
            <span
              key={c.id}
              className="text-xs font-medium px-2 py-1 rounded-full border"
              style={{ color: c.color, borderColor: c.color }}
            >{c.short}: {c.n}</span>
          ))}
        </div>
      )}

      {/* Ссылка для друзей */}
      <div className="mt-3 pt-3 border-t border-[var(--border)]">
        <div className="flex items-center gap-2">
          <input
            readOnly
            value={url}
            onFocus={e => e.target.select()}
            className="flex-1 min-w-0 text-xs !py-2 !px-3 text-[var(--text-muted)]"
            style={{ fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}
          />
          <button
            onClick={copy}
            className="btn-secondary !py-2 !px-3 text-sm flex items-center gap-1.5 flex-shrink-0"
            title="Скопировать ссылку"
          >
            <Icon name={copied ? 'check' : 'copy'} size={14} />
            <span className="hidden sm:inline">{copied ? 'Скопировано' : 'Копировать'}</span>
          </button>
          {typeof navigator !== 'undefined' && navigator.share && (
            <button onClick={share} className="btn-secondary !py-2 !px-3 flex-shrink-0" title="Поделиться">
              <Icon name="share" size={14} />
            </button>
          )}
        </div>
        <div className={`text-[11px] mt-1.5 ${shareOn ? 'text-[var(--text-subtle)]' : 'text-red-500'}`}>
          {shareOn
            ? 'По этой ссылке видно только это событие: участники, их ответы и комментарии. Остальной сайт по ней недоступен.'
            : 'Ссылка отключена — сейчас она не откроется ни у кого. Включите её, чтобы друзья снова смогли отвечать.'}
        </div>
      </div>

      <div className="flex items-center gap-3 mt-3 flex-wrap">
        <button
          onClick={() => setOpen(v => !v)}
          className="text-sm text-[var(--text-muted)] hover:text-[var(--text)] flex items-center gap-1"
        >
          <span className={`transition-transform ${open ? 'rotate-180' : ''}`}><Icon name="chevronDown" size={14} /></span>
          {open ? 'Свернуть' : `Ответы и комментарии${comments.length ? ` (${comments.length})` : ''}`}
        </button>
        <button onClick={onToggleShare} className="text-sm text-[var(--text-muted)] hover:text-[var(--text)]">
          {shareOn ? 'Отключить ссылку' : 'Включить ссылку'}
        </button>
        <button onClick={onRegenerate} className="text-sm text-[var(--text-muted)] hover:text-[var(--text)]">
          Новая ссылка
        </button>
      </div>

      {open && (
        <div className="mt-3 pt-3 border-t border-[var(--border)] space-y-4 slide-down">
          {ev.description && (
            <div>
              <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] mb-1">Описание</div>
              <div className="text-sm whitespace-pre-wrap">{ev.description}</div>
            </div>
          )}

          <div>
            <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] mb-2">Участники</div>
            {participants.length === 0 ? (
              <div className="text-sm text-[var(--text-subtle)]">
                {mode === 'open' ? 'Пока никто не записался по ссылке' : 'Участники не выбраны'}
              </div>
            ) : (
              <div className="space-y-1.5">
                {participants.map(p => {
                  const r = responseByFriend[p.id];
                  const st = r && PLANNER_STATUS_BY_ID[r.status];
                  return (
                    <div key={p.id} className="flex items-start gap-2 bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2">
                      <div className="flex-1 min-w-0">
                        <div className="text-sm font-medium flex items-center gap-1.5 flex-wrap break-words">
                          <span className="break-all">{p.name}</span>
                          {p.self && <span className="text-[10px] uppercase tracking-wider text-[var(--text-subtle)]">вписал(а) себя</span>}
                        </div>
                        {r?.note && <div className="text-xs text-[var(--text-muted)] italic mt-0.5 break-words">{r.note}</div>}
                      </div>
                      <span
                        className="text-xs font-medium px-2 py-0.5 rounded-full flex-shrink-0 border"
                        style={st
                          ? { color: st.color, borderColor: st.color }
                          : { color: 'var(--text-subtle)', borderColor: 'var(--border-strong)' }}
                      >{st ? st.short : 'нет ответа'}</span>
                      {p.self && (
                        <button
                          onClick={() => onDeleteGuest(p)}
                          className="text-[var(--text-subtle)] hover:text-red-500 flex-shrink-0 mt-0.5"
                          title="Убрать из события"
                        >
                          <Icon name="x" size={14} />
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <PlannerShoppingSection
            event={ev}
            nameById={nameById}
            items={shoppingItems}
            onAdd={onAddShoppingItem}
            onDelete={onDeleteShoppingItem}
            onToggle={onToggleShoppingItem}
          />

          <PlannerExpensesSection
            event={ev}
            participants={participants}
            expenses={expenses}
            payments={payments}
            onAddExpense={onAddExpense}
            onEditExpense={onEditExpense}
            onDeleteExpense={onDeleteExpense}
            onTogglePayment={onTogglePayment}
          />

          <div>
            <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] mb-2">Комментарии друзей</div>
            {comments.length === 0 ? (
              <div className="text-sm text-[var(--text-subtle)]">Пока никто ничего не написал</div>
            ) : (
              <div className="space-y-1.5">
                {[...comments].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).map(c => (
                  <div key={c.id} className="flex items-start gap-2 bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-baseline gap-2 flex-wrap">
                        <span className="text-sm font-medium break-all">{nameById[c.friendId] || 'Бывший участник'}</span>
                        <span className="text-[11px] text-[var(--text-subtle)]">
                          {c.createdAt ? new Date(c.createdAt).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''}
                        </span>
                      </div>
                      <div className="text-sm mt-0.5 whitespace-pre-wrap break-words">{c.text}</div>
                    </div>
                    <button
                      onClick={() => onDeleteComment(c.id)}
                      className="text-[var(--text-subtle)] hover:text-red-500 flex-shrink-0 mt-0.5"
                      title="Удалить комментарий"
                    >
                      <Icon name="x" size={14} />
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function PlannerEventModal({ initial, friends, onSave, onClose }) {
  const [f, setF] = useState({ ...initial, participantIds: [...(initial.participantIds || [])] });
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));

  const toggleFriend = (id) => setF(x => ({
    ...x,
    participantIds: x.participantIds.includes(id)
      ? x.participantIds.filter(p => p !== id)
      : [...x.participantIds, id],
  }));

  const allSelected = friends.length > 0 && friends.every(fr => f.participantIds.includes(fr.id));
  const toggleAll = () => set('participantIds', allSelected ? [] : friends.map(fr => fr.id));

  const submit = () => {
    if (!f.title.trim()) return alert('Введите название события');
    // Дата окончания раньше начала — почти всегда опечатка, молча не исправляем.
    if (f.endDate && f.startDate && f.endDate < f.startDate) {
      return alert('Дата окончания раньше даты начала');
    }
    onSave({
      ...f,
      title: f.title.trim(),
      shareToken: f.shareToken || makePlannerToken(),
      shareEnabled: f.shareEnabled !== false,
    });
  };

  const deadlineAfterStart = f.decisionDeadline && f.startDate && f.decisionDeadline > f.startDate;
  const isNew = !initial.title;
  const mode = f.participantMode === 'open' ? 'open' : 'list';

  return (
    <Modal onClose={onClose} title={isNew ? 'Новое событие' : 'Событие'}>
      <div className="space-y-4">
        <div>
          <label>Название</label>
          <input value={f.title} onChange={e => set('title', e.target.value)} placeholder="Например, Выезд на Селигер" autoFocus />
        </div>

        <div className="flex gap-3">
          <div className="flex-1">
            <label>Дата начала</label>
            <input type="date" value={f.startDate || ''} onChange={e => set('startDate', e.target.value)} />
          </div>
          <div className="flex-1">
            <label>Дата окончания</label>
            <input type="date" value={f.endDate || ''} onChange={e => set('endDate', e.target.value)} />
          </div>
        </div>

        <div className="flex gap-3">
          <div className="flex-1">
            <label>Время начала</label>
            <input type="time" value={f.startTime || ''} onChange={e => set('startTime', e.target.value)} />
          </div>
          <div className="flex-1">
            <label>Время окончания</label>
            <input type="time" value={f.endTime || ''} onChange={e => set('endTime', e.target.value)} />
          </div>
        </div>

        <div>
          <label>Дедлайн принятия решения</label>

// ── Друзья ─────────────────────────────────────────────────────────────────
function PlannerFriendsView({ data, setData }) {
  const [editing, setEditing] = useState(null);
  const friends = data.plannerFriends || [];
  const events = data.plannerEvents || [];

  const save = (fr) => {
    setData(d => {
      const list = d.plannerFriends || [];
      const exists = list.some(x => x.id === fr.id);
      return {
        ...d,
        plannerFriends: exists ? list.map(x => x.id === fr.id ? fr : x) : [...list, fr],
      };
    });
    setEditing(null);
  };

  const remove = (fr) => {
    const usedIn = events.filter(e => (e.participantIds || []).includes(fr.id)).length;
    const warn = usedIn
      ? `\n\n${fr.name} будет убран(а) из ${usedIn} ${plannerPlural(usedIn, 'события', 'событий', 'событий')} — вместе со своими ответами.`
      : '';
    if (!confirm(`Удалить ${fr.name} из списка друзей?${warn}`)) return;
    setData(d => {
      const deleted = { ...(d.deletedIds || {}) };
      const stamp = (key, ids) => {
        if (!ids.length) return;
        const coll = { ...(deleted[key] || {}) };
        ids.forEach(id => { coll[String(id)] = Date.now(); });
        deleted[key] = coll;
      };
      stamp('plannerFriends', [fr.id]);
      stamp('plannerResponses', (d.plannerResponses || []).filter(r => r.friendId === fr.id).map(r => r.id));
      return {
        ...d,
        plannerFriends: (d.plannerFriends || []).filter(x => x.id !== fr.id),
        plannerResponses: (d.plannerResponses || []).filter(r => r.friendId !== fr.id),
        plannerEvents: (d.plannerEvents || []).map(e =>
          (e.participantIds || []).includes(fr.id)
            ? { ...e, participantIds: e.participantIds.filter(id => id !== fr.id) }
            : e),
        deletedIds: deleted,
      };
    });
  };

  const sorted = [...friends].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));

  return (
    <div>
      <button
        onClick={() => setEditing({ id: crypto.randomUUID(), name: '', contact: '' })}
        className="btn-primary w-full flex items-center justify-center gap-2 mb-4"
      >
        <Icon name="plus" size={18} />
        Добавить друга
      </button>

      {sorted.length === 0 ? (
        <EmptyState title="Список пуст" text="Добавьте друзей — потом отметите их участниками событий" />
      ) : (
        <div className="space-y-2">
          {sorted.map(fr => {
            const inEvents = events.filter(e => (e.participantIds || []).includes(fr.id)).length;
            return (
              <div key={fr.id} className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-3.5 flex items-center gap-3">
                <div className="w-9 h-9 rounded-full bg-[var(--bg)] border border-[var(--border)] flex items-center justify-center text-xs font-semibold text-[var(--text-muted)] flex-shrink-0">
                  {(fr.name || '?').trim().split(/\s+/).slice(0, 2).map(p => p.charAt(0).toUpperCase()).join('')}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-medium truncate">{fr.name}</div>
                  <div className="text-xs text-[var(--text-subtle)] truncate">
                    {[fr.contact, inEvents ? `в ${inEvents} ${plannerPlural(inEvents, 'событии', 'событиях', 'событиях')}` : null]
                      .filter(Boolean).join(' · ') || 'пока не в событиях'}
                  </div>
                </div>
                <div className="flex gap-1 flex-shrink-0">
                  <button onClick={() => setEditing(fr)} className="p-1.5 rounded-lg hover:bg-black/5 text-[var(--text-muted)]">
                    <Icon name="edit" size={15} />
                  </button>
                  <button onClick={() => remove(fr)} className="p-1.5 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500">
                    <Icon name="trash" size={15} />
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {editing && <PlannerFriendModal key={editing.id} initial={editing} onSave={save} onClose={() => setEditing(null)} />}
    </div>
  );
}

// ── Список покупок события (сторона организатора) ──────────────────────────
// Название и количество — свободный текст: «Молоко» / «2 л». Взять и снять
// отметку могут все — как и с отметкой о переводе денег, чтобы случайный
// тап не блокировал позицию до появления того, кто её изначально добавил.
function PlannerShoppingSection({ event: ev, nameById, items, onAdd, onDelete, onToggle }) {
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState('');
  const [qty, setQty] = useState('');

  const whoName = (id) => {
    if (!id) return '';
    if (id === 'organizer') return 'Организатор';
    return nameById[id] || 'Бывший участник';
  };

  const submit = () => {
    const trimmed = name.trim();
    if (!trimmed) return;
    onAdd({
      id: crypto.randomUUID(),
      eventId: ev.id,
      name: trimmed,
      qty: qty.trim(),
      takenBy: null,
      takenAt: 0,
      createdAt: Date.now(),
      updatedAt: Date.now(),
    });
    setName('');
    setQty('');
    setAdding(false);
  };

  const taken = items.filter(i => i.takenBy);
  const pending = items.filter(i => !i.takenBy);

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-2">
        <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)]">Список покупок</div>
        {!adding && (
          <button onClick={() => setAdding(true)} className="text-xs text-[var(--text-muted)] hover:text-[var(--text)] underline">
            добавить продукт
          </button>
        )}
      </div>

      {adding && (
        <div className="bg-[var(--bg)] border border-[var(--border)] rounded-xl p-3 mb-3 space-y-2">
          <div className="flex gap-2">
            <input
              value={name}
              onChange={e => setName(e.target.value)}
              placeholder="Продукт, например «Молоко»"
              autoFocus
              className="flex-[2] !py-2 !px-3 text-sm"
              onKeyDown={e => e.key === 'Enter' && submit()}
            />
            <input
              value={qty}
              onChange={e => setQty(e.target.value)}
              placeholder="Сколько, напр. «2 л»"
              className="flex-1 !py-2 !px-3 text-sm"
              onKeyDown={e => e.key === 'Enter' && submit()}
            />
          </div>
          <div className="flex gap-2">
            <button onClick={() => { setAdding(false); setName(''); setQty(''); }} className="btn-secondary !py-1.5 text-sm flex-1">Отмена</button>
            <button onClick={submit} className="btn-primary !py-1.5 text-sm flex-1">Добавить</button>
          </div>
        </div>
      )}

      {items.length === 0 && !adding ? (
        <div className="text-sm text-[var(--text-subtle)]">
          Список пуст. Добавьте продукты — участники смогут отмечать по ссылке, кто что взял в магазине.
        </div>
      ) : items.length > 0 && (
        <>
          <div className="text-sm text-[var(--text-muted)] mb-2">Взято {taken.length} из {items.length}</div>
          <div className="space-y-1.5">
            {[...pending, ...taken].map(it => (
              <div key={it.id} className="flex items-center gap-2 bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2">
                <button
                  onClick={() => onToggle(it)}
                  className={`check-box flex-shrink-0 ${it.takenBy ? 'checked' : ''}`}
                  style={{ width: 22, height: 22 }}
                  aria-label={it.takenBy ? 'Снять отметку' : 'Отметить взятым'}
                >
                  <Icon name="check" size={12} />
                </button>
                <div className="flex-1 min-w-0">
                  <div className={`text-sm font-medium truncate ${it.takenBy ? 'line-through text-[var(--text-subtle)]' : ''}`}>
                    {it.name}{it.qty ? ` — ${it.qty}` : ''}
                  </div>
                  {it.takenBy && (
                    <div className="text-xs text-[var(--text-subtle)] truncate">Взял(а): {whoName(it.takenBy)}</div>
                  )}
                </div>
                <button onClick={() => onDelete(it)} className="text-[var(--text-subtle)] hover:text-red-500 flex-shrink-0" title="Удалить">
                  <Icon name="x" size={14} />
                </button>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ── Расходы мероприятия (сторона организатора) ─────────────────────────────
// Считает тот же planner-split.js, что и гостевая страница события, поэтому
// суммы у организатора и у участника не могут разойтись.

const plannerMoney = (cents) => window.PlannerSplit.formatMoney(cents);

function PlannerExpensesSection({ event: ev, participants, expenses, payments,
                                  onAddExpense, onEditExpense, onDeleteExpense, onTogglePayment }) {
  const Split = window.PlannerSplit;
  const s = useMemo(() => Split.computeSettlement({
    eventId: ev.id, participants, expenses, payments,
  }), [ev.id, participants, expenses, payments]);

  // Все переводы события: строка есть у должника в owes — берём их разом.
  const transfers = useMemo(() => {
    const out = [];
    Object.keys(s.byParticipant).forEach(id => {
      s.byParticipant[id].owes.forEach(r => out.push(r));
    });
    return out.sort((a, b) => b.amount - a.amount);
  }, [s]);

  const settled = transfers.filter(t => t.paid).length;

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-2">
        <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)]">Расходы</div>
        <button onClick={onAddExpense} className="text-xs text-[var(--text-muted)] hover:text-[var(--text)] underline">
          добавить трату
        </button>
      </div>

      {expenses.length === 0 ? (
        <div className="text-sm text-[var(--text-subtle)]">
          Трат нет. Участники заносят их сами на странице события — или добавьте за кого-то из них.
        </div>
      ) : (
        <>
          <div className="text-sm text-[var(--text-muted)] mb-2">
            Всего {plannerMoney(s.totalSpent)}
            {transfers.length > 0 && <> · переводов {transfers.length}, отмечено {settled}</>}
          </div>

          <div className="space-y-1.5 mb-3">
            {expenses.map(e => {
              const payer = s.byParticipant[e.payerId];
              const count = e.splitMode === 'custom' ? (e.shares || []).length : (e.participantIds || []).length;
              return (
                <div key={e.id} className="flex items-start gap-2 bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2">
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-medium break-words">{e.title || 'Без описания'}</div>
                    <div className="text-xs text-[var(--text-subtle)] break-all">
                      {(payer?.name) || 'Бывший участник'} · {e.splitMode === 'custom' ? 'вручную' : 'поровну'} на {count} чел.
                      {e.payTo ? ` · ${e.payTo}` : ''}
                    </div>
                  </div>
                  <div className="text-sm font-semibold whitespace-nowrap">{plannerMoney(Split.toCents(e.amount))}</div>
                  <button onClick={() => onEditExpense(e)} className="text-[var(--text-subtle)] hover:text-[var(--text)] flex-shrink-0 mt-0.5" title="Изменить">
                    <Icon name="edit" size={13} />
                  </button>
                  <button onClick={() => onDeleteExpense(e)} className="text-[var(--text-subtle)] hover:text-red-500 flex-shrink-0 mt-0.5" title="Удалить трату">
                    <Icon name="x" size={14} />
                  </button>
                </div>
              );
            })}
          </div>

          {transfers.length > 0 && (
            <>
              <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] mb-2">Кто кому переводит</div>
              <div className="space-y-1.5">
                {transfers.map(t => (
                  <div key={`${t.fromId}>${t.toId}`}
                       className={`bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 ${t.paid ? 'opacity-60' : ''}`}>
                    <div className="flex items-center gap-2">
                      <div className="flex-1 min-w-0 text-sm break-words">
                        <span className="font-medium">{t.fromName}</span>
                        <span className="text-[var(--text-subtle)]"> → </span>
                        <span className="font-medium">{t.toName}</span>
                      </div>
                      <div className={`text-sm font-semibold whitespace-nowrap ${t.paid ? 'line-through text-[var(--text-subtle)]' : ''}`}>
                        {plannerMoney(t.amount)}
                      </div>
                      <button
                        onClick={() => onTogglePayment(t)}
                        className={`text-xs px-2 py-1 rounded-lg border flex-shrink-0 ${
                          t.paid
                            ? 'border-green-500 text-green-600'
                            : 'border-[var(--border-strong)] text-[var(--text-muted)]'
                        }`}
                      >{t.paid ? 'оплачено' : 'отметить'}</button>
                    </div>
                    {t.payTo && <div className="text-xs text-[var(--text-subtle)] mt-1 break-all">Куда: {t.payTo}</div>}
                    {t.items.length > 0 && (
                      <div className="text-xs text-[var(--text-muted)] mt-1 break-words">
                        {t.items.map((it, i) => (
                          <span key={`${it.expenseId}-${i}`}>
                            {i > 0 && ' · '}
                            {it.title} {Split.formatCents(it.cents)}
                          </span>
                        ))}
                      </div>
                    )}
                    {t.amountChangedAfterPaid && (
                      <div className="text-xs text-amber-600 mt-1">
                        Отметку ставили на {plannerMoney(t.markedAmount)} — сумма с тех пор изменилась.
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </>
          )}

          {transfers.length === 0 && (
            <div className="text-sm text-[var(--text-subtle)]">Все в расчёте — переводить никому не нужно.</div>
          )}
        </>
      )}
    </div>
  );
}

function PlannerExpenseModal({ initial, participants, expenses, onSave, onClose }) {
  const Split = window.PlannerSplit;
  const isNew = !initial.id;
  const [f, setF] = useState(() => ({
    id: initial.id || null,
    payerId: initial.payerId || (participants[0]?.id || ''),
    amount: initial.amount != null ? String(initial.amount).replace('.', ',') : '',
    title: initial.title || '',
    payTo: initial.payTo || '',
    splitMode: initial.splitMode === 'custom' ? 'custom' : 'equal',
    selected: initial.id
      ? Object.fromEntries((initial.splitMode === 'custom'
          ? (initial.shares || []).map(sh => sh.participantId)
          : (initial.participantIds || [])).map(id => [id, true]))
      : Object.fromEntries(participants.map(p => [p.id, true])),
    shares: Object.fromEntries((initial.shares || []).map(sh => [sh.participantId, String(sh.amount).replace('.', ',')])),
  }));
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));

  // Реквизиты подставляем из прошлых трат этого плательщика — их редко меняют.
  // При СМЕНЕ плательщика подстановку обязательно обновляем: иначе в трате
  // одного человека оставалась карта другого, и все, кто ему переводит,
  // отправили бы деньги не туда. Введённое руками не трогаем.
  const knownRequisites = useMemo(() => Split.requisitesOf(expenses), [expenses]);
  const payToTouched = useRef(false);
  const skipFirstPayerEffect = useRef(true);
  useEffect(() => {
    if (skipFirstPayerEffect.current) { skipFirstPayerEffect.current = false; return; }
    if (payToTouched.current) return;
    set('payTo', knownRequisites[f.payerId] || '');
  }, [f.payerId]);

  const payerName = (participants.find(p => p.id === f.payerId) || {}).name || '';
  const selectedIds = participants.filter(p => f.selected[p.id]).map(p => p.id);
  const totalCents = Split.toCents(f.amount);
  const sharesSum = selectedIds.reduce((acc, id) => acc + Split.toCents(f.shares[id] || 0), 0);
  const left = totalCents - sharesSum;
  const equalPreview = totalCents && selectedIds.length ? Split.splitEqually(totalCents, selectedIds) : null;

  const toggle = (id) => setF(x => {
    const selected = { ...x.selected };
    const shares = { ...x.shares };
    if (selected[id]) { delete selected[id]; delete shares[id]; } else selected[id] = true;
    return { ...x, selected, shares };
  });
  const allOn = participants.length > 0 && selectedIds.length === participants.length;
  const toggleAll = () => setF(x => ({
    ...x,
    selected: allOn ? {} : Object.fromEntries(participants.map(p => [p.id, true])),
    shares: allOn ? {} : x.shares,
  }));

  const submit = () => {
    if (!f.payerId) return alert('Выберите, кто заплатил');
    if (totalCents <= 0) return alert('Укажите сумму больше нуля');
    if (!selectedIds.length) return alert('Выберите, между кем делить');
    if (f.splitMode === 'custom' && left !== 0) {
      return alert(left > 0
        ? `Не распределено ${plannerMoney(left)}`
        : `Распределено больше суммы на ${plannerMoney(-left)}`);
    }
    onSave({
      id: f.id || crypto.randomUUID(),
      eventId: initial.eventId,
      payerId: f.payerId,
      amount: Split.fromCents(totalCents),
      title: f.title.trim(),
      payTo: f.payTo.trim(),
      splitMode: f.splitMode,
      participantIds: selectedIds,
      shares: f.splitMode === 'custom'
        ? selectedIds.map(id => ({ participantId: id, amount: Split.fromCents(Split.toCents(f.shares[id] || 0)) }))
        : [],
      createdAt: initial.createdAt || Date.now(),
    });
  };

  return (
    <Modal onClose={onClose} title={isNew ? 'Новая трата' : 'Трата'}>
      <div className="space-y-4">
        <div>
          <label>Кто заплатил</label>
          <select value={f.payerId} onChange={e => set('payerId', e.target.value)}>
            {participants.length === 0 && <option value="">Нет участников</option>}
            {participants.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>

        <div className="flex gap-3">
          <div className="flex-1">
            <label>Сумма, ₽</label>
            <input inputMode="decimal" value={f.amount} onChange={e => set('amount', e.target.value)} placeholder="1500" autoFocus />
          </div>
          <div className="flex-[2]">
            <label>За что</label>
            <input value={f.title} onChange={e => set('title', e.target.value)} placeholder="Аренда корта" maxLength={200} />
          </div>
        </div>

        <div>
          <label>Куда переводить деньги{payerName ? ` — ${payerName}` : ''}</label>
          <input
            value={f.payTo}
            onChange={e => { payToTouched.current = true; set('payTo', e.target.value); }}
            placeholder="Карта, телефон или ссылка"
            maxLength={200}
          />
        </div>

        <div>
          <label>Как делим</label>
          <div className="flex gap-2 mt-1">
            {[['equal', 'Поровну'], ['custom', 'Вручную']].map(([id, label]) => (
              <button
                key={id}
                onClick={() => set('splitMode', id)}
                className={`flex-1 py-2.5 rounded-xl text-sm font-medium transition-all ${
                  f.splitMode === id
                    ? 'bg-[var(--text)] text-white'
                    : 'bg-[var(--surface)] border border-[var(--border)] text-[var(--text-muted)]'
                }`}
              >{label}</button>
            ))}
          </div>
        </div>

        <div>
          <div className="flex items-center justify-between mb-1.5">
            <label className="!mb-0">Между кем делим</label>
            {participants.length > 0 && (
              <button onClick={toggleAll} className="text-xs text-[var(--text-muted)] hover:text-[var(--text)] underline">
                {allOn ? 'снять всех' : 'выбрать всех'}
              </button>
            )}
          </div>
          {participants.length === 0 ? (
            <div className="text-sm text-[var(--text-subtle)] border border-dashed border-[var(--border-strong)] rounded-xl p-3">
              В событии пока нет участников.
            </div>
          ) : (
            <div className="space-y-1.5 max-h-56 overflow-y-auto">
              {participants.map(p => {
                const on = !!f.selected[p.id];
                return (
                  <div key={p.id} className={`flex items-center gap-3 px-3 py-2 rounded-xl border ${
                    on ? 'border-[var(--text)] bg-[var(--surface)]' : 'border-[var(--border)] bg-[var(--bg)]'
                  }`}>
                    <input type="checkbox" className="!w-auto flex-shrink-0 accent-[var(--text)]" checked={on} onChange={() => toggle(p.id)} />
                    <span className="flex-1 min-w-0 text-sm break-all">{p.name}</span>
                    {f.splitMode === 'custom' && on ? (
                      <input
                        inputMode="decimal"
                        value={f.shares[p.id] || ''}
                        onChange={e => setF(x => ({ ...x, shares: { ...x.shares, [p.id]: e.target.value } }))}
                        placeholder="0"
                        className="!w-24 !py-1.5 !px-2 text-sm text-right"
                      />
                    ) : (
                      on && equalPreview && (
                        <span className="text-xs text-[var(--text-subtle)] whitespace-nowrap">
                          {Split.formatCents(equalPreview[p.id])} ₽
                        </span>
                      )
                    )}
                  </div>
                );
              })}
            </div>
          )}
          {f.splitMode === 'custom' && totalCents > 0 && (
            <div className={`text-[11px] mt-1.5 ${left === 0 ? 'text-[var(--text-subtle)]' : 'text-amber-600'}`}>
              {left === 0
                ? 'Распределено полностью.'
                : left > 0
                  ? `Осталось распределить ${plannerMoney(left)}`
                  : `Распределено больше суммы на ${plannerMoney(-left)}`}
            </div>
          )}
        </div>

        <div className="flex gap-3 pt-2">
          <button onClick={onClose} className="btn-secondary flex-1">Отмена</button>
          <button onClick={submit} className="btn-primary flex-1">Сохранить</button>
        </div>
      </div>
    </Modal>
  );
}
