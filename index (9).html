function MiniWeatherCard({ onClick }) {
  const [state, setState] = useState({ loading: true, error: null, data: null, location: null });

  useEffect(() => {
    let cancelled = false;

    const fetchByCoords = async (loc, forCity = '') => {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}` +
        `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m` +
        `&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Ошибка загрузки');
      const weather = await res.json();
      localStorage.setItem(WEATHER_MINI_CACHE_KEY, JSON.stringify({ ts: Date.now(), weather, location: loc, forCity }));
      if (!cancelled) setState({ loading: false, error: null, data: weather, location: loc });
    };

    const load = async () => {
      try {
        // Читаем город из настроек
        const weatherCity = (() => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return JSON.parse(raw || '{}')?.settings?.weatherCity || '';
          } catch { return ''; }
        })();

        // Кэш: использовать только если он для ТОГО ЖЕ настроенного города —
        // иначе после смены города до 30 минут показывалась погода старого.
        const cached = JSON.parse(localStorage.getItem(WEATHER_MINI_CACHE_KEY) || 'null');
        const cacheMatchesCity = cached && (cached.forCity || '') === weatherCity;
        if (cached && cacheMatchesCity && Date.now() - cached.ts < 30 * 60 * 1000) {
          if (!cancelled) setState({ loading: false, error: null, data: cached.weather, location: cached.location });
          return;
        }

        if (weatherCity) {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(weatherCity)}&format=json&limit=1`,
            { headers: { 'Accept-Language': 'ru' } }
          );
          const results = res.ok ? await res.json() : [];
          if (!results.length) throw new Error(`Город «${weatherCity}» не найден`);
          const { lat, lon, display_name } = results[0];
          const loc = { lat: parseFloat(lat), lon: parseFloat(lon), name: display_name.split(',')[0].trim() };
          await fetchByCoords(loc, weatherCity);
          return;
        }

        const savedLoc = JSON.parse(localStorage.getItem(WEATHER_LOC_KEY) || 'null');
        if (savedLoc) {
          await fetchByCoords(savedLoc);
          return;
        }

        // Нет сохранённых координат — пробуем геолокацию браузера
        if (navigator.geolocation && window.isSecureContext) {
          await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(
              async (pos) => {
                try {
                  const loc = { lat: pos.coords.latitude, lon: pos.coords.longitude, name: '' };
                  try {
                    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${loc.lat}&lon=${loc.lon}&format=json&accept-language=ru`);
                    if (r.ok) {
                      const j = await r.json();
                      loc.name = j.address?.city || j.address?.town || j.address?.village || `${loc.lat.toFixed(2)}, ${loc.lon.toFixed(2)}`;
                    }
                  } catch {}
                  localStorage.setItem(WEATHER_LOC_KEY, JSON.stringify(loc));
                  await fetchByCoords(loc);
                } catch (e2) {
                  if (!cancelled) setState({ loading: false, error: e2.message, data: null, location: null });
                }
                resolve();
              },
              async () => {
                // Геолокация запрещена — пробуем по IP
                try {
                  const r = await fetch('https://ipapi.co/json/');
                  if (!r.ok) throw new Error();
                  const j = await r.json();
                  if (!j.latitude || !j.longitude) throw new Error();
                  const loc = { lat: j.latitude, lon: j.longitude, name: j.city || j.region || '' };
                  localStorage.setItem(WEATHER_LOC_KEY, JSON.stringify(loc));
                  await fetchByCoords(loc);
                } catch {
                  if (!cancelled) setState({ loading: false, error: 'Задайте город в Настройках → Общее', data: null, location: null });
                }
                resolve();
              },
              { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
            );
          });
          return;
        }

        // Геолокация недоступна — по IP
        try {
          const r = await fetch('https://ipapi.co/json/');
          if (!r.ok) throw new Error();
          const j = await r.json();
          if (!j.latitude || !j.longitude) throw new Error();
          const loc = { lat: j.latitude, lon: j.longitude, name: j.city || j.region || '' };
          localStorage.setItem(WEATHER_LOC_KEY, JSON.stringify(loc));
          await fetchByCoords(loc);
        } catch {
          if (!cancelled) setState({ loading: false, error: 'Задайте город в Настройках → Общее', data: null, location: null });
        }
      } catch (e) {
        if (!cancelled) setState({ loading: false, error: e.message, data: null, location: null });
      }
    };

    load();
    const interval = setInterval(load, 30 * 60 * 1000);
    return () => { cancelled = true; clearInterval(interval); };
  }, []);

  return (
    <div
      onClick={onClick}
      className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-6 cursor-pointer transition-all hover:border-[var(--border-strong)]"
    >
      <div className="flex items-center justify-between mb-4">
        <div className="text-xs uppercase tracking-widest text-[var(--text-subtle)] font-medium">Погода</div>
        {state.location && (
          <div className="flex items-center gap-1 text-xs text-[var(--text-subtle)]">
            <Icon name="mapPin" size={12} />
            <span className="truncate max-w-[120px]">{state.location.name}</span>
          </div>
        )}
      </div>

      {state.loading && (
        <div className="text-[var(--text-muted)] text-sm py-6">Загрузка...</div>
      )}

      {!state.loading && state.error && (
        <div className="py-2">
          <div className="text-[var(--text-muted)] text-sm">{state.error}</div>
          <div className="text-xs text-[var(--text-subtle)] mt-1">Нажмите чтобы открыть Погоду</div>
        </div>
      )}

      {!state.loading && state.data && (() => {
        const cur = state.data.current;
        const daily = state.data.daily;
        const info = getWeatherInfo(cur.weather_code);
        return (
          <div className="flex items-center justify-between gap-4">
            <div>
              <div className="font-display text-6xl leading-none mb-2">
                {Math.round(cur.temperature_2m)}°
              </div>
              <div className="text-[var(--text-muted)] text-sm">{info.label}</div>
              <div className="text-xs text-[var(--text-subtle)] mt-1">
                ↑ {Math.round(daily.temperature_2m_max[0])}° / ↓ {Math.round(daily.temperature_2m_min[0])}°
              </div>
              <div className="text-xs text-[var(--text-subtle)] mt-1 flex items-center gap-3">
                <span>Ощущается {Math.round(cur.apparent_temperature)}°</span>
                <span className="flex items-center gap-1">
                  <Icon name="wind" size={11} />
                  {Math.round(cur.wind_speed_10m)} км/ч
                </span>
              </div>
            </div>
            <div className="text-[var(--text)] opacity-90 flex-shrink-0">
              <Icon name={info.icon} size={72} />
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function CommuteCard({ settings }) {
  const { homeAddress, workAddress, tomtomKey } = settings || {};
  const [state, setState] = useState({ loading: true, error: null, data: null });

  const isConfigured = homeAddress && workAddress && tomtomKey;

  const fetchCommute = async () => {
    setState(s => ({ ...s, loading: true, error: null }));
    try {
      // 1. Геокод через Nominatim (бесплатно, без ключа)
      const geocode = async (q) => {
        const u = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`;
        const r = await fetch(u, { headers: { 'Accept-Language': 'ru' } });
        if (!r.ok) throw new Error(`Геокод не удался (${r.status})`);
        const j = await r.json();
        if (!j.length) throw new Error(`Адрес не найден: ${q}`);
        return { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon) };
      };

      const [from, to] = await Promise.all([geocode(homeAddress), geocode(workAddress)]);

      // 2. Маршрут с пробками
      const routeUrl = `https://api.tomtom.com/routing/1/calculateRoute/${from.lat},${from.lon}:${to.lat},${to.lon}/json` +
        `?key=${tomtomKey}&traffic=true&travelMode=car&computeTravelTimeFor=all`;
      const r = await fetch(routeUrl);
      if (!r.ok) throw new Error(`Маршрут не удался (${r.status})`);
      const j = await r.json();
      if (!j.routes?.length) throw new Error('Маршрут не найден');

      const summary = j.routes[0].summary;
      const result = {
        travelTimeSec: summary.travelTimeInSeconds, // с учётом пробок
        noTrafficTimeSec: summary.noTrafficTravelTimeInSeconds,
        distanceMeters: summary.lengthInMeters,
        ts: Date.now(),
      };
      localStorage.setItem(COMMUTE_CACHE_KEY, JSON.stringify(result));
      setState({ loading: false, error: null, data: result });
    } catch (e) {
      // Попробовать показать кэш
      try {
        const cached = JSON.parse(localStorage.getItem(COMMUTE_CACHE_KEY) || 'null');
        if (cached) {
          setState({ loading: false, error: e.message, data: { ...cached, stale: true } });
          return;
        }
      } catch {}
      setState({ loading: false, error: e.message, data: null });
    }
  };

  useEffect(() => {
    if (!isConfigured) {
      setState({ loading: false, error: null, data: null });
      return;
    }
    fetchCommute();
    const interval = setInterval(fetchCommute, 10 * 60 * 1000); // 10 минут
    return () => clearInterval(interval);
  }, [homeAddress, workAddress, tomtomKey]);

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-6">
      <div className="flex items-center justify-between mb-4">
        <div className="text-xs uppercase tracking-widest text-[var(--text-subtle)] font-medium">До работы</div>
        <div className="flex items-center gap-3">
          {isConfigured && !state.loading && (
            <button onClick={fetchCommute} className="text-[10px] text-[var(--text-subtle)] hover:text-[var(--text-muted)] transition-colors leading-none">
              обновить
            </button>
          )}
          <div className="text-[var(--text-muted)] flex-shrink-0">
            <Icon name="car" size={18} />
          </div>
        </div>
      </div>

      {!isConfigured && (
        <div className="py-2">
          <div className="text-[var(--text-muted)] text-sm">Не настроено</div>
          <div className="text-xs text-[var(--text-subtle)] mt-1">
            Укажите адреса и TomTom API-ключ в Настройках → Общее
          </div>
        </div>
      )}

      {isConfigured && state.loading && (
        <div className="text-[var(--text-muted)] text-sm py-6">Загрузка...</div>
      )}

      {isConfigured && !state.loading && state.data && (() => {
        const min = Math.round(state.data.travelTimeSec / 60);
        const noTrafficMin = Math.round(state.data.noTrafficTimeSec / 60);
        const trafficDelay = min - noTrafficMin;
        const km = (state.data.distanceMeters / 1000).toFixed(1);
        return (
          <div>
            <div className="flex items-baseline gap-2 mb-2">
              <div className="font-display text-6xl leading-none">{min}</div>
              <div className="text-[var(--text-muted)] text-xl">мин</div>
            </div>
            <div className="text-[var(--text-muted)] text-sm">
              {km} км · в пути ~{noTrafficMin} мин
            </div>
            {trafficDelay > 1 && (
              <div className="text-sm mt-2" style={{ color: trafficDelay > 10 ? '#b00020' : 'var(--text-muted)' }}>
                Пробки: +{trafficDelay} мин
              </div>
            )}
            {trafficDelay <= 1 && (
              <div className="text-sm mt-2 text-[var(--text-subtle)]">Без пробок</div>
            )}
            {state.data.stale && (
              <div className="text-xs text-[var(--text-subtle)] mt-2 italic">Данные из кэша</div>
            )}
          </div>
        );
      })()}

      {isConfigured && !state.loading && state.error && !state.data && (
        <div className="py-2">
          <div className="text-[var(--text-muted)] text-sm">Ошибка</div>
          <div className="text-xs text-[var(--text-subtle)] mt-1 break-words">{state.error}</div>
          <button onClick={fetchCommute} className="btn-ghost text-xs mt-2 p-0">Повторить</button>
        </div>
      )}
    </div>
  );
}

const ChevronRight = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M9 18l6-6-6-6"/>

function RationWidget({ data, setData, onGo }) {
  const rations = data.rationStock ?? 0;
  const RATIONS_PER_DAY = 2;
  const wholeDays = Math.floor(rations / RATIONS_PER_DAY);
  const halfDay = (rations % RATIONS_PER_DAY) > 0;

  const consume = (e) => {
    e.stopPropagation();
    if (rations <= 0) return;
    setData(d => ({ ...d, rationStock: (d.rationStock ?? 0) - 1 }));
  };

  const daysLabel = () => {
    if (rations === 0) return 'Рационов нет';
    const parts = [];
    if (wholeDays > 0) parts.push(`${wholeDays} ${pluralRu(wholeDays, ['день', 'дня', 'дней'])}`);
    if (halfDay) parts.push('½ дня');
    return `На ${parts.join(' и ')}`;
  };

  const urgency = rations === 0 ? '#ef4444' : wholeDays < 2 ? '#f59e0b' : 'var(--text)';

  return (
    <div
      onClick={onGo}
      className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-6 cursor-pointer transition-all hover:border-[var(--border-strong)]"
    >
      <div className="flex items-center justify-between mb-4">
        <div className="text-xs uppercase tracking-widest text-[var(--text-subtle)] font-medium">Счётчик рационов</div>
        <Icon name="plate" size={16} />
      </div>

      <div className="flex items-center justify-between gap-4">
        <div>
          <div className="font-display text-5xl leading-none mb-1" style={{ color: urgency }}>{rations}</div>
          <div className="text-sm" style={{ color: urgency === 'var(--text)' ? 'var(--text-muted)' : urgency }}>
            {daysLabel()}
          </div>
        </div>
        <button
          onClick={consume}
          disabled={rations <= 0}
          className={`flex-shrink-0 w-14 h-14 rounded-2xl flex items-center justify-center text-2xl font-bold transition-all ${
            rations > 0
              ? 'bg-[var(--text)] text-white active:scale-90'
              : 'bg-[var(--border)] text-[var(--text-subtle)] cursor-not-allowed'
          }`}
        >
          −1
        </button>
      </div>
    </div>
  );
}

  const consume = (e) => {
    e.stopPropagation();
    if (rations <= 0) return;

  const urgency = rations === 0 ? '#ef4444' : daysLeft < 2 ? '#f59e0b' : 'var(--text)';

function BossWidget({ data, onGo }) {
  const period = getBossPeriod();
  const today  = new Date().getDay();

  const tasks = period
    ? (data.bossTasks || []).filter(t =>
        !t.archived && t.period === period && t.days.includes(today)
      )
    : [];

  const periodLabel = period === 'morning' ? 'Утро' : period === 'evening' ? 'Вечер' : null;
  const periodIcon  = period === 'morning' ? 'sun' : 'moon';

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-6">
      <button
        onClick={onGo}
        className="w-full flex items-center justify-between mb-4 group"
      >
        <div className="text-xs uppercase tracking-widest text-[var(--text-subtle)] font-medium">Босс</div>
        <span className="text-[var(--text-subtle)] group-hover:text-[var(--text)] transition-colors">
          <ChevronRight />
        </span>
      </button>

      {!period ? (
        <div className="text-[var(--text-muted)] text-sm">Нет задач сейчас</div>
      ) : tasks.length === 0 ? (
        <div>
          <div className="flex items-center gap-1.5 text-xs text-[var(--text-muted)] mb-2">
            <Icon name={periodIcon} size={13} />
            {periodLabel}
          </div>
          <div className="text-[var(--text-muted)] text-sm">Нет задач</div>
        </div>
      ) : (
        <div>
          <div className="flex items-center gap-1.5 text-xs text-[var(--text-muted)] mb-3">
            <Icon name={periodIcon} size={13} />
            {periodLabel}
          </div>
          <div className="space-y-2">
            {tasks.map(t => (
              <div key={t.id} className="flex items-center gap-2.5 text-sm">
                <div className="w-1.5 h-1.5 rounded-full bg-[var(--text)] flex-shrink-0" />
                <span>{t.name}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function WeatherView({ settings }) {
  const [status, setStatus] = useState('loading'); // loading | ready | error | denied
  const [data, setData] = useState(null);
  const [location, setLocation] = useState(null);
  const [error, setError] = useState('');
  const weatherCity = (settings || {}).weatherCity || '';

  const fetchWeather = async (lat, lon) => {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day` +
      `&hourly=temperature_2m,weather_code,precipitation_probability` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,wind_speed_10m_max` +
      `&timezone=auto&forecast_days=7`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Не удалось загрузить погоду');
    return await res.json();
  };

  const reverseGeocode = async (lat, lon) => {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ru`);
      if (!res.ok) return null;
      const j = await res.json();
      return j.address?.city || j.address?.town || j.address?.village || j.address?.county || null;
    } catch { return null; }
  };

  const loadByCoords = async (lat, lon, cityName, forCity = '') => {
    try {
      const weather = await fetchWeather(lat, lon);
      const name = cityName || await reverseGeocode(lat, lon) || `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
      setData(weather);
      setLocation({ lat, lon, name });
      localStorage.setItem(WEATHER_LOC_KEY, JSON.stringify({ lat, lon, name }));
      localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({
        ts: Date.now(), weather, location: { lat, lon, name }, forCity
      }));
      setStatus('ready');
    } catch (e) {
      setError(e.message);
      setStatus('error');
    }
  };

  const geocodeCity = async (cityName) => {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cityName)}&format=json&limit=1&accept-language=ru`,
      { headers: { 'Accept-Language': 'ru' } }
    );
    if (!res.ok) throw new Error('Не удалось геокодировать город');
    const results = await res.json();
    if (!results.length) throw new Error(`Город «${cityName}» не найден`);
    const { lat, lon, display_name } = results[0];
    const shortName = display_name.split(',')[0].trim();
    return { lat: parseFloat(lat), lon: parseFloat(lon), name: shortName };
  };

  const loadByCity = async (cityName) => {
    try {
      setStatus('loading');
      const coords = await geocodeCity(cityName);
      await loadByCoords(coords.lat, coords.lon, coords.name, cityName);
    } catch (e) {
      setError(e.message);
      setStatus('error');
    }
  };

  const loadByIP = async () => {
    try {
      setStatus('loading');
      const res = await fetch('https://ipapi.co/json/');
      if (!res.ok) throw new Error('Не удалось определить местоположение по IP');
      const j = await res.json();
      if (!j.latitude || !j.longitude) throw new Error('IP-сервис не вернул координаты');
      await loadByCoords(j.latitude, j.longitude, j.city || j.region || null);
    } catch (e) {
      setError(`Не удалось определить по IP: ${e.message}`);
      setStatus('error');
    }
  };

  const requestLocation = () => {
    if (weatherCity) { loadByCity(weatherCity); return; }
    if (!navigator.geolocation) {
      setError('Геолокация не поддерживается. Попробуйте определить по IP.');
      setStatus('error');
      return;
    }
    if (!window.isSecureContext) {
      setError('Геолокация работает только по HTTPS. Откройте сайт через https:// или используйте IP.');
      setStatus('error');
      return;
    }
    setStatus('loading');
    navigator.geolocation.getCurrentPosition(
      (pos) => loadByCoords(pos.coords.latitude, pos.coords.longitude),
      (err) => {
        const messages = {
          1: 'Доступ к геолокации запрещён',
          2: 'Местоположение недоступно (нет сигнала GPS/WiFi)',
          3: 'Время ожидания истекло',
        };
        const msg = messages[err.code] || err.message || 'Неизвестная ошибка';
        if (err.code === 1) setStatus('denied');
        else { setError(`${msg} (код ${err.code})`); setStatus('error'); }
      },
      { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 }
    );
  };

  useEffect(() => {
    // Если задан город в настройках — всегда загружаем по нему (кэш только если город не менялся)
    if (weatherCity) {
      try {
        const cached = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY) || 'null');
        // Кэш валиден только для ЭТОГО города — после смены города в
        // настройках старый кэш игнорируется, а не показывается ещё 30 минут.
        if (cached && (cached.forCity || '') === weatherCity && Date.now() - cached.ts < 30 * 60 * 1000) {
          setData(cached.weather);
          setLocation(cached.location);
          setStatus('ready');
          return;
        }
      } catch {}
      loadByCity(weatherCity);
      return;
    }
    // Иначе: кэш → сохранённые координаты → геолокация
    try {
      const cached = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY) || 'null');
      if (cached && !cached.forCity && Date.now() - cached.ts < 30 * 60 * 1000) {
        setData(cached.weather);
        setLocation(cached.location);
        setStatus('ready');
        return;
      }
      const savedLoc = JSON.parse(localStorage.getItem(WEATHER_LOC_KEY) || 'null');
      if (savedLoc) {
        loadByCoords(savedLoc.lat, savedLoc.lon, savedLoc.name);
        return;
      }
    } catch {}
    requestLocation();
  }, [weatherCity]);

  return (
    <div className="fade-in">
      <div className="mb-6 flex items-center justify-between gap-4">
        <div className="flex items-baseline gap-3 min-w-0">
          <div className="font-display text-2xl">Погода</div>
          {location
            ? <div className="flex items-center gap-1 text-[var(--text-subtle)] text-xs flex-shrink-0"><Icon name="mapPin" size={12} /><span>{location.name}</span></div>
            : <div className="text-[var(--text-subtle)] text-xs uppercase tracking-widest flex-shrink-0">Прогноз</div>
          }
        </div>
        {status === 'ready' && (
          <button onClick={requestLocation} className="btn-ghost flex items-center gap-2 text-sm flex-shrink-0">
            <Icon name="restore" size={14} />
            Обновить
          </button>
        )}
      </div>

      {status === 'loading' && (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-12 text-center">
          <div className="text-[var(--text-muted)]">Загрузка...</div>
        </div>
      )}

      {status === 'denied' && (
        <div className="bg-[var(--surface)] border border-dashed border-[var(--border-strong)] rounded-2xl p-10 text-center">
          <div className="font-display text-2xl mb-2">Нужен доступ к местоположению</div>
          <div className="text-[var(--text-muted)] text-sm mb-6">Разрешите доступ в настройках браузера или определите по IP</div>
          <div className="flex gap-3 justify-center flex-wrap">
            <button onClick={requestLocation} className="btn-primary">Попробовать снова</button>
            <button onClick={loadByIP} className="btn-secondary">По IP</button>
          </div>
        </div>
      )}

      {status === 'error' && (
        <div className="bg-[var(--surface)] border border-dashed border-[var(--border-strong)] rounded-2xl p-10 text-center">
          <div className="font-display text-2xl mb-2">Не удалось получить погоду</div>
          <div className="text-[var(--text-muted)] text-sm mb-6 max-w-md mx-auto">{error}</div>
          <div className="flex gap-3 justify-center flex-wrap">
            <button onClick={requestLocation} className="btn-primary">Повторить</button>
            <button onClick={loadByIP} className="btn-secondary">По IP</button>
          </div>
        </div>
      )}

      {status === 'ready' && data && (
        <>
          <WeatherCurrent data={data} />
          <WeatherToday data={data} />
          <WeatherWeek data={data} />
        </>
      )}
    </div>
  );
}

function WeatherCurrent({ data }) {
  const cur = data.current;
  const today = data.daily;
  const info = getWeatherInfo(cur.weather_code);
  const tMax = Math.round(today.temperature_2m_max[0]);
  const tMin = Math.round(today.temperature_2m_min[0]);

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-6 mb-6">
      <div className="flex items-center justify-between gap-6 mb-6">
        <div>
          <div className="font-display text-5xl sm:text-7xl leading-none mb-2">
            {Math.round(cur.temperature_2m)}°
          </div>
          <div className="text-[var(--text-muted)] text-base">{info.label}</div>
          <div className="text-[var(--text-subtle)] text-sm mt-1">
            Ощущается как {Math.round(cur.apparent_temperature)}° · ↑ {tMax}° / ↓ {tMin}°
          </div>
        </div>
        <div className="text-[var(--text)] opacity-90">
          <span className="hidden sm:block"><Icon name={info.icon} size={88} /></span>
          <span className="sm:hidden"><Icon name={info.icon} size={64} /></span>
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-5 border-t border-[var(--border)]">
        <WeatherStat icon="droplet" label="Влажность" value={`${cur.relative_humidity_2m}%`} />
        <WeatherStat icon="wind" label="Ветер" value={`${Math.round(cur.wind_speed_10m)} км/ч`} />
        <WeatherStat icon="sunrise" label="Восход" value={formatTime(today.sunrise[0])} />
        <WeatherStat icon="sunset" label="Закат" value={formatTime(today.sunset[0])} />
      </div>
    </div>
  );
}

function WeatherStat({ icon, label, value }) {
  return (
    <div className="flex items-center gap-3">
      <div className="text-[var(--text-muted)] flex-shrink-0"><Icon name={icon} size={20} /></div>
      <div className="min-w-0">
        <div className="text-xs text-[var(--text-subtle)] uppercase tracking-wider">{label}</div>
        <div className="font-medium truncate">{value}</div>
      </div>
    </div>
  );
}

function WeatherToday({ data }) {
  const now = new Date();
  const nowISO = now.toISOString().slice(0, 13);

  // Берём 24 часа начиная с текущего
  const hourly = data.hourly;
  const startIdx = hourly.time.findIndex(t => t.slice(0, 13) >= nowISO);
  const idx = startIdx === -1 ? 0 : startIdx;
  const slice = hourly.time.slice(idx, idx + 24);

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 mb-6">
      <div className="text-xs uppercase tracking-widest text-[var(--text-subtle)] mb-4 font-medium">Сегодня по часам</div>
      <div className="overflow-x-auto scrollbar-hide -mx-5 px-5">
        <div className="flex gap-2 pb-1" style={{ minWidth: 'min-content' }}>
          {slice.map((t, i) => {
            const realIdx = idx + i;
            const hour = new Date(t).getHours();
            const code = hourly.weather_code[realIdx];
            const temp = Math.round(hourly.temperature_2m[realIdx]);
            const pop = hourly.precipitation_probability[realIdx];
            const info = getWeatherInfo(code);
            const isNow = i === 0;
            return (
              <div
                key={t}
                className={`flex-shrink-0 w-16 rounded-xl py-3 px-1 text-center ${
                  isNow ? 'bg-[var(--text)] text-white' : ''
                }`}
              >
                <div className={`text-xs ${isNow ? 'text-white/70' : 'text-[var(--text-subtle)]'}`}>
                  {isNow ? 'сейчас' : `${hour}:00`}
                </div>
                <div className={`my-2 flex justify-center ${isNow ? 'text-white' : 'text-[var(--text)]'}`}>
                  <Icon name={info.icon} size={22} />
                </div>
                <div className={`font-medium text-sm ${isNow ? 'text-white' : ''}`}>{temp}°</div>
                {pop > 10 && (
                  <div className={`text-[10px] mt-1 ${isNow ? 'text-white/60' : 'text-[var(--text-subtle)]'}`}>
                    {pop}%
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function WeatherWeek({ data }) {
  const d = data.daily;
  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
      <div className="text-xs uppercase tracking-widest text-[var(--text-subtle)] mb-2 font-medium">На неделю</div>
      <div className="divide-y divide-[var(--border)]">
        {d.time.map((t, i) => {
          const date = new Date(t);
          const info = getWeatherInfo(d.weather_code[i]);
          const max = Math.round(d.temperature_2m_max[i]);
          const min = Math.round(d.temperature_2m_min[i]);
          const pop = d.precipitation_probability_max[i];
          const wind = Math.round(d.wind_speed_10m_max[i]);
          const isToday = i === 0;
          return (
            <div key={t} className="py-3 flex items-center gap-4">
              <div className="w-20 flex-shrink-0">
                <div className={`font-medium ${isToday ? 'text-[var(--text)]' : ''}`}>
                  {isToday ? 'Сегодня' : WEEKDAY_FULL[date.getDay()]}
                </div>
                <div className="text-xs text-[var(--text-subtle)]">
                  {date.getDate()} {monthShort(date.getMonth())}
                </div>
              </div>
              <div className="text-[var(--text)] flex-shrink-0">
                <Icon name={info.icon} size={28} />
              </div>
              <div className="flex-1 min-w-0">
                <div className="text-sm truncate">{info.label}</div>
                <div className="text-xs text-[var(--text-subtle)] flex items-center gap-3">
                  {pop > 10 && (
                    <span className="flex items-center gap-1">
                      <Icon name="droplet" size={11} />
                      {pop}%
                    </span>
                  )}
                  <span className="flex items-center gap-1">
                    <Icon name="wind" size={11} />
                    {wind} км/ч
                  </span>
                </div>
              </div>
              <div className="text-right flex-shrink-0">
                <div className="font-medium">{max}°</div>
                <div className="text-sm text-[var(--text-subtle)]">{min}°</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const formatTime = (iso) => {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};
const monthShort = (m) => ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'][m];
const monthFullLower = (m) => ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'][m];

function BackupSettings({ data, setData }) {
  const [sending, setSending] = useState(false);
  const [result, setResult] = useState(null); // { ok, error?, sentTo?, recipients?, sizeBytes? }

  const reminder = (data.settings || {}).backupReminder
    || { enabled: false, frequency: 'weekly', time: '03:00', dayOfWeek: 0, dayOfMonth: 1 };
  const lastSentAt = (data.settings || {}).lastBackupSentAt || '';

  const setReminder = (patch) => setData(d => ({
    ...d,
    settings: {
      ...DEFAULT_SETTINGS, ...(d.settings || {}),
      backupReminder: {
        ...(d.settings || {}).backupReminder || { enabled: false, frequency: 'weekly', time: '03:00', dayOfWeek: 0, dayOfMonth: 1 },
        ...patch,
      },
      updatedAt: Date.now(),
    },
  }));

  const sendNow = async () => {
    setSending(true);
    setResult(null);
    try {
      const res = await fetch('/api/backup/send-now', { method: 'POST' });
      const json = await res.json();
      setResult(res.ok ? { ok: true, ...json } : { ok: false, error: json.error || 'Ошибка' });
    } catch (e) {
      setResult({ ok: false, error: 'Не удалось связаться с сервером' });
    }
    setSending(false);
  };

  const fmtBytes = (n) => {
    if (!n) return '';
    if (n < 1024 * 1024) return `${Math.round(n / 1024)} КБ`;
    return `${(n / (1024 * 1024)).toFixed(1)} МБ`;
  };
  const fmtDate = (iso) => {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString('ru-RU'); } catch { return iso; }
  };

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 space-y-4">
      <div className="flex items-start justify-between gap-4">
        <div>
          <h3 className="font-display text-lg mb-1">Резервное копирование</h3>
          <p className="text-sm text-[var(--text-muted)]">
            Полный бэкап проекта (код сайта + все данные, включая фото) файлом в Telegram — на случай, если Railway или GitHub станут недоступны.
          </p>
        </div>
        <button onClick={() => setReminder({ enabled: !reminder.enabled })}
          className={`relative w-11 h-6 rounded-full transition-colors shrink-0 ${reminder.enabled ? 'bg-green-500' : 'bg-[var(--border)]'}`}>
          <span className={`absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform ${reminder.enabled ? 'translate-x-5' : ''}`} />
        </button>
      </div>

      {reminder.enabled && (
        <div className="space-y-3">
          <div>
            <label className="block text-xs text-[var(--text-muted)] font-medium mb-1.5">Периодичность</label>
            <select value={reminder.frequency} onChange={e => setReminder({ frequency: e.target.value })}
              className="bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]">
              <option value="daily">Ежедневно</option>
              <option value="weekly">Раз в неделю</option>
              <option value="monthly">Раз в месяц</option>
            </select>
          </div>

          <div>
            <label className="block text-xs text-[var(--text-muted)] font-medium mb-1.5">Время</label>
            <MskTimeInput value={reminder.time || '03:00'} onChange={t => setReminder({ time: t })} hint
              className="bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]" />
          </div>

          {reminder.frequency === 'weekly' && (
            <div>
              <label className="block text-xs text-[var(--text-muted)] font-medium mb-1.5">День недели</label>
              <div className="flex flex-wrap gap-1.5">
                {WEEKDAYS.map(w => (
                  <button key={w.id} onClick={() => setReminder({ dayOfWeek: w.id })}
                    className={`w-10 h-10 rounded-xl text-sm font-medium transition-all ${reminder.dayOfWeek === w.id ? 'bg-[var(--text)] text-white' : 'bg-[var(--bg)] border border-[var(--border)] text-[var(--text-muted)]'}`}>
                    {w.label}
                  </button>
                ))}
              </div>
            </div>
          )}

          {reminder.frequency === 'monthly' && (
            <div>
              <label className="block text-xs text-[var(--text-muted)] font-medium mb-1.5">Число месяца</label>
              <select value={reminder.dayOfMonth || 1} onChange={e => setReminder({ dayOfMonth: Number(e.target.value) })}

            </div>

          <p className="text-xs text-[var(--text-subtle)]">

          </p>
        </div>
      )}

      <div className="pt-1 border-t border-[var(--border)] space-y-2">
        <button onClick={sendNow} disabled={sending}
          className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium border border-[var(--border)] text-[var(--text-muted)] hover:text-[var(--text)] transition-all disabled:opacity-50">

          <div className="text-xs text-red-500">Ошибка: {result.error}</div>
        )}
      </div>
    </div>
  );
}

function NotifyRoutingSettings({ data, setData }) {
  const [subs, setSubs] = useState(null); // null = loading, [] = loaded empty
  const [error, setError] = useState(false);

  const routing = (data.settings || {}).notifyRouting || {};

  const load = () => {
    setError(false);
    fetch('/api/subscribers')
      .then(r => r.json())
      .then(json => setSubs(json.subscribers || []))
      .catch(() => setError(true));
  };

  useEffect(() => { load(); }, []);

  const isAllowed = (chatId, catId) => {
    const list = routing[chatId];
    return list ? list.includes(catId) : true; // no entry yet = everything enabled (backward compatible)
  };

  const toggle = (chatId, catId) => {
    setData(d => {
      const r = { ...((d.settings || {}).notifyRouting || {}) };
      const current = r[chatId] ? [...r[chatId]] : NOTIFICATION_CATEGORIES.map(c => c.id);
      const idx = current.indexOf(catId);
      if (idx >= 0) current.splice(idx, 1); else current.push(catId);
      r[chatId] = current;
      return { ...d, settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}), notifyRouting: r, updatedAt: Date.now() } };
    });
  };

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 space-y-4">
      <div className="flex items-start justify-between gap-4">
        <div>
          <h3 className="font-display text-lg mb-1">Маршрутизация уведомлений</h3>
          <p className="text-sm text-[var(--text-muted)]">
            Кто из подписчиков бота получает уведомления из каждого раздела. Без настройки — получают все.
          </p>
        </div>
        <button onClick={load} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)] shrink-0" title="Обновить список">
          <Icon name="restore" size={16} />
        </button>
      </div>

      {error && (
        <div className="text-sm text-red-500">Не удалось загрузить список подписчиков.</div>
      )}
      {subs === null && !error && (
        <div className="text-sm text-[var(--text-subtle)]">Загрузка...</div>
      )}
      {subs !== null && subs.length === 0 && (
        <div className="text-sm text-[var(--text-subtle)]">Пока никто не подписан — напишите боту в Telegram любое сообщение.</div>
      )}

      {subs && subs.length > 0 && (
        <div className="space-y-3">
          {subs.map(s => (
            <div key={s.chatId} className="border border-[var(--border)] rounded-xl p-3">
              <div className="text-sm font-medium mb-2">{s.name || `Без имени (${s.chatId})`}</div>
              <div className="flex flex-wrap gap-1.5">
                {NOTIFICATION_CATEGORIES.map(cat => {
                  const on = isAllowed(String(s.chatId), cat.id);
                  return (
                    <button key={cat.id} onClick={() => toggle(String(s.chatId), cat.id)}
                      className={`px-3 py-1.5 rounded-full text-xs font-medium border transition-all ${on ? 'bg-[var(--text)] text-white border-transparent' : 'border-[var(--border)] text-[var(--text-muted)] hover:bg-black/5'}`}>
                      {cat.label}
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ============== DAILY CHECKLIST ==============

const CHECKLIST_OPTION_COLORS = ['#22c55e', '#ef4444', '#f59e0b', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];
const CHECKLIST_CHART_DAYS = 90;

function normChecklistOption(opt, index) {
  if (typeof opt === 'string') {
    return { label: opt, color: CHECKLIST_OPTION_COLORS[index % CHECKLIST_OPTION_COLORS.length] };
  }
  return {
    label: (opt.label || opt.text || '').trim(),
    color: opt.color || CHECKLIST_OPTION_COLORS[index % CHECKLIST_OPTION_COLORS.length],
  };
}

function getFieldOptions(field) {
  return (field.options || []).map(normChecklistOption);
}

function getOptionColor(field, labelOrIndex) {
  const opts = getFieldOptions(field);
  if (typeof labelOrIndex === 'number') {
    return opts[labelOrIndex]?.color || CHECKLIST_OPTION_COLORS[0];
  }
  const idx = opts.findIndex(o => o.label === labelOrIndex);
  return opts[idx >= 0 ? idx : 0]?.color || CHECKLIST_OPTION_COLORS[0];
}

function labelsToOptions(labels) {
  return labels.map((label, i) => ({
    label,
    color: CHECKLIST_OPTION_COLORS[i % CHECKLIST_OPTION_COLORS.length],
  }));
}

function buildChecklistChartDays(log, days = CHECKLIST_CHART_DAYS) {
  const byDate = Object.fromEntries(log.map(e => [e.date, e]));
  const chartDays = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = dateToLocalStr(d);
    chartDays.push({
      date: ds,
      entry: byDate[ds] || null,
      dow: d.getDay(),
      dayNum: d.getDate(),
      month: d.getMonth(),
    });
  }
  return chartDays;
}

function getChecklistFieldStats(field, log, periodDays) {
  const from = new Date();
  from.setDate(from.getDate() - periodDays + 1);
  const fromIso = dateToLocalStr(from);
  const today = getTodayKey();

  const periodDaysList = [];
  for (let i = periodDays - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    periodDaysList.push(dateToLocalStr(d));
  }

  const answered = log.filter(e => e.date >= fromIso && e.answers?.[field.id]);
  const opts = getFieldOptions(field);
  const counts = {};
  opts.forEach(o => { counts[o.label] = 0; });
  answered.forEach(e => {
    const v = e.answers[field.id];
    if (v != null) counts[v] = (counts[v] || 0) + 1;
  });

  const totalAnswered = answered.length;
  const fillPct = Math.round((totalAnswered / periodDays) * 100);

  let streak = 0;
  for (let i = periodDaysList.length - 1; i >= 0; i--) {
    const ds = periodDaysList[i];
    if (ds > today) continue;
    const entry = log.find(e => e.date === ds);
    if (entry?.answers?.[field.id]) streak++;
    else break;
  }

  const primaryOpt = opts[0]?.label;
  const primaryCount = primaryOpt ? (counts[primaryOpt] || 0) : 0;
  const primaryPct = totalAnswered > 0 ? Math.round((primaryCount / totalAnswered) * 100) : 0;

  const segments = opts
    .map(opt => ({ label: opt.label, value: counts[opt.label] || 0, color: opt.color }))
    .filter(s => s.value > 0);

  return { fromIso, totalAnswered, fillPct, streak, primaryOpt, primaryPct, primaryCount, counts, segments, periodDays };
}

function ChecklistDonut({ segments, size = 96 }) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  if (total === 0) {
    return (
      <div className="relative flex-shrink-0 rounded-full border-4 border-[var(--border)] bg-[var(--bg)]"
        style={{ width: size, height: size }}>
        <div className="absolute inset-0 flex items-center justify-center text-[10px] text-[var(--text-subtle)]">—</div>
      </div>
    );
  }
  let acc = 0;
  const stops = segments.map(seg => {
    const start = (acc / total) * 100;
    acc += seg.value;
    const end = (acc / total) * 100;
    return `${seg.color} ${start}% ${end}%`;
  }).join(', ');
  const lead = segments.reduce((best, s) => s.value > best.value ? s : best, segments[0]);
  const leadPct = Math.round((lead.value / total) * 100);
  return (
    <div className="relative flex-shrink-0" style={{ width: size, height: size }}>
      <div className="rounded-full" style={{
        width: size, height: size,
        background: `conic-gradient(${stops})`,
        WebkitMask: 'radial-gradient(circle, transparent 58%, black 59%)',
        mask: 'radial-gradient(circle, transparent 58%, black 59%)',
      }} />
      <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
        <span className="text-lg font-semibold leading-none">{leadPct}%</span>
        <span className="text-[9px] text-[var(--text-muted)] mt-0.5 max-w-[52px] truncate text-center">{lead.label}</span>
      </div>
    </div>
  );
}

function ChecklistFieldChart({ field, log, today, formatDate }) {
  const chartScrollRef = React.useRef(null);
  const chartDays = buildChecklistChartDays(log);
  const todayIndex = chartDays.findIndex(d => d.date === today);
  const stats30 = getChecklistFieldStats(field, log, 30);
  const stats90 = getChecklistFieldStats(field, log, CHECKLIST_CHART_DAYS);

  const opts = getFieldOptions(field);
  const optionColor = (label) => getOptionColor(field, label);

  const barW = 14, gap = 5, totalBarW = barW + gap;
  const TOP = 20, plotH = 64, svgH = TOP + plotH + 34;
  const bandH = plotH / Math.max(opts.length, 1);
  const svgW = chartDays.length * totalBarW;

  React.useEffect(() => {
    const el = chartScrollRef.current;
    if (!el || todayIndex < 0) return;
    const todayX = todayIndex * totalBarW + barW / 2;
    el.scrollLeft = todayX - el.offsetWidth / 2;

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 space-y-4">

                </div>

          })}

      )}

      {/* График 90 дней */}

        <div className="flex items-baseline justify-between mb-3">

        </div>
        <div className="overflow-x-auto scrollbar-hide -mx-1 px-1" ref={chartScrollRef}>
          <svg width={svgW} height={svgH} style={{ display: 'block' }}>
            {chartDays.map((day, i) => {
              const x = i * totalBarW;
              const cx = x + barW / 2;
              const answer = day.entry?.answers?.[field.id];
              const optIdx = answer != null ? opts.findIndex(o => o.label === answer) : -1;
              const isToday = day.date === today;
              const weekend = day.dow === 0 || day.dow === 6;
              const showMonth = i === 0 || day.dayNum === 1;
              const hasAnswer = optIdx >= 0;
              const color = hasAnswer ? optionColor(answer) : 'var(--border)';
              const y = hasAnswer ? TOP + plotH - (optIdx + 1) * bandH + 1 : TOP + plotH - 2;
              const h = hasAnswer ? Math.max(bandH - 2, 6) : 2;
              return (
                <g key={day.date}>
                  {showMonth && (
                    <text x={x} y={11} fontSize="9" fill="var(--text-subtle)" fontWeight="600">
                      {['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][day.month]}
                    </text>
                  )}
                  <rect x={x} y={y} width={barW} height={h} rx={hasAnswer ? 3 : 1} fill={color} opacity={hasAnswer ? 1 : 0.5} />
                  {isToday && (
                    <rect x={x - 1} y={TOP - 3} width={barW + 2} height={plotH + 6} rx={4}
                      fill="none" stroke="var(--text)" strokeWidth={1.5} opacity={0.3} />
                  )}
                  <text x={cx} y={svgH - 18} textAnchor="middle" fontSize="8"
                    fill={weekend ? '#ef4444' : 'var(--text-subtle)'} opacity={weekend ? 0.75 : 0.55}>
                    {['вс','пн','вт','ср','чт','пт','сб'][day.dow]}
                  </text>
                  <text x={cx} y={svgH - 6} textAnchor="middle" fontSize="9"
                    fill="var(--text-muted)" fontWeight={isToday ? 700 : 400}>
                    {day.dayNum}
                  </text>
                  {hasAnswer && <title>{formatDate(day.date)}: {answer}</title>}
                </g>
              );
            })}
          </svg>
        </div>
        <div className="flex flex-wrap items-center gap-x-3 gap-y-1.5 mt-3 text-xs text-[var(--text-muted)]">
          {opts.map(opt => (
            <div key={opt.label} className="flex items-center gap-1.5">
              <div className="w-2.5 h-2.5 rounded-sm" style={{ background: opt.color }} />
              {opt.label}
            </div>
          ))}
          <div className="flex items-center gap-1.5">
            <div className="w-2.5 h-0.5 rounded-sm bg-[var(--border)]" /> нет данных
          </div>
        </div>
      </div>
    </div>
  );
}

function DailyChecklistFieldsConfig({ data, setData }) {
  const allFields = data.dailyChecklistFields || [];
  const fields = allFields.filter(f => !f.archived);
  const archivedFields = allFields.filter(f => f.archived);

  const [newLabel, setNewLabel] = useState('');
  const [newOptions, setNewOptions] = useState('Да, Нет');
  const [editingId, setEditingId] = useState(null);
  const [editLabel, setEditLabel] = useState('');
  const [editOptionsList, setEditOptionsList] = useState([]);
  const [showArchive, setShowArchive] = useState(false);
  const editSnapshotRef = React.useRef(null);

  const parseLabels = (str) => str.split(/[,;]/).map(s => s.trim()).filter(Boolean);

  // Сразу сохраняем правки (название, цвета, варианты) в data
  React.useEffect(() => {
    if (!editingId) return;
    const label = editLabel.trim();
    const options = editOptionsList
      .map(o => ({ label: (o.label || '').trim(), color: o.color }))
      .filter(o => o.label);
    if (!label || options.length === 0) return;
    setData(d => {
      const cur = (d.dailyChecklistFields || []).find(f => f.id === editingId);
      if (!cur) return d;
      const same = cur.label === label && JSON.stringify(cur.options) === JSON.stringify(options);
      if (same) return d;
      return {
        ...d,
        dailyChecklistFields: (d.dailyChecklistFields || []).map(f =>
          f.id === editingId ? { ...f, label, options, updatedAt: Date.now() } : f
        ),
      };
    });
  }, [editingId, editLabel, editOptionsList, setData]);

  const addField = () => {
    const label = newLabel.trim();
    const labels = parseLabels(newOptions);
    if (!label || labels.length === 0) return;
    setData(d => ({
      ...d,
      dailyChecklistFields: [...(d.dailyChecklistFields || []), { id: crypto.randomUUID(), label, options: labelsToOptions(labels), archived: false, updatedAt: Date.now() }],
    }));
    setNewLabel('');
    setNewOptions('Да, Нет');
  };

  const startEdit = (f) => {
    const opts = getFieldOptions(f).map(o => ({ ...o }));
    editSnapshotRef.current = { label: f.label, options: opts };
    setEditingId(f.id);
    setEditLabel(f.label);
    setEditOptionsList(opts);
  };

  const finishEdit = () => {
    editSnapshotRef.current = null;
    setEditingId(null);
  };

  const cancelEdit = () => {
    const snap = editSnapshotRef.current;
    if (snap && editingId) {
      setData(d => ({
        ...d,
        dailyChecklistFields: (d.dailyChecklistFields || []).map(f =>
          f.id === editingId ? { ...f, label: snap.label, options: snap.options } : f
        ),
      }));
    }
    editSnapshotRef.current = null;
    setEditingId(null);
  };

  const addEditOption = () => {
    const i = editOptionsList.length;
    setEditOptionsList([...editOptionsList, { label: '', color: CHECKLIST_OPTION_COLORS[i % CHECKLIST_OPTION_COLORS.length] }]);
  };

  const updateEditOption = (idx, patch) => {
    setEditOptionsList(list => list.map((o, i) => i === idx ? { ...o, ...patch } : o));
  };

  const removeEditOption = (idx) => {
    setEditOptionsList(list => list.filter((_, i) => i !== idx));
  };

  // В архив — пункт прячется из ежедневной отметки и графиков, но сами
  // отметки в dailyChecklistLog не трогаем: историю можно вернуть, восстановив поле.
  const archiveField = (id) => {
    setData(d => ({
      ...d,
      dailyChecklistFields: (d.dailyChecklistFields || []).map(f =>
        f.id === id ? { ...f, archived: true, updatedAt: Date.now() } : f
      ),
    }));
    if (editingId === id) {
      editSnapshotRef.current = null;
      setEditingId(null);
    }
  };

  const restoreField = (id) => {
    setData(d => ({
      ...d,
      dailyChecklistFields: (d.dailyChecklistFields || []).map(f =>
        f.id === id ? { ...f, archived: false, updatedAt: Date.now() } : f
      ),
    }));
  };

  // Окончательное удаление — только для уже заархивированных пунктов,
  // стирает и сами отметки из истории. Предупреждаем явно.
  const removeField = (id) => {
    if (!confirm('Удалить пункт навсегда вместе с историей отметок? Это нельзя отменить.')) return;
    setData(d => ({
      ...d,
      dailyChecklistFields: (d.dailyChecklistFields || []).filter(f => f.id !== id),
      dailyChecklistLog: (d.dailyChecklistLog || []).map(e => {
        const answers = { ...(e.answers || {}) };
        delete answers[id];
        return { ...e, answers };
      }),
      deletedIds: withDeletedId(d, 'dailyChecklistFields', id),
    }));
    if (editingId === id) {
      editSnapshotRef.current = null;
      setEditingId(null);
    }
  };

  const moveField = (activeIdx, dir) => {
    setData(d => {
      const all = [...(d.dailyChecklistFields || [])];
      const activeIds = all.filter(f => !f.archived).map(f => f.id);
      const toIdx = activeIdx + dir;
      if (toIdx < 0 || toIdx >= activeIds.length) return d;
      const posA = all.findIndex(f => f.id === activeIds[activeIdx]);
      const posB = all.findIndex(f => f.id === activeIds[toIdx]);
      // Штамп на обоих переставленных: слияние упорядочивает по стороне с
      // самой свежей правкой — без штампа новый порядок откатился бы сервером.
      const now = Date.now();
      [all[posA], all[posB]] = [{ ...all[posB], updatedAt: now }, { ...all[posA], updatedAt: now }];
      return { ...d, dailyChecklistFields: all };
    });
  };

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
      <h3 className="font-display text-lg mb-1">Ежедневный чек-лист</h3>
      <p className="text-sm text-[var(--text-muted)] mb-4">
        Пункты для ежедневной отметки и варианты ответа.
      </p>

      {fields.length > 0 && (
        <div className="space-y-3 mb-4">
          {fields.map((f, i) => (
            <div key={f.id} className="bg-[var(--bg)] border border-[var(--border)] rounded-xl p-4">
              {editingId === f.id ? (
                <div className="space-y-3">
                  <input value={editLabel} onChange={e => setEditLabel(e.target.value)} placeholder="Название" className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]" />
                  <div className="space-y-2">
                    <div className="text-xs text-[var(--text-muted)] font-medium">Варианты ответа</div>
                    {editOptionsList.map((opt, oi) => (
                      <div key={oi} className="flex items-center gap-2">
                        <input type="color" value={opt.color} onChange={e => updateEditOption(oi, { color: e.target.value })}
                          className="w-9 h-9 rounded-lg border border-[var(--border)] cursor-pointer p-0.5 bg-transparent shrink-0" title="Цвет на графике" />
                        <input value={opt.label} onChange={e => updateEditOption(oi, { label: e.target.value })} placeholder="Вариант"
                          className="flex-1 bg-[var(--surface)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]" />
                        <button onClick={() => removeEditOption(oi)} disabled={editOptionsList.length <= 1}
                          className="p-2 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500 disabled:opacity-25 shrink-0">
                          <Icon name="trash" size={14} />
                        </button>
                      </div>
                    ))}
                    <button onClick={addEditOption} className="text-xs text-[var(--text-muted)] hover:text-[var(--text)] flex items-center gap-1">
                      <Icon name="plus" size={12} /> Добавить вариант
                    </button>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={finishEdit} className="btn-primary text-sm flex-1">Готово</button>
                    <button onClick={cancelEdit} className="btn-secondary text-sm flex-1">Отмена</button>
                  </div>
                </div>
              ) : (
                <div className="flex items-start justify-between gap-3">
                  <div className="flex-1 min-w-0">
                    <div className="font-medium text-sm">{f.label}</div>
                    <div className="flex flex-wrap gap-1.5 mt-2">
                      {getFieldOptions(f).map(opt => (
                        <span key={opt.label} className="text-xs px-2 py-1 rounded-lg border font-medium"
                          style={{ borderColor: opt.color + '66', color: opt.color, background: opt.color + '18' }}>
                          {opt.label}
                        </span>
                      ))}
                    </div>
                  </div>
                  <div className="flex gap-1 shrink-0">
                    <button onClick={() => moveField(i, -1)} disabled={i === 0} className="p-1 text-[var(--text-subtle)] disabled:opacity-25">↑</button>
                    <button onClick={() => moveField(i, 1)} disabled={i === fields.length - 1} className="p-1 text-[var(--text-subtle)] disabled:opacity-25">↓</button>
                    <button onClick={() => startEdit(f)} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]"><Icon name="edit" size={14} /></button>
                    <button onClick={() => archiveField(f.id)} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]" title="В архив"><Icon name="archive" size={14} /></button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      <div className="border border-dashed border-[var(--border)] rounded-xl p-4 space-y-3">
        <div className="text-xs uppercase tracking-wide text-[var(--text-subtle)] font-medium">Новый пункт</div>
        <input value={newLabel} onChange={e => setNewLabel(e.target.value)} placeholder="Например, Вакуум" className="w-full bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]" />
        <input value={newOptions} onChange={e => setNewOptions(e.target.value)} placeholder="Варианты: Да, Нет, Пропустил" className="w-full bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]" />
        <button onClick={addField} disabled={!newLabel.trim()} className="btn-primary text-sm flex items-center gap-2 disabled:opacity-40">
          <Icon name="plus" size={14} /> Добавить
        </button>
      </div>

      {archivedFields.length > 0 && (
        <div className="mt-4">
          <button
            onClick={() => setShowArchive(!showArchive)}
            className="flex items-center gap-2 text-[var(--text-muted)] hover:text-[var(--text)] text-sm"
          >
            <Icon name="archive" size={16} />
            Архив ({archivedFields.length})
            <span className={`transition-transform ${showArchive ? 'rotate-180' : ''}`}>
              <Icon name="chevronDown" size={16} />
            </span>
          </button>
          {showArchive && (
            <div className="space-y-3 mt-3 fade-in">
              {archivedFields.map(f => (
                <div key={f.id} className="bg-[var(--bg)] border border-[var(--border)] rounded-xl p-4 opacity-60">
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex-1 min-w-0">
                      <div className="font-medium text-sm">{f.label}</div>
                      <div className="flex flex-wrap gap-1.5 mt-2">
                        {getFieldOptions(f).map(opt => (
                          <span key={opt.label} className="text-xs px-2 py-1 rounded-lg border font-medium"
                            style={{ borderColor: opt.color + '66', color: opt.color, background: opt.color + '18' }}>
                            {opt.label}
                          </span>
                        ))}
                      </div>
                    </div>
                    <div className="flex gap-1 shrink-0">
                      <button onClick={() => restoreField(f.id)} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]" title="Восстановить"><Icon name="restore" size={14} /></button>
                      <button onClick={() => removeField(f.id)} className="p-2 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500" title="Удалить навсегда"><Icon name="trash" size={14} /></button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function DailyChecklistStats({ data, setData }) {
  const today = getTodayKey();
  const fields = (data.dailyChecklistFields || []).filter(f => !f.archived);
  const log = [...(data.dailyChecklistLog || [])].sort((a, b) => b.date.localeCompare(a.date));
  const [selDate, setSelDate] = useState(today);
  const [showHistory, setShowHistory] = useState(false);

  const fmtDate = (dateStr) => {
    const d = new Date(dateStr + 'T00:00:00');
    const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    const dows = ['вс','пн','вт','ср','чт','пт','сб'];
    return `${d.getDate()} ${months[d.getMonth()]} (${dows[d.getDay()]})`;
  };

  const setAnswer = (fieldId, option) => {
    setData(d => {
      const list = d.dailyChecklistLog || [];
      const existing = list.find(e => e.date === selDate);
      const answers = { ...(existing?.answers || {}), [fieldId]: option };
      // Явный updatedAt: запись за когда-то удалённую дату должна быть НОВЕЕ
      // её tombstone-а, иначе слияние сбрасывало бы её каждой синхронизацией.
      const entry = { id: existing?.id || crypto.randomUUID(), date: selDate, answers, updatedAt: Date.now() };
      return { ...d, dailyChecklistLog: [...list.filter(e => e.date !== selDate), entry].sort((a, b) => b.date.localeCompare(a.date)) };
    });
  };

  const deleteDay = (date) => {
    if (!confirm('Удалить запись за этот день?')) return;
    deleteLogEntryOnServer('dailyChecklistLog', date);
    setData(d => ({ ...d, dailyChecklistLog: (d.dailyChecklistLog || []).filter(e => e.date !== date), deletedIds: withDeletedId(d, 'dailyChecklistLog', date) }));
    if (selDate === date) setSelDate(today);
  };

  const selEntry = log.find(e => e.date === selDate);
  const todayEntry = log.find(e => e.date === today);
  const todayFilled = fields.filter(f => todayEntry?.answers?.[f.id]).length;

  if (fields.length === 0) {
    return (
      <EmptyState title="Нет пунктов" text="Добавьте пункты чек-листа в настройках раздела (⚙), чтобы видеть статистику." />
    );
  }

  return (
    <div className="fade-in space-y-5">
      {/* Сводка сегодня */}
      <div className="flex flex-wrap gap-3">
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl px-4 py-3 flex-1 min-w-[140px]">
          <div className="text-[10px] uppercase tracking-wide text-[var(--text-subtle)]">Сегодня</div>
          <div className="text-xl font-semibold mt-0.5">{todayFilled}/{fields.length}</div>
          <div className="text-xs text-[var(--text-muted)]">пунктов отмечено</div>
        </div>
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl px-4 py-3 flex-1 min-w-[140px]">
          <div className="text-[10px] uppercase tracking-wide text-[var(--text-subtle)]">Всего записей</div>
          <div className="text-xl font-semibold mt-0.5">{log.length}</div>
          <div className="text-xs text-[var(--text-muted)]">дней в журнале</div>
        </div>
      </div>

      {/* Быстрая отметка */}
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 space-y-4">
        <div className="flex items-center justify-between gap-3">
          <h3 className="font-display text-lg">Отметить за день</h3>
          <input type="date" value={selDate} max={today} onChange={e => setSelDate(e.target.value)}
            className="bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-1.5 text-sm focus:outline-none focus:border-[var(--text)]" />
        </div>
        <div className="space-y-3">
          {fields.map(f => {
            const opts = getFieldOptions(f);
            return (
            <div key={f.id} className="bg-[var(--bg)] rounded-xl p-3">
              <div className="text-xs text-[var(--text-muted)] font-medium mb-2">{f.label}</div>
              <div className="flex flex-wrap gap-1.5">
                {opts.map(opt => {
                  const active = selEntry?.answers?.[f.id] === opt.label;
                  return (
                    <button key={opt.label} onClick={() => setAnswer(f.id, opt.label)}
                      className="px-3 py-1.5 rounded-lg border text-sm font-medium transition-all"
                      style={active ? { background: opt.color, borderColor: opt.color, color: '#fff' } : { borderColor: 'var(--border)', color: 'var(--text-muted)' }}>
                      {opt.label}
                    </button>
                  );
                })}
              </div>
            </div>
            );
          })}
        </div>
        {selEntry && (
          <button onClick={() => deleteDay(selDate)}
            className="w-full text-xs text-[var(--text-subtle)] hover:text-red-400 py-1 transition-colors">
            Убрать все отметки за {fmtDate(selDate)}
          </button>
        )}
      </div>

      {/* Графики по каждому пункту */}
      {fields.map(f => (
        <ChecklistFieldChart key={f.id} field={f} log={log} today={today} formatDate={fmtDate} />
      ))}

      {/* История */}
      {log.length > 0 && (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5">
          <button onClick={() => setShowHistory(!showHistory)}
            className="flex items-center justify-between w-full text-left">
            <h3 className="font-display text-lg">История</h3>
            <span className="flex items-center gap-2 text-sm text-[var(--text-muted)]">
              {log.length} {log.length < 5 ? 'дня' : 'дней'}
              <span className={`transition-transform ${showHistory ? 'rotate-180' : ''}`}><Icon name="chevronDown" size={16} /></span>
            </span>
          </button>
          {showHistory && (
            <div className="space-y-2 mt-4 fade-in">
              {log.slice(0, 45).map(e => (
                <div key={e.id} className="flex items-start justify-between gap-3 bg-[var(--bg)] rounded-xl px-3 py-2.5">
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-medium">{fmtDate(e.date)}</div>
                    <div className="flex flex-wrap gap-1.5 mt-1.5">
                      {fields.map(f => {
                        const ans = e.answers?.[f.id];
                        if (!ans) return null;
                        const color = getOptionColor(f, ans);
                        return (
                          <span key={f.id} className="text-[10px] px-2 py-0.5 rounded-full font-medium"
                            style={{ background: color + '22', color, border: `1px solid ${color}44` }}>
                            {f.label}: {ans}
                          </span>
                        );
                      })}
                    </div>
                  </div>
                  <button onClick={() => deleteDay(e.date)} className="p-1 text-red-400 hover:text-red-600 shrink-0">
                    <Icon name="trash" size={14} />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function Toggle({ checked, onChange }) {
  return (
    <button
      onClick={() => onChange(!checked)}
      className={`relative inline-flex h-7 w-12 flex-shrink-0 rounded-full transition-colors ${
        checked ? 'bg-[var(--text)]' : 'bg-[var(--border-strong)]'
      }`}
    >
      <span
        className={`inline-block h-5 w-5 rounded-full bg-white shadow transition-transform ${
          checked ? 'translate-x-6' : 'translate-x-1'
        }`}
        style={{ marginTop: '4px' }}
      />
    </button>
  );
}

// ============== SUPPLEMENT SETTINGS ==============
function SupplementSettings({ data, setData, isWorkout }) {
  const [editing, setEditing] = useState(null); // объект или null
  const [showArchive, setShowArchive] = useState(false);
  const storageKey = isWorkout ? 'workoutSupplements' : 'supplements';

  const active = (data[storageKey] || []).filter(s => !s.archived);
  const archived = (data[storageKey] || []).filter(s => s.archived);

  const save = (supp) => {
    supp = { ...supp, updatedAt: Date.now() };
    setData(d => {
      const list = d[storageKey] || [];
      const exists = list.find(s => s.id === supp.id);
      const updated = exists
        ? list.map(s => s.id === supp.id ? supp : s)
        : [...list, supp];
      return { ...d, [storageKey]: updated };
    });
    setEditing(null);
  };

  const remove = (id) => {
    if (!confirm('Удалить БАДД полностью?')) return;
