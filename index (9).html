                  <button type="button" onClick={() => setEditingId(null)} className="text-sm px-2 py-1.5 text-[var(--text-muted)]">Отмена</button>
                </>
              ) : (
                <>
                  <button
                    type="button"
                    onClick={() => setData(d => ({ ...d, activeBudgetUserId: u.id }))}
                    className="flex-1 text-left text-sm font-medium min-w-0 truncate"
                  >
                    {u.name || 'Без имени'}
                    {u.id === activeId && <span className="ml-2 text-[10px] uppercase tracking-wide text-[var(--text-subtle)]">активен</span>}
                  </button>
                  <button type="button" onClick={() => startRename(u)} className="text-xs text-[var(--text-muted)] hover:text-[var(--text)] px-2 py-1">Переименовать</button>
                  <button type="button" onClick={() => removeUser(u.id)} className="text-xs text-red-500 hover:text-red-600 px-2 py-1" disabled={users.length <= 1}>Удалить</button>
                </>
              )}
            </div>
          ))}
        </div>

        <div className="pt-2 border-t border-[var(--border)]">
          <div className="text-xs uppercase tracking-wide text-[var(--text-subtle)] font-medium mb-2">Новый пользователь</div>
          <div className="flex gap-2">
            <input
              value={newName}
              onChange={e => setNewName(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') addUser(); }}
              placeholder="Имя"
              className="flex-1 bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]"
            />
            <button type="button" onClick={addUser} className="btn-primary text-sm px-4 py-2 flex items-center gap-1.5">
              <Icon name="plus" size={14} /> Добавить
            </button>
          </div>
        </div>
      </div>
    </Modal>
  );
}

function BudgetMonthlyView({ data, setData }) {
  const curYear  = new Date().getFullYear();
  const curMonth = `${curYear}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;

  const [year,         setYear]         = useState(curYear);
  const [showSettings, setShowSettings] = useState(false);
  const [showCopyMonth, setShowCopyMonth] = useState(false);
  const [importState,  setImportState]  = useState(null); // { rows, fileName }
  const [importError,  setImportError]  = useState('');
  const [showFact,     setShowFact]     = useState(true);
  const [editCell,     setEditCell]     = useState(null);
  const [editVal,      setEditVal]      = useState('');
  const scrollRef = useRef(null);
  const fileInputRef = useRef(null);

  const userCats = data.budgetPlanCategories || [];
  const vals     = data.budgetPlanValues     || {};
  const factVals = data.budgetFactValues     || {};
  const incomeFactVals = data.budgetIncomeFactValues || {};

  // ── Income (Приход) ──────────────────────────────────────────────────────
  const incomeSources = data.budgetIncomeSources || [];
  const incomeVals    = data.budgetIncomeValues  || {};

  // Операции ДДС (мобильное приложение + ручной ввод на вкладке «ДДС»)
  // попадают в столбцы «Факт» автоматически, поверх ручных значений и
  // импорта выписки.
  const ddsFact = useMemo(() => cashflowFactMaps(cashflowOpsOf(data)), [data.budgetCashflowOps]);

  const getIncomeVal    = (srcId, month) => incomeVals[`${srcId}_${month}`] || 0;
  const getIncomeFactVal = (srcId, month) =>
    (incomeFactVals[`${srcId}_${month}`] || 0) + (ddsFact.income[`${srcId}_${month}`] || 0);
  const incomeSrcTotal  = (month) => incomeSources.reduce((s, src) => s + getIncomeVal(src.id, month), 0);
  const incomeFactTotal = (month) => incomeSources.reduce((s, src) => s + getIncomeFactVal(src.id, month), 0);

  const startIncomeEdit = (srcId, month) => {
    setEditCell({ itemId: `__inc_${srcId}`, month, isIncome: true, srcId });
    setEditVal((incomeVals[`${srcId}_${month}`] || 0) > 0 ? String(incomeVals[`${srcId}_${month}`]) : '');
  };
  const commitIncomeEdit = (srcId, month, value) => {
    const num = parseInt(value.replace(/\s/g, ''), 10);
    setData(d => ({
      ...d,
      budgetIncomeValues: { ...(d.budgetIncomeValues || {}), [`${srcId}_${month}`]: isNaN(num) || num < 0 ? 0 : num }
    }));
    setEditCell(null);
  };
  const handleIncomeKeyDown = (e, srcId, month) => {
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); commitIncomeEdit(srcId, month, editVal); }
    if (e.key === 'Escape') setEditCell(null);
  };

  const MONTH_NAMES = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  const months = MONTH_NAMES.map((_, i) => `${year}-${String(i + 1).padStart(2, '0')}`);

  // ── Auto-categories from Накопления and Постоянные tabs ──────────────────
  const expCats      = getExpenseCats(data);
  const recCats      = getRecurringCats(data);
  const activeExp    = (data.budgetExpenses  || []).filter(e => !e.archived);
  const activeRec    = (data.budgetRecurring || []).filter(r => !r.archived);
  const savTx        = data.savingsTransactions || [];
  const debtTx       = data.debtTransactions || [];
  const planDebts    = (data.budgetDebts || []).filter(d => d.startDate && d.targetDate);

  const monthKey = (dateStr) => (dateStr || '').slice(0, 7);

  const getExpFact = (expId, month) =>
    savTx
      .filter(t => t.expenseId === expId && t.type === 'income' && monthKey(t.date) === month)
      .reduce((s, t) => s + (t.amount || 0), 0);

  // Накопления: фиксированный план = сумма ÷ месяцы графика (платежи не меняют).
  const getExpCatVal = (catId, month) =>
    activeExp
      .filter(e => e.category === catId && e.startDate <= month && e.targetDate >= month)
      .reduce((s, e) => s + calcMonthly(e), 0);

  const getExpCatFact = (catId, month) =>
    activeExp
      .filter(e => e.category === catId)
      .reduce((s, e) => s + getExpFact(e.id, month), 0);

  // Постоянные: сумма по категории с учётом пропущенных месяцев (skipMonths: 1–12)
  const getRecCatVal = (catId, month) => {
    const mNum = parseInt(String(month).split('-')[1], 10);
    return activeRec
      .filter(r => r.category === catId)
      .filter(r => !(Array.isArray(r.skipMonths) && r.skipMonths.includes(mNum)))
      .reduce((s, r) => s + (r.amount || 0), 0);
  };

  // Долги: фиксированный план = сумма ÷ месяцы графика (платежи не меняют).
  const getDebtVal = (debt, month) =>
    (debt.startDate <= month && debt.targetDate >= month)
      ? calcDebtMonthly(debt, debtTx)
      : 0;

  const getDebtFact = (debtId, month) =>
    debtTx
      .filter(t => t.debtId === debtId && t.type !== 'increase' && monthKey(t.date) === month)
      .reduce((s, t) => s + (t.amount || 0), 0);

  const usedExpCatIds = [...new Set(activeExp.map(e => e.category))];
  const usedRecCatIds = [...new Set(activeRec.map(r => r.category))];

  // Order: Постоянные, Накопления, Долги, Спортпит (appended after user cats)
  const autoCategories = [
    usedRecCatIds.length > 0 ? {
      id: '__recurring', emoji: '🔄', label: 'Постоянные', isAuto: true, autoColor: 'emerald',
      items: usedRecCatIds.map(cid => {
        const c = recCats.find(x => x.id === cid) || { emoji: '📌', label: cid };
        return { id: `__rec_${cid}`, emoji: c.emoji, label: c.label, isAuto: true,
                 getAutoVal: (m) => getRecCatVal(cid, m) };
      }),
    } : null,
    usedExpCatIds.length > 0 ? {
      id: '__savings', emoji: '💰', label: 'Накопления', isAuto: true, autoColor: 'violet',
      items: usedExpCatIds.map(cid => {
        const c = expCats.find(x => x.id === cid) || { emoji: '💡', label: cid };
        return { id: `__sav_${cid}`, emoji: c.emoji, label: c.label, isAuto: true,
                 getAutoVal: (m) => getExpCatVal(cid, m),
                 getAutoFact: (m) => getExpCatFact(cid, m) };
      }),
    } : null,
    planDebts.length > 0 ? {
      id: '__debts', emoji: '💳', label: 'Долги', isAuto: true, autoColor: 'rose',
      items: planDebts.map(d => ({
        id: `__debt_${d.id}`, emoji: '💳',
        label: d.closed ? `${d.debtor || 'Долг'} (закрыт)` : (d.debtor || 'Долг'),
        isAuto: true,
        getAutoVal: (m) => getDebtVal(d, m),
        getAutoFact: (m) => (d.startDate <= m && d.targetDate >= m) ? getDebtFact(d.id, m) : 0,
      })),
    } : null,
    (() => {
      const suppAssign = data.budgetSupplementAssignments || {};
      const suppItems  = data.budgetSupplements || [];
      const normalize  = (arr) => (arr || []).map(x => typeof x === 'string' ? { id: x, qty: 1 } : x);
      const monthsWithSupp = months.filter(m => {
        return normalize(suppAssign[m]).some(e => suppItems.find(s => s.id === e.id && !s.archived));
      });
      if (monthsWithSupp.length === 0) return null;
      return {
        id: '__supplements', emoji: '💊', label: 'Спортпит и БАДы', isAuto: true, autoColor: 'orange',
        items: [{
          id: '__supp_total', emoji: '💊', label: 'Спортпит и БАДы', isAuto: true,
          getAutoVal: (m) => {
            return normalize(suppAssign[m]).reduce((s, e) => {
              const item = suppItems.find(x => x.id === e.id && !x.archived);
              return s + (item ? (item.cost || 0) * (e.qty || 1) : 0);
            }, 0);
          }
        }]
      };
    })(),
  ].filter(Boolean);

  // Merge user + auto, then sort by saved order
  const allCatsUnsorted = [...userCats, ...autoCategories];
  const savedOrder = data.budgetCategoryOrder || [];
  const allCats = [...allCatsUnsorted].sort((a, b) => {
    const ai = savedOrder.indexOf(a.id);
    const bi = savedOrder.indexOf(b.id);
    if (ai === -1 && bi === -1) return 0;
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });

  // ── Value helpers ─────────────────────────────────────────────────────────
  const getItemVal   = (item, month) => item.getAutoVal ? item.getAutoVal(month) : (vals[`${item.id}_${month}`] || 0);
  const getItemFact  = (item, month) => item.getAutoFact
    ? item.getAutoFact(month)
    : (factVals[`${item.id}_${month}`] || 0) + (ddsFact.expense[`${item.id}_${month}`] || 0);
  const catTotal     = (cat, month)  => (cat.items || []).reduce((s, it) => s + getItemVal(it, month), 0);
  const catFactTotal = (cat, month)  => (cat.items || []).reduce((s, it) => s + getItemFact(it, month), 0);
  const grandTotal   = (month)       => allCats.flatMap(c => c.items || []).reduce((s, it) => s + getItemVal(it, month), 0);
  const grandFactTotal = (month)     => allCats.flatMap(c => c.items || []).reduce((s, it) => s + getItemFact(it, month), 0);

  const factCellCls = (fact, plan) => {
    if (!(fact > 0)) return 'text-gray-300';
    if (plan > 0 && fact > plan) return 'text-red-500 font-medium';
    return 'text-amber-700 font-medium';
  };

  const onStatementFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setImportError('');
    try {
      const rows = await readMoneyOkCsvFile(file);
      if (!rows.length) throw new Error('В файле нет операций для импорта.');
      setImportState({ rows, fileName: file.name });
    } catch (err) {
      setImportError(err.message || 'Не удалось прочитать выписку');
    }
  };

  const startEdit = (itemId, month) => {
    setEditCell({ itemId, month });
    setEditVal((vals[`${itemId}_${month}`] || 0) > 0 ? String(vals[`${itemId}_${month}`]) : '');
  };

  const commitEdit = (itemId, month, value) => {
    const num = parseInt(value.replace(/\s/g, ''), 10);
    setData(d => ({
      ...d,
      budgetPlanValues: { ...(d.budgetPlanValues || {}), [`${itemId}_${month}`]: isNaN(num) || num < 0 ? 0 : num }
    }));
    setEditCell(null);
  };

  const handleKeyDown = (e, itemId, month) => {
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); commitEdit(itemId, month, editVal); }
    if (e.key === 'Escape') setEditCell(null);
  };

  // ── Scroll to current month on year change ────────────────────────────────
  const monthColWidth = showFact ? 116 : 62;
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const curIdx = months.indexOf(curMonth);
    el.scrollLeft = curIdx > 0 ? curIdx * monthColWidth : 0;
  }, [year, showFact]);

  // ── CSS helpers ───────────────────────────────────────────────────────────
  const planHeaderCls = "px-1 py-1.5 text-center text-xs font-semibold tracking-wide border-b border-l-2 border-[var(--border)] w-[62px] bg-blue-50 text-blue-600";
  const factHeaderCls = "px-1 py-1.5 text-center text-xs font-medium tracking-wide border-b border-[var(--border)] w-[54px] bg-gray-50 text-gray-400";
  const planDivCls    = "border-l-2 border-[var(--border)]";



  return (
    <div>
      {/* Toolbar */}
      <div className="flex items-center gap-2 sm:gap-3 mb-4 flex-wrap">
        <div className="flex items-center gap-0 bg-[var(--surface)] border border-[var(--border)] rounded-xl overflow-hidden">
          <button onClick={() => setYear(y => y - 1)}
            className="px-3 py-2 text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-black/5 transition-colors text-base leading-none">‹</button>
          <span className="px-3 py-2 text-sm font-semibold min-w-[56px] text-center">{year}</span>
          <button onClick={() => setYear(y => y + 1)}
            className="px-3 py-2 text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-black/5 transition-colors text-base leading-none">›</button>
        </div>
        <button onClick={() => setShowSettings(true)}
          className="p-2 rounded-xl border border-[var(--border)] bg-[var(--surface)] text-[var(--text-muted)] hover:text-[var(--text)] transition-colors"
          title="Настройки статей бюджета">
          <Icon name="settings" size={16} />
        </button>
        <button onClick={() => setShowCopyMonth(true)}
          className="px-3 py-1.5 rounded-xl text-xs border border-[var(--border)] bg-[var(--surface)] text-[var(--text-muted)] hover:text-[var(--text)] transition-colors inline-flex items-center gap-1.5"
          title="Скопировать план из другого месяца">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Копировать месяц
        </button>
        <button onClick={() => fileInputRef.current && fileInputRef.current.click()}
          className="px-3 py-1.5 rounded-xl text-xs border border-[var(--border)] bg-[var(--surface)] text-[var(--text-muted)] hover:text-[var(--text)] transition-colors inline-flex items-center gap-1.5"
          title="Загрузить выписку MoneyOK для заполнения факта">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Загрузить выписку
        </button>
        {(data.budgetStatementRows || []).length > 0 && (
          <button
            onClick={() => setImportState({
              rows: data.budgetStatementRows,
              fileName: data.budgetStatementFileName || 'выписка.csv',
              editMode: true,
            })}
            className="px-3 py-1.5 rounded-xl text-xs border border-[var(--border)] bg-[var(--surface)] text-[var(--text-muted)] hover:text-[var(--text)] transition-colors inline-flex items-center gap-1.5"
            title="Изменить маппинг категорий сохранённой выписки">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            Маппинг
          </button>
        )}
        <button onClick={() => setShowFact(v => !v)}
          className={`px-3 py-1.5 rounded-xl text-xs border transition-colors inline-flex items-center gap-1.5 ${
            showFact
              ? 'border-[var(--border)] bg-[var(--surface)] text-[var(--text-muted)] hover:text-[var(--text)]'
              : 'border-amber-300 bg-amber-50 text-amber-800'
          }`}
          title={showFact ? 'Скрыть столбец Факт' : 'Показать столбец Факт'}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            {showFact
              ? <><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>
              : <><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></>}
          </svg>
          {showFact ? 'Скрыть факт' : 'Показать факт'}
        </button>
        <input ref={fileInputRef} type="file" accept=".csv,text/csv,text/plain" className="hidden" onChange={onStatementFile} />
        {year !== curYear && (
          <button onClick={() => setYear(curYear)}
            className="px-3 py-1.5 rounded-xl text-xs border border-[var(--border)] bg-[var(--surface)] text-[var(--text-muted)] hover:text-[var(--text)] transition-colors">
            Текущий год
          </button>
        )}
        {importError && (
          <span className="text-xs text-red-500">{importError}</span>
        )}
      </div>

      {!allCats.length && !incomeSources.length ? (
        <div className="text-center py-16 text-[var(--text-subtle)]">
          <div className="text-4xl mb-3">📊</div>
          <div className="font-medium mb-1">Нет данных для отображения</div>
          <div className="text-sm mb-4">Добавьте накопления, долги или постоянные платежи — они появятся здесь автоматически. Или нажмите на шестерёнку, чтобы добавить ручные статьи.</div>
          <button onClick={() => setShowSettings(true)} className="btn-primary inline-flex items-center gap-2">
            <Icon name="settings" size={16} />Настроить статьи
          </button>
        </div>
      ) : (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl overflow-hidden">
          <div className="overflow-x-auto" ref={scrollRef}>
            <table className="text-sm border-collapse" style={{minWidth:`${180 + months.length * monthColWidth}px`}}>
              <thead>
                <tr>
                  <th className="sticky left-0 z-20 bg-[var(--bg)] px-4 py-2.5 text-left text-xs font-semibold uppercase tracking-wide text-[var(--text-subtle)] border-b border-r border-[var(--border)]"
                    style={{minWidth:'180px'}}>
                    Статья
                  </th>
                  {months.map((m, i) => (
                    <th key={m} colSpan={showFact ? 2 : 1} data-month={m}
                      className={`px-1 py-2.5 text-center text-xs font-semibold uppercase tracking-wide border-b border-l-2 border-[var(--border)] whitespace-nowrap
                        ${m === curMonth ? 'bg-blue-50 text-blue-700' : 'bg-[var(--bg)] text-[var(--text-subtle)]'}`}
                      style={{minWidth:`${monthColWidth}px`}}>
                      {m === curMonth
                        ? <span className="px-2 py-0.5 rounded-md bg-blue-600 text-white text-[10px]">{MONTH_NAMES[i]}</span>
                        : MONTH_NAMES[i]}
                    </th>
                  ))}
                </tr>
                <tr>
                  <th className="sticky left-0 z-20 bg-[var(--bg)] border-b border-r border-[var(--border)]" />
                  {months.map(m => (
                    <React.Fragment key={m}>
                      <th className={planHeaderCls}>План</th>
                      {showFact && <th className={factHeaderCls}>Факт</th>}
                    </React.Fragment>
                  ))}
                </tr>
              </thead>

              <tbody>
                {/* ── Income section ─────────────────────────────── */}
                {incomeSources.length > 0 && (
                  <React.Fragment>
                    <tr className="bg-emerald-50">
                      <td className="sticky left-0 z-10 bg-emerald-50 px-4 py-2 border-b border-r border-[var(--border)] font-semibold text-xs">
                        <span className="mr-1.5">💰</span>
                        <span className="uppercase tracking-wide text-emerald-700">Приход</span>
                      </td>
                      {months.map(m => {
                        const t = incomeSrcTotal(m);
                        const ft = incomeFactTotal(m);
                        return (
                          <React.Fragment key={m}>
                            <td className={`px-1 py-2 text-center text-xs font-semibold border-b border-[var(--border)] whitespace-nowrap ${planDivCls} ${t > 0 ? 'text-emerald-600' : 'text-[var(--border)]'}`}>
                              {t > 0 ? formatRub(t) : '—'}
                            </td>
                            {showFact && (
                              <td className={`px-1 py-2 text-center text-xs border-b border-[var(--border)] whitespace-nowrap ${ft > 0 ? 'text-emerald-700 font-semibold' : 'text-gray-300 text-[10px]'}`}>
                                {ft > 0 ? formatRub(ft) : '—'}
                              </td>
                            )}
                          </React.Fragment>
                        );
                      })}
                    </tr>
                    {incomeSources.map(src => (
                      <tr key={src.id} className="border-b border-[var(--border)] transition-colors hover:bg-emerald-50/30 bg-white">
                        <td className="sticky left-0 z-10 bg-white px-4 py-1.5 border-r border-[var(--border)] text-[var(--text-muted)] text-sm pl-8">
                          <span className="before:content-['·'] before:mr-2 before:text-[var(--border-strong)]">{src.label}</span>
                        </td>
                        {months.map(m => {
                          const v = getIncomeVal(src.id, m);
                          const fv = getIncomeFactVal(src.id, m);
                          const isEditing = editCell?.isIncome && editCell?.srcId === src.id && editCell?.month === m;
                          return (
                            <React.Fragment key={m}>
                              <td className={`px-1 py-1 w-[62px] ${planDivCls}`}>
                                {isEditing ? (
                                  <input
                                    type="number" inputMode="numeric"
                                    className="w-full text-center text-xs px-1 py-1 border border-emerald-400 rounded-md focus:outline-none bg-white text-emerald-700"
                                    value={editVal}
                                    onChange={e => setEditVal(e.target.value)}
                                    onBlur={() => commitIncomeEdit(src.id, m, editVal)}
                                    onKeyDown={e => handleIncomeKeyDown(e, src.id, m)}
                                    autoFocus
                                  />
                                ) : (
                                  <button
                                    onClick={() => startIncomeEdit(src.id, m)}
                                    className={`w-full text-center text-xs px-1 py-1.5 rounded hover:bg-emerald-50 transition-colors whitespace-nowrap font-medium ${v > 0 ? 'text-emerald-600' : ''}`}>
                                    {v > 0 ? formatRub(v) : <span className="text-gray-300 text-[10px]">·</span>}
                                  </button>
                                )}
                              </td>
                              {showFact && (
                                <td className={`px-1 py-1 text-center text-xs w-[54px] whitespace-nowrap ${fv > 0 ? 'text-emerald-700 font-medium' : 'text-gray-300 text-[10px]'}`}>
                                  {fv > 0 ? formatRub(fv) : '—'}
                                </td>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </tr>
                    ))}
                    <tr><td colSpan={1 + months.length * (showFact ? 2 : 1)} className="h-1 bg-[var(--border)]" /></tr>
                  </React.Fragment>
                )}

                {/* ── Expense categories ─────────────────────────── */}
                {allCats.map((cat) => {
                  const isAutoCat = !!cat.isAuto;

                  return (
                    <React.Fragment key={cat.id}>
                      {/* Category total row */}
                      <tr className="bg-gray-100">
                        <td className="sticky left-0 z-10 bg-gray-100 px-4 py-2 border-b border-r border-[var(--border)] font-semibold text-xs">
                          {cat.emoji && <span className="mr-1.5">{cat.emoji}</span>}
                          <span className="uppercase tracking-wide text-[var(--text)]">{cat.label}</span>
                          {isAutoCat && <span className="ml-2 text-[9px] font-normal opacity-50 normal-case tracking-normal">авто</span>}
                        </td>
                        {months.map(m => {
                          const t = catTotal(cat, m);
                          const ft = catFactTotal(cat, m);
                          return (
                            <React.Fragment key={m}>
                              <td className={`px-1 py-2 text-center text-xs font-semibold border-b border-[var(--border)] whitespace-nowrap ${planDivCls} ${t > 0 ? 'text-blue-600' : 'text-[var(--border)]'}`}>
                                {t > 0 ? formatRub(t) : '—'}
                              </td>
                              {showFact && (
                                <td className={`px-1 py-2 text-center text-xs border-b border-[var(--border)] whitespace-nowrap ${factCellCls(ft, t)}`}>
                                  {ft > 0 ? formatRub(ft) : '—'}
                                </td>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </tr>

                      {/* Item rows */}
                      {(cat.items || []).map((item, ii) => (
                        <tr key={item.id} className={"border-b border-[var(--border)] transition-colors hover:bg-blue-50/20 bg-white"}>
                          <td className="sticky left-0 z-10 bg-white px-4 py-1.5 border-r border-[var(--border)] text-[var(--text-muted)] text-sm pl-8">
                            {!isAutoCat && item.emoji && <span className="mr-1">{item.emoji}</span>}
                            <span className="before:content-['·'] before:mr-2 before:text-[var(--border-strong)]">{item.label}</span>
                          </td>
                          {months.map(m => {
                            const v         = getItemVal(item, m);
                            const fv        = getItemFact(item, m);
                            const isEditing = !isAutoCat && editCell?.itemId === item.id && editCell?.month === m;
                            const valColor  = 'text-blue-600';

                            return (
                              <React.Fragment key={m}>
                                <td className={`px-1 py-1 w-[62px] ${planDivCls}`}>
                                  {isEditing ? (
                                    <input
                                      type="number" inputMode="numeric"
                                      className="w-full text-center text-xs px-1 py-1 border border-blue-400 rounded-md focus:outline-none bg-white text-blue-700"
                                      value={editVal}
                                      onChange={e => setEditVal(e.target.value)}
                                      onBlur={() => commitEdit(item.id, m, editVal)}
                                      onKeyDown={e => handleKeyDown(e, item.id, m)}
                                      autoFocus
                                    />
                                  ) : isAutoCat ? (
                                    // Auto-computed: display only, no editing
                                    <span className={`block w-full text-center text-xs px-1 py-1.5 font-medium ${v > 0 ? valColor : 'text-gray-300'}`}>
                                      {v > 0 ? formatRub(v) : <span className="text-[10px]">·</span>}
                                    </span>
                                  ) : (
                                    // Manual: click to edit
                                    <button
                                      onClick={() => startEdit(item.id, m)}
                                      className={`w-full text-center text-xs px-1 py-1.5 rounded hover:bg-blue-50 transition-colors whitespace-nowrap font-medium ${v > 0 ? valColor : ''}`}>
                                      {v > 0 ? formatRub(v) : <span className="text-gray-300 text-[10px]">·</span>}
                                    </button>
                                  )}
                                </td>
                                {showFact && (
                                  <td className={`px-1 py-1 text-center text-xs w-[54px] whitespace-nowrap ${factCellCls(fv, v)}`}>
                                    {fv > 0 ? formatRub(fv) : '—'}
                                  </td>
                                )}
                              </React.Fragment>
                            );
                          })}
                        </tr>
                      ))}
                    </React.Fragment>
                  );
                })}

                {/* Grand total */}
                <tr className="border-t-2 border-[var(--border-strong)] bg-gray-200">
                  <td className="sticky left-0 z-10 bg-gray-200 px-4 py-3 border-r border-[var(--border)] font-bold text-xs uppercase tracking-wide text-[var(--text)]">
                    Итого расходы
                  </td>
                  {months.map(m => {
                    const t = grandTotal(m);
                    const ft = grandFactTotal(m);
                    return (
                      <React.Fragment key={m}>
                        <td className={`px-1 py-3 text-center text-xs font-bold whitespace-nowrap ${planDivCls} ${t > 0 ? 'text-blue-700' : 'text-gray-300'}`}>
                          {t > 0 ? formatRub(t) : '—'}
                        </td>
                        {showFact && (
                          <td className={`px-1 py-3 text-center text-xs font-bold whitespace-nowrap ${factCellCls(ft, t)}`}>
                            {ft > 0 ? formatRub(ft) : '—'}
                          </td>
                        )}
                      </React.Fragment>
                    );
                  })}
                </tr>

                {/* Delta: Income − Expenses */}
                {incomeSources.length > 0 && (
                  <tr className="bg-gray-100 border-t border-[var(--border)]">
                    <td className="sticky left-0 z-10 bg-gray-100 px-4 py-3 border-r border-[var(--border)] font-bold text-xs uppercase tracking-wide text-[var(--text)]">
                      Остаток
                    </td>
                    {months.map(m => {
                      const income  = incomeSrcTotal(m);
                      const expense = grandTotal(m);
                      const delta   = income - expense;
                      const hasData = income > 0 || expense > 0;
                      const incomeF  = incomeFactTotal(m);
                      const expenseF = grandFactTotal(m);
                      const deltaF   = incomeF - expenseF;
                      const hasFact  = incomeF > 0 || expenseF > 0;
                      return (
                        <React.Fragment key={m}>
                          <td className={`px-1 py-3 text-center text-xs font-bold whitespace-nowrap ${planDivCls} ${!hasData ? 'text-gray-300' : delta >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>
                            {!hasData ? '—' : (delta >= 0 ? '+' : '') + formatRub(delta)}
                          </td>
                          {showFact && (
                            <td className={`px-1 py-3 text-center text-xs font-bold whitespace-nowrap ${!hasFact ? 'text-gray-300 text-[10px]' : deltaF >= 0 ? 'text-emerald-700' : 'text-red-500'}`}>
                              {!hasFact ? '—' : (deltaF >= 0 ? '+' : '') + formatRub(deltaF)}
                            </td>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {showSettings && (
        <BudgetPlanSettingsModal data={data} setData={setData} autoCategories={autoCategories} allCatsOrdered={allCats} onClose={() => setShowSettings(false)} />
      )}

      {showCopyMonth && (
        <BudgetCopyMonthModal
          year={year}
          userCats={userCats}
          incomeSources={incomeSources}
          data={data}
          setData={setData}
          onClose={() => setShowCopyMonth(false)}
        />
      )}

      {importState && (
        <BudgetStatementImportModal
          rows={importState.rows}
          fileName={importState.fileName}
          editMode={!!importState.editMode}
          data={data}
          setData={setData}
          allCats={allCats}
          incomeSources={incomeSources}
          onClose={() => setImportState(null)}
        />
      )}
    </div>
  );
}


// ── Вкладка «ДДС» ───────────────────────────────────────────────────────────
// История операций расхода и дохода: сюда падает всё, что записано с телефона
// через /pf/<token>, и всё, что добавлено руками здесь же. Отсюда суммы
// автоматически попадают в столбцы «Факт» на вкладке «По месяцу».
function BudgetCashflowView({ data, setData, userId }) {
  const [month,      setMonth]      = useState(getCurrentMonthStr());
  const [accFilter,  setAccFilter]  = useState('');
  const [dirFilter,  setDirFilter]  = useState('');
  const [query,      setQuery]      = useState('');
  const [editingOp,  setEditingOp]  = useState(null);   // объект операции или {} для новой
  const [showAccounts, setShowAccounts] = useState(false);
  const [copied,     setCopied]     = useState(false);

  const accounts = data.budgetCashflowAccounts || [];
  const ops      = cashflowOpsOf(data);
  const articles = useMemo(() => cashflowArticles(data), [data.budgetIncomeSources, data.budgetPlanCategories, data.budgetRecurring, data.budgetRecurringCategories]);
  const artById  = useMemo(() => Object.fromEntries(articles.map(a => [a.id, a])), [articles]);
  const accById  = useMemo(() => Object.fromEntries(accounts.map(a => [a.id, a])), [accounts]);

  const user = (data.budgetUsers || []).find(u => u.id === userId) || null;
  const shareUrl = financeAppUrl(user);
  const shareOn  = !!user && user.financeShareEnabled !== false;

  const months = useMemo(() => {
    const set = new Set(ops.map(o => String(o.date || '').slice(0, 7)).filter(Boolean));
    set.add(getCurrentMonthStr());
    return [...set].sort().reverse();
  }, [ops]);

  const visibleOps = useMemo(() => {
    const q = query.trim().toLowerCase();
    return ops
      .filter(o => !month || String(o.date || '').slice(0, 7) === month)
      .filter(o => !accFilter || o.accountId === accFilter)
      .filter(o => !dirFilter || o.direction === dirFilter)
      .filter(o => {
        if (!q) return true;
        const hay = [
          artById[o.categoryId]?.label || '',
          accById[o.accountId]?.name || '',
          o.purpose || '',
        ].join(' ').toLowerCase();
        return hay.includes(q);
      })
      .sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))
        || (b.createdAt || 0) - (a.createdAt || 0));
  }, [ops, month, accFilter, dirFilter, query, artById, accById]);

  const totals = useMemo(() => visibleOps.reduce((acc, o) => {
    const amt = Number(o.amount) || 0;
    if (o.direction === 'in') acc.income += amt; else acc.expense += amt;
    return acc;
  }, { income: 0, expense: 0 }), [visibleOps]);

  const saveOp = (op) => {
    const clean = {
      ...op,
      amount: Math.round((Number(op.amount) || 0) * 100) / 100,
      purpose: (op.purpose || '').trim().slice(0, 200),
      updatedAt: Date.now(),
    };
    setData(d => {
      const list = d.budgetCashflowOps || [];
      const exists = list.some(o => o.id === clean.id);
      return {
        ...d,
        budgetCashflowOps: exists
          ? list.map(o => o.id === clean.id ? { ...o, ...clean } : o)
          : [...list, { source: 'manual', createdAt: Date.now(), ...clean }],
      };
    });
    setEditingOp(null);
  };

  const deleteOp = (id) => {
    if (!confirm('Удалить операцию?')) return;
    setData(d => ({
      ...d,
      budgetCashflowOps: (d.budgetCashflowOps || []).filter(o => o.id !== id),
      deletedIds: withDeletedId(d, 'budgetCashflowOps', id),
    }));
  };

  const ensureToken = () => {
    if (!user) return;
    if (!user.financeToken || !shareOn) {
      setData(d => ({
        ...d,
        budgetUsers: (d.budgetUsers || []).map(u => u.id === userId
          ? { ...u, financeToken: u.financeToken || makePlannerToken(), financeShareEnabled: true, updatedAt: Date.now() }
          : u),
      }));
    }
  };

  const revokeToken = () => {
    if (!confirm('Отключить ссылку?\n\nПриложение на телефоне перестанет открываться, пока вы не включите её снова.')) return;
    setData(d => ({
      ...d,
      budgetUsers: (d.budgetUsers || []).map(u => u.id === userId
        ? { ...u, financeShareEnabled: false, updatedAt: Date.now() } : u),
    }));
  };

  const regenerateToken = () => {
    if (!confirm('Сделать новую ссылку?\n\nСтарая перестанет работать — на телефоне придётся открыть приложение заново.')) return;
    setData(d => ({
      ...d,
      budgetUsers: (d.budgetUsers || []).map(u => u.id === userId
        ? { ...u, financeToken: makePlannerToken(), financeShareEnabled: true, updatedAt: Date.now() } : u),
    }));
  };

  const copyLink = async () => {
    const ok = await copyToClipboard(shareUrl);
    if (ok) { setCopied(true); setTimeout(() => setCopied(false), 2000); }
    else prompt('Скопируйте ссылку вручную:', shareUrl);
  };

  const totalBalance = accounts.reduce((s, a) => s + cashflowAccountBalance(a, ops), 0);

  return (
    <div className="space-y-6">
      {/* ── Счета ───────────────────────────────────────────────── */}
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 sm:p-5">
        <div className="flex items-center justify-between gap-3 mb-3">
          <div>
            <div className="font-medium">Счета</div>
            <div className="text-xs text-[var(--text-subtle)] mt-0.5">
              Первоначальный баланс + операции. Эти же счета видны в приложении на телефоне.
            </div>
          </div>
          <button onClick={() => setShowAccounts(true)}
            className="px-3 py-2 rounded-xl text-sm border border-[var(--border)] text-[var(--text-muted)] hover:bg-black/5 transition-colors whitespace-nowrap">
            Настроить
          </button>
        </div>

        {accounts.length === 0 ? (
          <div className="text-sm text-[var(--text-subtle)] py-3">
            Счетов пока нет — нажмите «Настроить», чтобы завести первый.
          </div>
        ) : (
          <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
            {accounts.map(a => {
              const bal = cashflowAccountBalance(a, ops);
              return (
                <div key={a.id} className="rounded-xl border border-[var(--border)] bg-[var(--bg)] px-3.5 py-3">
                  <div className="text-sm font-medium truncate">{a.name || 'Счёт'}</div>
                  <div className={`mt-1 text-lg font-semibold tabular-nums ${bal < 0 ? 'text-red-500' : 'text-[var(--text)]'}`}>
                    {formatRubExact(bal)} ₽
                  </div>
                  <div className="text-[11px] text-[var(--text-subtle)] mt-0.5">
                    старт: {formatRubExact(a.initialBalance || 0)} ₽
                  </div>
                </div>
              );
            })}
            {accounts.length > 1 && (
              <div className="rounded-xl border border-dashed border-[var(--border-strong)] px-3.5 py-3">
                <div className="text-sm font-medium truncate text-[var(--text-muted)]">Всего</div>
                <div className={`mt-1 text-lg font-semibold tabular-nums ${totalBalance < 0 ? 'text-red-500' : 'text-[var(--text)]'}`}>
                  {formatRubExact(totalBalance)} ₽
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── Выводы по месяцу ─────────────────────────────────────── */}
      <BudgetMonthlyNotesBlock data={data} setData={setData} />

      {/* ── Ссылка на мобильное приложение ───────────────────────── */}
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 sm:p-5">
        <div className="font-medium">Приложение на телефон</div>
        <div className="text-xs text-[var(--text-subtle)] mt-0.5 mb-3">
          Отдельная ссылка для этого пользователя бюджета: откройте её на iPhone и добавьте на экран «Домой».
          Записанные там траты и доходы сразу появятся здесь.
        </div>

        {!user ? (
          <div className="text-sm text-[var(--text-subtle)]">Выберите пользователя бюджета.</div>
        ) : !user.financeToken || !shareOn ? (
          <button onClick={ensureToken} className="btn-primary text-sm px-4 py-2">
            {user.financeToken ? 'Включить ссылку' : 'Создать ссылку'}
          </button>
        ) : (
          <div className="space-y-3">
            <div className="flex flex-wrap items-center gap-2">
              <input readOnly value={shareUrl} onFocus={e => e.target.select()}
                className="flex-1 min-w-[16rem] bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm font-mono" />
              <button onClick={copyLink} className="btn-primary text-sm px-4 py-2">
                {copied ? 'Скопировано' : 'Копировать'}
              </button>
              <a href={shareUrl} target="_blank" rel="noopener noreferrer"
                className="px-3 py-2 rounded-xl text-sm border border-[var(--border)] text-[var(--text-muted)] hover:bg-black/5 transition-colors">
                Открыть
              </a>
            </div>
            <div className="flex flex-wrap gap-3 text-xs">
              <button onClick={regenerateToken} className="text-[var(--text-muted)] hover:text-[var(--text)]">Новая ссылка</button>
              <button onClick={revokeToken} className="text-red-500 hover:text-red-600">Отключить</button>
            </div>
          </div>
        )}
      </div>

      {/* ── Операции ─────────────────────────────────────────────── */}
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl overflow-hidden">
        <div className="p-4 sm:p-5 border-b border-[var(--border)]">
          <div className="flex flex-wrap items-center gap-2 sm:gap-3">
            <select value={month} onChange={e => setMonth(e.target.value)}
              className="bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm">
              <option value="">Все месяцы</option>
              {months.map(m => <option key={m} value={m}>{formatMonthFull(m)}</option>)}
            </select>

            <select value={accFilter} onChange={e => setAccFilter(e.target.value)}
              className="bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm">
              <option value="">Все счета</option>
              {accounts.map(a => <option key={a.id} value={a.id}>{a.name || 'Счёт'}</option>)}
            </select>

            <select value={dirFilter} onChange={e => setDirFilter(e.target.value)}
              className="bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm">
              <option value="">Расход и доход</option>
              <option value="out">Только расход</option>
              <option value="in">Только доход</option>
            </select>

            <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Поиск по статье, счёту, назначению"
              className="flex-1 min-w-[12rem] bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]" />

            <button
              onClick={() => setEditingOp({
                id: crypto.randomUUID(),
                date: new Date().toISOString().slice(0, 10),
                direction: 'out',
                amount: '',
                accountId: (data.budgetCashflowSettings || {}).quickAccountId || accounts[0]?.id || '',
                categoryId: '',
                purpose: '',
                source: 'manual',
                _isNew: true,
              })}
              disabled={!accounts.length || !articles.length}
              className="btn-primary text-sm px-4 py-2 inline-flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed"
              title={!accounts.length ? 'Сначала заведите счёт' : (!articles.length ? 'Сначала добавьте статьи в «По месяцу»' : '')}>
              <Icon name="plus" size={14} /> Операция
            </button>
          </div>

          <div className="flex flex-wrap gap-4 mt-3 text-sm">
            <div><span className="text-[var(--text-subtle)]">Доходы: </span>
              <span className="font-semibold text-emerald-600">{formatRubExact(totals.income)} ₽</span></div>
            <div><span className="text-[var(--text-subtle)]">Расходы: </span>
              <span className="font-semibold text-[var(--text)]">{formatRubExact(totals.expense)} ₽</span></div>
            <div><span className="text-[var(--text-subtle)]">Итог: </span>
              <span className={`font-semibold ${totals.income - totals.expense >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>
                {totals.income - totals.expense >= 0 ? '+' : '−'}{formatRubExact(Math.abs(totals.income - totals.expense))} ₽
              </span></div>
            <div className="text-[var(--text-subtle)]">{visibleOps.length} оп.</div>
          </div>
        </div>

        {visibleOps.length === 0 ? (
          <div className="px-4 py-12 text-center text-[var(--text-subtle)]">
            <div className="text-3xl mb-2">💸</div>
            <div className="text-sm">Операций за выбранный период нет</div>
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm border-collapse">
              <thead>
                <tr className="bg-[var(--bg)] text-[var(--text-subtle)]">
                  <th className="px-4 py-2.5 text-left text-xs font-semibold uppercase tracking-wide border-b border-[var(--border)]">Дата</th>
                  <th className="px-3 py-2.5 text-left text-xs font-semibold uppercase tracking-wide border-b border-[var(--border)]">Статья</th>
                  <th className="px-3 py-2.5 text-left text-xs font-semibold uppercase tracking-wide border-b border-[var(--border)]">Счёт</th>
                  <th className="px-3 py-2.5 text-left text-xs font-semibold uppercase tracking-wide border-b border-[var(--border)]">Назначение</th>
                  <th className="px-3 py-2.5 text-right text-xs font-semibold uppercase tracking-wide border-b border-[var(--border)]">Сумма</th>
                  <th className="px-4 py-2.5 border-b border-[var(--border)]" />
                </tr>
              </thead>
              <tbody>
                {visibleOps.map(op => {
                  const art = artById[op.categoryId];
                  const isIn = op.direction === 'in';
                  return (
                    <tr key={op.id} className="border-b border-[var(--border)] hover:bg-black/[0.02]">
                      <td className="px-4 py-2.5 whitespace-nowrap text-[var(--text-muted)]">
                        {(op.date || '').split('-').reverse().join('.')}
                      </td>
                      <td className="px-3 py-2.5">
                        <div className="flex items-center gap-2 min-w-0">
                          <span className={`w-2 h-2 rounded-full flex-shrink-0 ${isIn ? 'bg-emerald-500' : 'bg-blue-500'}`} />
                          <span className="truncate">{art ? art.label : <span className="text-red-500">Статья удалена</span>}</span>
                          {art && <span className="text-[11px] text-[var(--text-subtle)] hidden sm:inline">· {art.group}</span>}
                        </div>
                      </td>
                      <td className="px-3 py-2.5 text-[var(--text-muted)] whitespace-nowrap">
                        {accById[op.accountId]?.name || <span className="text-red-500">Счёт удалён</span>}
                      </td>
                      <td className="px-3 py-2.5 text-[var(--text-muted)] max-w-[16rem] truncate">
                        {op.purpose || '—'}
                        {op.source === 'pwa' && <span className="ml-2 text-[10px] uppercase tracking-wide text-[var(--text-subtle)]">телефон</span>}
                      </td>
                      <td className={`px-3 py-2.5 text-right font-semibold tabular-nums whitespace-nowrap ${isIn ? 'text-emerald-600' : 'text-[var(--text)]'}`}>
                        {isIn ? '+' : '−'}{formatRubExact(op.amount)} ₽
                      </td>
                      <td className="px-4 py-2.5 whitespace-nowrap text-right">
                        <button onClick={() => setEditingOp({ ...op })} className="p-1.5 text-[var(--text-muted)] hover:text-[var(--text)]" title="Изменить">
                          <Icon name="edit" size={15} />
                        </button>
                        <button onClick={() => deleteOp(op.id)} className="p-1.5 text-[var(--text-muted)] hover:text-red-500" title="Удалить">
                          <Icon name="trash" size={15} />
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        <div className="px-4 py-3 text-xs text-[var(--text-subtle)] border-t border-[var(--border)]">
          Суммы отсюда автоматически складываются в столбцы «Факт» на вкладке «По месяцу»
          (поверх ручных значений и импорта выписки).
        </div>
      </div>

      {showAccounts && (
        <CashflowAccountsModal data={data} setData={setData} onClose={() => setShowAccounts(false)} />
      )}

      {editingOp && (
        <CashflowOpModal
          op={editingOp}
          accounts={accounts}
          articles={articles}
          onSave={saveOp}
          onClose={() => setEditingOp(null)}
        />
      )}
    </div>
  );
}

// Выводы по месяцу: пункты, которые нужно соблюдать. Их же приложение на
// телефоне показывает напоминанием: первый заход за день — всегда, дальше
// 50/50. Прошлые месяцы не стираются — их видно в «Истории» ниже.
function BudgetMonthlyNotesBlock({ data, setData }) {
  const [month, setMonth] = useState(getCurrentMonthStr());
  const [newText, setNewText] = useState('');
  const [editing, setEditing] = useState(null); // { id, text }
  const [showHistory, setShowHistory] = useState(false);

  const items = useMemo(() => monthlyNotesFor(data, month), [data.budgetMonthlyNotes, month]);
  const historyMonths = useMemo(() => monthlyNotesMonths(data), [data.budgetMonthlyNotes]);
  const prevMonth = addMonthsStr(month, -1);
  const prevItems = useMemo(() => monthlyNotesFor(data, prevMonth), [data.budgetMonthlyNotes, prevMonth]);

  const addNote = () => {
    const text = newText.trim();
    if (!text) return;
    const maxSort = items.reduce((m, n) => Math.max(m, n.sort || 0), 0);
    const note = {
      id: crypto.randomUUID(), month, text: text.slice(0, 200),
      sort: maxSort + 1, createdAt: Date.now(), updatedAt: Date.now(),
    };
    setData(d => ({ ...d, budgetMonthlyNotes: [...(d.budgetMonthlyNotes || []), note] }));
    setNewText('');
  };

  const saveEdit = () => {
    const text = (editing?.text || '').trim();
    if (!text) return;
    setData(d => ({
      ...d,
      budgetMonthlyNotes: (d.budgetMonthlyNotes || []).map(n => n.id === editing.id
        ? { ...n, text: text.slice(0, 200), updatedAt: Date.now() } : n),
    }));
    setEditing(null);
  };

  const removeNote = (id) => {
    setData(d => ({
      ...d,
      budgetMonthlyNotes: (d.budgetMonthlyNotes || []).filter(n => n.id !== id),
      deletedIds: withDeletedId(d, 'budgetMonthlyNotes', id),
    }));
  };

  // Порядок держится на поле sort — перестановка меняет местами именно его,
  // чтобы нумерация совпадала на всех устройствах и в приложении.
  const moveNote = (id, dir) => {
    const idx = items.findIndex(n => n.id === id);
    const other = items[idx + dir];
    if (!other) return;
    const cur = items[idx];
    const curSort = cur.sort || 0, otherSort = other.sort || 0;
    const [a, b] = curSort === otherSort ? [otherSort - dir, otherSort] : [otherSort, curSort];
    setData(d => ({
      ...d,
      budgetMonthlyNotes: (d.budgetMonthlyNotes || []).map(n =>
        n.id === cur.id ? { ...n, sort: a, updatedAt: Date.now() }
        : n.id === other.id ? { ...n, sort: b, updatedAt: Date.now() }
        : n),
    }));
  };

  const copyFromPrev = () => {
    if (!prevItems.length) return;
    const now = Date.now();
    const copies = prevItems.map((n, i) => ({
      id: crypto.randomUUID(), month, text: n.text,
      sort: i + 1, createdAt: now + i, updatedAt: now + i,
    }));
    setData(d => ({ ...d, budgetMonthlyNotes: [...(d.budgetMonthlyNotes || []), ...copies] }));
  };

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 sm:p-5">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-1">
        <div>
          <div className="font-medium">Выводы по месяцу</div>
          <div className="text-xs text-[var(--text-subtle)] mt-0.5">
            Пункты, которые нужно соблюдать. Приложение на телефоне напоминает о них перед записью траты:
            при первом заходе за день — всегда, дальше — примерно через раз.
          </div>
        </div>
        <div className="flex items-center gap-0 bg-[var(--bg)] border border-[var(--border)] rounded-xl overflow-hidden shrink-0">
          <button onClick={() => setMonth(m => addMonthsStr(m, -1))}
            className="px-3 py-2 text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-black/5 transition-colors text-base leading-none"
            title="Предыдущий месяц">‹</button>
          <span className="px-3 py-2 text-sm font-semibold min-w-[8.5rem] text-center">{formatMonthFull(month)}</span>
          <button onClick={() => setMonth(m => addMonthsStr(m, 1))}
            className="px-3 py-2 text-[var(--text-muted)] hover:text-[var(--text)] hover:bg-black/5 transition-colors text-base leading-none"
            title="Следующий месяц">›</button>
        </div>
      </div>

      {month !== getCurrentMonthStr() && (
        <button onClick={() => setMonth(getCurrentMonthStr())}
          className="text-xs text-[var(--text-muted)] hover:text-[var(--text)] mb-2">
          ← к текущему месяцу
        </button>
      )}

      <div className="space-y-2 mt-3">
        {items.map((n, i) => (
          <div key={n.id} className="flex items-start gap-2.5 p-3 rounded-xl border border-[var(--border)] bg-[var(--bg)]">
            <span className="mt-0.5 w-6 h-6 rounded-lg bg-[var(--surface)] border border-[var(--border)] text-xs font-semibold flex items-center justify-center shrink-0">
              {i + 1}
            </span>
            {editing?.id === n.id ? (
              <>
                <input autoFocus value={editing.text} maxLength={200}
                  onChange={e => setEditing({ ...editing, text: e.target.value })}
                  onKeyDown={e => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') setEditing(null); }}
                  className="flex-1 bg-[var(--surface)] border border-[var(--border)] rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-[var(--text)]" />
                <button onClick={saveEdit} className="text-sm px-3 py-1.5 rounded-lg bg-[var(--text)] text-white">OK</button>
                <button onClick={() => setEditing(null)} className="text-sm px-2 py-1.5 text-[var(--text-muted)]">Отмена</button>
              </>
            ) : (
              <>
                <span className="flex-1 text-sm leading-relaxed min-w-0 break-words">{n.text}</span>
                <div className="flex items-center shrink-0">
                  <button onClick={() => moveNote(n.id, -1)} disabled={i === 0}
                    className="px-1.5 py-1 text-[var(--text-subtle)] hover:text-[var(--text)] disabled:opacity-25" title="Выше">↑</button>
                  <button onClick={() => moveNote(n.id, 1)} disabled={i === items.length - 1}
                    className="px-1.5 py-1 text-[var(--text-subtle)] hover:text-[var(--text)] disabled:opacity-25" title="Ниже">↓</button>
                  <button onClick={() => setEditing({ id: n.id, text: n.text })}
                    className="p-1.5 text-[var(--text-muted)] hover:text-[var(--text)]" title="Изменить">
                    <Icon name="edit" size={14} />
                  </button>
                  <button onClick={() => removeNote(n.id)}
                    className="p-1.5 text-[var(--text-muted)] hover:text-red-500" title="Удалить">
                    <Icon name="trash" size={14} />
                  </button>
                </div>
              </>
            )}
          </div>
        ))}

        {!items.length && (
          <div className="text-sm text-[var(--text-subtle)] py-1">
            На {formatMonthFull(month).toLowerCase()} выводов пока нет.
            {prevItems.length > 0 && (
              <button onClick={copyFromPrev} className="ml-1 text-[var(--text-muted)] underline hover:text-[var(--text)]">
                Скопировать из «{formatMonthShortBudget(prevMonth)}» ({prevItems.length})
              </button>
            )}
          </div>
        )}
      </div>

      <div className="flex gap-2 mt-3">
        <input value={newText} onChange={e => setNewText(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') addNote(); }}
          maxLength={200}
          placeholder={`Например: следить за тратами на продукты`}
          className="flex-1 bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]" />
        <button onClick={addNote} disabled={!newText.trim()}
          className="btn-primary text-sm px-4 py-2 flex items-center gap-1.5 disabled:opacity-40">
          <Icon name="plus" size={14} /> Добавить
        </button>
      </div>

      {/* История: выводы прошлых месяцев никуда не деваются */}
      {historyMonths.length > 0 && (
        <div className="mt-4 pt-3 border-t border-[var(--border)]">
          <button onClick={() => setShowHistory(v => !v)}
            className="text-xs font-medium text-[var(--text-muted)] hover:text-[var(--text)] inline-flex items-center gap-1.5">
            {showHistory ? 'Скрыть историю' : `История выводов (${historyMonths.length} мес.)`}
          </button>

          {showHistory && (
            <div className="mt-3 space-y-3">
              {historyMonths.map(m => {
                const list = monthlyNotesFor(data, m);
                return (
                  <div key={m} className={`rounded-xl border px-3.5 py-3 ${m === month ? 'border-[var(--text)] bg-[var(--bg)]' : 'border-[var(--border)]'}`}>
                    <button onClick={() => setMonth(m)}
                      className="text-xs font-semibold uppercase tracking-wide text-[var(--text-muted)] hover:text-[var(--text)]">
                      {formatMonthFull(m)}
                      {m === getCurrentMonthStr() && <span className="ml-2 normal-case tracking-normal text-[10px] text-[var(--text-subtle)]">текущий</span>}
                    </button>
                    <ol className="mt-1.5 space-y-1 text-sm text-[var(--text-muted)] list-decimal list-inside">
                      {list.map(n => <li key={n.id} className="leading-relaxed break-words">{n.text}</li>)}
                    </ol>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function CashflowAccountsModal({ data, setData, onClose }) {
  const accounts = data.budgetCashflowAccounts || [];
  const ops = cashflowOpsOf(data);
  const [newName, setNewName] = useState('');
  const [newBalance, setNewBalance] = useState('');
  const [editing, setEditing] = useState(null); // { id, name, initialBalance }

  const parseMoney = (v) => {
    const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));
    return Number.isFinite(n) ? Math.round(n * 100) / 100 : 0;
  };

  const addAccount = () => {
    const name = newName.trim();
    if (!name) return;
    const acc = {
      id: crypto.randomUUID(),
      name,
      initialBalance: parseMoney(newBalance),
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    setData(d => ({ ...d, budgetCashflowAccounts: [...(d.budgetCashflowAccounts || []), acc] }));
    setNewName('');
    setNewBalance('');
  };

  const saveEdit = () => {
    if (!editing?.name?.trim()) return;
    setData(d => ({
      ...d,
      budgetCashflowAccounts: (d.budgetCashflowAccounts || []).map(a => a.id === editing.id
        ? { ...a, name: editing.name.trim(), initialBalance: parseMoney(editing.initialBalance), updatedAt: Date.now() }
        : a),
    }));
    setEditing(null);
  };

  const removeAccount = (id) => {
    const used = ops.filter(o => o.accountId === id);
    const acc = accounts.find(a => a.id === id);
    const msg = used.length
      ? `Удалить счёт «${acc?.name || ''}» и ${used.length} его операц.? Суммы исчезнут и из столбцов «Факт».`
      : `Удалить счёт «${acc?.name || ''}»?`;
    if (!confirm(msg)) return;
    setData(d => {
      let deleted = withDeletedId(d, 'budgetCashflowAccounts', id);
      used.forEach(o => {
        deleted = { ...deleted, budgetCashflowOps: { ...(deleted.budgetCashflowOps || {}), [String(o.id)]: Date.now() } };
      });
      return {
        ...d,
        budgetCashflowAccounts: (d.budgetCashflowAccounts || []).filter(a => a.id !== id),
        budgetCashflowOps: (d.budgetCashflowOps || []).filter(o => o.accountId !== id),
        deletedIds: deleted,
      };
    });
  };

  return (
    <Modal title="Счета ДДС" onClose={onClose}>
      <div className="space-y-4">
        <p className="text-sm text-[var(--text-muted)]">
          Название и первоначальный баланс счёта. Текущий баланс считается сам: старт + доходы − расходы.
        </p>

        <div className="space-y-2">
          {accounts.map(a => (
            <div key={a.id} className="p-3 rounded-xl border border-[var(--border)]">
              {editing?.id === a.id ? (
                <div className="flex flex-wrap items-center gap-2">
                  <input autoFocus value={editing.name} onChange={e => setEditing({ ...editing, name: e.target.value })}
                    className="flex-1 min-w-[8rem] bg-[var(--bg)] border border-[var(--border)] rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-[var(--text)]" />
                  <input value={editing.initialBalance} onChange={e => setEditing({ ...editing, initialBalance: e.target.value })}
                    inputMode="decimal" placeholder="Старт, ₽"
                    className="w-28 bg-[var(--bg)] border border-[var(--border)] rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-[var(--text)]" />
                  <button onClick={saveEdit} className="text-sm px-3 py-1.5 rounded-lg bg-[var(--text)] text-white">OK</button>
                  <button onClick={() => setEditing(null)} className="text-sm px-2 py-1.5 text-[var(--text-muted)]">Отмена</button>
                </div>
              ) : (
                <div className="flex items-center gap-2">
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-medium truncate">{a.name || 'Счёт'}</div>
                    <div className="text-xs text-[var(--text-subtle)]">
                      старт {formatRubExact(a.initialBalance || 0)} ₽ · сейчас {formatRubExact(cashflowAccountBalance(a, ops))} ₽
                    </div>
                  </div>
                  <button onClick={() => setEditing({ id: a.id, name: a.name || '', initialBalance: String(a.initialBalance ?? '') })}
                    className="text-xs text-[var(--text-muted)] hover:text-[var(--text)] px-2 py-1">Изменить</button>
                  <button onClick={() => removeAccount(a.id)} className="text-xs text-red-500 hover:text-red-600 px-2 py-1">Удалить</button>
                </div>
              )}
            </div>
          ))}
          {accounts.length === 0 && (
            <div className="text-sm text-[var(--text-subtle)]">Счетов пока нет.</div>
          )}
        </div>

        <div className="pt-2 border-t border-[var(--border)]">
          <div className="text-xs uppercase tracking-wide text-[var(--text-subtle)] font-medium mb-2">Новый счёт</div>
          <div className="flex flex-wrap gap-2">
            <input value={newName} onChange={e => setNewName(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') addAccount(); }}
              placeholder="Название (например, Карта Тинькофф)"
              className="flex-1 min-w-[12rem] bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]" />
            <input value={newBalance} onChange={e => setNewBalance(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') addAccount(); }}
              inputMode="decimal" placeholder="Баланс, ₽"
              className="w-32 bg-[var(--bg)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-[var(--text)]" />
            <button onClick={addAccount} disabled={!newName.trim()}
              className="btn-primary text-sm px-4 py-2 flex items-center gap-1.5 disabled:opacity-40">
              <Icon name="plus" size={14} /> Добавить
            </button>
          </div>
        </div>
      </div>
    </Modal>
  );
}

function CashflowOpModal({ op, accounts, articles, onSave, onClose }) {
  const [form, setForm] = useState(() => ({
    ...op,
    amount: op.amount === '' || op.amount == null ? '' : String(op.amount),
  }));

  const set = (patch) => setForm(f => ({ ...f, ...patch }));
  const dirArticles = articles.filter(a => a.direction === form.direction);
  const grouped = dirArticles.reduce((acc, a) => {
    (acc[a.group || '—'] = acc[a.group || '—'] || []).push(a);
    return acc;
  }, {});

  const amountNum = parseFloat(String(form.amount).replace(/\s/g, '').replace(',', '.'));
  const valid = Number.isFinite(amountNum) && amountNum > 0 && form.date && form.accountId && form.categoryId;

  const submit = () => {
    if (!valid) return;
    const { _isNew, ...rest } = form;
    onSave({ ...rest, amount: amountNum });
  };

  return (
    <Modal title={op._isNew ? 'Новая операция' : 'Операция'} onClose={onClose}>
      <div className="space-y-4">
        <div className="inline-flex bg-[var(--surface)] border border-[var(--border)] rounded-xl p-1">
          {[['out', 'Расход'], ['in', 'Доход']].map(([id, label]) => (
            <button key={id}
              onClick={() => set({ direction: id, categoryId: articles.some(a => a.id === form.categoryId && a.direction === id) ? form.categoryId : '' })}
              className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${form.direction === id ? 'bg-[var(--text)] text-white' : 'text-[var(--text-muted)]'}`}>
              {label}
            </button>
          ))}
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs font-medium text-[var(--text-muted)] mb-1.5">Дата</label>
            <input type="date" value={form.date || ''} onChange={e => set({ date: e.target.value })}
              className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-[var(--text)]" />
          </div>
          <div>
            <label className="block text-xs font-medium text-[var(--text-muted)] mb-1.5">Сумма, ₽</label>
            <input value={form.amount} onChange={e => set({ amount: e.target.value })}
              inputMode="decimal" placeholder="0"
              className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-[var(--text)]" />
          </div>
        </div>

        <div>
          <label className="block text-xs font-medium text-[var(--text-muted)] mb-1.5">Счёт</label>
          <select value={form.accountId || ''} onChange={e => set({ accountId: e.target.value })}
            className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-3 py-2.5 text-sm">
            <option value="">Выберите счёт…</option>
            {accounts.map(a => <option key={a.id} value={a.id}>{a.name || 'Счёт'}</option>)}
          </select>
        </div>

        <div>
          <label className="block text-xs font-medium text-[var(--text-muted)] mb-1.5">Статья</label>
          <select value={form.categoryId || ''} onChange={e => set({ categoryId: e.target.value })}
            className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-3 py-2.5 text-sm">
            <option value="">Выберите статью…</option>
            {Object.entries(grouped).map(([group, items]) => (
              <optgroup key={group} label={group}>
                {items.map(a => <option key={a.id} value={a.id}>{a.label}</option>)}
              </optgroup>
            ))}
          </select>
          {!dirArticles.length && (
            <div className="text-xs text-amber-600 mt-1.5">
              Нет статей этого направления — добавьте их в настройках вкладки «По месяцу».
            </div>
          )}
        </div>

        <div>
          <label className="block text-xs font-medium text-[var(--text-muted)] mb-1.5">Назначение</label>
          <input value={form.purpose || ''} onChange={e => set({ purpose: e.target.value })}
            placeholder="Необязательно" maxLength={200}
            className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-[var(--text)]" />
        </div>
      </div>

      <div className="flex gap-3 mt-5 pt-4 border-t border-[var(--border)]">
        <button onClick={onClose} className="btn-secondary">Отмена</button>
        <button onClick={submit} disabled={!valid}
          className="btn-primary flex-1 disabled:opacity-40 disabled:cursor-not-allowed">
          Сохранить
        </button>
      </div>
    </Modal>
  );
}


function BudgetStatementImportModal({ rows, fileName, editMode, data, setData, allCats, incomeSources, onClose }) {
  const savedMappings = data.budgetStatementMappings || {};
  const targetGroups = useMemo(
    () => collectBudgetFactTargets(data, allCats, incomeSources),
    [data, allCats, incomeSources]
  );
  const flatTargets = useMemo(
    () => targetGroups.flatMap(g => g.items.map(it => ({ ...it, groupLabel: g.label }))),
    [targetGroups]
  );

  const accounts = useMemo(() => {
    const map = new Map();
    rows.forEach(r => {
      const cur = map.get(r.account) || { account: r.account, count: 0, expense: 0, income: 0 };
      cur.count += 1;
      if (r.amount < 0) cur.expense += -r.amount;
      else cur.income += r.amount;
      map.set(r.account, cur);
    });
    return [...map.values()].sort((a, b) => b.count - a.count);
  }, [rows]);

  const preferredAccount = data.budgetStatementAccount
    && accounts.some(a => a.account === data.budgetStatementAccount)
    ? data.budgetStatementAccount
    : (accounts[0]?.account || '');

  const [account, setAccount] = useState(preferredAccount);
  const [mappings, setMappings] = useState(() => {
    const init = {};
    const cats = new Set(rows.map(r => r.category));
    cats.forEach(cat => {
      init[cat] = autoMapStatementCategory(cat, targetGroups, savedMappings);
    });
    return init;
  });
  const [filter, setFilter] = useState(editMode ? 'expenses' : 'unmapped'); // all | unmapped | expenses | income

  // Re-auto-map when account changes only for still-empty mappings of categories present on that account
  useEffect(() => {
    setMappings(prev => {
      const next = { ...prev };
      const cats = new Set(rows.filter(r => r.account === account).map(r => r.category));
      cats.forEach(cat => {
        if (!next[cat]) next[cat] = autoMapStatementCategory(cat, targetGroups, savedMappings);
      });
      return next;
    });
  }, [account]); // eslint-disable-line react-hooks/exhaustive-deps

  const categoryStats = useMemo(() => {
    const map = new Map();
    rows.filter(r => r.account === account).forEach(r => {
      const cur = map.get(r.category) || {
        category: r.category,
        expense: 0, income: 0,
        nExpense: 0, nIncome: 0,
      };
      if (r.amount < 0) { cur.expense += -r.amount; cur.nExpense += 1; }
      else if (r.amount > 0) { cur.income += r.amount; cur.nIncome += 1; }
      map.set(r.category, cur);
    });
    return [...map.values()].sort((a, b) => (b.expense - a.expense) || (b.income - a.income) || a.category.localeCompare(b.category, 'ru'));
  }, [rows, account]);

  const isExpenseCat = (st) => st.expense > 0;
  const isMapped = (cat) => {
    const m = mappings[cat];
    return !!(m && (m === 'skip' || flatTargets.some(t => t.id === m)));
  };

  const unmappedExpenseStats = categoryStats.filter(st => isExpenseCat(st) && !isMapped(st.category));
  const unmappedExpenseSum = unmappedExpenseStats.reduce((s, st) => s + st.expense, 0);
  const expenseCatsTotal = categoryStats.filter(isExpenseCat).length;
  const expenseCatsMapped = expenseCatsTotal - unmappedExpenseStats.length;

  const visibleStats = categoryStats.filter(st => {
    if (filter === 'unmapped') return isExpenseCat(st) && !isMapped(st.category);
    if (filter === 'expenses') return st.expense > 0;
    if (filter === 'income') return st.income > 0 && st.expense <= 0;
    return true;
  });

  const setMapping = (cat, value) => setMappings(m => ({ ...m, [cat]: value }));

  const applyImport = () => {
    if (unmappedExpenseStats.length > 0) return;

    const monthsInFile = new Set(rows.filter(r => r.account === account).map(r => r.month));
    const rebuiltFact = {};
    const rebuiltInc = {};

    rows.filter(r => r.account === account).forEach(r => {
      const target = mappings[r.category];
      if (!target || target === 'skip') return;
      if (target.startsWith('item:')) {
        if (!(r.amount < 0)) return;
        const itemId = target.slice(5);
        const key = `${itemId}_${r.month}`;
        rebuiltFact[key] = (rebuiltFact[key] || 0) + (-r.amount);
      } else if (target.startsWith('inc:')) {
        if (!(r.amount > 0)) return;
        const srcId = target.slice(4);
        const key = `${srcId}_${r.month}`;
        rebuiltInc[key] = (rebuiltInc[key] || 0) + r.amount;
      }
    });

    Object.keys(rebuiltFact).forEach(k => { rebuiltFact[k] = Math.round(rebuiltFact[k]); });
    Object.keys(rebuiltInc).forEach(k => { rebuiltInc[k] = Math.round(rebuiltInc[k]); });

    // Replace fact for months present in the statement; keep other months untouched
    const newFact = { ...(data.budgetFactValues || {}) };
    const newIncFact = { ...(data.budgetIncomeFactValues || {}) };
    const allItemIds = allCats.flatMap(c => (c.items || []).map(it => it.id));
    allItemIds.forEach(itemId => {
      monthsInFile.forEach(month => {
        const key = `${itemId}_${month}`;
        if (rebuiltFact[key] != null) newFact[key] = rebuiltFact[key];
        else delete newFact[key];
      });
    });
    (incomeSources || []).forEach(src => {
      monthsInFile.forEach(month => {
        const key = `${src.id}_${month}`;
        if (rebuiltInc[key] != null) newIncFact[key] = rebuiltInc[key];
        else delete newIncFact[key];
      });
    });

    const nextMappings = { ...savedMappings, ...mappings };
    Object.keys(nextMappings).forEach(k => { if (!nextMappings[k]) delete nextMappings[k]; });

    // Persist compact rows so mapping can be re-edited without re-uploading
    const compactRows = rows.map(r => ({
      date: r.date,
      month: r.month,
      amount: r.amount,
      account: r.account,
      category: r.category,
    }));

    setData(d => ({
      ...d,
      budgetFactValues: newFact,
      budgetIncomeFactValues: newIncFact,
      budgetStatementMappings: nextMappings,
      budgetStatementAccount: account,
      budgetStatementRows: compactRows,
      budgetStatementFileName: fileName || d.budgetStatementFileName || '',
    }));
    onClose();
  };

  const accountMeta = accounts.find(a => a.account === account);

  return (
    <Modal title={editMode ? 'Маппинг выписки' : 'Загрузка выписки'} onClose={onClose} wide>
      <div className="space-y-4">
        <div className="text-xs text-[var(--text-muted)]">
          Файл: <span className="text-[var(--text)] font-medium">{fileName || 'выписка.csv'}</span>
          {' · '}{rows.length} операций
          {editMode && <span className="ml-1 text-[var(--text-subtle)]">· редактирование</span>}
        </div>

        <div>
          <label className="block text-xs text-[var(--text-muted)] font-medium mb-1.5">Счёт</label>
          <select
            className="w-full border border-[var(--border)] rounded-xl px-3 py-2.5 text-sm bg-[var(--surface)]"
            value={account}
            onChange={e => setAccount(e.target.value)}
          >
            {accounts.map(a => (
              <option key={a.account} value={a.account}>
                {a.account} — {a.count} оп., расход {formatRub(a.expense)} ₽
              </option>
            ))}
          </select>
          {accountMeta && (
            <div className="mt-1.5 text-xs text-[var(--text-subtle)]">
              Расход: {formatRub(accountMeta.expense)} ₽ · Приход: {formatRub(accountMeta.income)} ₽
            </div>
          )}
        </div>

        <div className={`rounded-xl border px-3 py-2.5 text-sm flex items-center justify-between gap-3 ${
          unmappedExpenseStats.length
            ? 'border-amber-300 bg-amber-50 text-amber-900'
            : 'border-emerald-200 bg-emerald-50 text-emerald-800'
        }`}>
          <div>
            {unmappedExpenseStats.length
              ? <>Нераспределено расходов: <b>{formatRub(unmappedExpenseSum)} ₽</b> · {unmappedExpenseStats.length} {pluralRu(unmappedExpenseStats.length, ['категория', 'категории', 'категорий'])}</>
              : <>Все расходы распределены ({expenseCatsMapped}/{expenseCatsTotal})</>}
          </div>
