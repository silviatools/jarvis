// ── Справочник ─────────────────────────────────────────────────────────────
function CampingCatalogView({ data, setData }) {
  const [editing, setEditing] = useState(null); // null | item | 'new'
  const [query, setQuery] = useState('');
  const items = data.campingItems || [];
  const categories = data.campingCategories || [];
  const catById = useMemo(
    () => Object.fromEntries(categories.map(c => [c.id, c])),
    [categories]);

  const ensureCategory = (name) => {
    const trimmed = (name || '').trim();
    if (!trimmed) return null;
    const existing = (getAppDataSnapshot()?.campingCategories || categories)
      .find(c => (c.name || '').toLowerCase() === trimmed.toLowerCase());
    if (existing) return existing;
    const cat = { id: crypto.randomUUID(), name: trimmed, createdAt: Date.now() };
    setData(d => {
      const list = d.campingCategories || [];
      if (list.some(c => (c.name || '').toLowerCase() === trimmed.toLowerCase())) return d;
      return { ...d, campingCategories: [...list, cat] };
    });
    return cat;
  };

  const saveItem = (item, categoryName) => {
    const cat = ensureCategory(categoryName);
    if (!cat) return alert('Укажите категорию');
    const entry = {
      ...item,
      name: item.name.trim(),
      categoryId: cat.id,
      isBag: !!item.isBag,
    };
    if (!entry.name) return alert('Введите название');
    setData(d => {
      const list = d.campingItems || [];
      const exists = list.some(x => x.id === entry.id);
      return {
        ...d,
        campingItems: exists ? list.map(x => x.id === entry.id ? entry : x) : [...list, entry],
      };
    });
    setEditing(null);
  };

  const removeItem = (it) => {
    if (!confirm(`Удалить «${it.name}» из справочника?`)) return;
    setData(d => ({
      ...d,
      campingItems: (d.campingItems || []).filter(x => x.id !== it.id),
      deletedIds: withDeletedId(d, 'campingItems', it.id),
    }));
  };

  const renameCategory = (cat, nextName) => {
    const trimmed = (nextName || '').trim();
    if (!trimmed || trimmed === cat.name) return;
    const dup = categories.some(c => c.id !== cat.id && (c.name || '').toLowerCase() === trimmed.toLowerCase());
    if (dup) return alert('Категория с таким названием уже есть');
    setData(d => ({
      ...d,
      campingCategories: (d.campingCategories || []).map(c => c.id === cat.id ? { ...c, name: trimmed } : c),
    }));
  };

  const removeCategory = (cat) => {
    const count = items.filter(i => i.categoryId === cat.id).length;
    const msg = count > 0
      ? `Удалить категорию «${cat.name}»? ${count} ${plannerPlural(count, 'вещь', 'вещи', 'вещей')} останутся без категории.`
      : `Удалить категорию «${cat.name}»?`;
    if (!confirm(msg)) return;
    setData(d => ({
      ...d,
      campingCategories: (d.campingCategories || []).filter(c => c.id !== cat.id),
      campingItems: (d.campingItems || []).map(i => i.categoryId === cat.id ? { ...i, categoryId: '' } : i),
      deletedIds: withDeletedId(d, 'campingCategories', cat.id),
    }));
  };

  const filteredItems = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return items;
    return items.filter(it =>
      (it.name || '').toLowerCase().includes(q) ||
      (catById[it.categoryId]?.name || '').toLowerCase().includes(q));
  }, [items, query, catById]);

  const grouped = useMemo(() => {
    const bags = filteredItems.filter(i => i.isBag);
    const goods = filteredItems.filter(i => !i.isBag);
    const byCat = {};
    goods.forEach(it => {
      const key = it.categoryId || '_none';
      if (!byCat[key]) byCat[key] = [];
      byCat[key].push(it);
    });
    Object.keys(byCat).forEach(k => byCat[k].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru')));
    bags.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));
    const catOrder = [...categories]
      .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'))
      .map(c => c.id)
      .filter(id => byCat[id]);
    if (byCat._none) catOrder.push('_none');
    // категории вещей, которых уже нет в справочнике категорий
    Object.keys(byCat).forEach(id => {
      if (id !== '_none' && !catOrder.includes(id)) catOrder.push(id);
    });
    return { bags, byCat, catOrder };
  }, [filteredItems, categories]);

  if (editing) {
    return (
      <CampingItemForm
        initial={editing === 'new'
          ? { id: crypto.randomUUID(), name: '', categoryId: '', isBag: false }
          : editing}
        categories={categories}
        ensureCategory={ensureCategory}
        onSave={saveItem}
        onCancel={() => setEditing(null)}
      />
    );
  }

  return (
    <div>
      <button
        onClick={() => setEditing('new')}
        className="btn-primary w-full flex items-center justify-center gap-2 mb-4"
      >
        <Icon name="plus" size={18} /> Добавить
      </button>

      {items.length > 0 && (
        <div className="relative mb-4">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-subtle)]">
            <Icon name="search" size={16} />
          </span>
          <input
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Поиск по справочнику"
            className="w-full !pl-9"
          />
        </div>
      )}

      {items.length === 0 ? (
        <EmptyState title="Справочник пуст" text="Добавьте вещи и сумки — потом соберёте их в поездку" />
      ) : grouped.bags.length === 0 && grouped.catOrder.length === 0 ? (
        <EmptyState title="Ничего не найдено" text="Попробуйте изменить запрос" />
      ) : (
        <div className="space-y-5">
          {grouped.bags.length > 0 && (
            <div>
              <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] mb-2 flex items-center gap-2">
                <Icon name="backpack" size={14} /> Сумки
              </div>
              <div className="space-y-2">
                {grouped.bags.map(it => (
                  <CampingCatalogRow
                    key={it.id}
                    item={it}
                    categoryName={catById[it.categoryId]?.name}
                    onEdit={() => setEditing(it)}
                    onRemove={() => removeItem(it)}
                  />
                ))}
              </div>
            </div>
          )}
          {grouped.catOrder.map(cid => (
            <div key={cid}>
              {cid === '_none' ? (
                <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] mb-2">Без категории</div>
              ) : (
                <CampingCategoryHeader
                  category={catById[cid] || { id: cid, name: 'Категория' }}
                  onRename={name => renameCategory(catById[cid] || { id: cid }, name)}
                  onRemove={() => removeCategory(catById[cid] || { id: cid, name: 'Категория' })}
                />
              )}
              <div className="space-y-2">
                {grouped.byCat[cid].map(it => (
                  <CampingCatalogRow
                    key={it.id}
                    item={it}
                    categoryName={catById[it.categoryId]?.name}
                    onEdit={() => setEditing(it)}
                    onRemove={() => removeItem(it)}
                  />
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CampingCategoryHeader({ category, onRename, onRemove }) {
  const [editing, setEditing] = useState(false);
  const [name, setName] = useState(category.name || '');

  const commit = () => {
    onRename(name);
    setEditing(false);
  };

  if (editing) {
    return (
      <div className="flex items-center gap-2 mb-2">
        <input
          value={name}
          onChange={e => setName(e.target.value)}
          onKeyDown={e => {
            if (e.key === 'Enter') { e.preventDefault(); commit(); }
            if (e.key === 'Escape') { setName(category.name || ''); setEditing(false); }
          }}
          autoFocus
          className="!py-1.5 !text-sm flex-1"
        />
        <button onClick={commit} className="p-1.5 rounded-lg hover:bg-black/5 text-[var(--text-muted)]" title="Сохранить">
          <Icon name="check" size={15} />
        </button>
        <button onClick={() => { setName(category.name || ''); setEditing(false); }} className="p-1.5 rounded-lg hover:bg-black/5 text-[var(--text-muted)]" title="Отмена">
          <Icon name="x" size={15} />
        </button>
      </div>
    );
  }

  return (
    <div className="flex items-center gap-2 mb-2 group">
      <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] flex-1">{category.name}</div>
      <button onClick={() => { setName(category.name || ''); setEditing(true); }} className="p-1 rounded-lg hover:bg-black/5 text-[var(--text-subtle)]" title="Переименовать категорию">
        <Icon name="edit" size={13} />
      </button>
      <button onClick={onRemove} className="p-1 rounded-lg hover:bg-red-50 text-[var(--text-subtle)] hover:text-red-500" title="Удалить категорию">
        <Icon name="trash" size={13} />
      </button>
    </div>
  );
}

function CampingItemForm({ initial, categories, ensureCategory, onSave, onCancel }) {
  const [name, setName] = useState(initial.name || '');
  const [isBag, setIsBag] = useState(!!initial.isBag);
  const initialCatName = (categories.find(c => c.id === initial.categoryId) || {}).name || '';
  const [catInput, setCatInput] = useState(initialCatName);
  const [catOpen, setCatOpen] = useState(false);
  const dirtyRef = useRef(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    const onDoc = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setCatOpen(false);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const markDirty = () => { dirtyRef.current = true; };

  const filtered = useMemo(() => {
    const q = catInput.trim().toLowerCase();
    const list = [...categories].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));
    if (!q) return list;
    return list.filter(c => (c.name || '').toLowerCase().includes(q));
  }, [categories, catInput]);

  const exactMatch = categories.some(c => (c.name || '').toLowerCase() === catInput.trim().toLowerCase());

  const commitCategory = (raw) => {
    const trimmed = (raw || catInput).trim();
    if (!trimmed) return;
    setCatInput(trimmed);
    const cat = ensureCategory(trimmed);
    if (cat) setCatInput(cat.name);
    setCatOpen(false);
  };

  const requestClose = () => {
    if (dirtyRef.current || name.trim() !== (initial.name || '') || isBag !== !!initial.isBag
        || catInput.trim() !== initialCatName) {
      if (!confirm('Закрыть без сохранения? Изменения будут потеряны.')) return;
    }
    onCancel();
  };

  const submit = () => {
    if (!name.trim()) return alert('Введите название');
    if (!catInput.trim()) return alert('Укажите категорию');
    commitCategory(catInput);
    onSave({ ...initial, name: name.trim(), isBag }, catInput.trim());
  };

  return (
    <div className="fade-in space-y-5">
      <div className="flex items-center gap-3">
        <button onClick={requestClose} className="p-2 rounded-xl hover:bg-black/5 text-[var(--text-muted)]" aria-label="Закрыть">
          <Icon name="x" size={20} />
        </button>
        <h2 className="font-display text-2xl">{initial.name ? 'Вещь' : 'Новая вещь'}</h2>
      </div>

      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-5 space-y-4">
        <div>
          <label>Название</label>
          <input
            value={name}
            onChange={e => { markDirty(); setName(e.target.value); }}
            placeholder="Например, Спальник"
            autoFocus
          />
        </div>

        <div ref={wrapRef} className="relative">
          <label>Категория</label>
          <input
            value={catInput}
            onChange={e => { markDirty(); setCatInput(e.target.value); setCatOpen(true); }}
            onFocus={() => setCatOpen(true)}
            onBlur={() => {
              // даём клику по списку сработать раньше blur-закрытия
              setTimeout(() => {
                if (catInput.trim() && !exactMatch) commitCategory(catInput);
              }, 120);
            }}
            onKeyDown={e => {
              if (e.key === 'Enter') {
                e.preventDefault();
                commitCategory(catInput);
              }
            }}
            placeholder="Введите или выберите"
            autoComplete="off"
          />
          {catOpen && (filtered.length > 0 || (catInput.trim() && !exactMatch)) && (
            <div className="absolute z-20 left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-[var(--surface)] border border-[var(--border)] rounded-xl shadow-lg">

                <button
                  key={c.id}
                  type="button"
                  className="w-full text-left px-3 py-2.5 text-sm hover:bg-[var(--bg)]"
                  onMouseDown={e => e.preventDefault()}
                  onClick={() => { markDirty(); setCatInput(c.name); setCatOpen(false); }}
                >{c.name}</button>
              ))}
              {catInput.trim() && !exactMatch && (
                <button
                  type="button"
                  className="w-full text-left px-3 py-2.5 text-sm border-t border-[var(--border)] text-[var(--text)] font-medium hover:bg-[var(--bg)]"
                  onMouseDown={e => e.preventDefault()}
                  onClick={() => commitCategory(catInput)}
                >Создать «{catInput.trim()}»</button>
              )}
            </div>
          )}
          <div className="text-[11px] text-[var(--text-subtle)] mt-1">
            Новая категория сохраняется сразу и появится в списке.
          </div>
        </div>

        <label className="flex items-center gap-3 cursor-pointer !normal-case !tracking-normal !text-sm !text-[var(--text)] !font-normal !mb-0">
          <input
            type="checkbox"
            className="!w-auto accent-[var(--text)]"
            checked={isBag}
            onChange={e => { markDirty(); setIsBag(e.target.checked); }}
          />
          Это сумка
        </label>
        {isBag && (
          <div className="text-xs text-[var(--text-muted)] -mt-2">
            В сумку можно будет класть другие вещи при сборах в поездку.
          </div>
        )}
      </div>

      <div className="flex gap-3">
        <button onClick={requestClose} className="btn-secondary flex-1">Отмена</button>
        <button onClick={submit} className="btn-primary flex-1">Сохранить</button>
      </div>
    </div>
  );
}

// ── Чек лист / поездки ─────────────────────────────────────────────────────
function CampingChecklistView({ data, setData }) {
  const [editingTrip, setEditingTrip] = useState(null); // null | 'new' | trip
  const [openTripId, setOpenTripId] = useState(null);
  const trips = [...(data.campingTrips || [])].sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));

  const saveTrip = (trip) => {
    const entry = {
      ...trip,
      name: trip.name.trim(),
      location: (trip.location || '').trim(),
      description: (trip.description || '').trim(),
      packing: campingNormPacking(trip.packing),
    };
    if (!entry.name) return alert('Введите наименование');
    setData(d => {
      const list = d.campingTrips || [];
      const exists = list.some(x => x.id === entry.id);
      return {
        ...d,
        campingTrips: exists ? list.map(x => x.id === entry.id ? entry : x) : [...list, entry],
      };
    });
    setEditingTrip(null);
    setOpenTripId(entry.id);
  };

  const removeTrip = (trip) => {
    if (!confirm(`Удалить поездку «${trip.name}»?`)) return;
    setData(d => ({
      ...d,
      campingTrips: (d.campingTrips || []).filter(x => x.id !== trip.id),
      deletedIds: withDeletedId(d, 'campingTrips', trip.id),
    }));
    if (openTripId === trip.id) setOpenTripId(null);
  };

  const updateTrip = (tripId, patch) => {
    setData(d => ({
      ...d,
      campingTrips: (d.campingTrips || []).map(t => t.id === tripId ? { ...t, ...patch } : t),
    }));
  };

  if (editingTrip) {
    return (
      <CampingTripForm
        initial={editingTrip === 'new'
          ? { id: crypto.randomUUID(), name: '', startDate: '', endDate: '', location: '', description: '', packing: campingEmptyPacking(), shareToken: makePlannerToken(), shareEnabled: true, createdAt: Date.now() }
          : editingTrip}
        onSave={saveTrip}
        onCancel={() => setEditingTrip(null)}
      />
    );
  }

  const openTrip = openTripId ? trips.find(t => t.id === openTripId) : null;
  if (openTrip) {
    return (
      <CampingTripDetail
        trip={openTrip}
        data={data}
        onBack={() => setOpenTripId(null)}
        onEdit={() => setEditingTrip(openTrip)}
        onDelete={() => removeTrip(openTrip)}
        onUpdate={(patch) => updateTrip(openTrip.id, patch)}
      />
    );
  }

  return (
    <div>
      <button
        onClick={() => setEditingTrip('new')}
        className="btn-primary w-full flex items-center justify-center gap-2 mb-4"
      >
        <Icon name="plus" size={18} /> Создать поездку
      </button>

      {trips.length === 0 ? (
        <EmptyState title="Нет поездок" text="Создайте поездку и соберите вещи по сумкам" />
      ) : (
        <div className="space-y-2">
          {trips.map(t => {
            const packing = campingNormPacking(t.packing);
            const total = packing.bags.length + packing.items.length;
            const done = packing.bags.filter(b => b.packed).length + packing.items.filter(i => i.packed).length;
            return (
              <button
                key={t.id}
                onClick={() => setOpenTripId(t.id)}
                className="w-full text-left bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-3.5 hover:border-[var(--border-strong)] transition-colors"
              >
                <div className="font-medium">{t.name}</div>
                <div className="text-xs text-[var(--text-subtle)] mt-1">
                  {[campingFmtTripDates(t), t.location].filter(Boolean).join(' · ') || 'без дат'}
                  {total > 0 ? ` · собрано ${done}/${total}` : ''}
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

const campingFmtTripDates = (t) => {
  if (!t.startDate && !t.endDate) return '';
  const a = t.startDate ? plannerFmtDate(t.startDate) : '';
  const b = t.endDate ? plannerFmtDate(t.endDate) : '';
  if (a && b && a !== b) return `${a} – ${b}`;
  return a || b;
};

    name: initial.name || '',
    startDate: initial.startDate || '',

    if (!f.name.trim()) return alert('Введите наименование');

      endDate: f.endDate,
      location: f.location.trim(),

  return (
    <div className="fade-in space-y-5">

        <div>
          <label>Наименование</label>
          <input value={f.name} onChange={e => { dirty.current = true; set('name', e.target.value); }} placeholder="Алтай, май" autoFocus />
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label>Начало</label>
            <input type="date" value={f.startDate} onChange={e => { dirty.current = true; set('startDate', e.target.value); }} />
          </div>
          <div>
            <label>Конец</label>

        <div>
          <label>Местоположение</label>
          <input value={f.location} onChange={e => { dirty.current = true; set('location', e.target.value); }} placeholder="Озеро, кемпинг…" />
        </div>

          <textarea

      </div>

      <div className="flex gap-3">

        <button onClick={submit} className="btn-primary flex-1">Сохранить</button>
      </div>
    </div>
  );
}

function CampingTripDetail({ trip, data, onBack, onEdit, onDelete, onUpdate }) {
  const [packingOpen, setPackingOpen] = useState(false);
  const [collapsed, setCollapsed] = useState({}); // bagItemId -> bool (true = collapsed)
  const [shareOpen, setShareOpen] = useState(false);
  const [copied, setCopied] = useState(false);
  const itemsById = useMemo(
    () => Object.fromEntries((data.campingItems || []).map(i => [i.id, i])),
    [data.campingItems]);
  const packing = campingNormPacking(trip.packing);

  const shareOn = trip.shareEnabled !== false;
  const shareUrl = campingTripUrl(trip);

  const openShare = () => {
    if (!trip.shareToken) onUpdate({ shareToken: makePlannerToken(), shareEnabled: true });
    setShareOpen(true);
  };

  const copyLink = async () => {
    const ok = await copyToClipboard(shareUrl);
    if (ok) {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } else {
      prompt('Скопируйте ссылку вручную:', shareUrl);
    }
  };

  const shareLink = async () => {
    try {
      await navigator.share({ title: trip.name || 'Список для поездки', text: trip.name || '', url: shareUrl });
    } catch (_) {}
  };

  const toggleShare = () => onUpdate({ shareEnabled: !shareOn });

  const regenerateToken = () => {
    if (!confirm('Сделать новую ссылку?\n\nСтарая перестанет работать — тем, кому вы её уже отправили, придётся прислать новую.')) return;
    onUpdate({ shareToken: makePlannerToken(), shareEnabled: true });
  };

  const toggleItemPacked = (itemId) => {
    const next = {
      ...packing,
      items: packing.items.map(it => it.itemId === itemId ? { ...it, packed: !it.packed } : it),
    };
    onUpdate({ packing: next });
  };
  const toggleBagPacked = (bagItemId) => {
    const next = {
      ...packing,
      bags: packing.bags.map(b => b.itemId === bagItemId ? { ...b, packed: !b.packed } : b),
    };
    onUpdate({ packing: next });
  };

  const savePacking = (nextPacking) => {
    // сохраняем отметки packed с прошлого расклада, если вещь/сумка остались
    const prevItemPacked = Object.fromEntries(packing.items.map(i => [i.itemId, i.packed]));
    const prevBagPacked = Object.fromEntries(packing.bags.map(b => [b.itemId, b.packed]));
    const merged = {
      bags: nextPacking.bags.map(b => ({
        itemId: b.itemId,
        packed: !!prevBagPacked[b.itemId],
      })),
      items: nextPacking.items.map(it => ({
        itemId: it.itemId,
        bagId: it.bagId || null,
        packed: !!prevItemPacked[it.itemId],
      })),
    };
    onUpdate({ packing: merged });
    setPackingOpen(false);
  };

  if (packingOpen) {
    return (
      <CampingPackingEditor
        catalogItems={data.campingItems || []}
        categories={data.campingCategories || []}
        initial={packing}
        onSave={savePacking}
        onClose={() => setPackingOpen(false)}
      />
    );
  }

  const loose = packing.items.filter(it => !it.bagId);
  const inBag = (bagId) => packing.items.filter(it => it.bagId === bagId);
  const total = packing.bags.length + packing.items.length;
  const done = packing.bags.filter(b => b.packed).length + packing.items.filter(i => i.packed).length;

  return (
    <div className="fade-in space-y-4">
      <div className="flex items-center gap-3">
        <button onClick={onBack} className="p-2 rounded-xl hover:bg-black/5 text-[var(--text-muted)]">
          <Icon name="chevronLeft" size={20} />
        </button>
        <div className="flex-1 min-w-0">
          <div className="font-display text-2xl truncate">{trip.name}</div>
          <div className="text-xs text-[var(--text-subtle)] truncate">
            {[campingFmtTripDates(trip), trip.location].filter(Boolean).join(' · ')}
          </div>
        </div>
        <button
          onClick={() => shareOpen ? setShareOpen(false) : openShare()}
          className={`p-2 rounded-lg hover:bg-black/5 ${shareOpen ? 'text-[var(--text)]' : 'text-[var(--text-muted)]'}`}
          title="Поделиться списком"
        ><Icon name="share" size={16} /></button>
        <button onClick={onEdit} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)]"><Icon name="edit" size={16} /></button>
        <button onClick={onDelete} className="p-2 rounded-lg hover:bg-red-50 text-[var(--text-muted)] hover:text-red-500"><Icon name="trash" size={16} /></button>
      </div>

      {shareOpen && (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4">
          <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] mb-3">Ссылка для друзей</div>
          <div className="flex items-center gap-2">
            <input
              readOnly
              value={shareUrl}
              onFocus={e => e.target.select()}
              className="flex-1 min-w-0 text-xs !py-2 !px-3 text-[var(--text-muted)]"
              style={{ fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}
            />
            <button
              onClick={copyLink}
              className="btn-secondary !py-2 !px-3 text-sm flex items-center gap-1.5 flex-shrink-0"
              title="Скопировать ссылку"
            >
              <Icon name={copied ? 'check' : 'copy'} size={14} />
              <span className="hidden sm:inline">{copied ? 'Скопировано' : 'Копировать'}</span>
            </button>
            {typeof navigator !== 'undefined' && navigator.share && (
              <button onClick={shareLink} className="btn-secondary !py-2 !px-3 flex-shrink-0" title="Поделиться">
                <Icon name="share" size={14} />
              </button>
            )}
          </div>
          <div className={`text-[11px] mt-2 ${shareOn ? 'text-[var(--text-subtle)]' : 'text-red-500'}`}>
            {shareOn

          </div>
          <div className="flex items-center gap-3 mt-3">
            <button onClick={toggleShare} className="text-sm text-[var(--text-muted)] hover:text-[var(--text)]">
              {shareOn ? 'Отключить ссылку' : 'Включить ссылку'}

            <button onClick={regenerateToken} className="text-sm text-[var(--text-muted)] hover:text-[var(--text)]">

          <div className="text-xs text-[var(--text-subtle)] uppercase tracking-wider">

            return (

                  <button
                    onClick={() => toggleBagPacked(b.itemId)}

                    <Icon name="check" size={14} />

                    <Icon name="backpack" size={16} />

                      {bag?.name || 'Удалённая сумка'}

                    <span className="text-xs text-[var(--text-subtle)] flex-shrink-0">{kidsDone}/{kids.length}</span>
                    <span className={`text-[var(--text-subtle)] transition-transform ${isCollapsed ? '' : 'rotate-180'}`}>
                      <Icon name="chevronDown" size={16} />

                {!isCollapsed && (
                  <div className="border-t border-[var(--border)] px-3.5 py-2 space-y-1">
                    {kids.length === 0 ? (
                      <div className="text-xs text-[var(--text-subtle)] py-2">Пусто</div>

                      const item = itemsById[it.itemId];
                      return (
                        <button

                          <span className={`check-box ${it.packed ? 'checked' : ''}`} style={{ width: 22, height: 22 }}>

                          </span>

            <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-3.5 space-y-1">

                const item = itemsById[it.itemId];
                return (
                  <button
                    key={it.itemId}

                  >
                    <span className={`check-box ${it.packed ? 'checked' : ''}`} style={{ width: 22, height: 22 }}>
                      <Icon name="check" size={12} />
                    </span>
                    <span className={`text-sm flex-1 truncate ${it.packed ? 'line-through text-[var(--text-subtle)]' : ''}`}>
                      {item?.name || 'Удалённая вещь'}
                    </span>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Редактор раскладки: вещи слева (по категориям), сумки справа.
// Desktop — drag&drop; touch — tap вещь → tap сумку / «Без сумки».
// Грязное состояние блокирует закрытие крестиком без подтверждения.
function CampingPackingEditor({ catalogItems, categories, initial, onSave, onClose }) {
  const [bags, setBags] = useState(() => (initial.bags || []).map(b => b.itemId));
  const [assign, setAssign] = useState(() => {
    const m = {};
    (initial.items || []).forEach(it => { m[it.itemId] = it.bagId || null; });
    return m; // itemId -> bagId | null (в поездке) | undefined (не взята)
  });
  const [dirty, setDirty] = useState(false);
  const [selected, setSelected] = useState(null); // itemId for tap-assign
  const [dragItem, setDragItem] = useState(null);
  const [dragOver, setDragOver] = useState(null); // bagId | '__loose__' | '__bags__'
  const dirtyRef = useRef(false);

  const catById = useMemo(
    () => Object.fromEntries((categories || []).map(c => [c.id, c])),
    [categories]);
  const bagCatalog = useMemo(
    () => (catalogItems || []).filter(i => i.isBag).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru')),
    [catalogItems]);
  const goodsCatalog = useMemo(
    () => (catalogItems || []).filter(i => !i.isBag).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru')),
    [catalogItems]);

  const markDirty = () => { dirtyRef.current = true; setDirty(true); };

  useEffect(() => {
    const onBeforeUnload = (e) => {
      if (!dirtyRef.current) return;
      e.preventDefault();
      e.returnValue = '';
    };
    const onKey = (e) => {
      if (e.key === 'Escape') requestClose();
    };
    window.addEventListener('beforeunload', onBeforeUnload);
    window.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('beforeunload', onBeforeUnload);
      window.removeEventListener('keydown', onKey);
    };
  }, []);

  const requestClose = () => {
    if (dirtyRef.current) {
      if (!confirm('Закрыть без сохранения? Выбранные вещи и раскладка по сумкам будут потеряны.')) return;
    }
    dirtyRef.current = false;
    onClose();
  };

  const toggleBag = (bagId) => {
    markDirty();
    setBags(prev => {
      if (prev.includes(bagId)) {
        // убираем сумку — вещи из неё становятся «не взяты»
        setAssign(a => {
          const next = { ...a };
          Object.keys(next).forEach(id => {
            if (next[id] === bagId) delete next[id];
          });
          return next;
        });
        return prev.filter(id => id !== bagId);
      }
      return [...prev, bagId];
    });
  };

  const setItemAssign = (itemId, bagIdOrNull) => {
    markDirty();
    setAssign(a => ({ ...a, [itemId]: bagIdOrNull }));
    setSelected(null);
  };

  // Мобильный лист выбора сумки: сумка ставится в поездку по необходимости
  // и вещь тут же назначается в неё — без прокрутки к колонке сумок.
  const assignSelectedToBag = (bagId) => {
    if (!bags.includes(bagId)) {
      markDirty();
      setBags(b => [...b, bagId]);
    }
    setItemAssign(selected, bagId);
  };

  const unselectItem = (itemId) => {
    markDirty();
    setAssign(a => {
      const next = { ...a };
      delete next[itemId];
      return next;
    });
    setSelected(null);
  };

  const onItemTap = (itemId) => {
    // Если уже выбрана — снять; иначе выбрать для назначения
    if (selected === itemId) { setSelected(null); return; }
    setSelected(itemId);
  };

  const dropOn = (target) => {
    if (!dragItem) return;
    if (dragItem.kind === 'bag') {
      if (target === '__bags__' || target === 'take-bag') {
        if (!bags.includes(dragItem.id)) {
          markDirty();
          setBags(b => [...b, dragItem.id]);
        }
      }
    } else if (dragItem.kind === 'item') {
      if (target === '__loose__') setItemAssign(dragItem.id, null);
      else if (target && target !== '__bags__') {
        // target = bagId — сумка должна быть в поездке
        if (!bags.includes(target)) {
          markDirty();
          setBags(b => [...b, target]);
        }
        setItemAssign(dragItem.id, target);
      }
    }
    setDragItem(null);
    setDragOver(null);
  };

  const submit = () => {
    const takenItems = Object.keys(assign).filter(id => assign[id] !== undefined);
    if (bags.length === 0 && takenItems.length === 0) {
      return alert('Выберите хотя бы одну вещь или сумку');
    }
    dirtyRef.current = false;
    onSave({
      bags: bags.map(itemId => ({ itemId, packed: false })),
      items: takenItems.map(itemId => ({
        itemId,
        bagId: assign[itemId],
        packed: false,
      })),
    });
  };

  const goodsByCat = useMemo(() => {
    const map = {};
    goodsCatalog.forEach(it => {
      const k = it.categoryId || '_none';
      if (!map[k]) map[k] = [];
      map[k].push(it);
    });
    const order = [...(categories || [])]
      .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'))
      .map(c => c.id)
      .filter(id => map[id]);
    if (map._none) order.push('_none');
    Object.keys(map).forEach(id => { if (id !== '_none' && !order.includes(id)) order.push(id); });
    return { map, order };
  }, [goodsCatalog, categories]);

  const takenCount = Object.keys(assign).length;

  return (
    <div className="fade-in space-y-4">
      <div className="flex items-center gap-3">
        <button onClick={requestClose} className="p-2 rounded-xl hover:bg-black/5 text-[var(--text-muted)]" aria-label="Закрыть">
          <Icon name="x" size={20} />
        </button>
        <div className="flex-1 min-w-0">
          <h2 className="font-display text-2xl">Сумки и вещи</h2>
          <div className="text-xs text-[var(--text-subtle)]">
            <span className="hidden lg:inline">Перетащите вещь в сумку или нажмите вещь → сумку.</span>
            <span className="lg:hidden">Нажмите вещь и выберите сумку в открывшемся окне.</span>
            {' '}{dirty ? 'Есть несохранённые изменения.' : ''}
          </div>
        </div>
      </div>

      {selected && (
        <div className="hidden lg:flex bg-[var(--text)] text-white rounded-xl px-3 py-2 text-sm items-center justify-between gap-2">
          <span className="truncate">Выбрано: {(catalogItems.find(i => i.id === selected) || {}).name}</span>
          <div className="flex gap-2 flex-shrink-0">
            <button
              onClick={() => setItemAssign(selected, null)}
              className="px-2 py-1 rounded-lg bg-white/15 text-xs"
            >Без сумки</button>
            <button onClick={() => setSelected(null)} className="px-2 py-1 rounded-lg bg-white/15 text-xs">Отмена</button>
          </div>
        </div>
      )}

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        {/* Вещи */}
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 min-h-[200px]">
          <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] mb-3">Вещи по категориям</div>
          {goodsCatalog.length === 0 ? (
            <div className="text-sm text-[var(--text-subtle)]">В справочнике нет вещей. Добавьте их во вкладке «Справочник».</div>
          ) : (
            <div className="space-y-4">
              {goodsByCat.order.map(cid => (
                <div key={cid}>
                  <div className="text-xs font-medium text-[var(--text-muted)] mb-1.5">
                    {cid === '_none' ? 'Без категории' : (catById[cid]?.name || 'Категория')}
                  </div>
                  <div className="space-y-1.5">
                    {goodsByCat.map[cid].map(it => {
                      const taken = Object.prototype.hasOwnProperty.call(assign, it.id);
                      const bagId = assign[it.id];
                      const bagName = bagId ? (bagCatalog.find(b => b.id === bagId) || {}).name : null;
                      return (
                        <div
                          key={it.id}
                          draggable
                          onDragStart={() => setDragItem({ kind: 'item', id: it.id })}
                          onDragEnd={() => { setDragItem(null); setDragOver(null); }}
                          onClick={() => onItemTap(it.id)}
                          className={`flex items-center gap-2 px-3 py-2.5 rounded-xl border cursor-grab active:cursor-grabbing select-none transition-all ${
                            selected === it.id
                              ? 'border-[var(--text)] bg-[var(--bg)] ring-2 ring-[var(--text)]/10'
                              : taken
                                ? 'border-[var(--border-strong)] bg-[var(--bg)]'
                                : 'border-[var(--border)] hover:border-[var(--border-strong)]'
                          }`}
                        >
                          <Icon name="archive" size={14} />
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-medium truncate">{it.name}</div>
                            {taken && (
                              <div className="text-[11px] text-[var(--text-subtle)] truncate">
                                {bagName ? `→ ${bagName}` : 'без сумки'}
                              </div>
                            )}
                          </div>
                          {taken && (
                            <button
                              onClick={(e) => { e.stopPropagation(); unselectItem(it.id); }}
                              className="p-1 rounded-lg text-[var(--text-subtle)] hover:text-red-500"
                              title="Убрать из поездки"
                            >
                              <Icon name="x" size={14} />
                            </button>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Сумки + зона «без сумки» */}
        <div className="space-y-3">
          <div
            className={`bg-[var(--surface)] border rounded-2xl p-4 min-h-[120px] transition-all ${
              dragOver === '__bags__' ? 'border-[var(--text)] ring-2 ring-[var(--text)]/10' : 'border-[var(--border)]'
            }`}
            onDragOver={e => { e.preventDefault(); setDragOver('__bags__'); }}
            onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
            onDrop={e => { e.preventDefault(); dropOn('__bags__'); }}
          >
            <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] mb-3 flex items-center gap-2">
              <Icon name="backpack" size={14} /> Сумки
            </div>
            {bagCatalog.length === 0 ? (
              <div className="text-sm text-[var(--text-subtle)]">Нет сумок в справочнике. Отметьте вещь галочкой «Это сумка».</div>
            ) : (
              <div className="space-y-2">
                {bagCatalog.map(bag => {
                  const onTrip = bags.includes(bag.id);
                  const kids = Object.entries(assign).filter(([, bid]) => bid === bag.id);
                  return (
                    <div
                      key={bag.id}
                      onDragOver={e => { e.preventDefault(); e.stopPropagation(); setDragOver(bag.id); }}
                      onDrop={e => { e.preventDefault(); e.stopPropagation(); dropOn(bag.id); }}
                      onClick={() => {
                        if (selected) {
                          if (!onTrip) toggleBag(bag.id);
                          setItemAssign(selected, bag.id);
                        } else {
                          toggleBag(bag.id);
                        }
                      }}
                      className={`rounded-xl border p-3 transition-all cursor-pointer ${
                        dragOver === bag.id
                          ? 'border-[var(--text)] bg-[var(--bg)] ring-2 ring-[var(--text)]/10'
                          : onTrip
                            ? 'border-[var(--border-strong)] bg-[var(--bg)]'
                            : 'border-dashed border-[var(--border)]'
                      }`}
                    >
                      <div className="flex items-center gap-2">
                        <input
                          type="checkbox"
                          className="!w-auto accent-[var(--text)]"
                          checked={onTrip}
                          onChange={() => toggleBag(bag.id)}
                          onClick={e => e.stopPropagation()}
                        />
                        <span className="font-medium text-sm flex-1 truncate">{bag.name}</span>
                        {onTrip && <span className="text-xs text-[var(--text-subtle)]">{kids.length}</span>}
                      </div>
                      {onTrip && kids.length > 0 && (
                        <div className="mt-2 space-y-1 pl-6">
                          {kids.map(([itemId]) => {
                            const it = goodsCatalog.find(g => g.id === itemId);
                            return (
                              <div key={itemId} className="text-xs text-[var(--text-muted)] flex items-center justify-between gap-2">
                                <span className="truncate">{it?.name || itemId}</span>
                                <button
                                  onClick={e => { e.stopPropagation(); unselectItem(itemId); }}
                                  className="text-[var(--text-subtle)] hover:text-red-500"
                                ><Icon name="x" size={12} /></button>
                              </div>
                            );
                          })}
                        </div>
                      )}
                      {selected && (
                        <div className="text-[11px] text-[var(--text-subtle)] mt-1.5">
                          Нажмите, чтобы положить сюда
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div
            className={`bg-[var(--surface)] border rounded-2xl p-4 transition-all ${
              dragOver === '__loose__' ? 'border-[var(--text)] ring-2 ring-[var(--text)]/10' : 'border-dashed border-[var(--border)]'
            }`}
            onDragOver={e => { e.preventDefault(); setDragOver('__loose__'); }}
            onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
            onDrop={e => { e.preventDefault(); dropOn('__loose__'); }}
            onClick={() => { if (selected) setItemAssign(selected, null); }}
          >
            <div className="text-xs uppercase tracking-wider text-[var(--text-subtle)] mb-2">Без сумки</div>
            <div className="text-xs text-[var(--text-muted)] mb-2">
              Палатка и крупное — перетащите сюда или нажмите, когда вещь выбрана.
            </div>
            <div className="space-y-1">
              {Object.entries(assign).filter(([, bid]) => bid === null).map(([itemId]) => {
                const it = goodsCatalog.find(g => g.id === itemId);
                return (
                  <div key={itemId} className="flex items-center justify-between gap-2 text-sm py-1">
                    <span className="truncate">{it?.name || itemId}</span>
                    <button onClick={e => { e.stopPropagation(); unselectItem(itemId); }} className="text-[var(--text-subtle)] hover:text-red-500">
                      <Icon name="x" size={14} />
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>

      <div className="flex gap-3 sticky bottom-2 bg-[var(--bg)]/90 backdrop-blur py-2">
        <button onClick={requestClose} className="btn-secondary flex-1">Отмена</button>
        <button onClick={submit} className="btn-primary flex-1">
          Сохранить{takenCount || bags.length ? ` (${bags.length} сум., ${takenCount} в.)` : ''}
        </button>
      </div>

      {/* Мобильный лист выбора сумки: замена drag&drop на телефоне — тап по
          вещи сразу открывает список сумок снизу, без прокрутки ко второй
          колонке. На десктопе не показывается, там работают drag&drop и
          верхняя плашка «Выбрано». */}
      {selected && ReactDOM.createPortal(
        <div className="lg:hidden">
          <div className="fixed inset-0 z-40 bg-black/40 fade-in" onClick={() => setSelected(null)} />
          <div className="fixed inset-x-0 bottom-0 z-50 bg-[var(--surface)] border-t border-[var(--border)] rounded-t-2xl shadow-2xl max-h-[75vh] flex flex-col">
            <div className="flex items-center justify-between gap-2 px-4 py-3.5 border-b border-[var(--border)] flex-shrink-0">
              <div className="min-w-0">
                <div className="text-[11px] uppercase tracking-wider text-[var(--text-subtle)]">Куда положить</div>
                <div className="text-[15px] font-medium truncate">{(catalogItems.find(i => i.id === selected) || {}).name}</div>
              </div>
              <button onClick={() => setSelected(null)} className="p-2 rounded-lg hover:bg-black/5 text-[var(--text-muted)] flex-shrink-0" aria-label="Закрыть">
                <Icon name="x" size={18} />
              </button>
            </div>
            <div className="p-3 space-y-1.5 overflow-y-auto" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 12px)' }}>
              <button
                onClick={() => setItemAssign(selected, null)}
                className={`w-full text-left px-3.5 py-3 rounded-xl border text-[15px] flex items-center gap-2.5 ${
                  assign[selected] === null ? 'border-[var(--text)] bg-[var(--bg)]' : 'border-[var(--border)]'
                }`}
              >
                <Icon name="archive" size={16} /> Без сумки
              </button>
              {bagCatalog.length === 0 ? (
                <div className="text-xs text-[var(--text-subtle)] px-1 py-2">Нет сумок в справочнике.</div>
              ) : bagCatalog.map(bag => (
                <button
                  key={bag.id}
                  onClick={() => assignSelectedToBag(bag.id)}
                  className={`w-full text-left px-3.5 py-3 rounded-xl border text-[15px] flex items-center gap-2.5 ${
                    assign[selected] === bag.id ? 'border-[var(--text)] bg-[var(--bg)]' : 'border-[var(--border)]'
                  }`}
                >
                  <Icon name="backpack" size={16} /> {bag.name}
                </button>
              ))}
              {Object.prototype.hasOwnProperty.call(assign, selected) && (
                <button
                  onClick={() => unselectItem(selected)}
                  className="w-full text-left px-3.5 py-3 rounded-xl border border-dashed border-[var(--border)] text-[15px] text-red-500 flex items-center gap-2.5"
                >
                  <Icon name="x" size={16} /> Убрать из поездки
                </button>
              )}
            </div>
          </div>
        </div>,
        document.body
      )}
    </div>
  );
}

// ── Хотелки ────────────────────────────────────────────────────────────────
// Вкладки внутри («Аня», «Миша», «Общее», «Для дома») заводит сам пользователь:
// это обычная коллекция, а не фиксированный список в коде.

const WISHLIST_STARTER_CATEGORIES = ['Общее', 'Для дома'];

const newWishlistItem = (categoryId) => ({
  id: crypto.randomUUID(),
  categoryId: categoryId || '',
  title: '',
  url: '',
  price: '',
  description: '',
  image: '',       // имя файла в /api/photos
  imageUrl: '',    // откуда картинка приехала — на случай, если файл потеряется
  bought: false,
  createdAt: Date.now(),
  updatedAt: Date.now(),
});

// «12 990,50 ₽» → 12990.5. Цена хранится строкой (её пишет и человек, и
// парсер), а суммировать по вкладке всё равно надо числом.
const wishPriceNumber = (raw) => {
  const s = String(raw ?? '').replace(/ /g, ' ').trim();
  if (!s) return 0;
  const m = s.match(/\d[\d\s.,]*/);
  if (!m) return 0;
  let t = m[0].replace(/\s/g, '');
  const sep = Math.max(t.lastIndexOf('.'), t.lastIndexOf(','));
  if (sep >= 0 && [1, 2].includes(t.length - sep - 1)) {
    t = t.slice(0, sep).replace(/[.,]/g, '') + '.' + t.slice(sep + 1);
  } else {
    t = t.replace(/[.,]/g, '');
  }
  const n = parseFloat(t);
  return isNaN(n) ? 0 : n;
};

const wishMoney = (n) => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(n) + ' ₽';

const wishHost = (url) => {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; }
};

function WishlistView({ data, setData }) {
  const cats = data.wishlistCategories || [];
  const items = data.wishlistItems || [];
  const [active, setActive] = useState('all');
  const [editing, setEditing] = useState(null);
  const [manageCats, setManageCats] = useState(false);
  const [showBought, setShowBought] = useState(false);

  // Вкладка могла быть удалена на другом устройстве — не показываем пустоту.
  useEffect(() => {
    if (active !== 'all' && !cats.some(c => c.id === active)) setActive('all');
  }, [cats, active]);

  const saveItem = (item) => {
    setData(d => {
      const list = d.wishlistItems || [];
      const exists = list.some(i => i.id === item.id);
      return {
        ...d,
        wishlistItems: exists ? list.map(i => i.id === item.id ? item : i) : [...list, item],
      };
    });
    setEditing(null);
  };

  const removeItem = (item) => {
    if (!confirm(`Удалить «${item.title || 'без названия'}» из хотелок?`)) return;
    if (item.image) deletePhoto(item.image);
    setData(d => ({
      ...d,
      wishlistItems: (d.wishlistItems || []).filter(i => i.id !== item.id),
      deletedIds: withDeletedId(d, 'wishlistItems', item.id),
    }));
  };

  const toggleBought = (item) => {
    setData(d => ({
      ...d,
      wishlistItems: (d.wishlistItems || []).map(i =>
        i.id === item.id ? { ...i, bought: !i.bought, boughtAt: !i.bought ? Date.now() : 0 } : i),
    }));
  };

  const inTab = active === 'all' ? items : items.filter(i => i.categoryId === active);
  const wanted = inTab.filter(i => !i.bought);
  const bought = inTab.filter(i => i.bought);
  const total = wanted.reduce((s, i) => s + wishPriceNumber(i.price), 0);
  const countIn = (catId) => items.filter(i => i.categoryId === catId && !i.bought).length;

  const sortItems = (list) => [...list].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  return (
    <div>
      <button
        onClick={() => setEditing(newWishlistItem(active === 'all' ? (cats[0]?.id || '') : active))}
        className="btn-primary w-full flex items-center justify-center gap-2 mb-4"
      >
        <Icon name="plus" size={18} />
        Новая хотелка
      </button>

      {/* Вкладки-списки + управление ими */}
      <div className="flex gap-1.5 mb-4 flex-wrap items-center">
        <button
          onClick={() => setActive('all')}
          className={`px-3 py-1.5 rounded-xl text-sm font-medium transition-all ${
            active === 'all'
              ? 'bg-[var(--text)] text-white'
              : 'bg-[var(--surface)] border border-[var(--border)] text-[var(--text-muted)]'
          }`}
        >Все</button>
        {cats.map(c => (
          <button
            key={c.id}
            onClick={() => setActive(c.id)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-sm font-medium transition-all ${
              active === c.id
                ? 'bg-[var(--text)] text-white'
                : 'bg-[var(--surface)] border border-[var(--border)] text-[var(--text-muted)]'
            }`}
          >
            {c.name}
            {countIn(c.id) > 0 && (
              <span className={active === c.id ? 'opacity-80' : 'text-[var(--text-subtle)]'}>{countIn(c.id)}</span>
            )}
          </button>
        ))}
        <button
          onClick={() => setManageCats(true)}
          className="px-3 py-1.5 rounded-xl text-sm font-medium bg-[var(--surface)] border border-dashed border-[var(--border-strong)] text-[var(--text-muted)]"
          title="Вкладки хотелок"
        >
          <Icon name="settings" size={14} />
        </button>
      </div>

      {cats.length === 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4 text-sm text-amber-900">
          Заведите вкладки — например «Аня», «Миша», «Общее», «Для дома», — и раскладывайте хотелки по ним.{' '}
          <button onClick={() => setManageCats(true)} className="underline font-medium">Создать</button>
        </div>
      )}

      {wanted.length > 0 && (
        <div className="flex items-baseline justify-between gap-3 mb-2 text-sm">
          <span className="text-[var(--text-muted)]">
            {wanted.length} {plannerPlural(wanted.length, 'хотелка', 'хотелки', 'хотелок')}
          </span>
          {total > 0 && <span className="font-semibold tabular-nums">{wishMoney(total)}</span>}
        </div>
      )}

      {wanted.length === 0 ? (
        <EmptyState
          title="Пока пусто"
          text={items.length === 0
            ? 'Добавьте то, что хотите купить — можно просто вставить ссылку'
            : 'В этой вкладке ничего не запланировано'}
        />
      ) : (
        <div className="space-y-2.5">
          {sortItems(wanted).map(it => (
            <WishlistCard
              key={it.id}
              item={it}
              category={cats.find(c => c.id === it.categoryId)}
              showCategory={active === 'all'}
              onEdit={() => setEditing(it)}
              onDelete={() => removeItem(it)}
              onToggleBought={() => toggleBought(it)}
            />
          ))}
        </div>
      )}

      {bought.length > 0 && (
        <div className="mt-5">
          <button
            onClick={() => setShowBought(v => !v)}
            className="flex items-center gap-2 text-sm text-[var(--text-muted)] hover:text-[var(--text)]"
          >
            <Icon name={showBought ? 'chevronDown' : 'chevronRight'} size={16} />
            Куплено — {bought.length}
          </button>
          {showBought && (
            <div className="space-y-2.5 mt-3">
              {sortItems(bought).map(it => (
                <WishlistCard
                  key={it.id}
                  item={it}
                  category={cats.find(c => c.id === it.categoryId)}
                  showCategory={active === 'all'}
                  onEdit={() => setEditing(it)}
                  onDelete={() => removeItem(it)}
                  onToggleBought={() => toggleBought(it)}
                />
              ))}
            </div>
          )}
        </div>
      )}

      {editing && (
        <WishlistItemModal
          key={editing.id}
          initial={editing}
          categories={cats}
          onSave={saveItem}
          onClose={() => setEditing(null)}
        />
      )}

      {manageCats && (
        <WishlistCategoriesModal
          data={data}
          setData={setData}
          onClose={() => setManageCats(false)}
        />
      )}
    </div>
  );
}
