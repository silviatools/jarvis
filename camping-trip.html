<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#4F8EF7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Список для поездки</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e8e8e8;
    --border-strong: #d4d4d4;
    --text: #0a0a0a;
    --text-muted: #6b6b6b;
    --text-subtle: #9a9a9a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding: 24px 16px 48px;
    overflow-wrap: break-word;
  }
  .font-display { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.02em; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 26px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.02em; }
  .muted { color: var(--text-muted); font-size: 14px; }
  .subtle { color: var(--text-subtle); font-size: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 16px; margin-bottom: 12px;
  }
  .head { margin-bottom: 18px; }
  .desc { white-space: pre-wrap; font-size: 14px; color: var(--text-muted); margin-top: 12px; }
  .sec-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-subtle); margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .progress { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-subtle); margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .row .nm { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
  .row .nm.done { text-decoration: line-through; color: var(--text-subtle); }
  .cb {
    width: 20px; height: 20px; flex: 0 0 20px; border-radius: 7px;
    border: 1.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center;
  }
  .cb.on { background: var(--text); border-color: var(--text); color: var(--bg); }
  .cb svg { width: 12px; height: 12px; }
  .bag-card { border: 1px solid var(--border); border-radius: 16px; margin-bottom: 10px; overflow: hidden; background: var(--surface); }
  .bag-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .bag-top .nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .bag-top .nm.done { text-decoration: line-through; color: var(--text-subtle); }
  .bag-count { font-size: 12px; color: var(--text-subtle); flex: 0 0 auto; }
  .bag-kids { border-top: 1px solid var(--border); padding: 4px 14px 8px 44px; }
  .empty { color: var(--text-subtle); font-size: 13px; padding: 8px 0; }
  .center { text-align: center; padding: 64px 20px; }
  .footer-note { text-align: center; font-size: 12px; color: var(--text-subtle); margin-top: 24px; }
  a { color: inherit; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0f; --surface: #17181a; --border: #2a2b2e; --border-strong: #3a3b3f;
      --text: #f4f4f5; --text-muted: #a1a1aa; --text-subtle: #71717a;
    }
  }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="center muted">Загрузка…</div>
</div>

<script>
(function () {
  const root = document.getElementById('root');
  const token = location.pathname.split('/').filter(Boolean).pop();
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const fmtDate = (iso) => {
    if (!iso) return '';
    const [y, m, d] = String(iso).split('-').map(Number);
    if (!y || !m || !d) return '';
    return `${d} ${MONTHS[m - 1]} ${y}`;
  };
  const fmtRange = (a, b) => {
    if (!a && !b) return '';
    if (a && b && a !== b) return `${fmtDate(a)} – ${fmtDate(b)}`;
    return fmtDate(a || b);
  };

  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const backpackSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M8 21v-5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v5"/><path d="M8 10h8"/></svg>';

  const cb = (packed) => `<span class="cb ${packed ? 'on' : ''}">${packed ? checkSvg : ''}</span>`;

  function render(data) {
    const trip = data.trip;
    const bags = data.bags || [];
    const items = data.items || [];
    const loose = items.filter(it => !it.bagId);
    const total = bags.length + items.length;
    const done = bags.filter(b => b.packed).length + items.filter(it => it.packed).length;

    let html = '<div class="head">';
    html += `<h1>${esc(trip.name)}</h1>`;
    const sub = [fmtRange(trip.startDate, trip.endDate), trip.location].filter(Boolean).map(esc).join(' · ');
    if (sub) html += `<div class="muted">${sub}</div>`;
    html += '</div>';

    if (trip.description) {
      html += `<div class="card desc">${esc(trip.description)}</div>`;
    }

    if (total === 0) {
      html += '<div class="card empty">Список вещей пока пуст.</div>';
    } else {
      html += `<div class="progress">Собрано ${done} из ${total}</div>`;

      bags.forEach(b => {
        const kids = items.filter(it => it.bagId === b.itemId);
        const kidsDone = kids.filter(it => it.packed).length;
        html += '<div class="bag-card">';
        html += `<div class="bag-top">${cb(b.packed)}<span style="color:var(--text-subtle);flex:0 0 auto;">${backpackSvg}</span>`;
        html += `<span class="nm ${b.packed ? 'done' : ''}">${esc(b.name)}</span>`;
        if (kids.length) html += `<span class="bag-count">${kidsDone}/${kids.length}</span>`;
        html += '</div>';
        if (kids.length) {
          html += '<div class="bag-kids">';
          kids.forEach(it => {
            html += `<div class="row">${cb(it.packed)}<span class="nm ${it.packed ? 'done' : ''}">${esc(it.name)}</span></div>`;
          });
          html += '</div>';
        }
        html += '</div>';
      });

      if (loose.length) {
        html += `<div class="card"><div class="sec-title">Без сумки</div>`;
        loose.forEach(it => {
          html += `<div class="row">${cb(it.packed)}<span class="nm ${it.packed ? 'done' : ''}">${esc(it.name)}</span></div>`;
        });
        html += '</div>';
      }
    }

    html += '<div class="footer-note">Ссылка только для просмотра — поделились с вами списком для сборов.</div>';
    root.innerHTML = html;
  }

  function renderError() {
    root.innerHTML = '<div class="center"><div class="font-display" style="font-size:20px;margin-bottom:8px;">Список не найден</div><div class="muted">Ссылка недействительна или отключена автором.</div></div>';
  }

  if (!token) {
    renderError();
  } else {
    fetch(`/api/camping-trip/${encodeURIComponent(token)}`)
      .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(render)
      .catch(renderError);
  }
})();
</script>
</body>
</html>
